<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ChickenRoids — Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>🥚</text></svg>" />
  <style>
    :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
      background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.22),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.16),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;}
    .wrap{max-width:560px;margin:0 auto;padding:16px 16px 30px;display:flex;flex-direction:column;align-items:center;gap:12px}
    .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
    .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
    .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
    h1{margin:0;font-size:1.6rem;background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
    .scores{display:flex;gap:12px;width:100%}
    .stat{flex:1;background:var(--panel);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:8px;text-align:center}
    .stat .label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    .stat .value{font-size:1.3rem;font-weight:700}
    .board-wrap{position:relative;width:100%}
    canvas{width:100%;height:auto;display:block;background:#05060f;border:1px solid rgba(255,255,255,.08);border-radius:14px;touch-action:none}
    .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(15,16,32,.85);border-radius:14px;text-align:center}
    .overlay.hidden{display:none}
    .overlay h2{margin:0}.overlay p{margin:0;color:var(--muted)}
    .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:12px 28px;border-radius:999px;cursor:pointer}
    .pad{display:flex;gap:8px;width:100%;justify-content:center;flex-wrap:wrap}
    .pad button{background:var(--panel);border:1px solid rgba(255,255,255,.14);color:var(--text);border-radius:10px;padding:12px 16px;font-size:1.1rem;cursor:pointer;min-width:56px;user-select:none;touch-action:none}
    .hint{color:var(--muted);font-size:.82rem;text-align:center}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar"><a class="home" href="/">← Home</a><h1>🥚 ChickenRoids</h1><span style="width:64px"></span></div>
    <div class="scores">
      <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">Lives</div><div class="value" id="lives">3</div></div>
      <div class="stat"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
    <div class="board-wrap">
      <canvas id="c" width="560" height="420"></canvas>
      <div class="overlay" id="ov"><h2 id="ot">ChickenRoids</h2><p id="om">Rotate, thrust, and blast the eggs.</p><button class="btn" id="start">Play</button></div>
    </div>
    <div class="pad">
      <button data-k="left">⟲</button>
      <button data-k="thrust">🔥 Thrust</button>
      <button data-k="right">⟳</button>
      <button data-k="fire">● Fire</button>
      <button data-k="warp">✦ Warp</button>
    </div>
    <p class="hint">← → rotate · ↑ thrust · hold Space to rapid-fire · ↓ hyperspace warp</p>
  </div>
  <script>
  (function(){
    const cv=document.getElementById("c"),ctx=cv.getContext("2d"),W=cv.width,H=cv.height;
    const scoreEl=document.getElementById("score"),livesEl=document.getElementById("lives"),bestEl=document.getElementById("best");
    const ov=document.getElementById("ov"),ot=document.getElementById("ot"),om=document.getElementById("om"),startBtn=document.getElementById("start");
    let ship,rocks,bullets,score,lives,wave,running,raf,inv,best=+localStorage.getItem("asteroids_best")||0;
    bestEl.textContent=best;
    const keys={left:false,right:false,thrust:false,fire:false};
    let lastWarp=0;
    function hyperspace(){if(!ship)return;const now=performance.now();if(now-lastWarp<600)return;lastWarp=now;ship.x=Math.random()*W;ship.y=Math.random()*H;ship.vx=0;ship.vy=0;inv=Math.max(inv,45);}
    let lastFire=0;
    // Death sequence: 2s of drifting wreckage, then a clearly-announced new ship.
    const DEATH_FRAMES=120, RESPAWN_INV=120, RESPAWN_FLASH=90;
    let dying=0, debris=[], gameOverPending=false, respawnFlash=0;

    // Two hostiles share the sky with the eggs.
    //  · the space-suit chicken buzzes past now and then from wave 3 — it flies
    //    straight through and leaves, so it is a bonus you have to take quickly
    //  · the space weasel arrives at wave 10 and behaves like an egg: it drifts
    //    and wraps and stays until you kill it, but it shoots back
    const FLYBY_FROM=3, WEASEL_FROM=10;
    const FLYBY_GAP_MIN=60*60, FLYBY_GAP_MAX=60*140;   // roughly 1-2.5 minutes apart
    const FLYBY_SHOT=90, WEASEL_SHOT=140;              // 1.5s and ~2.3s between shots
    const FLYBY_SCORE=500, WEASEL_SCORE=250;
    let flyby=null, flybyTimer=0, weasels=[], eBullets=[], pops=[];

    function scheduleFlyby(){ flybyTimer=FLYBY_GAP_MIN+Math.floor(Math.random()*(FLYBY_GAP_MAX-FLYBY_GAP_MIN)); }
    function spawnFlyby(){
      const fromLeft=Math.random()<0.5, sp=1.5+Math.random()*0.9;
      flyby={ x: fromLeft?-30:W+30, y: 40+Math.random()*(H-80),
              vx: fromLeft?sp:-sp, vy:(Math.random()-0.5)*0.5, r:13, shot:FLYBY_SHOT, bob:0 };
    }
    function spawnWeasels(){
      weasels=[];
      if(wave<WEASEL_FROM) return;
      const n=1+Math.floor((wave-WEASEL_FROM)/4);
      for(let i=0;i<n;i++){
        let x,y; do{ x=Math.random()*W; y=Math.random()*H; }while(ship&&Math.hypot(x-ship.x,y-ship.y)<150);
        const a=Math.random()*Math.PI*2, sp=0.5+Math.random()*0.5;
        weasels.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:14,shot:WEASEL_SHOT+Math.random()*60,wig:Math.random()*7});
      }
    }
    // Enemies lead the shot slightly so they are a real threat, but not perfect.
    function enemyFire(e){
      if(!ship) return;
      const a=Math.atan2(ship.y-e.y, ship.x-e.x)+(Math.random()-0.5)*0.25;
      eBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*3.4,vy:Math.sin(a)*3.4,life:150});
      if(typeof Arcade!=="undefined") Arcade.sfx.shoot();
    }
    function pop(x,y,text){ pops.push({x,y,text,life:70}); }

    function newShip(){return {x:W/2,y:H/2,a:-Math.PI/2,vx:0,vy:0};}
    function makeRock(x,y,size){
      const verts=[],n=9+Math.floor(Math.random()*4);
      for(let i=0;i<n;i++)verts.push(0.7+Math.random()*0.5);
      const ang=Math.random()*Math.PI*2,sp=(3-size)*0.4+0.3+Math.random()*0.5;
      return {x,y,size,r:size*14+6,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,verts,rot:Math.random()*Math.PI*2,vr:(Math.random()-.5)*0.04};
    }
    function spawnWave(){rocks=[];const count=3+wave;for(let i=0;i<count;i++){
      let x,y;do{x=Math.random()*W;y=Math.random()*H;}while(Math.hypot(x-ship.x,y-ship.y)<120);
      rocks.push(makeRock(x,y,3));}}
    function reset(full){if(full){score=0;lives=3;wave=1;}dying=0;debris=[];gameOverPending=false;respawnFlash=0;ship=newShip();bullets=[];inv=90;
      flyby=null;flybyTimer=0;weasels=[];eBullets=[];pops=[];spawnWave();spawnWeasels();
      if(wave>=FLYBY_FROM)scheduleFlyby();
      scoreEl.textContent=score;livesEl.textContent=lives;}
    function start(){reset(true);ov.classList.add("hidden");running=true;loop();}
    function fire(){if(!ship)return;const now=performance.now();if(now-lastFire<220)return;lastFire=now;
      bullets.push({x:ship.x+Math.cos(ship.a)*14,y:ship.y+Math.sin(ship.a)*14,vx:Math.cos(ship.a)*6+ship.vx,vy:Math.sin(ship.a)*6+ship.vy,life:60});}
    function wrap(o){if(o.x<0)o.x+=W;if(o.x>W)o.x-=W;if(o.y<0)o.y+=H;if(o.y>H)o.y-=H;}
    function loop(){if(!running)return;update();render();raf=requestAnimationFrame(loop);}
    function update(){
      // While the wreck is drifting, the rocks keep moving but you have no ship.
      if(dying>0){
        debris.forEach(d=>{d.x+=d.vx;d.y+=d.vy;d.a+=d.va;wrap(d);});
        rocks.forEach(r=>{r.x+=r.vx;r.y+=r.vy;r.rot+=r.vr;wrap(r);});
        bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.life--;wrap(b);});
        bullets=bullets.filter(b=>b.life>0);
        eBullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.life--;wrap(b);});
        eBullets=eBullets.filter(b=>b.life>0);
        if(flyby){ flyby.x+=flyby.vx; flyby.y+=flyby.vy; if(flyby.x<-50||flyby.x>W+50){flyby=null;scheduleFlyby();} }
        weasels.forEach(wz=>{wz.x+=wz.vx;wz.y+=wz.vy;wrap(wz);});
        if(--dying<=0) afterDeath();
        return;
      }
      if(!ship) return;
      if(respawnFlash>0)respawnFlash--;
      if(keys.left)ship.a-=0.07;if(keys.right)ship.a+=0.07;
      if(keys.thrust){ship.vx+=Math.cos(ship.a)*0.13;ship.vy+=Math.sin(ship.a)*0.13;}
      ship.vx*=0.99;ship.vy*=0.99;ship.x+=ship.vx;ship.y+=ship.vy;wrap(ship);
      if(keys.fire)fire();
      if(inv>0)inv--;
      if(stepEnemies()) return;        // enemy fire can kill, which clears the ship
      bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.life--;wrap(b);});
      bullets=bullets.filter(b=>b.life>0);
      rocks.forEach(r=>{r.x+=r.vx;r.y+=r.vy;r.rot+=r.vr;wrap(r);});
      // bullet-rock
      for(let i=rocks.length-1;i>=0;i--){const r=rocks[i];
        for(let j=bullets.length-1;j>=0;j--){const b=bullets[j];
          if(Math.hypot(b.x-r.x,b.y-r.y)<r.r){
            bullets.splice(j,1);rocks.splice(i,1);
            score+=[0,100,50,20][r.size];scoreEl.textContent=score;
            if(r.size>1){rocks.push(makeRock(r.x,r.y,r.size-1));rocks.push(makeRock(r.x,r.y,r.size-1));}
            break;
          }
        }
      }
      // ship-rock
      if(inv<=0){for(const r of rocks){if(Math.hypot(ship.x-r.x,ship.y-r.y)<r.r+8){die();break;}}}
      if(rocks.length===0){wave++;ship=newShip();inv=RESPAWN_INV;spawnWave();spawnWeasels();
        if(wave>=FLYBY_FROM&&flybyTimer<=0&&!flyby) scheduleFlyby(); }
    }
    function stepEnemies(){
      pops.forEach(p=>{p.y-=0.5;p.life--;}); pops=pops.filter(p=>p.life>0);

      // space-suit chicken: straight through the screen, then gone
      if(wave>=FLYBY_FROM){
        if(!flyby){ if(flybyTimer>0){ if(--flybyTimer<=0) spawnFlyby(); } else scheduleFlyby(); }
        else {
          flyby.x+=flyby.vx; flyby.y+=flyby.vy; flyby.bob+=0.12;
          if(flyby.y<20||flyby.y>H-20) flyby.vy*=-1;
          if(--flyby.shot<=0){ flyby.shot=FLYBY_SHOT; enemyFire(flyby); }
          if(flyby.x<-50||flyby.x>W+50){ flyby=null; scheduleFlyby(); }   // straight through and away
        }
      }
      // space weasels: drift and wrap like the eggs, but they shoot
      for(const wz of weasels){
        wz.x+=wz.vx; wz.y+=wz.vy; wz.wig+=0.18; wrap(wz);
        if(--wz.shot<=0){ wz.shot=WEASEL_SHOT; enemyFire(wz); }
      }
      // enemy fire
      eBullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.life--;wrap(b);});
      eBullets=eBullets.filter(b=>b.life>0);

      // your shots against them
      for(let j=bullets.length-1;j>=0;j--){
        const b=bullets[j];
        if(flyby&&Math.hypot(b.x-flyby.x,b.y-flyby.y)<flyby.r+3){
          bullets.splice(j,1); pop(flyby.x,flyby.y,"+"+FLYBY_SCORE); flyby=null; scheduleFlyby();
          score+=FLYBY_SCORE; scoreEl.textContent=score;
          if(typeof Arcade!=="undefined") Arcade.sfx.explode();
          continue;
        }
        for(let i=weasels.length-1;i>=0;i--){
          const wz=weasels[i];
          if(Math.hypot(b.x-wz.x,b.y-wz.y)<wz.r+3){
            bullets.splice(j,1); weasels.splice(i,1); pop(wz.x,wz.y,"+"+WEASEL_SCORE);
            score+=WEASEL_SCORE; scoreEl.textContent=score;
            if(typeof Arcade!=="undefined") Arcade.sfx.explode();
            break;
          }
        }
      }
      // their shots, and the weasels themselves, against you
      if(ship&&inv<=0){
        for(const b of eBullets){ if(Math.hypot(b.x-ship.x,b.y-ship.y)<9){ eBullets=[]; die(); return true; } }
        for(const wz of weasels){ if(Math.hypot(wz.x-ship.x,wz.y-ship.y)<wz.r+8){ die(); return true; } }
      }
      return false;
    }
    function die(){lives--;livesEl.textContent=lives;
      // Blow the ship apart into drifting shards for ~2s before the next one appears.
      debris=[]; for(let i=0;i<14;i++){ const a=Math.random()*Math.PI*2, sp=0.6+Math.random()*2.2;
        debris.push({x:ship.x,y:ship.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,a:Math.random()*7,va:(Math.random()-.5)*0.3,len:4+Math.random()*7}); }
      dying=DEATH_FRAMES; ship=null;
      if(lives<=0){ gameOverPending=true; }
    }
    // Called when the death animation finishes.
    function afterDeath(){
      dying=0; debris=[];
      if(gameOverPending){ gameOverPending=false; running=false; cancelAnimationFrame(raf);
        if(score>best){best=score;localStorage.setItem("asteroids_best",best);bestEl.textContent=best;}
        ot.textContent="Game Over";om.textContent="Score "+score+" · wave "+wave;startBtn.textContent="Play again";ov.classList.remove("hidden");return; }
      ship=newShip(); inv=RESPAWN_INV; respawnFlash=RESPAWN_FLASH;
    }
    function render(){
      ctx.clearRect(0,0,W,H);
      // stars
      ctx.fillStyle="rgba(255,255,255,.35)";
      // eggs
      rocks.forEach(r=>{ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.rot);
        // shell: an oval, narrower at the top like a real egg
        ctx.fillStyle="#f3ead7";ctx.strokeStyle="#c9bda3";ctx.lineWidth=1.6;
        ctx.beginPath();ctx.moveTo(0,-r.r);
        ctx.bezierCurveTo(r.r*.62,-r.r,r.r*.82,r.r*.30,0,r.r);
        ctx.bezierCurveTo(-r.r*.82,r.r*.30,-r.r*.62,-r.r,0,-r.r);
        ctx.closePath();ctx.fill();ctx.stroke();
        // speckles, seeded off the shape so each egg keeps its own pattern
        ctx.fillStyle="rgba(150,130,95,.55)";
        r.verts.forEach((v,i)=>{const ang=i/r.verts.length*Math.PI*2;
          ctx.beginPath();ctx.arc(Math.cos(ang)*r.r*v*.45,Math.sin(ang)*r.r*v*.55,r.r*.09,0,7);ctx.fill();});
        ctx.restore();});
      // space-suit chicken: helmeted, with a little jetpack flare
      if(flyby){
        const fx=flyby.x, fy=flyby.y+Math.sin(flyby.bob)*3, face=flyby.vx>0?1:-1;
        ctx.save(); ctx.translate(fx,fy); ctx.scale(face,1);
        ctx.fillStyle="#fb923c"; ctx.beginPath(); ctx.moveTo(-10,0); ctx.lineTo(-19,-5); ctx.lineTo(-19,5); ctx.closePath(); ctx.fill();
        ctx.fillStyle="#cbd5e1"; ctx.fillRect(-13,-7,10,14);                 // suit pack
        ctx.fillStyle="#f0902a"; ctx.beginPath(); ctx.arc(0,0,9,0,7); ctx.fill();
        ctx.fillStyle="#dc2626"; ctx.fillRect(-3,-13,3,5); ctx.fillRect(1,-14,3,6);
        ctx.fillStyle="#5a2a00"; ctx.fillRect(3,-3,3,3);
        ctx.fillStyle="#facc15"; ctx.beginPath(); ctx.moveTo(7,0); ctx.lineTo(13,2); ctx.lineTo(7,4); ctx.closePath(); ctx.fill();
        ctx.strokeStyle="rgba(186,230,253,.85)"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(1,-1,13,0,7); ctx.stroke();
        ctx.fillStyle="rgba(186,230,253,.16)"; ctx.beginPath(); ctx.arc(1,-1,13,0,7); ctx.fill();
        ctx.restore();
      }
      // space weasels: long, low and mean
      for(const wz of weasels){
        ctx.save(); ctx.translate(wz.x,wz.y); ctx.rotate(Math.atan2(wz.vy,wz.vx));
        ctx.fillStyle="#7c4a21"; ctx.beginPath(); ctx.ellipse(0,0,16,7,0,0,7); ctx.fill();
        ctx.fillStyle="#a8683a"; ctx.beginPath(); ctx.ellipse(-4,1,11,4,0,0,7); ctx.fill();
        ctx.strokeStyle="#7c4a21"; ctx.lineWidth=3; ctx.beginPath();
        ctx.moveTo(-15,0); ctx.quadraticCurveTo(-24,Math.sin(wz.wig)*6,-29,Math.sin(wz.wig)*3); ctx.stroke();
        ctx.fillStyle="#f43f5e"; ctx.beginPath(); ctx.arc(9,-2,2.3,0,7); ctx.fill();
        ctx.fillStyle="#3b2412"; ctx.beginPath(); ctx.moveTo(6,-6); ctx.lineTo(9,-11); ctx.lineTo(11,-6); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      // bullets
      ctx.fillStyle="#22d3ee";bullets.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,2.2,0,7);ctx.fill();});
      // enemy fire, in a colour that cannot be mistaken for yours
      ctx.fillStyle="#f43f5e";eBullets.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,3,0,7);ctx.fill();});
      // bonus score popups
      ctx.textAlign="center"; ctx.font="bold 13px system-ui";
      for(const p of pops){ ctx.fillStyle="rgba(250,204,21,"+Math.min(1,p.life/40)+")"; ctx.fillText(p.text,p.x,p.y); }
      // wreckage, drifting and fading over the 2s death animation
      if(dying>0){
        const fade=Math.min(1,dying/DEATH_FRAMES);
        ctx.strokeStyle="rgba(250,204,21,"+fade+")"; ctx.lineWidth=2;
        for(const d of debris){ ctx.save(); ctx.translate(d.x,d.y); ctx.rotate(d.a);
          ctx.beginPath(); ctx.moveTo(-d.len/2,0); ctx.lineTo(d.len/2,0); ctx.stroke(); ctx.restore(); }
        ctx.fillStyle="rgba(244,63,94,"+Math.min(1,dying/70)+")";
        ctx.font="bold 17px system-ui"; ctx.textAlign="center";
        ctx.fillText(lives>0?"SHIP DESTROYED":"LAST SHIP LOST",W/2,H/2-8);
        if(lives>0){ ctx.fillStyle="rgba(230,230,240,.85)"; ctx.font="12px system-ui";
          ctx.fillText(lives+" left · next ship in "+(dying/60).toFixed(1)+"s",W/2,H/2+14); }
      }
      // ship (blink when invulnerable)
      if(ship && (inv<=0||Math.floor(inv/5)%2===0)){
        ctx.save();ctx.translate(ship.x,ship.y);ctx.rotate(ship.a);
        ctx.strokeStyle="#facc15";ctx.lineWidth=2;ctx.beginPath();
        ctx.moveTo(14,0);ctx.lineTo(-10,-9);ctx.lineTo(-6,0);ctx.lineTo(-10,9);ctx.closePath();ctx.stroke();
        if(keys.thrust){ctx.strokeStyle="#fb923c";ctx.beginPath();ctx.moveTo(-6,0);ctx.lineTo(-16,0);ctx.stroke();}
        ctx.restore();
      }
      // clear marker so you can see exactly where the new ship appeared
      if(ship && respawnFlash>0){
        const a=respawnFlash/RESPAWN_FLASH;
        ctx.strokeStyle="rgba(52,211,153,"+(a*0.9)+")"; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(ship.x,ship.y,18+(1-a)*22,0,7); ctx.stroke();
        ctx.fillStyle="rgba(52,211,153,"+a+")"; ctx.font="bold 12px system-ui"; ctx.textAlign="center";
        ctx.fillText("NEW SHIP",ship.x,ship.y-28);
      }
    }
    // input
    function setKey(k,v){if(k==="fire"){keys.fire=v;return;}if(k==="warp"){if(v&&running)hyperspace();return;}if(k in keys)keys[k]=v;}
    document.addEventListener("keydown",e=>{const m={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"thrust",a:"left",d:"right",w:"thrust"}[e.key];
      if(m){e.preventDefault();keys[m]=true;}
      if(e.key===" "){e.preventDefault();keys.fire=true;}
      if(e.key==="ArrowDown"||e.key==="s"){e.preventDefault();if(running)hyperspace();}});
    document.addEventListener("keyup",e=>{const m={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"thrust",a:"left",d:"right",w:"thrust"}[e.key];if(m)keys[m]=false;if(e.key===" ")keys.fire=false;});
    document.querySelectorAll(".pad button").forEach(b=>{const k=b.dataset.k;
      const on=(e)=>{e.preventDefault();setKey(k,true);},off=(e)=>{e.preventDefault();setKey(k,false);};
      b.addEventListener("touchstart",on,{passive:false});b.addEventListener("touchend",off,{passive:false});
      b.addEventListener("mousedown",on);b.addEventListener("mouseup",off);b.addEventListener("mouseleave",off);
    });
    startBtn.addEventListener("click",start);
    reset(true);render();
  })();
