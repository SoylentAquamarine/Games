<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Dr Chicken — Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>💊</text></svg>" />
<style>
  :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;--bad:#f43f5e;}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
    background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.2),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.14),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;touch-action:none;}
  .wrap{max-width:380px;margin:0 auto;padding:14px 12px 30px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
  .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
  .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
  h1{margin:0;font-size:1.3rem;background:linear-gradient(120deg,#f43f5e,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
  .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer}
  .playfield{display:flex;align-items:flex-start;justify-content:center;gap:8px;width:100%}
  .side{display:flex;flex-direction:column;gap:8px;flex:0 0 auto;padding-top:4px}
  .panel{background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:6px 8px;text-align:center;min-width:62px}
  .plabel{font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .pval{font-size:1.1rem;font-weight:800;color:var(--text)}
  #next{width:56px;height:34px;border:none;background:transparent;border-radius:0}
  #doc{width:72px;height:96px;border:none;background:transparent;border-radius:0;margin-top:6px}
  #game{width:min(62vw,240px);height:calc(min(62vw,240px)*2.25)}
  canvas{border-radius:10px;border:2px solid #2a2f55;background:#0a0c18;touch-action:none}
  .msg{min-height:1.3em;font-weight:800;text-align:center}
  .ctl{display:flex;gap:8px;align-items:center}
  .dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:4px}
  .dpad button{background:var(--panel);color:var(--text);border:1px solid rgba(255,255,255,.1);border-radius:9px;font-size:1.1rem;cursor:pointer;user-select:none}
  .dpad button:active{background:var(--accent);color:#0b0c1a}
  .dpad .l{grid-area:1/1}.dpad .dn{grid-area:1/2}.dpad .r{grid-area:1/3}.dpad .rot{grid-area:2/1/3/4}
  .rotb{background:var(--accent-2);color:#0b0c1a;border:none;border-radius:9px;font-weight:800;cursor:pointer}
  .hint{font-size:.78rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="home" href="/">← Home</a><h1>🐔 Dr Chicken</h1><button class="btn" id="new">New Game</button></div>
  <div class="playfield">
    <div class="side">
      <div class="panel"><div class="plabel">Next</div><canvas id="next" width="56" height="34"></canvas></div>
      <canvas id="doc" width="72" height="96" title="Dr Chicken"></canvas>
    </div>
    <canvas id="game" width="240" height="540"></canvas>
    <div class="side">
      <div class="panel"><div class="plabel">Level</div><div class="pval" id="level">1</div></div>
      <div class="panel"><div class="plabel">Score</div><div class="pval" id="score">0</div></div>
      <div class="panel"><div class="plabel">Viruses</div><div class="pval" id="viruses">0</div></div>
      <div class="panel"><div class="plabel">Best</div><div class="pval" id="best">0</div></div>
    </div>
  </div>
  <div class="msg" id="msg">Line up 4+ of a color to clear the viruses!</div>
  <div class="ctl">
    <div class="dpad"><button class="l" data-a="left">◀</button><button class="dn" data-a="down">▼</button><button class="r" data-a="right">▶</button><button class="rot rotb" data-a="rotate">⟳ ROTATE</button></div>
  </div>
  <div class="hint">←/→ move · ↓ drop · ↑/Space/tap rotate</div>
</div>
<script src="/arcade.js"></script>
<script src="/mascots.js"></script>
<script>
(function(){
  const C={ rows:18, cols:8, colors:["R","B","Y"] };
  const COLHEX={R:"#f43f5e",B:"#22d3ee",Y:"#ffcf5a"};
  function emptyGrid(){ const g=[]; for(let r=0;r<C.rows;r++) g.push(new Array(C.cols).fill(null)); return g; }
  function clearMatches(grid){ const rows=grid.length, cols=grid[0].length; const toClear=new Set();
    for(let r=0;r<rows;r++){ let run=1; for(let c=1;c<=cols;c++){ const cur=c<cols?grid[r][c]:null, prev=grid[r][c-1];
      if(cur&&prev&&cur.color===prev.color) run++; else { if(run>=4) for(let k=c-run;k<c;k++) toClear.add(r+","+k); run=1; } } }
    for(let c=0;c<cols;c++){ let run=1; for(let r=1;r<=rows;r++){ const cur=r<rows?grid[r][c]:null, prev=grid[r-1][c];
      if(cur&&prev&&cur.color===prev.color) run++; else { if(run>=4) for(let k=r-run;k<r;k++) toClear.add(k+","+c); run=1; } } }
    for(const key of toClear){ const [r,c]=key.split(",").map(Number); grid[r][c]=null; } return toClear.size; }
  function settle(grid){ const rows=grid.length, cols=grid[0].length; let any=false, moved=true;
    while(moved){ moved=false; for(let r=rows-2;r>=0;r--) for(let c=0;c<cols;c++){ const cell=grid[r][c];
      if(cell && !cell.virus && grid[r+1][c]===null){ grid[r+1][c]=cell; grid[r][c]=null; moved=true; any=true; } } } return any; }
  function resolve(grid){ let total=0; while(true){ const c=clearMatches(grid); if(c===0) break; total+=c; settle(grid); } return total; }
  function countViruses(grid){ let n=0; for(const row of grid) for(const cell of row) if(cell&&cell.virus) n++; return n; }
  function placeViruses(grid, n){ let placed=0, tries=0; const rows=grid.length, cols=grid[0].length;
    while(placed<n && tries<500){ tries++; const r=Math.floor(rows/2)+Math.floor(Math.random()*(rows/2-1)), c=Math.floor(Math.random()*cols);
      if(grid[r][c]) continue; const color=C.colors[Math.floor(Math.random()*3)];
      const bad=(grid[r][c-1]&&grid[r][c-2]&&grid[r][c-1].color===color&&grid[r][c-2].color===color)||(grid[r-1]&&grid[r-2]&&grid[r-1][c]&&grid[r-2][c]&&grid[r-1][c].color===color&&grid[r-2][c].color===color);
      if(bad) continue; grid[r][c]={color,virus:true}; placed++; } }
  function newPill(){ return { r:1, c:Math.floor(C.cols/2)-1, o:0, ca:C.colors[Math.floor(Math.random()*3)], cb:C.colors[Math.floor(Math.random()*3)] }; }
  // 4 rotation states: the pivot (ca) stays put and the second half (cb) orbits it — right(0) -> up(1) -> left(2) -> down(3)
  function cellsOf(p){ const off=[[0,1],[-1,0],[0,-1],[1,0]][p.o]; return [ {r:p.r,c:p.c,color:p.ca}, {r:p.r+off[0],c:p.c+off[1],color:p.cb} ]; }
  function canPlace(grid, cells){ for(const cell of cells){ if(cell.c<0||cell.c>=C.cols||cell.r<0||cell.r>=C.rows) return false; if(grid[cell.r][cell.c]) return false; } return true; }
  // Eased per comment ("screen way too full, difficulty curve too steep"): half
  // the starting density and a lower, later-reached cap.
  function virusesFor(level){ return Math.min(4+(level-1)*3, 40); }
  // The drop speed ramp, also eased: a gentler descent and a higher (slower) floor.
  function dropSpeed(level){ return Math.max(14, 34-(level-1)*2); }
  // Clearing every virus advances a level: a fresh, denser bottle, score kept.
  function advanceLevel(st){ st.level++; st.grid=emptyGrid(); placeViruses(st.grid, virusesFor(st.level));
    st.pill=newPill(); st.next=newPill(); st.mode="play"; st.bonus=null; st.banner={text:"LEVEL "+st.level, t:100};
    if(typeof Arcade!=="undefined")Arcade.sfx.wave(); }
  // Every 5th cleared level is a bonus round: a spacesuit chicken drifts around the
  // bottle and you drop bricks on it. Positions are in grid-cell units.
  function startBonus(st){ st.mode="bonus";
    st.bonus={ chicken:{x:C.cols/2, y:2.4, vx:0.09, vy:0.05, hits:0}, bricks:[], dropped:0, max:6, dropCol:Math.floor(C.cols/2), cool:0 };
    st.banner={text:"BONUS ROUND!", t:110};
    if(typeof Arcade!=="undefined")Arcade.sfx.wave(); }
  function winLevel(st){ if(st.level%5===0) startBonus(st); else advanceLevel(st); }
  function bonusMove(st,dir){ const b=st.bonus; if(b) b.dropCol=Math.max(0,Math.min(C.cols-1,b.dropCol+dir)); }
  function bonusDrop(st){ const b=st.bonus; if(!b||b.dropped>=b.max||b.cool>0) return;
    b.bricks.push({x:b.dropCol+0.5, y:0.5, hit:false}); b.dropped++; b.cool=8; }
  function bonusStep(st){ const b=st.bonus; if(!b) return; const ch=b.chicken;
    ch.x+=ch.vx; ch.y+=ch.vy;
    if(ch.x<1){ch.x=1;ch.vx=Math.abs(ch.vx);} if(ch.x>C.cols-1){ch.x=C.cols-1;ch.vx=-Math.abs(ch.vx);}
    if(ch.y<1){ch.y=1;ch.vy=Math.abs(ch.vy);} if(ch.y>C.rows*0.6){ch.y=C.rows*0.6;ch.vy=-Math.abs(ch.vy);}
    if(b.cool>0) b.cool--;
    for(const br of b.bricks){ br.y+=0.42;
      if(!br.hit && Math.hypot(br.x-ch.x, br.y-ch.y)<0.95){ br.hit=true; br.dead=true; ch.hits++; st.score+=500; if(typeof Arcade!=="undefined")Arcade.sfx.hit(); }
      else if(br.y>=C.rows-0.5) br.dead=true; }
    b.bricks=b.bricks.filter(x=>!x.dead);
    if(b.dropped>=b.max && b.bricks.length===0) advanceLevel(st); }
  // Player feedback: "this should not have lives, it should end when the
  // blocks reach the top." Jamming the neck (a new pill can't be placed
  // because the stack reached the spawn point) used to cost a "chicken"
  // (3 lives) and clear part of the board so play continued -- a deviation
  // from the original Dr. Mario rule, where reaching the top ends the run
  // outright, no retries. Now it just ends the game.
  function jamOver(st){ st.over=true; if(typeof Arcade!=="undefined"){ Arcade.sfx.death(); Arcade.sfx.lose(); } }
  function newState(){ const level=1, grid=emptyGrid(); placeViruses(grid, virusesFor(level));
    return { grid, pill:newPill(), next:newPill(), score:0, level, mode:"play", bonus:null, over:false, won:false, banner:null }; }
  window.__drmario={ newState, emptyGrid, clearMatches, settle, resolve, countViruses, cellsOf, canPlace, newPill, virusesFor, dropSpeed, winLevel, advanceLevel, startBonus, bonusStep, bonusDrop, bonusMove, jamOver, C };

  if(typeof document==="undefined") return;
  const $=(id)=>document.getElementById(id);
  const cv=$("game"), ctx=cv.getContext("2d"); const CS=cv.width/C.cols;
  let s=newState(), best=0, dropT=0;
  try{ best=parseInt(localStorage.getItem("drmario_best")||"0")||0; }catch(e){}

  function lock(){ for(const cell of cellsOf(s.pill)){ if(cell.r>=0&&cell.r<C.rows) s.grid[cell.r][cell.c]={color:cell.color,virus:false}; }
    const cleared=resolve(s.grid); s.score += cleared*20;
    if(cleared>0 && typeof Arcade!=="undefined") Arcade.sfx.coin();
    if(countViruses(s.grid)===0){ winLevel(s); return; }
    // promote the previewed pill, then queue a fresh one
    s.pill=s.next||newPill(); s.pill.r=1; s.pill.c=Math.floor(C.cols/2)-1; s.pill.o=0;
    s.next=newPill();
    if(!canPlace(s.grid, cellsOf(s.pill))){ jamOver(s); } }
  function tryMove(np){ const test={...s.pill,...np}; if(canPlace(s.grid, cellsOf(test))){ s.pill=test; return true; } return false; }
  function rotate(){ const test={...s.pill, o:(s.pill.o+1)%4};
    for(const dc of [0,-1,1]){ const t={...test,c:test.c+dc}; if(canPlace(s.grid,cellsOf(t))){ s.pill=t; return; } } }
  function drop(){ if(!tryMove({r:s.pill.r+1})){ lock(); } }
  function act(a){ if(s.over) return;
    if(s.mode==="bonus"){ if(a==="left") bonusMove(s,-1); else if(a==="right") bonusMove(s,1); else if(a==="down"||a==="rotate") bonusDrop(s); return; }
    if(a==="left") tryMove({c:s.pill.c-1}); else if(a==="right") tryMove({c:s.pill.c+1}); else if(a==="down") drop(); else if(a==="rotate") rotate(); }

  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height); ctx.fillStyle="#0a0c18"; ctx.fillRect(0,0,cv.width,cv.height);
    if(s.mode==="bonus"){ drawBonus(); }
    else {
    for(let r=0;r<C.rows;r++) for(let c=0;c<C.cols;c++){ const cell=s.grid[r][c]; if(!cell) continue;
      ctx.fillStyle=COLHEX[cell.color]; if(cell.virus){ ctx.beginPath(); ctx.arc(c*CS+CS/2,r*CS+CS/2,CS/2-2,0,7); ctx.fill(); ctx.fillStyle="#0b0c1a"; ctx.fillRect(c*CS+5,r*CS+6,3,3); ctx.fillRect(c*CS+CS-8,r*CS+6,3,3); }
      else { ctx.fillRect(c*CS+2,r*CS+2,CS-4,CS-4); } }
    if(!s.over&&!s.won) for(const cell of cellsOf(s.pill)){ if(cell.r<0) continue; ctx.fillStyle=COLHEX[cell.color]; ctx.fillRect(cell.c*CS+2,cell.r*CS+2,CS-4,CS-4); ctx.fillStyle="rgba(255,255,255,.25)"; ctx.fillRect(cell.c*CS+3,cell.r*CS+3,CS-8,3); }
    }
    if(s.banner && !s.over){ ctx.fillStyle="rgba(0,0,0,.5)"; ctx.fillRect(0,cv.height/2-22,cv.width,44);
      ctx.fillStyle=s.banner.text[0]==="L"?"#34d399":"#ffcf5a"; ctx.font="bold 17px system-ui"; ctx.textAlign="center"; ctx.fillText(s.banner.text,cv.width/2,cv.height/2+5); }
    if(s.over){ ctx.fillStyle="rgba(0,0,0,.65)"; ctx.fillRect(0,0,cv.width,cv.height); ctx.fillStyle="#f43f5e"; ctx.font="bold 18px system-ui"; ctx.textAlign="center"; ctx.fillText("GAME OVER",cv.width/2,cv.height/2-6); ctx.fillStyle="#e6e6f0"; ctx.font="12px system-ui"; ctx.fillText("Score "+s.score,cv.width/2,cv.height/2+14); }
  }
  // Bonus round: the spacesuit chicken drifting in the bottle, bricks raining down.
  function drawBonus(){
    const b=s.bonus; if(!b) return;
    ctx.fillStyle="#22d3ee"; ctx.fillRect(b.dropCol*CS+CS*0.2, 2, CS*0.6, CS*0.45);
    ctx.fillStyle="rgba(255,255,255,.3)"; ctx.fillRect(b.dropCol*CS+CS*0.25, 3, CS*0.5, 3);
    for(const br of b.bricks){ const x=(br.x-0.35)*CS, y=(br.y-0.35)*CS;
      ctx.fillStyle="#b98a5e"; ctx.fillRect(x,y,CS*0.7,CS*0.7);
      ctx.fillStyle="rgba(0,0,0,.25)"; ctx.fillRect(x,y+CS*0.35,CS*0.7,2); ctx.fillRect(x+CS*0.35,y,2,CS*0.7); }
    const ch=b.chicken, x=ch.x*CS, y=ch.y*CS, r=CS*0.55;
    // Drawn from the shared /mascots.js library — matches the flyby cameo
    // used across the rest of the site instead of its own slightly-drifted
    // copy (this one had marginally different beak/comb offsets).
    Mascots.spacesuitChicken(ctx, x, y, r);
    ctx.fillStyle="#e6e6f0"; ctx.font="11px system-ui"; ctx.textAlign="center";
    ctx.fillText("Bricks "+(b.max-b.dropped)+" · Hits "+ch.hits, cv.width/2, cv.height-8);
  }
  // preview of the pill that comes next, drawn lying horizontally
  const nextCv=$("next"), nctx=nextCv?nextCv.getContext("2d"):null;
  function drawNext(){ if(!nctx) return;
    nctx.clearRect(0,0,nextCv.width,nextCv.height);
    if(!s.next) return;
    const sz=22, x=(nextCv.width-sz*2)/2, y=(nextCv.height-sz)/2;
    [s.next.ca,s.next.cb].forEach((col,i)=>{
      nctx.fillStyle=COLHEX[col]; nctx.fillRect(x+i*sz+2,y+2,sz-4,sz-4);
      nctx.fillStyle="rgba(255,255,255,.25)"; nctx.fillRect(x+i*sz+3,y+3,sz-8,3); });
  }
  function frame(){
    if(!s.over){
      if(s.mode==="bonus"){ bonusStep(s); }
      else { const speed=dropSpeed(s.level); if(++dropT>=speed){ dropT=0; drop(); } }
      if(typeof Arcade!=="undefined")Arcade.stats.record("drmario",s.score); }
    if(s.over && s.score>best){ best=s.score; try{localStorage.setItem("drmario_best",String(best));}catch(e){} }
    if(s.banner){ if(--s.banner.t<=0) s.banner=null; }
    $("msg").textContent = s.over ? ("Blocks reached the top! Score "+s.score)
      : s.banner ? s.banner.text
      : s.mode==="bonus" ? "Drop bricks on the space chicken! (←/→ then ↓)"
      : "Clear the viruses — level "+s.level+"!";
    $("score").textContent=s.score; $("viruses").textContent=countViruses(s.grid); $("best").textContent=best;
    $("level").textContent=s.level;
    draw(); drawNext(); drawDoc(); requestAnimationFrame(frame); }

  // Dr Chicken herself, watching the bottle from the side panel. Player
  // feedback (the same comment that asked for the shared mascot library):
  // "sometimes like in dr mario I want it not in a space suit but in a
  // surgical mask, Dr Chicken, we will update that sprite to have more
  // detail and to be a little different per game." Redesigned from the
  // old spacesuit look (jetpack, life-support pack, helmet dome — matched
  // the site's other cameos) to an actual doctor: her own body/comb/beak,
  // a surgical mask over her beak with an ear-loop tie, the white coat
  // kept (it already read as "doctor"), and a head mirror on a band
  // instead of a space helmet. Deliberately NOT drawn from the shared
  // /mascots.js spacesuit variants — this character is supposed to look
  // different from those, not unified with them.
  const docCv=$("doc"), docCtx=docCv&&docCv.getContext("2d");
  function drawDoc(){
    if(!docCtx) return;
    const W=docCv.width, H=docCv.height;
    docCtx.clearRect(0,0,W,H);
    const cx=W/2, cy=H*0.56, r=W*0.30;
    // body
    docCtx.fillStyle="#f0902a"; docCtx.beginPath(); docCtx.arc(cx,cy,r,0,7); docCtx.fill();
    // comb
    docCtx.fillStyle="#dc2626";
    docCtx.beginPath();
    docCtx.arc(cx-r*0.30,cy-r*0.92,r*0.20,0,7);
    docCtx.arc(cx,cy-r*1.02,r*0.22,0,7);
    docCtx.arc(cx+r*0.30,cy-r*0.92,r*0.20,0,7);
    docCtx.fill();
    // eye
    docCtx.fillStyle="#fff"; docCtx.beginPath(); docCtx.arc(cx+r*0.30,cy-r*0.20,r*0.26,0,7); docCtx.fill();
    docCtx.fillStyle="#0b0c1a"; docCtx.beginPath(); docCtx.arc(cx+r*0.36,cy-r*0.20,r*0.13,0,7); docCtx.fill();
    // beak (mostly covered by the mask below, just the tip shows)
    docCtx.fillStyle="#facc15";
    docCtx.beginPath(); docCtx.moveTo(cx+r*0.72,cy-r*0.02); docCtx.lineTo(cx+r*1.15,cy+r*0.12); docCtx.lineTo(cx+r*0.72,cy+r*0.24); docCtx.closePath(); docCtx.fill();
    // surgical mask — a teal cloth ellipse over the lower face, pleat
    // lines, and an ear-loop strap curving back toward the head
    docCtx.fillStyle="#7dd3c8";
    docCtx.beginPath(); docCtx.ellipse(cx+r*0.42,cy+r*0.14,r*0.42,r*0.28,-0.15,0,7); docCtx.fill();
    docCtx.strokeStyle="rgba(0,0,0,.18)"; docCtx.lineWidth=1;
    for(let i=-1;i<=1;i++){
      docCtx.beginPath();
      docCtx.moveTo(cx+r*(0.18+i*0.02),cy+r*(-0.06+i*0.14));
      docCtx.lineTo(cx+r*(0.60+i*0.02),cy+r*(0.02+i*0.14));
      docCtx.stroke();
    }
    docCtx.strokeStyle="#e8e2d4"; docCtx.lineWidth=1.5;
    docCtx.beginPath(); docCtx.moveTo(cx+r*0.12,cy-r*0.02); docCtx.quadraticCurveTo(cx-r*0.30,cy-r*0.35,cx-r*0.55,cy-r*0.10); docCtx.stroke();
    // white coat, kept from the original design — already reads as "doctor"
    docCtx.fillStyle="rgba(255,255,255,.9)";
    docCtx.beginPath(); docCtx.moveTo(cx-r*0.75,cy+r*0.25);
    docCtx.lineTo(cx+r*0.75,cy+r*0.25); docCtx.lineTo(cx+r*0.55,cy+r*1.0);
    docCtx.lineTo(cx-r*0.55,cy+r*1.0); docCtx.closePath(); docCtx.fill();
    docCtx.strokeStyle="#22d3ee"; docCtx.lineWidth=1.5;
    docCtx.beginPath(); docCtx.moveTo(cx,cy+r*0.25); docCtx.lineTo(cx,cy+r*1.0); docCtx.stroke();
    // head mirror on a band — the classic "doctor" accessory, replacing
    // the old helmet dome/visor
    docCtx.strokeStyle="#94a3b8"; docCtx.lineWidth=2;
    docCtx.beginPath(); docCtx.arc(cx-r*0.05,cy-r*1.15,r*0.30,0,7); docCtx.stroke();
    docCtx.fillStyle="rgba(226,232,240,.55)";
