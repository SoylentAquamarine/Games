<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Dr Chicken — Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>💊</text></svg>" />
<style>
  :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;--bad:#f43f5e;}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
    background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.2),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.14),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;touch-action:none;}
  .wrap{max-width:380px;margin:0 auto;padding:14px 12px 30px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
  .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
  .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
  h1{margin:0;font-size:1.3rem;background:linear-gradient(120deg,#f43f5e,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
  .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer}
  .playfield{display:flex;align-items:flex-start;justify-content:center;gap:8px;width:100%}
  .side{display:flex;flex-direction:column;gap:8px;flex:0 0 auto;padding-top:4px}
  .panel{background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:6px 8px;text-align:center;min-width:62px}
  .plabel{font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .pval{font-size:1.1rem;font-weight:800;color:var(--text)}
  #next{width:56px;height:34px;border:none;background:transparent;border-radius:0}
  #doc{width:72px;height:96px;border:none;background:transparent;border-radius:0;margin-top:6px}
  #game{width:min(52vw,180px);height:calc(min(52vw,180px)*2.25)}
  canvas{border-radius:10px;border:2px solid #2a2f55;background:#0a0c18;touch-action:none}
  .msg{min-height:1.3em;font-weight:800;text-align:center}
  .ctl{display:flex;gap:8px;align-items:center}
  .dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:4px}
  .dpad button{background:var(--panel);color:var(--text);border:1px solid rgba(255,255,255,.1);border-radius:9px;font-size:1.1rem;cursor:pointer;user-select:none}
  .dpad button:active{background:var(--accent);color:#0b0c1a}
  .dpad .l{grid-area:1/1}.dpad .dn{grid-area:1/2}.dpad .r{grid-area:1/3}.dpad .rot{grid-area:2/1/3/4}
  .rotb{background:var(--accent-2);color:#0b0c1a;border:none;border-radius:9px;font-weight:800;cursor:pointer}
  .hint{font-size:.78rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="home" href="/">← Home</a><h1>🐔 Dr Chicken</h1><button class="btn" id="new">New Game</button></div>
  <div class="playfield">
    <div class="side">
      <div class="panel"><div class="plabel">Next</div><canvas id="next" width="56" height="34"></canvas></div>
      <canvas id="doc" width="72" height="96" title="Dr Chicken"></canvas>
    </div>
    <canvas id="game" width="160" height="360"></canvas>
    <div class="side">
      <div class="panel"><div class="plabel">Score</div><div class="pval" id="score">0</div></div>
      <div class="panel"><div class="plabel">Viruses</div><div class="pval" id="viruses">0</div></div>
      <div class="panel"><div class="plabel">Best</div><div class="pval" id="best">0</div></div>
    </div>
  </div>
  <div class="msg" id="msg">Line up 4+ of a color to clear the viruses!</div>
  <div class="ctl">
    <div class="dpad"><button class="l" data-a="left">◀</button><button class="dn" data-a="down">▼</button><button class="r" data-a="right">▶</button><button class="rot rotb" data-a="rotate">⟳ ROTATE</button></div>
  </div>
  <div class="hint">←/→ move · ↓ drop · ↑/Space/tap rotate</div>
</div>
<script src="/arcade.js"></script>
<script>
(function(){
  const C={ rows:18, cols:8, colors:["R","B","Y"] };
  const COLHEX={R:"#f43f5e",B:"#22d3ee",Y:"#ffcf5a"};
  function emptyGrid(){ const g=[]; for(let r=0;r<C.rows;r++) g.push(new Array(C.cols).fill(null)); return g; }
  function clearMatches(grid){ const rows=grid.length, cols=grid[0].length; const toClear=new Set();
    for(let r=0;r<rows;r++){ let run=1; for(let c=1;c<=cols;c++){ const cur=c<cols?grid[r][c]:null, prev=grid[r][c-1];
      if(cur&&prev&&cur.color===prev.color) run++; else { if(run>=4) for(let k=c-run;k<c;k++) toClear.add(r+","+k); run=1; } } }
    for(let c=0;c<cols;c++){ let run=1; for(let r=1;r<=rows;r++){ const cur=r<rows?grid[r][c]:null, prev=grid[r-1][c];
      if(cur&&prev&&cur.color===prev.color) run++; else { if(run>=4) for(let k=r-run;k<r;k++) toClear.add(k+","+c); run=1; } } }
    for(const key of toClear){ const [r,c]=key.split(",").map(Number); grid[r][c]=null; } return toClear.size; }
  function settle(grid){ const rows=grid.length, cols=grid[0].length; let any=false, moved=true;
    while(moved){ moved=false; for(let r=rows-2;r>=0;r--) for(let c=0;c<cols;c++){ const cell=grid[r][c];
      if(cell && !cell.virus && grid[r+1][c]===null){ grid[r+1][c]=cell; grid[r][c]=null; moved=true; any=true; } } } return any; }
  function resolve(grid){ let total=0; while(true){ const c=clearMatches(grid); if(c===0) break; total+=c; settle(grid); } return total; }
  function countViruses(grid){ let n=0; for(const row of grid) for(const cell of row) if(cell&&cell.virus) n++; return n; }
  function placeViruses(grid, n){ let placed=0, tries=0; const rows=grid.length, cols=grid[0].length;
    while(placed<n && tries<500){ tries++; const r=Math.floor(rows/2)+Math.floor(Math.random()*(rows/2-1)), c=Math.floor(Math.random()*cols);
      if(grid[r][c]) continue; const color=C.colors[Math.floor(Math.random()*3)];
      const bad=(grid[r][c-1]&&grid[r][c-2]&&grid[r][c-1].color===color&&grid[r][c-2].color===color)||(grid[r-1]&&grid[r-2]&&grid[r-1][c]&&grid[r-2][c]&&grid[r-1][c].color===color&&grid[r-2][c].color===color);
      if(bad) continue; grid[r][c]={color,virus:true}; placed++; } }
  function newPill(){ return { r:1, c:Math.floor(C.cols/2)-1, o:0, ca:C.colors[Math.floor(Math.random()*3)], cb:C.colors[Math.floor(Math.random()*3)] }; }
  // 4 rotation states: the pivot (ca) stays put and the second half (cb) orbits it — right(0) -> up(1) -> left(2) -> down(3)
  function cellsOf(p){ const off=[[0,1],[-1,0],[0,-1],[1,0]][p.o]; return [ {r:p.r,c:p.c,color:p.ca}, {r:p.r+off[0],c:p.c+off[1],color:p.cb} ]; }
  function canPlace(grid, cells){ for(const cell of cells){ if(cell.c<0||cell.c>=C.cols||cell.r<0||cell.r>=C.rows) return false; if(grid[cell.r][cell.c]) return false; } return true; }
  function newState(){ const grid=emptyGrid(); placeViruses(grid, 8);
    return { grid, pill:newPill(), next:newPill(), score:0, over:false, won:false }; }
  window.__drmario={ newState, emptyGrid, clearMatches, settle, resolve, countViruses, cellsOf, canPlace, newPill, C };

  if(typeof document==="undefined") return;
  const $=(id)=>document.getElementById(id);
  const cv=$("game"), ctx=cv.getContext("2d"); const CS=cv.width/C.cols;
  let s=newState(), best=0, dropT=0;
  try{ best=parseInt(localStorage.getItem("drmario_best")||"0")||0; }catch(e){}

  function lock(){ for(const cell of cellsOf(s.pill)){ if(cell.r>=0&&cell.r<C.rows) s.grid[cell.r][cell.c]={color:cell.color,virus:false}; }
    s.score += resolve(s.grid)*20;
    if(countViruses(s.grid)===0){ s.won=true; return; }
    // promote the previewed pill, then queue a fresh one
    s.pill=s.next||newPill(); s.pill.r=1; s.pill.c=Math.floor(C.cols/2)-1; s.pill.o=0;
    s.next=newPill();
    if(!canPlace(s.grid, cellsOf(s.pill))){ s.over=true; } }
  function tryMove(np){ const test={...s.pill,...np}; if(canPlace(s.grid, cellsOf(test))){ s.pill=test; return true; } return false; }
  function rotate(){ const test={...s.pill, o:(s.pill.o+1)%4};
    for(const dc of [0,-1,1]){ const t={...test,c:test.c+dc}; if(canPlace(s.grid,cellsOf(t))){ s.pill=t; return; } } }
  function drop(){ if(!tryMove({r:s.pill.r+1})){ lock(); } }
  function act(a){ if(s.over||s.won) return; if(a==="left") tryMove({c:s.pill.c-1}); else if(a==="right") tryMove({c:s.pill.c+1}); else if(a==="down") drop(); else if(a==="rotate") rotate(); }

  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height); ctx.fillStyle="#0a0c18"; ctx.fillRect(0,0,cv.width,cv.height);
    for(let r=0;r<C.rows;r++) for(let c=0;c<C.cols;c++){ const cell=s.grid[r][c]; if(!cell) continue;
      ctx.fillStyle=COLHEX[cell.color]; if(cell.virus){ ctx.beginPath(); ctx.arc(c*CS+CS/2,r*CS+CS/2,CS/2-2,0,7); ctx.fill(); ctx.fillStyle="#0b0c1a"; ctx.fillRect(c*CS+5,r*CS+6,3,3); ctx.fillRect(c*CS+CS-8,r*CS+6,3,3); }
      else { ctx.fillRect(c*CS+2,r*CS+2,CS-4,CS-4); } }
    if(!s.over&&!s.won) for(const cell of cellsOf(s.pill)){ if(cell.r<0) continue; ctx.fillStyle=COLHEX[cell.color]; ctx.fillRect(cell.c*CS+2,cell.r*CS+2,CS-4,CS-4); ctx.fillStyle="rgba(255,255,255,.25)"; ctx.fillRect(cell.c*CS+3,cell.r*CS+3,CS-8,3); }
    if(s.won||s.over){ ctx.fillStyle="rgba(0,0,0,.65)"; ctx.fillRect(0,0,cv.width,cv.height); ctx.fillStyle=s.won?"#34d399":"#f43f5e"; ctx.font="bold 18px system-ui"; ctx.textAlign="center"; ctx.fillText(s.won?"CURED!":"GAME OVER",cv.width/2,cv.height/2-6); ctx.fillStyle="#e6e6f0"; ctx.font="12px system-ui"; ctx.fillText("Score "+s.score,cv.width/2,cv.height/2+14); }
  }
  // preview of the pill that comes next, drawn lying horizontally
  const nextCv=$("next"), nctx=nextCv?nextCv.getContext("2d"):null;
  function drawNext(){ if(!nctx) return;
    nctx.clearRect(0,0,nextCv.width,nextCv.height);
    if(!s.next) return;
    const sz=22, x=(nextCv.width-sz*2)/2, y=(nextCv.height-sz)/2;
    [s.next.ca,s.next.cb].forEach((col,i)=>{
      nctx.fillStyle=COLHEX[col]; nctx.fillRect(x+i*sz+2,y+2,sz-4,sz-4);
      nctx.fillStyle="rgba(255,255,255,.25)"; nctx.fillRect(x+i*sz+3,y+3,sz-8,3); });
  }
  function frame(){ if(!s.over&&!s.won){ if(++dropT>=34){ dropT=0; drop(); }
    if(typeof Arcade!=="undefined")Arcade.stats.record("drmario",s.score); if((s.over||s.won)&&s.score>best){ best=s.score; try{localStorage.setItem("drmario_best",String(best));}catch(e){} }
    if(s.won) $("msg").textContent="🎉 All viruses cleared! Score "+s.score;
    else if(s.over) $("msg").textContent="Bottle jammed! Score "+s.score; }
    $("score").textContent=s.score; $("viruses").textContent=countViruses(s.grid); $("best").textContent=best;
    draw(); drawNext(); drawDoc(); requestAnimationFrame(frame); }

  // Dr Chicken herself, watching the bottle from the side panel in her space suit.
  const docCv=$("doc"), docCtx=docCv&&docCv.getContext("2d");
  function drawDoc(){
    if(!docCtx) return;
    const W=docCv.width, H=docCv.height, t=Date.now()/500;
    docCtx.clearRect(0,0,W,H);
    const cx=W/2, cy=H*0.56, r=W*0.30;
    // jetpack flare, gently pulsing
    docCtx.fillStyle="rgba(251,146,60,"+(0.35+0.25*Math.sin(t*2))+")";
    docCtx.beginPath(); docCtx.moveTo(cx-r*0.9,cy+r*0.7);
    docCtx.lineTo(cx-r*1.5,cy+r*(1.5+0.25*Math.sin(t*3)));
    docCtx.lineTo(cx-r*0.35,cy+r*1.05); docCtx.closePath(); docCtx.fill();
    // life-support pack
    docCtx.fillStyle="#cbd5e1"; docCtx.fillRect(cx-r*1.05,cy-r*0.45,r*0.5,r*1.3);
    // body
    docCtx.fillStyle="#f0902a"; docCtx.beginPath(); docCtx.arc(cx,cy,r,0,7); docCtx.fill();
    // comb, beak, wattle
    docCtx.fillStyle="#dc2626";
    docCtx.beginPath();
    docCtx.arc(cx-r*0.30,cy-r*0.92,r*0.20,0,7);
    docCtx.arc(cx,cy-r*1.02,r*0.22,0,7);
    docCtx.arc(cx+r*0.30,cy-r*0.92,r*0.20,0,7);
    docCtx.fill();
    docCtx.fillStyle="#fff"; docCtx.beginPath(); docCtx.arc(cx+r*0.30,cy-r*0.20,r*0.26,0,7); docCtx.fill();
    docCtx.fillStyle="#0b0c1a"; docCtx.beginPath(); docCtx.arc(cx+r*0.36,cy-r*0.20,r*0.13,0,7); docCtx.fill();
    docCtx.fillStyle="#facc15";
    docCtx.beginPath(); docCtx.moveTo(cx+r*0.72,cy-r*0.02); docCtx.lineTo(cx+r*1.25,cy+r*0.14); docCtx.lineTo(cx+r*0.72,cy+r*0.28); docCtx.closePath(); docCtx.fill();
    // white coat over the suit, so she reads as a doctor
    docCtx.fillStyle="rgba(255,255,255,.9)";
    docCtx.beginPath(); docCtx.moveTo(cx-r*0.75,cy+r*0.25);
    docCtx.lineTo(cx+r*0.75,cy+r*0.25); docCtx.lineTo(cx+r*0.55,cy+r*1.0);
    docCtx.lineTo(cx-r*0.55,cy+r*1.0); docCtx.closePath(); docCtx.fill();
    docCtx.strokeStyle="#22d3ee"; docCtx.lineWidth=1.5;
    docCtx.beginPath(); docCtx.moveTo(cx,cy+r*0.25); docCtx.lineTo(cx,cy+r*1.0); docCtx.stroke();
    // helmet dome
    docCtx.strokeStyle="rgba(186,230,253,.9)"; docCtx.lineWidth=2.5;
    docCtx.beginPath(); docCtx.arc(cx,cy-r*0.12,r*1.5,0,7); docCtx.stroke();
    docCtx.fillStyle="rgba(186,230,253,.14)";
    docCtx.beginPath(); docCtx.arc(cx,cy-r*0.12,r*1.5,0,7); docCtx.fill();
    docCtx.fillStyle="rgba(255,255,255,.5)";
    docCtx.beginPath(); docCtx.ellipse(cx-r*0.65,cy-r*0.85,r*0.30,r*0.16,-0.6,0,7); docCtx.fill();
  }
  document.querySelectorAll(".ctl button").forEach(b=>{ const a=b.getAttribute("data-a"); const f=(e)=>{e.preventDefault();act(a);}; b.addEventListener("click",f); b.addEventListener("touchstart",f,{passive:false}); });
  addEventListener("keydown",(e)=>{ const m={ArrowLeft:"left",ArrowRight:"right",ArrowDown:"down",ArrowUp:"rotate"," ":"rotate",a:"left",d:"right",s:"down",w:"rotate"}[e.key]; if(m){ e.preventDefault(); act(m); } });
  cv.addEventListener("touchstart",(e)=>{ e.preventDefault(); act("rotate"); },{passive:false});
  $("new").addEventListener("click",()=>{ s=newState(); $("msg").textContent="Line up 4+ of a color to clear the viruses!"; });
  requestAnimationFrame(frame);
})();
</script>
<script src="/comments.js" defer></script>
</body>
</html>
