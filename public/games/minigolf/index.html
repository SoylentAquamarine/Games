<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Mini Golf — Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>⛳</text></svg>" />
<style>
  :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;--good:#34d399;}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
    background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.2),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.14),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;touch-action:none;}
  .wrap{max-width:440px;margin:0 auto;padding:14px 12px 30px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
  .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
  .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
  h1{margin:0;font-size:1.3rem;background:linear-gradient(120deg,#34d399,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
  .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer}
  .hud{width:100%;max-width:420px;display:flex;justify-content:space-between;font-size:.86rem;color:var(--muted)}
  .hud b{color:var(--text)}
  /* Player feedback: "resize this to the size of the screen, I need a HUD
     and the green all on the screen" — the canvas used to size purely off
     viewport WIDTH (min(94vw,460px)), so on a short or landscape viewport
     the resulting height (1.3125x that) could exceed the visible area,
     pushing the bottom of the green (and sometimes the HUD) off-screen.
     Now sized off whichever of width or height is more constraining: the
     calc() term converts a 60vh height budget into the equivalent width at
     this board's 320:420 aspect ratio, and min() picks the smallest. */
  canvas{width:min(94vw,420px,calc(60vh * (320/420)));aspect-ratio:320/420;height:auto;border-radius:10px;border:2px solid #2a2f55;background:#1a5a2a;cursor:crosshair;touch-action:none}
  .msg{min-height:1.3em;font-weight:800;text-align:center}
  .hint{font-size:.78rem;color:var(--muted);text-align:center}
  .modal-back{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:20;padding:14px}
  .modal-back.hidden{display:none}
  .modal{background:var(--panel);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:16px;max-width:340px;width:100%;max-height:86vh;overflow-y:auto;text-align:center}
  .modal h3{margin:0 0 12px}
  .courseBtn{display:block;width:100%;background:#141726;color:var(--text);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:.95rem;cursor:pointer;text-align:left}
  .courseBtn:hover{border-color:var(--accent-2)}
  .courseBtn.random{color:var(--accent-2);font-weight:700;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="home" href="/">← Home</a><h1>Mini Golf</h1><button class="btn" id="new">New Game</button></div>
  <div class="hud"><span>Hole <b id="hole">1</b>/<b id="holes">18</b></span><span>Par <b id="par">3</b></span><span>Strokes <b id="strokes">0</b></span><span>Total <b id="total">0</b></span><span id="courseName" style="display:none"><b id="courseNameB"></b></span></div>
  <canvas id="game" width="320" height="420"></canvas>
  <div class="msg" id="msg">Drag back from the ball to aim & set power, release to putt.</div>
  <div class="hint">Sand slows the ball · water costs a penalty stroke</div>
</div>

<div class="modal-back hidden" id="coursePicker">
  <div class="modal">
    <h3>⛳ Choose a course</h3>
    <div id="courseList"></div>
  </div>
</div>
<script src="/arcade.js"></script>
<script>
(function(){
  const C={ W:320,H:420, R:7, FRICTION:0.984, SAND_FRICTION:0.9, STOP:0.28, MAXPOW:15, HOLE_R:11 };
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  const B=[{x:-30,y:-30,w:C.W+60,h:30},{x:-30,y:C.H,w:C.W+60,h:30},{x:-30,y:-30,w:30,h:C.H+60},{x:C.W,y:-30,w:30,h:C.H+60}];
  const inRect=(x,y,r)=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;
  // 18 holes: {walls, sand, water, start, hole, par} — difficulty ramps up.
  // The admin course editor can override this whole set via localStorage.
  const DEFAULT_LEVELS=[
    {walls:[],sand:[],water:[],start:{x:160,y:370},hole:{x:160,y:80},par:2},
    {walls:[{x:80,y:210,w:160,h:16}],sand:[],water:[],start:{x:80,y:370},hole:{x:250,y:90},par:3},
    {walls:[{x:0,y:170,w:190,h:16}],sand:[],water:[],start:{x:40,y:380},hole:{x:280,y:80},par:3},
    {walls:[{x:120,y:150,w:16,h:150}],sand:[{x:180,y:250,w:90,h:70}],water:[],start:{x:60,y:380},hole:{x:250,y:90},par:3},
    {walls:[{x:60,y:230,w:200,h:16}],sand:[{x:60,y:120,w:110,h:70}],water:[],start:{x:160,y:380},hole:{x:230,y:70},par:4},
    {walls:[{x:0,y:150,w:130,h:16},{x:190,y:250,w:130,h:16}],sand:[],water:[],start:{x:50,y:380},hole:{x:270,y:70},par:4},
    {walls:[],sand:[{x:110,y:180,w:100,h:110}],water:[],start:{x:160,y:385},hole:{x:160,y:70},par:3},
    {walls:[{x:150,y:120,w:16,h:120},{x:150,y:290,w:16,h:110}],sand:[],water:[{x:60,y:210,w:70,h:70}],start:{x:60,y:385},hole:{x:250,y:80},par:4},
    {walls:[{x:70,y:200,w:180,h:16}],sand:[{x:70,y:90,w:80,h:70}],water:[{x:180,y:90,w:90,h:70}],start:{x:160,y:385},hole:{x:110,y:60},par:4},
    {walls:[{x:0,y:160,w:150,h:16},{x:170,y:280,w:150,h:16}],sand:[],water:[{x:150,y:190,w:70,h:60}],start:{x:50,y:385},hole:{x:270,y:70},par:5},
    {walls:[{x:100,y:100,w:16,h:180},{x:204,y:130,w:16,h:180}],sand:[{x:120,y:300,w:84,h:60}],water:[],start:{x:160,y:390},hole:{x:160,y:70},par:4},
    {walls:[{x:60,y:230,w:200,h:16}],sand:[{x:60,y:90,w:90,h:70}],water:[{x:170,y:150,w:100,h:80}],start:{x:150,y:388},hole:{x:250,y:70},par:5},
    {walls:[{x:0,y:130,w:120,h:16},{x:120,y:130,w:16,h:120},{x:200,y:250,w:120,h:16}],sand:[],water:[{x:140,y:300,w:80,h:60}],start:{x:60,y:388},hole:{x:270,y:70},par:5},
    {walls:[{x:80,y:180,w:16,h:160},{x:224,y:100,w:16,h:160}],sand:[{x:100,y:110,w:120,h:60}],water:[{x:100,y:300,w:120,h:50}],start:{x:160,y:390},hole:{x:160,y:70},par:5},
    {walls:[{x:0,y:150,w:110,h:16},{x:210,y:150,w:110,h:16},{x:150,y:250,w:16,h:120}],sand:[],water:[{x:120,y:80,w:80,h:55}],start:{x:60,y:390},hole:{x:160,y:60},par:5},
    {walls:[{x:60,y:120,w:200,h:16},{x:60,y:270,w:200,h:16}],sand:[{x:130,y:170,w:60,h:90}],water:[{x:60,y:300,w:90,h:50},{x:180,y:300,w:80,h:50}],start:{x:160,y:392},hole:{x:230,y:70},par:6},
    {walls:[{x:90,y:90,w:16,h:150},{x:200,y:200,w:16,h:150}],sand:[{x:110,y:280,w:90,h:60}],water:[{x:120,y:110,w:90,h:60}],start:{x:60,y:392},hole:{x:260,y:70},par:5},
    {walls:[{x:0,y:140,w:130,h:16},{x:190,y:140,w:130,h:16},{x:130,y:250,w:16,h:120},{x:174,y:250,w:16,h:120}],sand:[{x:130,y:290,w:60,h:70}],water:[{x:130,y:80,w:60,h:50}],start:{x:160,y:394},hole:{x:160,y:55},par:6},
  ];
  // Player feedback: "We need to be able to create different courses with
  // names and their own 18 holes, and you should get to choose which
  // course you are going to play or a random course." COURSES is always
  // headed by the built-in "Classic 18", followed by whatever named custom
  // courses the admin course designer has saved to "minigolf_courses". The
  // older single-course format ("minigolf_levels") is migrated in as one
  // more course so nothing an admin already designed gets lost.
  function isValidHoles(o){ return Array.isArray(o)&&o.length>0&&o.every(h=>h&&h.start&&h.hole&&Array.isArray(h.walls)&&Array.isArray(h.sand)&&Array.isArray(h.water)); }
  function loadCourses(){
    const courses=[{id:"classic",name:"Classic 18",holes:DEFAULT_LEVELS}];
    try{
      const j=localStorage.getItem("minigolf_courses");
      if(j){
        const arr=JSON.parse(j);
        if(Array.isArray(arr)) for(const c of arr) if(c&&c.id&&c.name&&isValidHoles(c.holes)) courses.push(c);
      } else {
        const old=localStorage.getItem("minigolf_levels");
        if(old){ const o=JSON.parse(old); if(isValidHoles(o)) courses.push({id:"custom",name:"Custom Course",holes:o}); }
      }
    }catch(e){}
    return courses;
  }
  const COURSES=loadCourses();
  function courseById(id){ return COURSES.find(c=>c.id===id); }
  let LEVELS=COURSES[0].holes;
  function collideWall(ball, w){
    const cx=clamp(ball.x,w.x,w.x+w.w), cy=clamp(ball.y,w.y,w.y+w.h);
    const dx=ball.x-cx, dy=ball.y-cy; const d2=dx*dx+dy*dy;
    if(d2>=C.R*C.R) return false;
    if(d2>1e-9){                                  // normal case: centre outside the wall
      const d=Math.sqrt(d2); const nx=dx/d, ny=dy/d;
      ball.x=cx+nx*C.R; ball.y=cy+ny*C.R; const dot=ball.vx*nx+ball.vy*ny;
      ball.vx=(ball.vx-2*dot*nx)*0.78; ball.vy=(ball.vy-2*dot*ny)*0.78; return true;
    }
    // Centre is INSIDE the wall. dx/dy are both zero here, so there is no usable
    // normal — the old code left the ball unreflected and it sailed out the far
    // side. Eject through whichever face is closest and bounce off that axis.
    const left=ball.x-w.x, right=w.x+w.w-ball.x, top=ball.y-w.y, bot=w.y+w.h-ball.y;
    const m=Math.min(left,right,top,bot);
    if(m===left){ ball.x=w.x-C.R; ball.vx=-Math.abs(ball.vx)*0.78; }
    else if(m===right){ ball.x=w.x+w.w+C.R; ball.vx=Math.abs(ball.vx)*0.78; }
    else if(m===top){ ball.y=w.y-C.R; ball.vy=-Math.abs(ball.vy)*0.78; }
    else { ball.y=w.y+w.h+C.R; ball.vy=Math.abs(ball.vy)*0.78; }
    return true;
  }
  function putt(ball, angle, power){ power=clamp(power,0,C.MAXPOW); ball.vx=Math.cos(angle)*power; ball.vy=Math.sin(angle)*power; }
  function moving(ball){ return Math.hypot(ball.vx,ball.vy) >= C.STOP; }
  // Traps are irregular blobs, not rectangles. The outline is derived
  // deterministically from the trap's own position so it never shifts between
  // frames, and the hit test below runs against that same outline — the drawn
  // shape and the physics shape are always identical.
  function seeded(n){ const x=Math.sin(n)*10000; return x-Math.floor(x); }
  function blobPoints(r){
    if(r._pts) return r._pts;
    const n=14, cx=r.x+r.w/2, cy=r.y+r.h/2, rx=r.w/2, ry=r.h/2;
    const seed=r.x*0.37+r.y*0.71+r.w*0.13+r.h*0.29, pts=[];
    for(let i=0;i<n;i++){
      const a=i/n*Math.PI*2, wob=0.80+seeded(seed+i*1.7)*0.34;
      pts.push({x:cx+Math.cos(a)*rx*wob, y:cy+Math.sin(a)*ry*wob});
    }
    r._pts=pts; return pts;
  }
  function inBlob(x,y,r){
    const p=blobPoints(r); let inside=false;
    for(let i=0,j=p.length-1;i<p.length;j=i++){
      if((p[i].y>y)!==(p[j].y>y) && x < (p[j].x-p[i].x)*(y-p[i].y)/(p[j].y-p[i].y)+p[i].x) inside=!inside;
    }
    return inside;
  }
  function inSand(ball, sand){ for(const r of (sand||[])) if(inBlob(ball.x,ball.y,r)) return true; return false; }
  function inWater(ball, water){ for(const r of (water||[])) if(inBlob(ball.x,ball.y,r)) return true; return false; }
  function stepBall(ball, walls, sand){
    // Move in sub-steps no larger than half a radius. A full-power putt travels 15px
    // per frame, more than a 16px wall is thick, so a single big step could tunnel
    // straight through one before any collision test ran.
    const dist=Math.hypot(ball.vx,ball.vy);
    const steps=Math.max(1,Math.ceil(dist/(C.R*0.5)));
    for(let i=0;i<steps;i++){
      ball.x+=ball.vx/steps; ball.y+=ball.vy/steps;
      for(const w of B) collideWall(ball,w);
      for(const w of (walls||[])) collideWall(ball,w);
    }
    const f = inSand(ball,sand)?C.SAND_FRICTION:C.FRICTION; ball.vx*=f; ball.vy*=f;
    // Backstop: whatever happens above, the ball never leaves the green.
    if(ball.x<C.R){ ball.x=C.R; ball.vx=Math.abs(ball.vx)*0.78; }
    if(ball.x>C.W-C.R){ ball.x=C.W-C.R; ball.vx=-Math.abs(ball.vx)*0.78; }
    if(ball.y<C.R){ ball.y=C.R; ball.vy=Math.abs(ball.vy)*0.78; }
    if(ball.y>C.H-C.R){ ball.y=C.H-C.R; ball.vy=-Math.abs(ball.vy)*0.78; }
    if(!moving(ball)){ ball.vx=0; ball.vy=0; }
    return ball;
  }
  function sunk(ball, hole){ return Math.hypot(ball.x-hole.x,ball.y-hole.y)<C.HOLE_R && Math.hypot(ball.vx,ball.vy)<7; }
  // startLevel lets the admin course designer jump straight to the hole
  // being edited (?hole=N in the URL) instead of always starting at hole 1
  // — "test the board directly from the design page".
  function newState(startLevel){ const lv=LEVELS[startLevel||0]; return { level:startLevel||0, ball:{x:lv.start.x,y:lv.start.y,vx:0,vy:0}, strokes:0, total:0, card:[], done:false }; }
  window.__minigolf={ newState, putt, stepBall, sunk, collideWall, moving, inSand, inWater, LEVELS, C, COURSES, courseById, isValidHoles,
    getLEVELS:()=>LEVELS };   // live getter (LEVELS above is a snapshot at export time, before DOM-layer course selection runs)

  if(typeof document==="undefined") return;
  const $=(id)=>document.getElementById(id);
  const cv=$("game"), ctx=cv.getContext("2d"); const W=C.W,H=C.H;
  const qs=new URLSearchParams(location.search);
  // The admin course designer's "Test this hole" button passes ?course=<id>
  // so testing always targets the exact course being edited, skipping the
  // course picker entirely.
  const urlCourse=qs.get("course");
  if(urlCourse && courseById(urlCourse)) LEVELS=courseById(urlCourse).holes;
  const urlHole=parseInt(qs.get("hole"))||0;
  const startLevel=(urlHole>=1&&urlHole<=LEVELS.length)?urlHole-1:0;
  let s=newState(startLevel), aim=null, best=null, lastRest={x:0,y:0};
  // Course picker: only shown when there's an actual choice to make (more
  // than the built-in course exists) and the URL didn't already pick one
  // for us (the admin "Test this hole" button always passes ?course=).
  let pickingCourse=COURSES.length>1 && !urlCourse;
  function setCourse(course,startLvl){
    LEVELS=course.holes; s=newState(startLvl||0);
    const cn=$("courseName"), cnb=$("courseNameB");
    if(cn&&cnb){ if(COURSES.length>1){ cn.style.display=""; cnb.textContent=course.name; } else cn.style.display="none"; }
  }
  function showCoursePicker(){
    const list=$("courseList"); list.innerHTML="";
    for(const c of COURSES){
      const b=document.createElement("button"); b.className="courseBtn"; b.textContent=c.name+" ("+c.holes.length+" holes)";
      b.addEventListener("click",()=>{ setCourse(c); $("coursePicker").classList.add("hidden"); pickingCourse=false; });
      list.appendChild(b);
    }
    const r=document.createElement("button"); r.className="courseBtn random"; r.textContent="🎲 Random course";
    r.addEventListener("click",()=>{ setCourse(COURSES[Math.floor(Math.random()*COURSES.length)]); $("coursePicker").classList.add("hidden"); pickingCourse=false; });
    list.appendChild(r);
    $("coursePicker").classList.remove("hidden");
  }
  if(pickingCourse) showCoursePicker(); else setCourse(courseById(urlCourse)||COURSES[0],startLevel);
  // Hole-in-one celebration: two seconds of fireworks over a shaking banner
  // before the course moves on.
  let ace=0, fw=[];
  const ACE_FRAMES=120;
  function burst(x,y){
    const hue=["#ffcf5a","#f43f5e","#22d3ee","#4ade80","#c084fc"][Math.floor(Math.random()*5)];
    for(let i=0;i<26;i++){ const a=Math.random()*Math.PI*2, sp=1.2+Math.random()*3.4;
      fw.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:34+Math.random()*22,max:56,col:hue}); }
  }
  function stepFireworks(){
    if(ace%18===0) burst(40+Math.random()*(W-80), 60+Math.random()*(H*0.5));
    for(const p of fw){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.06; p.vx*=0.98; p.life--; }
    fw=fw.filter(p=>p.life>0);
  }
  try{ best=parseInt(localStorage.getItem("minigolf_best")||"")||null; }catch(e){}
  function lv(){ return LEVELS[s.level]; }

  function draw(){
    ctx.clearRect(0,0,W,H); ctx.fillStyle="#1a5a2a"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#176a2c"; for(let y=0;y<H;y+=24) ctx.fillRect(0,y,W,12);
    // Trace the blob outline with smooth curves through the midpoints.
    const tracePath=(r)=>{ const p=blobPoints(r); ctx.beginPath();
      let mx=(p[p.length-1].x+p[0].x)/2, my=(p[p.length-1].y+p[0].y)/2;
      ctx.moveTo(mx,my);
      for(let i=0;i<p.length;i++){ const nx=p[(i+1)%p.length], cur=p[i];
        ctx.quadraticCurveTo(cur.x,cur.y,(cur.x+nx.x)/2,(cur.y+nx.y)/2); }
      ctx.closePath(); };
    for(const r of (lv().sand||[])){
      tracePath(r); ctx.fillStyle="#d9c48a"; ctx.fill();
      ctx.strokeStyle="#c2a86a"; ctx.lineWidth=1.5; ctx.stroke();
      ctx.save(); ctx.clip(); ctx.fillStyle="#c9b06a";
      for(let i=0;i<r.w*r.h/300;i++) ctx.fillRect(r.x+(i*53)%r.w, r.y+(i*97)%r.h,2,2);
      ctx.restore(); }
    for(const r of (lv().water||[])){
      tracePath(r); ctx.fillStyle="#1f6fb0"; ctx.fill();
      ctx.strokeStyle="#15558c"; ctx.lineWidth=1.5; ctx.stroke();
      ctx.save(); ctx.clip(); ctx.fillStyle="#3a8fd0";
      for(let y=r.y+4;y<r.y+r.h;y+=8) ctx.fillRect(r.x+3,y,r.w-6,2);
      ctx.restore(); }
    for(const w of lv().walls){ ctx.fillStyle="#6a4a2a"; ctx.fillRect(w.x,w.y,w.w,w.h); ctx.fillStyle="#7a5a3a"; ctx.fillRect(w.x,w.y,w.w,3); }
    const h=lv().hole; ctx.fillStyle="#0a0c18"; ctx.beginPath(); ctx.arc(h.x,h.y,C.HOLE_R,0,7); ctx.fill();
    ctx.strokeStyle="#e6e6f0"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(h.x,h.y); ctx.lineTo(h.x,h.y-26); ctx.stroke(); ctx.fillStyle="#f43f5e"; ctx.fillRect(h.x,h.y-26,14,9);
    if(aim){ const dx=aim.sx-aim.x, dy=aim.sy-aim.y; const pw=Math.min(Math.hypot(dx,dy),120);
      const ang=Math.atan2(dy,dx); ctx.strokeStyle="rgba(255,255,255,.7)"; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(s.ball.x,s.ball.y); ctx.lineTo(s.ball.x+Math.cos(ang)*pw*0.7,s.ball.y+Math.sin(ang)*pw*0.7); ctx.stroke(); }
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(s.ball.x,s.ball.y,C.R,0,7); ctx.fill(); ctx.fillStyle="rgba(0,0,0,.15)"; ctx.beginPath(); ctx.arc(s.ball.x+2,s.ball.y+2,C.R*0.6,0,7); ctx.fill();
    if(ace>0){
      for(const p of fw){ ctx.globalAlpha=Math.max(0,p.life/p.max); ctx.fillStyle=p.col; ctx.fillRect(p.x-2,p.y-2,4,4); }
      ctx.globalAlpha=1;
      const sh=Math.max(0,(ace-40)/80)*6 + 2;      // shakes hardest at the start
      const ox=(Math.random()*2-1)*sh, oy=(Math.random()*2-1)*sh;
      ctx.textAlign="center";
      ctx.font="bold 30px system-ui"; ctx.lineWidth=5; ctx.strokeStyle="#0a0c18";
      ctx.strokeText("HOLE IN ONE",W/2+ox,H/2+oy);
      ctx.fillStyle="#ffcf5a"; ctx.fillText("HOLE IN ONE",W/2+ox,H/2+oy);
    }
    if(s.done) drawCard();
  }
  // Full golf card: par, shots and how you finished on every hole.
  function drawCard(){
    ctx.fillStyle="rgba(6,10,18,.93)"; ctx.fillRect(0,0,W,H);
    ctx.textAlign="center"; ctx.fillStyle="#34d399"; ctx.font="bold 20px system-ui";
    ctx.fillText("SCORECARD",W/2,32);
    const parTot=s.card.reduce((a,c)=>a+c.par,0);
    const rel=s.total-parTot;
    ctx.fillStyle="#e6e6f0"; ctx.font="13px system-ui";
    ctx.fillText("Total "+s.total+"  ·  Par "+parTot+"  ·  "+(rel===0?"E":(rel>0?"+"+rel:String(rel))),W/2,52);
    if(best) { ctx.fillStyle="#9a9ab5"; ctx.font="11px system-ui"; ctx.fillText("Best "+best,W/2,68); }
    const NAME=(r)=>r<=-3?"Albatross":r===-2?"Eagle":r===-1?"Birdie":r===0?"Par":r===1?"Bogey":r===2?"Double":"+"+r;
    const COL=(r)=>r<=-2?"#ffcf5a":r===-1?"#4ade80":r===0?"#e6e6f0":r===1?"#fbbf24":"#f43f5e";
    const top=88, rowH=17;
    for(let half=0; half<2; half++){
      const x0 = half? W/2+6 : 10;
      ctx.textAlign="left"; ctx.fillStyle="#9a9ab5"; ctx.font="10px system-ui";
      ctx.fillText(half?"BACK 9":"FRONT 9", x0+2, top-8);
      ctx.fillText("Hole", x0+2, top+4); ctx.fillText("Par", x0+42, top+4);
      ctx.fillText("You", x0+72, top+4); ctx.fillText("", x0+100, top+4);
      for(let i=0;i<9;i++){
        const idx=half*9+i, c=s.card[idx]; if(!c) continue;
        const y=top+18+i*rowH, r=c.shots-c.par;
        if(i%2===0){ ctx.fillStyle="rgba(255,255,255,.04)"; ctx.fillRect(x0,y-11,W/2-16,rowH); }
        ctx.font="11px system-ui"; ctx.fillStyle="#9a9ab5"; ctx.fillText(String(idx+1), x0+4, y);
        ctx.fillStyle="#c9c9dd"; ctx.fillText(String(c.par), x0+44, y);
        ctx.fillStyle=COL(r); ctx.font="bold 11px system-ui"; ctx.fillText(String(c.shots), x0+74, y);
        ctx.font="10px system-ui"; ctx.fillText(NAME(r), x0+94, y);
      }
      const sub=s.card.slice(half*9,half*9+9);
      const sy=top+18+9*rowH+6;
      ctx.font="bold 11px system-ui"; ctx.fillStyle="#e6e6f0"; ctx.textAlign="left";
      ctx.fillText("OUT", x0+4, sy);
      ctx.fillText(String(sub.reduce((a,c)=>a+c.par,0)), x0+44, sy);
      ctx.fillText(String(sub.reduce((a,c)=>a+c.shots,0)), x0+74, sy);
    }
    const aces=s.card.filter(c=>c.shots===1).length;
    ctx.textAlign="center"; ctx.font="11px system-ui"; ctx.fillStyle="#ffcf5a";
    ctx.fillText(aces?("🎆 "+aces+" hole"+(aces>1?"s":"")+" in one"):"No aces this round", W/2, H-14);
  }
  function frame(){
    if(ace>0){
      ace--; stepFireworks();
      if(ace===0){ fw=[]; nextHole(); }
      draw(); return requestAnimationFrame(frame);
    }
    if(moving(s.ball)){ stepBall(s.ball, lv().walls, lv().sand);
      if(inWater(s.ball, lv().water)){ s.ball.x=lastRest.x; s.ball.y=lastRest.y; s.ball.vx=0; s.ball.vy=0; s.strokes++; $("msg").textContent="💦 Splash! Penalty stroke."; }
      else if(sunk(s.ball, lv().hole)){ s.ball.vx=0; s.ball.vy=0; s.ball.x=lv().hole.x; s.ball.y=lv().hole.y;
        if(s.strokes===1){ ace=ACE_FRAMES; fw=[]; burst(W/2,H/2); $("msg").textContent="🎆 HOLE IN ONE!";
          if(typeof Arcade!=="undefined") Arcade.sfx.win(); }
        else nextHole(); } }
    $("hole").textContent=s.level+1; $("holes").textContent=LEVELS.length; $("par").textContent=lv().par; $("strokes").textContent=s.strokes; $("total").textContent=s.total;
    draw(); requestAnimationFrame(frame);
  }
  function nextHole(){ s.card.push({par:lv().par, shots:s.strokes}); s.total+=s.strokes; const rel=s.strokes-lv().par;
    if(s.level+1>=LEVELS.length){ s.done=true; if(!best||s.total<best){ best=s.total; try{localStorage.setItem("minigolf_best",String(best));}catch(e){} } $("msg").textContent="Course complete! Total "+s.total+(best?"  ·  Best "+best:""); return; }
    s.level++; s.strokes=0; const l=lv(); s.ball={x:l.start.x,y:l.start.y,vx:0,vy:0}; $("msg").textContent=(rel<=-2?"Eagle!":rel===-1?"Birdie!":rel===0?"Par!":rel===1?"Bogey.":"+"+rel)+" — next hole."; }
  function pos(ev){ const r=cv.getBoundingClientRect(); const t=ev.touches?ev.touches[0]:ev; return { x:(t.clientX-r.left)*(W/r.width), y:(t.clientY-r.top)*(H/r.height) }; }
  function down(ev){ if(pickingCourse||s.done||ace>0||moving(s.ball)) return; const p=pos(ev); if(Math.hypot(p.x-s.ball.x,p.y-s.ball.y)<40) aim={x:p.x,y:p.y,sx:p.x,sy:p.y}; }
  function move(ev){ if(!aim) return; ev.preventDefault(); const p=pos(ev); aim.x=p.x; aim.y=p.y; }
  function up(){ if(!aim) return; const dx=aim.sx-aim.x, dy=aim.sy-aim.y; const dist=Math.hypot(dx,dy);
    if(dist>8){ lastRest={x:s.ball.x,y:s.ball.y}; const ang=Math.atan2(dy,dx); putt(s.ball, ang, Math.min(dist,120)/120*C.MAXPOW); s.strokes++; } aim=null; }
  cv.addEventListener("mousedown",down); window.addEventListener("mousemove",move); window.addEventListener("mouseup",up);
  cv.addEventListener("touchstart",(e)=>{e.preventDefault();down(e);},{passive:false}); cv.addEventListener("touchmove",move,{passive:false}); cv.addEventListener("touchend",up);
  $("new").addEventListener("click",()=>{ s=newState(); aim=null; ace=0; fw=[]; $("msg").textContent="Drag back from the ball to aim, release to putt."; });
  requestAnimationFrame(frame);
})();
</script>
