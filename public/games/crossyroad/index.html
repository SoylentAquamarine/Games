<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Crossy Road — Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>🐔</text></svg>" />
<style>
  :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
    background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.2),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.14),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;touch-action:none;}
  .wrap{max-width:420px;margin:0 auto;padding:14px 12px 30px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
  .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
  .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
  h1{margin:0;font-size:1.3rem;background:linear-gradient(120deg,#8ad48a,#ffcf5a);-webkit-background-clip:text;background-clip:text;color:transparent}
  .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer}
  .hud{width:100%;max-width:360px;display:flex;justify-content:space-between;font-size:.9rem;color:var(--muted)}
  .hud b{color:var(--text)}
  canvas{width:min(92vw,360px);height:min(92vw,360px);image-rendering:pixelated;border-radius:10px;border:2px solid #2a2f55;background:#101828;touch-action:none}
  .msg{min-height:1.3em;font-weight:800;text-align:center}
  .dpad{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(2,50px);gap:5px}
  .dpad button{background:var(--panel);color:var(--text);border:1px solid rgba(255,255,255,.1);border-radius:10px;font-size:1.2rem;cursor:pointer;user-select:none}
  .dpad button:active{background:var(--accent);color:#0b0c1a}
  .dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .d{grid-area:2/2}.dpad .r{grid-area:2/3}
  .hint{font-size:.78rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="home" href="/">← Home</a><h1>Crossy Road</h1><button class="btn" id="new">New Game</button></div>
  <div class="hud"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div>
  <canvas id="game" width="360" height="360"></canvas>
  <div class="msg" id="msg">Hop forward across roads and rivers. Don't get hit — don't fall in!</div>
  <div class="dpad"><button class="u" data-d="up">▲</button><button class="l" data-d="left">◀</button><button class="d" data-d="down">▼</button><button class="r" data-d="right">▶</button></div>
  <div class="hint">Arrows / WASD / swipe · tap the canvas to hop forward</div>
</div>
<script>
(function(){
  const C={ COLS:9, VIEW:9 };
  function rnd(a,b){ return a+Math.random()*(b-a); }
  function genRow(i){
    if(i<3) return { type:"grass", ent:[] };
    const t=Math.random(); let type = t<0.42?"road" : t<0.72?"water":"grass";
    const ent=[];
    if(type==="road"){ const n=2+Math.floor(Math.random()*2), dir=Math.random()<.5?1:-1, sp=rnd(0.018,0.045);
      for(let k=0;k<n;k++) ent.push({x:(k*(C.COLS/n))+rnd(0,1), len:1, speed:sp, dir}); }
    else if(type==="water"){ const dir=Math.random()<.5?1:-1, sp=rnd(0.012,0.03), len=2+Math.floor(Math.random()*2);
      let x=rnd(0,2); while(x<C.COLS){ ent.push({x, len, speed:sp, dir}); x+=len+rnd(1.5,2.6); } }
    return { type, ent };
  }
  function carHit(car, px){ const inset=0.12; return px+0.26>car.x+inset && px-0.26<car.x+car.len-inset; }
  function logUnder(row, px){ for(const l of row.ent){ if(px+0.3>l.x && px-0.3<l.x+l.len) return l; } return null; }
  function ensureRows(s, upto){ while(s.rows.length<=upto) s.rows.push(genRow(s.rows.length)); }
  function newState(){ const s={ rows:[], player:{x:4,row:0}, score:0, over:false }; ensureRows(s,20); return s; }
  function hop(s, dir){ if(s.over) return s; const p=s.player;
    if(dir==="up"){ p.row++; ensureRows(s,p.row+C.VIEW); if(p.row>s.score) s.score=p.row; }
    else if(dir==="down"){ if(p.row>0) p.row--; }
    else if(dir==="left"){ p.x=Math.max(0,Math.round(p.x)-1); }
    else if(dir==="right"){ p.x=Math.min(C.COLS-1,Math.round(p.x)+1); }
    if(s.rows[p.row] && s.rows[p.row].type!=="water") p.x=Math.round(p.x);
    return s;
  }
  function step(s){
    if(s.over) return s;
    for(let r=Math.max(0,s.player.row-2); r<=s.player.row+C.VIEW && r<s.rows.length; r++){
      const row=s.rows[r]; for(const e of row.ent){ e.x+=e.dir*e.speed;
        if(e.dir>0 && e.x>C.COLS) e.x=-e.len; if(e.dir<0 && e.x<-e.len) e.x=C.COLS; } }
    const row=s.rows[s.player.row];
    if(row){ if(row.type==="road"){ for(const car of row.ent){ if(carHit(car,s.player.x)){ s.over=true; break; } } }
      else if(row.type==="water"){ const lg=logUnder(row,s.player.x); if(lg){ s.player.x+=lg.dir*lg.speed; if(s.player.x<-0.2||s.player.x>C.COLS-0.8) s.over=true; } else s.over=true; } }
    return s;
  }
  window.__crossyroad={ newState, genRow, hop, step, carHit, logUnder, C };

  if(typeof document==="undefined") return;
  const $=(id)=>document.getElementById(id);
  const cv=$("game"), ctx=cv.getContext("2d"); const W=cv.width,H=cv.height, RH=40, cw=W/C.COLS;
  let s=newState(), best=0, camRow=0;
  try{ best=parseInt(localStorage.getItem("crossy_best")||"0")||0; }catch(e){}
  const COL={grass:"#2f6b34",grass2:"#37773c",road:"#2b2f3a",water:"#1f5a8a"};

  function draw(){
    ctx.clearRect(0,0,W,H); camRow += (s.player.row - camRow)*0.2;
    const BASE = H - 2.5*RH;                 // screen y of the row the player is on
    const sy=(r)=> BASE - (r - camRow)*RH;    // higher rows (bigger r) sit higher up
    const lo=Math.floor(camRow)-2, hi=Math.floor(camRow)+C.VIEW+2;
    for(let r=lo;r<=hi;r++){ if(r<0||r>=s.rows.length) continue; const row=s.rows[r]; const y=sy(r);
      let col = row.type==="grass"?(r%2?COL.grass:COL.grass2):COL[row.type]; ctx.fillStyle=col; ctx.fillRect(0,y,W,RH);
      if(row.type==="water"){ for(const l of row.ent){ ctx.fillStyle="#7a4a24"; ctx.fillRect(l.x*cw,y+6,l.len*cw,RH-12); ctx.fillStyle="#5c3a18"; ctx.fillRect(l.x*cw,y+6,l.len*cw,2); } }
      if(row.type==="road"){ ctx.strokeStyle="rgba(255,255,255,.25)"; ctx.setLineDash([8,8]); ctx.beginPath(); ctx.moveTo(0,y+RH/2); ctx.lineTo(W,y+RH/2); ctx.stroke(); ctx.setLineDash([]);
        for(const car of row.ent){ ctx.fillStyle="#f43f5e"; ctx.fillRect(car.x*cw+3,y+7,car.len*cw-6,RH-14); ctx.fillStyle="#ffd0d6"; ctx.fillRect((car.dir>0?(car.x+car.len)*cw-6:car.x*cw+2),y+11,4,RH-22); } }
    }
    const py=sy(s.player.row)+RH/2, pcx=s.player.x*cw+cw/2;
    ctx.fillStyle="#ffcf5a"; ctx.beginPath(); ctx.arc(pcx, py, 13, 0, 7); ctx.fill();
    ctx.fillStyle="#f0902a"; ctx.fillRect(pcx-2, py-15, 4, 5);        // beak
    ctx.fillStyle="#f43f5e"; ctx.fillRect(pcx-5, py-14, 10, 3);       // comb
    ctx.fillStyle="#0b0c1a"; ctx.fillRect(pcx-5, py-4, 2, 2); ctx.fillRect(pcx+3, py-4, 2, 2);
    if(s.over){ ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillRect(0,0,W,H); ctx.fillStyle="#f43f5e"; ctx.font="bold 24px system-ui"; ctx.textAlign="center"; ctx.fillText("SPLAT!",W/2,H/2-6); ctx.fillStyle="#e6e6f0"; ctx.font="14px system-ui"; ctx.fillText("Score "+s.score+"  ·  Best "+best,W/2,H/2+16); }
  }
  function frame(){ step(s);
    if(s.over && s.score>best){ best=s.score; try{localStorage.setItem("crossy_best",String(best));}catch(e){} $("msg").textContent="Ouch! Score "+s.score+"  ·  Best "+best; }
    $("score").textContent=s.score; $("best").textContent=best; draw(); requestAnimationFrame(frame); }
  function go(d){ if(s.over) return; hop(s,d); }
  document.querySelectorAll(".dpad button").forEach(b=>{ const d=b.getAttribute("data-d"); const f=(e)=>{e.preventDefault();go(d);}; b.addEventListener("click",f); b.addEventListener("touchstart",f,{passive:false}); });
  addEventListener("keydown",(e)=>{ const m={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",w:"up",s:"down",a:"left",d:"right"}[e.key]; if(m){ e.preventDefault(); go(m); } });
  let t0=null;
  cv.addEventListener("touchstart",(e)=>{ t0={x:e.touches[0].clientX,y:e.touches[0].clientY}; },{passive:true});
  cv.addEventListener("touchend",(e)=>{ if(!t0) return; const t=e.changedTouches[0], dx=t.clientX-t0.x, dy=t.clientY-t0.y;
    if(Math.abs(dx)<20&&Math.abs(dy)<20) go("up"); else if(Math.abs(dx)>Math.abs(dy)) go(dx>0?"right":"left"); else go(dy>0?"down":"up"); t0=null; });
  cv.addEventListener("mousedown",()=>go("up"));
  $("new").addEventListener("click",()=>{ s=newState(); camRow=0; $("msg").textContent="Hop forward across roads and rivers!"; });
  requestAnimationFrame(frame);
})();
</script>
<script src="/comments.js" defer></script>
</body>
</html>
