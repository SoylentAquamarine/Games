<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Galaga — Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>🛸</text></svg>" />
<style>
  :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;--bad:#f43f5e;}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
    background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.2),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.14),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;touch-action:none;}
  .wrap{max-width:520px;margin:0 auto;padding:14px 12px 30px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
  .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
  .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
  h1{margin:0;font-size:1.3rem;background:linear-gradient(120deg,#22d3ee,#f0616e);-webkit-background-clip:text;background-clip:text;color:transparent}
  .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer}
  .hud{width:100%;max-width:480px;display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
  .hud b{color:var(--text)}
  canvas{width:min(96vw,480px);height:calc(min(96vw,480px)*1.25);image-rendering:pixelated;border-radius:10px;border:2px solid #2a2f55;background:#05060f;touch-action:none}
  .msg{min-height:1.3em;font-weight:800;text-align:center}
  .ctl{display:flex;gap:8px;align-items:center}
  .cbtn{background:var(--panel);color:var(--text);border:1px solid rgba(255,255,255,.12);border-radius:12px;width:60px;height:52px;font-size:1.3rem;cursor:pointer;user-select:none}
  .cbtn:active{background:var(--accent);color:#0b0c1a}
  .fire{background:var(--bad);color:#fff;border:none;border-radius:12px;width:80px;height:52px;font-weight:800;cursor:pointer;user-select:none}
  .hint{font-size:.78rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="home" href="/">← Home</a><h1>Galaga</h1><button class="btn" id="new">New Game</button></div>
  <div class="hud"><span>Score: <b id="score">0</b></span><span>Wave: <b id="wave">1</b></span><span>Lives: <b id="lives">3</b></span></div>
  <canvas id="game" width="480" height="600"></canvas>
  <div class="msg" id="msg">Blast the fleet. Beware the boss tractor beam — shoot the captor to get your ship back!</div>
  <div class="ctl"><button class="cbtn" id="bl">◀</button><button class="fire" id="fire">FIRE</button><button class="cbtn" id="br">▶</button></div>
  <div class="hint">←/→ or A/D move · Space/FIRE shoots · drag on canvas to move</div>
</div>
<script src="/arcade.js"></script>
<script>
(function(){
  const C={ W:480,H:600, PW:22,PH:14, EW:20,EH:16, PLY:558, BSPEED:7, ESPEED:2.4,
            BEAM_Y:210, BEAM_W:56, BEAM_OPEN:80, BEAM_HOLD:150,
            BEAM_RAMP:26, BEAM_ARM:0.6, PULL_T:46 };
  // BEAM_RAMP: frames to widen or shut the cone.
  // BEAM_ARM: how far open it must be before it can actually take your ship.
  // PULL_T: frames the captured ship spends being drawn up the beam.
  const rov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
  function bulletHitsEnemy(b, e){ return e.alive && rov({x:b.x,y:b.y,w:3,h:10},{x:e.x-C.EW/2,y:e.y-C.EH/2,w:C.EW,h:C.EH}); }
  function enemyRect(e){ return {x:e.x-C.EW/2,y:e.y-C.EH/2,w:C.EW,h:C.EH}; }
  function makeWave(s){ s.wave++; s.enemies=[]; const cols=6, rows=3;
    // Each wave the flock flies IN rather than appearing: they stream from the
    // sides in single file, arc across the screen, and peel into their formation
    // slots. It is cosmetic — they can't be hit or shoot until they arrive.
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){ const fx=60+c*(C.W-120)/(cols-1), fy=70+r*42;
      const fromLeft = c<cols/2;
      const order = fromLeft ? c : (cols-1-c);      // near side launches first
      s.enemies.push({ x:fx, y:fy, fx, fy, alive:true, state:"enter",
        enterT:0, enterDelay:8+order*7+r*3, fromLeft,
        t:Math.random()*6, boss:r===0, hasShip:false,
        color:r===0?"#f0616e":r===1?"#ffcf5a":"#22d3ee" }); }
    s.diveTimer=120; s.beamTimer=180;
    // every fifth wave a bomber chicken sweeps over dropping bombs
    if(s.wave%5===0){ const fromLeft=Math.random()<0.5;
      s.flyby={ x: fromLeft?-24:C.W+24, y:44, vx:(fromLeft?1:-1)*1.6, dropT:36 }; }
  }
  // Swooping entrance: in low from the side, arc up and over, ease into the slot.
  function enterStep(e){
    e.enterT++;
    if(e.enterT < e.enterDelay) return;             // still queued off-screen
    const u = Math.min(1,(e.enterT-e.enterDelay)/46);
    const startX = e.fromLeft ? -20 : C.W+20, startY = 20;
    const midX = e.fromLeft ? C.W*0.75 : C.W*0.25,  midY = 150;
    const ax = startX+(midX-startX)*u, ay = startY+(midY-startY)*u;
    const bx = midX+(e.fx-midX)*u,     by = midY+(e.fy-midY)*u;
    e.x = ax+(bx-ax)*u;
    e.y = ay+(by-ay)*u;
    if(u>=1){ e.x=e.fx; e.y=e.fy; e.state="form"; }
  }
  function newState(){ const s={ px:C.W/2, bullets:[], enemies:[], score:0, wave:0, lives:3, over:false, sway:0,
    diveTimer:90, beamTimer:150, dual:false, rescue:null, captured:false, pull:null, flyby:null, bombs:[] }; makeWave(s); return s; }
  // Width of the beam cone at a given depth below the boss.
  function beamHalfWidth(e, y){ const d=Math.max(0,y-e.y);
    const open = e.beamOpen==null ? 1 : e.beamOpen;
    return (C.BEAM_W*0.25 + d*0.18) * open; }
  function inBeam(e, px, py){
    if(e.state!=="beam"||e.beamT<=0) return false;
    if((e.beamOpen||0) < C.BEAM_ARM) return false;      // still opening — not armed yet
    if(py<e.y) return false;
    return Math.abs(px-e.x) <= beamHalfWidth(e,py);
  }
  function enemyDiveStep(e, targetX){ e.t+=0.06; e.y+=C.ESPEED; e.x=e.diveX + Math.sin(e.t*3)*40 + (targetX-e.diveX)*0.002*e.y*0;
    e.x=e.diveX + Math.sin(e.t*4)*46; }
  function step(s, input){
    if(s.over) return s;
    if(input){ if(input.left) s.px=Math.max(C.PW/2,s.px-5); if(input.right) s.px=Math.min(C.W-C.PW/2,s.px+5); if(input.x!=null) s.px=Math.max(C.PW/2,Math.min(C.W-C.PW/2,input.x)); }
    s.sway+=0.03;
    for(const b of s.bullets) b.y-=C.BSPEED;
    s.bullets=s.bullets.filter(b=>b.y>-12);
    // formation sway + dives
    for(const e of s.enemies){ if(!e.alive) continue;
      if(e.state==="enter"){ enterStep(e); }
      else if(e.state==="form"){ e.x=e.fx+Math.sin(s.sway)*10; e.y=e.fy; }
      else if(e.state==="beam"){
        // descend to beam height, hold there with the beam open, then climb home
        if(e.y<C.BEAM_Y && e.beamT<=0 && !e.returning){ e.y+=C.ESPEED; if(e.y>=C.BEAM_Y) e.beamT=C.BEAM_HOLD; }
        else if(e.beamT>0){
          e.beamT--;
          // widen on the way in, shut again over the last frames
          const closing = e.beamT < C.BEAM_RAMP;
          const target = closing ? 0 : 1;
          const rate = 1/C.BEAM_RAMP;
          e.beamOpen = (e.beamOpen==null?0:e.beamOpen) + Math.sign(target-(e.beamOpen==null?0:e.beamOpen))*rate;
          e.beamOpen = Math.max(0, Math.min(1, e.beamOpen));
          if(!s.captured && !s.dual && inBeam(e,s.px,C.PLY)){   // caught in the beam
            s.captured=true; e.hasShip=true; e.beamT=0; e.returning=true;
            s.pull={ x:s.px, y:C.PLY, tx:e.x, ty:e.y+C.EH, t:C.PULL_T };
            s.lives--; if(s.lives<=0){ s.over=true; return s; }
            s.px=C.W/2;
          }
          if(e.beamT<=0 && !e.returning) e.returning=true;
        }
        else if(e.returning){ e.beamOpen=Math.max(0,(e.beamOpen==null?0:e.beamOpen)-1/C.BEAM_RAMP); e.y-=C.ESPEED*1.2; if(e.y<=e.fy){ e.y=e.fy; e.state="form"; e.returning=false; s.captured=e.hasShip?true:s.captured; } }
      }
      else { e.t+=0.05; e.y+=C.ESPEED+s.wave*0.15; e.x=e.diveX+Math.sin(e.t*4)*46;
        if(e.y>C.H+20){ e.y=-10; e.state="form"; } // looped back to formation
        if(rov(enemyRect(e),{x:s.px-C.PW/2,y:C.PLY-C.PH/2,w:C.PW,h:C.PH})){ e.alive=false; s.lives--; if(s.lives<=0) s.over=true; }
      }
    }
    const entering = s.enemies.some(e=>e.alive&&e.state==="enter");
    // launch a diver (never while the flock is still flying in)
    if(!entering && --s.diveTimer<=0){ const forms=s.enemies.filter(e=>e.alive&&e.state==="form"&&!e.boss); if(forms.length){ const e=forms[Math.floor(Math.random()*forms.length)]; e.state="dive"; e.diveX=e.x; e.t=0; } s.diveTimer=Math.max(30,90-s.wave*8); }
    // the captured ship being drawn up the beam
    if(s.pull){ s.pull.t--;
      if(s.pull.t<=0) s.pull=null;
      else { const u=1-(s.pull.t/C.PULL_T);
        s.pull.cx=s.pull.x+(s.pull.tx-s.pull.x)*u;
        s.pull.cy=s.pull.y+(s.pull.ty-s.pull.y)*u; } }
    // a boss comes down to try the tractor beam
    if(--s.beamTimer<=0){
      const bosses=s.enemies.filter(e=>e.alive&&e.boss&&e.state==="form"&&!e.hasShip);
      if(bosses.length && !s.captured && !s.dual){ const e=bosses[Math.floor(Math.random()*bosses.length)];
        e.state="beam"; e.beamT=0; e.beamOpen=0; e.returning=false; }
      s.beamTimer=C.BEAM_OPEN+Math.floor(Math.random()*90);   // noticeably more often
    }
    // a freed ship flies back down to you and doubles you up
    if(s.rescue){ s.rescue.y+=4; if(s.rescue.y>=C.PLY){ s.rescue=null; s.dual=true; s.captured=false; } }
    // bullet hits
    for(const b of s.bullets){ for(const e of s.enemies){ if(bulletHitsEnemy(b,e)){
      e.alive=false; b.y=-99; s.score+= e.state==="dive"?150:100;
      // shooting the boss that stole your ship sets it free
      if(e.hasShip && !s.dual && !s.rescue){ s.rescue={x:e.x,y:e.y}; s.score+=1000; e.hasShip=false; }
    } } }
    stepFlyby(s);
    s.bullets=s.bullets.filter(b=>b.y>-12);
    s.enemies=s.enemies.filter(e=>e.alive);
    if(s.enemies.length===0) makeWave(s);
    return s;
  }
  // Doubled up, both ships fire — twice the firepower, twice the width to hit.
  function fire(s){ if(s.over) return;
    const cap = s.dual?6:3;
    if(s.bullets.length>=cap) return;
    if(s.dual){ s.bullets.push({x:s.px-1-14, y:C.PLY-12}); s.bullets.push({x:s.px-1+14, y:C.PLY-12}); }
    else s.bullets.push({x:s.px-1, y:C.PLY-12});
  }
  function stepFlyby(s){
    s.bombs=s.bombs||[];
    if(s.flyby){
      const fb=s.flyby; fb.x+=fb.vx;
      if(--fb.dropT<=0 && fb.x>10 && fb.x<C.W-10){ fb.dropT=30+Math.floor(Math.random()*24);
        s.bombs.push({x:fb.x,y:fb.y+8,vy:2.4}); }
      for(const b of s.bullets){ if(Math.abs(b.x-fb.x)<12 && Math.abs(b.y-fb.y)<12){ s.score+=2000; b.y=-99; s.flyby=null; break; } }
      if(s.flyby && (fb.x<-30||fb.x>C.W+30)) s.flyby=null;
    }
    for(const bm of s.bombs){
      bm.y+=bm.vy;
      if(bm.y>C.H+10){ bm.dead=true; continue; }
      if(Math.abs(bm.x-s.px)<C.PW/2 && Math.abs(bm.y-C.PLY)<C.PH/2){ bm.dead=true; s.lives--; if(s.lives<=0) s.over=true; }
      for(const b of s.bullets){ if(!bm.dead && Math.abs(b.x-bm.x)<9 && Math.abs(b.y-bm.y)<9){ bm.dead=true; b.y=-99; s.score+=100; } }
    }
    s.bombs=s.bombs.filter(b=>!b.dead);
  }
  window.__galaga={ newState, step, fire, makeWave, enterStep, stepFlyby, bulletHitsEnemy, inBeam, beamHalfWidth, C };

  if(typeof document==="undefined") return;
  const $=(id)=>document.getElementById(id);
  const cv=$("game"), ctx=cv.getContext("2d"); const W=C.W,H=C.H;
  // Hold the loop until the player asks for it (comment: Press Spacebar To Begin)
  const GATE = Arcade.startGate(cv, "Chickaga");
  let s=newState(), input={left:false,right:false,x:null}, best=0, stars=[];
  try{ best=parseInt(localStorage.getItem("galaga_best")||"0")||0; }catch(e){}
  for(let i=0;i<50;i++) stars.push({x:Math.random()*W,y:Math.random()*H,s:0.3+Math.random()});

  function draw(){
    ctx.clearRect(0,0,W,H); ctx.fillStyle="#05060f"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#2a2f55"; for(const st of stars){ st.y=(st.y+st.s)%H; ctx.fillRect(st.x,st.y,1,1); }
    // tractor beams first, so ships draw over them
    for(const e of s.enemies){ if(!e.alive||e.state!=="beam"||e.beamT<=0) continue;
      const grd=ctx.createLinearGradient(0,e.y,0,C.PLY);
      grd.addColorStop(0,"rgba(124,92,255,.55)"); grd.addColorStop(1,"rgba(34,211,238,.05)");
      ctx.fillStyle=grd; ctx.beginPath();
      ctx.moveTo(e.x-beamHalfWidth(e,e.y),e.y); ctx.lineTo(e.x+beamHalfWidth(e,e.y),e.y);
      ctx.lineTo(e.x+beamHalfWidth(e,C.PLY),C.PLY); ctx.lineTo(e.x-beamHalfWidth(e,C.PLY),C.PLY);
      ctx.closePath(); ctx.fill();
      // pulsing rungs down the cone
      ctx.strokeStyle="rgba(199,180,255,"+(0.25+0.35*(e.beamOpen==null?1:e.beamOpen))+")";
      for(let k=0;k<5;k++){ const yy=e.y+((k*46+(Date.now()/8)%46));
        if(yy>C.PLY) continue; const hw=beamHalfWidth(e,yy);
        ctx.beginPath(); ctx.moveTo(e.x-hw,yy); ctx.lineTo(e.x+hw,yy); ctx.stroke(); } }
    // your ship spiralling up the beam after a capture
    if(s.pull && s.pull.cx!=null){
      const u=1-(s.pull.t/C.PULL_T);
      ctx.save(); ctx.translate(s.pull.cx,s.pull.cy); ctx.rotate(u*Math.PI*4);
      ctx.globalAlpha=0.4+0.6*(1-u);
      ctx.fillStyle="#22d3ee"; ctx.fillRect(-C.PW/2,-C.PH/2,C.PW,C.PH*0.7);
      ctx.restore(); ctx.globalAlpha=1;
    }
    for(const e of s.enemies){ if(!e.alive) continue; ctx.fillStyle=e.color; ctx.fillRect(e.x-C.EW/2,e.y-C.EH/2,C.EW,C.EH);
      ctx.fillStyle="#0b0c1a"; ctx.fillRect(e.x-6,e.y-2,4,4); ctx.fillRect(e.x+2,e.y-2,4,4); ctx.fillStyle=e.color; ctx.fillRect(e.x-C.EW/2-3,e.y,3,5); ctx.fillRect(e.x+C.EW/2,e.y,3,5);
      // your captured ship, slung underneath the boss that took it
      if(e.hasShip){ ctx.fillStyle="#22d3ee"; ctx.fillRect(e.x-C.PW/2,e.y+C.EH/2+3,C.PW,C.PH*0.7); ctx.fillRect(e.x-2,e.y+C.EH/2+C.PH*0.7+2,4,4); } }
    ctx.fillStyle="#fff"; for(const b of s.bullets) ctx.fillRect(b.x,b.y,3,10);
    // the bomber chicken's bombs
    if(s.bombs) for(const bm of s.bombs){ ctx.fillStyle="#f43f5e"; ctx.beginPath(); ctx.arc(bm.x,bm.y,3.4,0,7); ctx.fill();
      ctx.fillStyle="#fde68a"; ctx.beginPath(); ctx.arc(bm.x,bm.y,1.4,0,7); ctx.fill(); }
    // the bomber chicken
    if(s.flyby){ const fb=s.flyby, r=9;
      ctx.save(); ctx.translate(fb.x,fb.y); ctx.scale(fb.vx>0?1:-1,1);
      ctx.fillStyle="#fb923c"; ctx.beginPath(); ctx.moveTo(-r*0.9,0); ctx.lineTo(-r*1.9,-r*0.5); ctx.lineTo(-r*1.9,r*0.5); ctx.closePath(); ctx.fill();
      ctx.fillStyle="#cbd5e1"; ctx.fillRect(-r*1.3,-r*0.7,r*0.9,r*1.4);
      ctx.fillStyle="#f0902a"; ctx.beginPath(); ctx.arc(0,0,r*0.85,0,7); ctx.fill();
      ctx.fillStyle="#dc2626"; ctx.beginPath(); ctx.arc(-r*0.2,-r*0.9,r*0.18,0,7); ctx.arc(r*0.1,-r*1.0,r*0.2,0,7); ctx.arc(r*0.4,-r*0.9,r*0.18,0,7); ctx.fill();
      ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(r*0.3,-r*0.2,r*0.24,0,7); ctx.fill();
      ctx.fillStyle="#0b0c1a"; ctx.beginPath(); ctx.arc(r*0.36,-r*0.2,r*0.12,0,7); ctx.fill();
      ctx.fillStyle="#facc15"; ctx.beginPath(); ctx.moveTo(r*0.75,0); ctx.lineTo(r*1.4,r*0.18); ctx.lineTo(r*0.75,r*0.3); ctx.closePath(); ctx.fill();
      ctx.strokeStyle="rgba(186,230,253,.85)"; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,-r*0.1,r*1.35,0,7); ctx.stroke();
      ctx.fillStyle="rgba(186,230,253,.15)"; ctx.beginPath(); ctx.arc(0,-r*0.1,r*1.35,0,7); ctx.fill();
      ctx.restore();
    }
    // a freed ship on its way back down
    if(s.rescue){ ctx.fillStyle="#7de8ff"; ctx.fillRect(s.rescue.x-C.PW/2,s.rescue.y-C.PH/2,C.PW,C.PH); }
    ctx.fillStyle="#22d3ee";
    if(s.dual){   // twin fighters
      ctx.fillRect(s.px-C.PW/2-14,C.PLY-C.PH/2,C.PW,C.PH); ctx.fillRect(s.px-2-14,C.PLY-C.PH/2-6,4,6);
      ctx.fillRect(s.px-C.PW/2+14,C.PLY-C.PH/2,C.PW,C.PH); ctx.fillRect(s.px-2+14,C.PLY-C.PH/2-6,4,6);
    } else { ctx.fillRect(s.px-C.PW/2,C.PLY-C.PH/2,C.PW,C.PH); ctx.fillRect(s.px-2,C.PLY-C.PH/2-6,4,6); }
    if(s.over){ ctx.fillStyle="rgba(0,0,0,.6)"; ctx.fillRect(0,0,W,H); ctx.fillStyle="#f43f5e"; ctx.font="bold 24px system-ui"; ctx.textAlign="center"; ctx.fillText("GAME OVER",W/2,H/2-6); ctx.fillStyle="#e6e6f0"; ctx.font="14px system-ui"; ctx.fillText("Score "+s.score+"  ·  Best "+best,W/2,H/2+16); }
  }
  function frame(){
    if(!GATE.open){ draw(); GATE.paint(); return requestAnimationFrame(frame); } step(s,input);
    if(typeof Arcade!=="undefined")Arcade.stats.record("galaga",s.score); if(s.over && s.score>best){ best=s.score; try{localStorage.setItem("galaga_best",String(best));}catch(e){} $("msg").textContent="Game over! Score "+s.score+"  ·  Best "+best; }
    $("score").textContent=s.score; $("wave").textContent=s.wave; $("lives").textContent=Math.max(0,s.lives); draw(); requestAnimationFrame(frame); }
  const bindHold=(id,k)=>{ const el=$(id); const on=(e)=>{e.preventDefault();input[k]=true;}; const off=(e)=>{e.preventDefault();input[k]=false;};
    el.addEventListener("touchstart",on,{passive:false});el.addEventListener("touchend",off);el.addEventListener("mousedown",on);el.addEventListener("mouseup",off);el.addEventListener("mouseleave",off); };
  bindHold("bl","left"); bindHold("br","right");
  const fb=$("fire"); const ff=(e)=>{e.preventDefault();fire(s);}; fb.addEventListener("touchstart",ff,{passive:false}); fb.addEventListener("mousedown",ff);
  addEventListener("keydown",(e)=>{ if(e.key==="ArrowLeft"||e.key==="a")input.left=true; else if(e.key==="ArrowRight"||e.key==="d")input.right=true; else if(e.key===" "){e.preventDefault();fire(s);} });
  addEventListener("keyup",(e)=>{ if(e.key==="ArrowLeft"||e.key==="a")input.left=false; else if(e.key==="ArrowRight"||e.key==="d")input.right=false; });
  cv.addEventListener("touchmove",(e)=>{ e.preventDefault(); const r=cv.getBoundingClientRect(); input.x=(e.touches[0].clientX-r.left)*(W/r.width); },{passive:false});
  cv.addEventListener("touchstart",(e)=>{ e.preventDefault(); fire(s); const r=cv.getBoundingClientRect(); input.x=(e.touches[0].clientX-r.left)*(W/r.width); },{passive:false});
  $("new").addEventListener("click",()=>{ s=newState(); input={left:false,right:false,x:null}; $("msg").textContent="Blast the fleet!"; });
  requestAnimationFrame(frame);
})();
</script>
<script src="/comments.js" defer></script>
</body>
