<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Games — Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>🃏</text></svg>" />
  <style>
    :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;--card:#1e2140;}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
      background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.22),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.16),transparent 60%),var(--bg);}
    .wrap{max-width:820px;margin:0 auto;padding:20px 18px 60px}
    .topbar{display:flex;align-items:center;justify-content:space-between}
    .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
    .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
    h1{font-size:clamp(2rem,7vw,3rem);margin:.4em 0 .1em;background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
    .sub{text-align:center;color:var(--muted);margin:0 0 8px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-top:26px}
    .c{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--card);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:22px 16px;text-decoration:none;color:var(--text);transition:transform .15s,border-color .15s}
    .c:hover{transform:translateY(-4px);border-color:rgba(124,92,255,.6)}
    .c .icon{font-size:2.4rem}
    .c span{font-weight:600}
    .c.soon{opacity:.55;cursor:default}
    .c.soon:hover{transform:none;border-color:rgba(255,255,255,.07)}
    .tag{font-size:.68rem;color:var(--muted)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar"><a class="home" href="/">← Home</a><span></span></div>
    <h1>🃏 Card Games</h1>
    <p class="sub">All built on one shared card engine.</p>
    <div class="grid">
      <a class="c" href="/games/cards/war/"><div class="icon">⚔️</div><span>War</span></a>
      <a class="c" href="/games/cards/crazy8/"><div class="icon">8️⃣</div><span>Crazy Eights</span></a>
      <a class="c" href="/games/cards/hearts/"><div class="icon">♥️</div><span>Hearts</span></a>
      <a class="c" href="/games/cards/spades/"><div class="icon">♠️</div><span>Spades</span></a>
      <a class="c" href="/games/cards/klondike/"><div class="icon">🂡</div><span>Klondike</span></a>
      <a class="c" href="/games/cards/freecell/"><div class="icon">🃏</div><span>FreeCell</span></a>
      <a class="c" href="/games/cards/pyramid/"><div class="icon">🔺</div><span>Pyramid</span></a>
      <a class="c" href="/games/cards/gofish/"><div class="icon">🐟</div><span>Go Fish</span></a>
      <a class="c" href="/games/cards/videopoker/"><div class="icon">🎰</div><span>Video Poker</span></a>
    </div>
  </div>
  <script src="/comments.js" defer></script>
</body>
</html>
