<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spades — Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>♠️</text></svg>" />
  <style>
    :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;--felt:#12351f;}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
      background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.22),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.16),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;}
    .wrap{max-width:560px;margin:0 auto;padding:14px 10px 40px;display:flex;flex-direction:column;align-items:center;gap:10px}
    .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
    .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
    .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
    h1{margin:0;font-size:1.5rem;background:linear-gradient(120deg,#e6e6f0,var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
    .teams{display:flex;gap:8px;width:100%;font-size:.8rem}
    .team{flex:1;background:var(--panel);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:7px;text-align:center}
    .team b{font-size:1.2rem;display:block}
    .players{display:flex;gap:5px;width:100%;font-size:.72rem}
    .pl{flex:1;background:var(--panel);border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:5px;text-align:center}
    .pl.turn{border-color:var(--accent-2)}
    .table{width:100%;background:radial-gradient(circle at 50% 45%,#1a4a2b,var(--felt));border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px 12px;min-height:180px;display:grid;
      grid-template-areas:". n ." "w c e" ". s .";grid-template-columns:1fr 1fr 1fr;gap:6px;align-items:center;justify-items:center}
    .slot-n{grid-area:n}.slot-s{grid-area:s}.slot-w{grid-area:w}.slot-e{grid-area:e}
    .banner{grid-area:c;font-weight:700;color:#fde68a;text-align:center;font-size:.9rem}
    .trickcard .pcard{--cw:52px}
    .hand{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;width:100%}
    .hand .pcard{--cw:52px;cursor:default;transition:transform .1s}
    .hand .pcard.legal{cursor:pointer;box-shadow:0 0 0 2px #34d399,0 2px 6px rgba(0,0,0,.4)}
    .hand .pcard.legal:hover{transform:translateY(-8px)}
    .status{min-height:1.2em;font-weight:600;text-align:center;color:#fde68a}
    .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
    .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:9px 14px;border-radius:999px;cursor:pointer;font-size:.85rem}
    .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.18);color:var(--muted)}
    .bidbtn{min-width:40px}
    .hint{color:var(--muted);font-size:.8rem;text-align:center}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar"><a class="home" href="/games/cards/">← Cards</a><h1>♠️ Spades</h1><span style="width:56px"></span></div>
    <div class="teams" id="teams"></div>
    <div class="players" id="players"></div>
    <div class="table" id="table">
      <div class="slot-n trickcard" id="tc2"></div>
      <div class="slot-w trickcard" id="tc1"></div>
      <div class="banner" id="banner"></div>
      <div class="slot-e trickcard" id="tc3"></div>
      <div class="slot-s trickcard" id="tc0"></div>
    </div>
    <div class="status" id="status"></div>
    <div class="hand" id="hand"></div>
    <div class="btns" id="bidbtns"></div>
    <div class="btns"><button class="btn ghost" id="new">New Game</button></div>
    <p class="hint">You &amp; North vs West &amp; East. Spades are trump. Make your combined bid; overtricks are “bags” (10 bags = −100). Nil (bid 0) = +100 if you take no tricks. First to 500.</p>
  </div>

  <script src="../cards.js"></script>
  <script>
  (function(){
    const NAMES=["You","West","North","East"];
    function bestOfTrick(trick){const led=trick[0].card.suit;const sp=trick.filter(t=>t.card.suit==="S");
      const pool=sp.length?sp:trick.filter(t=>t.card.suit===led);return pool.reduce((a,b)=>b.card.rank>a.card.rank?b:a);}
    function legalPlays(hand,ctx){
      if(ctx.leading){if(!ctx.spadesBroken){const non=hand.filter(c=>c.suit!=="S");if(non.length)return non;}return hand.slice();}
      const inSuit=hand.filter(c=>c.suit===ctx.ledSuit);return inSuit.length?inSuit:hand.slice();
    }
    function aiChoose(hand,trick,ctx){
      const opts=legalPlays(hand,ctx);
      if(ctx.leading){const non=opts.filter(c=>c.suit!=="S");return (non.length?non:opts).sort((a,b)=>a.rank-b.rank)[0];}
      const led=ctx.ledSuit,winner=bestOfTrick(trick);
      const partnerWinning=(winner.player%2===ctx.me%2)&&winner.player!==ctx.me;
      const inSuit=opts.filter(c=>c.suit===led);
      if(inSuit.length){
        if(partnerWinning)return inSuit.sort((a,b)=>a.rank-b.rank)[0];
        const spadeInTrick=trick.some(t=>t.card.suit==="S");
        if(!spadeInTrick){const wins=inSuit.filter(c=>c.rank>winner.card.rank);if(wins.length)return wins.sort((a,b)=>a.rank-b.rank)[0];}
        return inSuit.sort((a,b)=>a.rank-b.rank)[0];
      }
      const spades=opts.filter(c=>c.suit==="S");
      if(spades.length&&!partnerWinning){const need=winner.card.suit==="S"?winner.card.rank:0;
        const wins=spades.filter(c=>c.rank>need);if(wins.length)return wins.sort((a,b)=>a.rank-b.rank)[0];}
      const non=opts.filter(c=>c.suit!=="S");return (non.length?non:opts).sort((a,b)=>a.rank-b.rank)[0];
    }
    function aiBid(hand){let pts=0;const spades=hand.filter(c=>c.suit==="S");
      for(const c of hand){if(c.rank===14)pts+=1;else if(c.rank===13)pts+=0.7;else if(c.rank===12&&c.suit==="S")pts+=0.5;}
      if(spades.length>3)pts+=(spades.length-3)*0.5;if(spades.some(c=>c.rank===14))pts+=0.3;
      let b=Math.round(pts);return Math.max(1,Math.min(8,b));}
    function scoreTeam(pa,pb,bids,tricks,bagTotalRef){
      let contract=0,teamTricks=tricks[pa]+tricks[pb],score=0,nilAdj=0;
      [pa,pb].forEach(p=>{if(bids[p]===0)nilAdj+=(tricks[p]===0?100:-100);else contract+=bids[p];});
      let bags=0;
      if(teamTricks>=contract){score+=contract*10;bags=teamTricks-contract;}else score-=contract*10;
      score+=nilAdj;
      bagTotalRef.v+=bags;while(bagTotalRef.v>=10){score-=100;bagTotalRef.v-=10;}
      return {score,bags:bagTotalRef.v};
    }
    window.__spades={bestOfTrick,legalPlays,aiChoose,aiBid,scoreTeam};

    // ---- state ----
    let hands,bids,tricks,trick,current,spadesBroken,tricksDone,phase,over;
    let scores=[0,0],bagTotal=[{v:0},{v:0}];
    const delay=(ms)=>new Promise(r=>setTimeout(r,ms));
    function sortHand(h){const order={C:0,D:1,H:2,S:3};h.sort((a,b)=>order[a.suit]-order[b.suit]||a.rank-b.rank);}

    function newGame(){scores=[0,0];bagTotal=[{v:0},{v:0}];over=false;startHand();}
    function startHand(){
      const d=Cards.shuffle(Cards.makeDeck());
      hands=[d.slice(0,13),d.slice(13,26),d.slice(26,39),d.slice(39,52)];hands.forEach(sortHand);
      bids=[null,null,null,null];tricks=[0,0,0,0];trick=[];spadesBroken=false;tricksDone=0;phase="bid";
      document.getElementById("status").textContent="Place your bid (0 = nil).";
      render();showBidButtons();
    }
    function showBidButtons(){const el=document.getElementById("bidbtns");el.innerHTML="";
      for(let b=0;b<=8;b++){const btn=document.createElement("button");btn.className="btn bidbtn";btn.textContent=b===0?"Nil":b;
        btn.addEventListener("click",()=>makeBid(b));el.appendChild(btn);}}
    function makeBid(b){if(phase!=="bid")return;bids[0]=b;bids[1]=aiBid(hands[1]);bids[2]=aiBid(hands[2]);bids[3]=aiBid(hands[3]);
      document.getElementById("bidbtns").innerHTML="";phase="play";current=0;trick=[];
      document.getElementById("status").textContent="You bid "+(b===0?"Nil":b)+". Your lead.";render();proceed();}
    async function proceed(){
      render();
      if(trick.length===4){await delay(700);return resolveTrick();}
      if(current===0){document.getElementById("status").textContent="Your turn.";render();return;}
      await delay(600);
      const ctx={leading:trick.length===0,spadesBroken,ledSuit:trick.length?trick[0].card.suit:null,me:current};
      playCard(current,aiChoose(hands[current],trick,ctx));
    }
    function humanPlay(card){if(phase!=="play"||current!==0)return;
      const ctx={leading:trick.length===0,spadesBroken,ledSuit:trick.length?trick[0].card.suit:null,me:0};
      if(!legalPlays(hands[0],ctx).includes(card))return;playCard(0,card);}
    function playCard(p,card){const i=hands[p].indexOf(card);if(i<0)return;hands[p].splice(i,1);
      trick.push({player:p,card});if(card.suit==="S")spadesBroken=true;current=(current+1)%4;proceed();}
    async function resolveTrick(){const w=bestOfTrick(trick).player;tricks[w]++;tricksDone++;
      document.getElementById("status").textContent=NAMES[w]+" wins the trick.";trick=[];current=w;render();
      await delay(650);if(tricksDone===13)return endHand();proceed();}
    function endHand(){
      const a=scoreTeam(0,2,bids,tricks,bagTotal[0]);const b=scoreTeam(1,3,bids,tricks,bagTotal[1]);
      scores[0]+=a.score;scores[1]+=b.score;phase="over";render();
      let msg="Hand over. You/North "+(a.score>=0?"+":"")+a.score+", West/East "+(b.score>=0?"+":"")+b.score+".";
      if(Math.max(scores[0],scores[1])>=500&&scores[0]!==scores[1]){over=true;msg="🏁 "+(scores[0]>scores[1]?"You & North win":"West & East win")+" the game "+scores[0]+"–"+scores[1]+"!";
        document.getElementById("status").textContent=msg;return;}
      document.getElementById("status").textContent=msg+" Next hand…";setTimeout(startHand,1600);
    }
    function render(){
      const t=document.getElementById("teams");t.innerHTML=
        `<div class="team">You & North<b>${scores[0]}</b>bags ${bagTotal[0].v}</div>`+
        `<div class="team">West & East<b>${scores[1]}</b>bags ${bagTotal[1].v}</div>`;
      const pl=document.getElementById("players");pl.innerHTML="";
      NAMES.forEach((n,i)=>{const d=document.createElement("div");d.className="pl"+(i===current&&phase==="play"?" turn":"");
        d.innerHTML=n+"<br>"+(bids[i]==null?"—":(bids[i]===0?"Nil":"bid "+bids[i]))+"<br>won "+tricks[i];pl.appendChild(d);});
      for(let p=0;p<4;p++){const slot=document.getElementById("tc"+p);slot.innerHTML="";const tt=trick.find(x=>x.player===p);if(tt)slot.appendChild(Cards.cardEl(tt.card,true));}
      document.getElementById("banner").textContent=phase==="bid"?"Bidding":"";
      const handEl=document.getElementById("hand");handEl.innerHTML="";
      const ctx={leading:trick.length===0,spadesBroken,ledSuit:trick.length?trick[0].card.suit:null,me:0};
      const legal=phase==="play"&&current===0?legalPlays(hands[0],ctx):[];
      hands[0].forEach(c=>{const el=Cards.cardEl(c,true);if(legal.includes(c)){el.classList.add("legal");el.addEventListener("click",()=>humanPlay(c));}handEl.appendChild(el);});
    }
    document.getElementById("new").addEventListener("click",newGame);
    newGame();
  })();
  </script>
  <script src="/comments.js" defer></script>
</body>
</html>
