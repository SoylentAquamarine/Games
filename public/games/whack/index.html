<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Whack-a-Mole — Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>🐹</text></svg>" />
  <style>
    :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;--hole:#1a1c33;--dirt:#3a2a1a;}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
      background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.22),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.16),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;}
    .wrap{max-width:460px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;align-items:center;gap:14px}
    .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
    .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
    .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
    h1{margin:0;font-size:1.5rem;background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
    .scores{display:flex;gap:12px;width:100%}
    .stat{flex:1;background:var(--panel);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:10px;text-align:center}
    .stat .label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    .stat .value{font-size:1.5rem;font-weight:700}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%}
    .hole{aspect-ratio:1;background:radial-gradient(circle at 50% 78%,var(--dirt) 0 46%,transparent 47%),var(--hole);
      border-radius:50%/60%;position:relative;overflow:hidden;cursor:pointer;border:1px solid rgba(255,255,255,.06)}
    .mole{position:absolute;left:50%;bottom:-100%;transform:translateX(-50%);width:64%;height:64%;
      display:flex;align-items:center;justify-content:center;font-size:clamp(1.8rem,10vw,3rem);transition:bottom .12s;pointer-events:none}
    .hole.up .mole{bottom:14%}
    .hole.bonk .mole{transform:translateX(-50%) scale(.7)}
    .status{min-height:1.3em;font-weight:600;color:var(--accent-2)}
    .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:12px 28px;border-radius:999px;cursor:pointer}
    .btn:hover{transform:translateY(-2px)}
    .hint{color:var(--muted);font-size:.85rem;text-align:center}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar"><a class="home" href="/">← Home</a><h1>🐹 Whack-a-Mole</h1><span style="width:64px"></span></div>
    <div class="scores">
      <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">Time</div><div class="value" id="time">30</div></div>
      <div class="stat"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="status" id="status">Bonk the moles 🐹 — avoid the bombs 💣!</div>
    <button class="btn" id="start">Start</button>
    <p class="hint">30 seconds. Moles = +1, golden mole = +3, bomb = −2.</p>
  </div>
  <script>
  (function(){
    const grid=document.getElementById("grid"),scoreEl=document.getElementById("score"),timeEl=document.getElementById("time"),bestEl=document.getElementById("best"),statusEl=document.getElementById("status"),startBtn=document.getElementById("start");
    const HOLES=9;let holes=[],score,time,running,popTimer,tickTimer,best=Number(localStorage.getItem("whack_best")||0);
    bestEl.textContent=best;
    for(let i=0;i<HOLES;i++){const h=document.createElement("div");h.className="hole";h.innerHTML='<div class="mole"></div>';
      h.addEventListener("click",()=>whack(i));grid.appendChild(h);holes.push({el:h,mole:h.querySelector(".mole"),type:null});}
    function start(){score=0;time=30;running=true;scoreEl.textContent=0;timeEl.textContent=30;statusEl.textContent="Go!";startBtn.disabled=true;
      pop();tickTimer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)end();},1000);}
    function pop(){if(!running)return;
      const free=holes.filter(h=>!h.type);
      if(free.length){const h=free[Math.floor(Math.random()*free.length)];
        const r=Math.random();const type=r<.15?"bomb":r<.3?"gold":"mole";
        h.type=type;h.mole.textContent=type==="bomb"?"💣":type==="gold"?"🌟":"🐹";h.el.classList.add("up");
        const life=Math.max(600,1200-(30-time)*20);
        setTimeout(()=>{if(h.type===type){h.el.classList.remove("up");h.type=null;}},life);
      }
      popTimer=setTimeout(pop,Math.max(350,750-(30-time)*12));
    }
    function whack(i){if(!running)return;const h=holes[i];if(!h.type)return;
      if(h.type==="bomb"){score=Math.max(0,score-2);statusEl.textContent="💥 Bomb! −2";}
      else if(h.type==="gold"){score+=3;statusEl.textContent="🌟 +3!";}
      else{score+=1;statusEl.textContent="🐹 +1";}
      scoreEl.textContent=score;h.el.classList.add("bonk");
      const t=h.type;h.type=null;setTimeout(()=>{h.el.classList.remove("up","bonk");},120);
    }
    function end(){running=false;clearTimeout(popTimer);clearInterval(tickTimer);startBtn.disabled=false;startBtn.textContent="Play again";
      holes.forEach(h=>{h.el.classList.remove("up");h.type=null;});
      let msg=`⏱ Time! Final score ${score}.`;if(score>best){best=score;bestEl.textContent=best;localStorage.setItem("whack_best",best);msg+=" 🏆 New best!";}
      statusEl.textContent=msg;
    }
    startBtn.addEventListener("click",start);
  })();
  </script>
</body>
</html>
