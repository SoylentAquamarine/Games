<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hangman — Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>🪢</text></svg>" />
  <style>
    :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;--key:#3a4066;}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
      background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.22),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.16),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;}
    .wrap{max-width:420px;margin:0 auto;padding:16px 12px 30px;display:flex;flex-direction:column;align-items:center;gap:14px}
    .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
    .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
    .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
    h1{margin:0;font-size:1.6rem;background:linear-gradient(120deg,#f97316,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
    .gallows{width:180px;height:150px}
    .lives{font-size:1.4rem;letter-spacing:4px}
    .word{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:1.8rem;font-weight:800;letter-spacing:2px}
    .word .ch{min-width:26px;border-bottom:3px solid var(--muted);text-align:center;text-transform:uppercase}
    .word .ch.filled{border-color:var(--accent-2)}
    .status{min-height:1.2em;font-weight:600;color:#fde68a;text-align:center}
    .kb{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:400px}
    .key{width:32px;height:40px;border:none;border-radius:6px;background:var(--key);color:var(--text);font-weight:700;cursor:pointer;text-transform:uppercase}
    .key.good{background:#22a352}.key.bad{background:#3a3f5c;color:#7a7f9e}
    .key:disabled{cursor:default}
    .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:10px 22px;border-radius:999px;cursor:pointer}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar"><a class="home" href="/">← Home</a><h1>🪢 Hangman</h1><span style="width:56px"></span></div>
    <svg class="gallows" id="gallows" viewBox="0 0 180 150"></svg>
    <div class="word" id="word"></div>
    <div class="status" id="status">Guess the word!</div>
    <div class="kb" id="kb"></div>
    <button class="btn" id="new">New Word</button>
  </div>
  <script>
  (function(){
    const WORDS=("planet rocket puzzle guitar dragon castle wizard forest island jungle desert glacier volcano diamond emerald compass anchor lantern harvest thunder blossom whisper journey mystery gravity machine rainbow bicycle penguin dolphin octopus panther cheetah leopard sparrow falcon monarch pyramid cathedral windmill treasure voyage galaxy comet meteor nebula quasar circuit network quantum crystal marble copper silver bronze velvet cotton feather blanket kitchen balcony chimney library museum stadium theater harbor bridge tunnel canyon meadow orchard").split(" ");
    const gallowsEl=document.getElementById("gallows"),wordEl=document.getElementById("word"),statusEl=document.getElementById("status"),kbEl=document.getElementById("kb");
    const MAXW=6; // wrong guesses allowed
    let answer,guessed,wrong,over;
    const PARTS=[
      '<line x1="50" y1="10" x2="120" y2="10"/>',        // top beam
      '<line x1="120" y1="10" x2="120" y2="30"/>',        // rope
      '<circle cx="120" cy="42" r="12"/>',                // head
      '<line x1="120" y1="54" x2="120" y2="95"/>',        // body
      '<line x1="120" y1="65" x2="100" y2="82"/><line x1="120" y1="65" x2="140" y2="82"/>', // arms
      '<line x1="120" y1="95" x2="102" y2="120"/><line x1="120" y1="95" x2="138" y2="120"/>', // legs
    ];
    function drawGallows(){
      let s='<g stroke="#9aa4d0" stroke-width="4" fill="none" stroke-linecap="round">';
      s+='<line x1="20" y1="140" x2="80" y2="140"/><line x1="50" y1="140" x2="50" y2="10"/>';
      for(let i=0;i<wrong;i++)s+=PARTS[i].replace(/<circle/g,'<circle fill="none"');
      s+='</g>';gallowsEl.innerHTML=s;
    }
    function newGame(){answer=WORDS[Math.floor(Math.random()*WORDS.length)];guessed=new Set();wrong=0;over=false;
      statusEl.textContent="Guess the word!";buildKb();render();}
    function buildKb(){kbEl.innerHTML="";for(const ch of "abcdefghijklmnopqrstuvwxyz"){const b=document.createElement("button");b.className="key";b.textContent=ch;b.dataset.k=ch;
      b.addEventListener("click",()=>guess(ch));kbEl.appendChild(b);}}
    function render(){
      wordEl.innerHTML="";for(const ch of answer){const d=document.createElement("div");d.className="ch"+(guessed.has(ch)||over?" filled":"");
        d.textContent=(guessed.has(ch)||over)?ch:"";wordEl.appendChild(d);}
      drawGallows();
      const lives=MAXW-wrong;statusEl.dataset.lives=lives;
    }
    function guess(ch){
      if(over||guessed.has(ch))return;guessed.add(ch);
      const btn=kbEl.querySelector('[data-k="'+ch+'"]');
      if(answer.includes(ch)){btn.classList.add("good");btn.disabled=true;
        if([...answer].every(c=>guessed.has(c))){over=true;statusEl.textContent="🎉 You got it: "+answer.toUpperCase();}
      }else{wrong++;btn.classList.add("bad");btn.disabled=true;
        if(wrong>=MAXW){over=true;statusEl.textContent="💀 Out of guesses — it was "+answer.toUpperCase();}}
      render();
    }
    document.addEventListener("keydown",e=>{if(/^[a-zA-Z]$/.test(e.key))guess(e.key.toLowerCase());});
    document.getElementById("new").addEventListener("click",newGame);
    newGame();
  })();
  </script>
  <script src="/comments.js" defer></script>
</body>
</html>
