<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Flappy Chicken — Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>🐔</text></svg>" />
  <style>
    :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
      background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.22),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.16),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;}
    .wrap{max-width:420px;margin:0 auto;padding:16px 16px 30px;display:flex;flex-direction:column;align-items:center;gap:12px}
    .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
    .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
    .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
    h1{margin:0;font-size:1.6rem;background:linear-gradient(120deg,#eab308,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
    .scores{display:flex;gap:12px;width:100%}
    .stat{flex:1;background:var(--panel);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:8px;text-align:center}
    .stat .label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    .stat .value{font-size:1.4rem;font-weight:700}
    .board-wrap{position:relative;width:100%}
    canvas{width:100%;height:auto;display:block;border:1px solid rgba(255,255,255,.08);border-radius:14px;touch-action:none;cursor:pointer}
    .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(15,16,32,.7);border-radius:14px;text-align:center}
    .overlay.hidden{display:none}
    .overlay h2{margin:0}.overlay p{margin:0;color:#e6e6f0}
    .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:12px 28px;border-radius:999px;cursor:pointer}
    .hint{color:var(--muted);font-size:.82rem;text-align:center}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar"><a class="home" href="/">← Home</a><h1>🐔 Flappy Chicken</h1><span style="width:56px"></span></div>
    <div class="scores">
      <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
    <div class="board-wrap">
      <canvas id="c" width="360" height="480"></canvas>
      <div class="overlay" id="ov"><h2 id="ot">🐔 Flappy Chicken</h2><p id="om">Tap / click / Space to flap.</p><button class="btn" id="start">Play</button></div>
    </div>
    <p class="hint">Tap, click, or press Space to flap through the gaps.</p>
  </div>
  <script src="/arcade.js"></script>
  <script>
  (function(){
    const cv=document.getElementById("c"),ctx=cv.getContext("2d"),W=cv.width,H=cv.height;
    const scoreEl=document.getElementById("score"),bestEl=document.getElementById("best");
    const ov=document.getElementById("ov"),ot=document.getElementById("ot"),om=document.getElementById("om"),startBtn=document.getElementById("start");
    const PIPE_W=52;
    // Admin-tunable difficulty knobs — see /admin/games/?game=flappy. Same
    // pattern as every other configurable game (e.g. kaboom): explicit
    // allowlist, only numeric values, safe no-op with no localStorage
    // (headless tests).
    const C={ GAP:150, SPEED:2.2, GRAV:0.4, FLAP:-6.4 };
    (function(){ try{
      const allow=["GAP","SPEED","GRAV","FLAP"];
      const o=JSON.parse(localStorage.getItem("flappy_config")||"{}");
      for(const k of allow) if(typeof o[k]==="number") C[k]=o[k];
    }catch(_){} })();
    window.__flappy={ C };
    let bird,pipes,score,running,raf,best=+localStorage.getItem("flappy_best")||0;
    bestEl.textContent=best;
    function reset(){bird={x:90,y:H/2,v:0,r:13};pipes=[];score=0;scoreEl.textContent=0;
      for(let i=0;i<3;i++)pipes.push(mkPipe(W+i*180));}
    function mkPipe(x){const gy=60+Math.random()*(H-120-C.GAP);return {x,gy,passed:false};}
    function start(){reset();ov.classList.add("hidden");running=true;loop();}
    let flapT=0;   // counts down after each flap to drive the wing animation
    function flap(){if(running){bird.v=C.FLAP;flapT=10;}}
    function loop(){if(!running)return;update();render();raf=requestAnimationFrame(loop);}
    function update(){
      bird.v+=C.GRAV;bird.y+=bird.v;
      pipes.forEach(p=>p.x-=C.SPEED);
      if(pipes[0].x<-PIPE_W){pipes.shift();pipes.push(mkPipe(pipes[pipes.length-1].x+180));}
      for(const p of pipes){
        if(!p.passed&&p.x+PIPE_W<bird.x){p.passed=true;score++;scoreEl.textContent=score;}
        if(bird.x+bird.r>p.x&&bird.x-bird.r<p.x+PIPE_W&&(bird.y-bird.r<p.gy||bird.y+bird.r>p.gy+C.GAP))return dead();
      }
      if(bird.y+bird.r>H||bird.y-bird.r<0)return dead();
    }
    function dead(){running=false;cancelAnimationFrame(raf);if(typeof Arcade!=="undefined")Arcade.stats.record("flappy",score); if(score>best){best=score;localStorage.setItem("flappy_best",best);bestEl.textContent=best;}
      ot.textContent="Game Over";om.textContent="Score "+score+(score>=best?" · new best!":"");startBtn.textContent="Play again";ov.classList.remove("hidden");}
    function render(){
      // sky
      const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#1a2b4a");g.addColorStop(1,"#0e1830");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      // pipes
      ctx.fillStyle="#22c55e";pipes.forEach(p=>{ctx.fillRect(p.x,0,PIPE_W,p.gy);ctx.fillRect(p.x,p.gy+C.GAP,PIPE_W,H-p.gy-C.GAP);
        ctx.fillStyle="#16a34a";ctx.fillRect(p.x-3,p.gy-14,PIPE_W+6,14);ctx.fillRect(p.x-3,p.gy+C.GAP,PIPE_W+6,14);ctx.fillStyle="#22c55e";});
      // chicken — drawn facing right, wing driven by the flap timer
      ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(Math.max(-0.5,Math.min(1,bird.v/12)));
      const r=bird.r;
      // tail feathers (behind, pointing left)
      ctx.fillStyle="#c96f14";ctx.beginPath();ctx.moveTo(-r*0.6,-r*0.1);ctx.lineTo(-r*1.7,-r*0.8);ctx.lineTo(-r*0.6,r*0.6);ctx.closePath();ctx.fill();
      // comb
      ctx.fillStyle="#dc2626";ctx.beginPath();
      ctx.arc(-r*0.1,-r*0.95,r*0.22,0,7);ctx.arc(r*0.28,-r*1.02,r*0.24,0,7);ctx.arc(r*0.62,-r*0.88,r*0.20,0,7);ctx.fill();
      // body
      ctx.fillStyle="#facc15";ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
      // wing: sweeps up right after a flap, settles back down
      const wing=Math.sin(Math.min(1,flapT/10)*Math.PI)*r*0.95;
      ctx.fillStyle="#fde68a";ctx.beginPath();
      ctx.ellipse(-r*0.15,r*0.05-wing*0.5,r*0.62,r*0.34,-wing*0.05,0,7);ctx.fill();
      ctx.strokeStyle="#e0b83a";ctx.lineWidth=1;ctx.stroke();
      // eye, beak and wattle on the right-hand side
      ctx.fillStyle="#0b1030";ctx.beginPath();ctx.arc(r*0.45,-r*0.3,r*0.14,0,7);ctx.fill();
      ctx.fillStyle="#fb923c";ctx.beginPath();
      ctx.moveTo(r*0.8,-r*0.18);ctx.lineTo(r*1.5,r*0.02);ctx.lineTo(r*0.8,r*0.2);ctx.closePath();ctx.fill();
      ctx.fillStyle="#dc2626";ctx.beginPath();ctx.arc(r*0.82,r*0.34,r*0.18,0,7);ctx.fill();
      ctx.restore();
      if(flapT>0)flapT--;
      // score
      ctx.fillStyle="#fff";ctx.font="bold 28px system-ui";ctx.textAlign="center";ctx.fillText(score,W/2,44);
    }
    function press(e){e.preventDefault();if(running)flap();}
    cv.addEventListener("mousedown",press);cv.addEventListener("touchstart",press,{passive:false});
    document.addEventListener("keydown",e=>{if(e.key===" "){e.preventDefault();flap();}});
    startBtn.addEventListener("click",start);
    reset();render();
  })();
  </script>
  <script src="/startgate.js" defer></script>
  <script src="/comments.js" defer></script>
  <script src="/fullscreen.js" defer></script>
</body>
</html>
