<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>ChickenDash — Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>🥚</text></svg>" />
<style>
  :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;--bad:#f43f5e;--good:#34d399;}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
    background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.2),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.14),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;touch-action:none;}
  .wrap{max-width:660px;margin:0 auto;padding:14px 12px 30px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
  .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
  .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
  h1{margin:0;font-size:1.3rem;background:linear-gradient(120deg,#22d3ee,#ffcf5a);-webkit-background-clip:text;background-clip:text;color:transparent}
  .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer}
  .hud{width:100%;max-width:616px;display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
  .hud b{color:var(--text)}
  canvas{width:min(96vw,616px);height:calc(min(96vw,616px)*0.75);image-rendering:pixelated;border-radius:10px;border:2px solid #2a2f55;background:#0a0c18;touch-action:none}
  .msg{min-height:1.3em;font-weight:800;text-align:center}
  .dpad{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px);gap:5px}
  .dpad button{background:var(--panel);color:var(--text);border:1px solid rgba(255,255,255,.1);border-radius:10px;font-size:1.2rem;cursor:pointer;user-select:none}
  .dpad button:active{background:var(--accent);color:#0b0c1a}
  .dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .dn{grid-area:3/2}.dpad .r{grid-area:2/3}
  .hint{font-size:.78rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="home" href="/">← Home</a><h1>🥚 ChickenDash</h1><button class="btn" id="new">New Game</button></div>
  <div class="hud"><span>Eggs: <b id="gems">0</b>/<b id="need">0</b></span><span>Chickens: <b id="chix">🐔🐔🐔</b></span><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div>
  <canvas id="game" width="616" height="462"></canvas>
  <div class="msg" id="msg">Dig for eggs, dodge falling rocks, then reach the exit!</div>
  <div class="dpad"><button class="u" data-d="up">▲</button><button class="l" data-d="left">◀</button><button class="dn" data-d="down">▼</button><button class="r" data-d="right">▶</button></div>
  <div class="hint">Arrows/WASD move · push rocks sideways · don't stand under them</div>
</div>
<script src="/arcade.js"></script>
<script src="/mascots.js"></script>
<script>
(function(){
  const C={ cols:28, rows:21, cell:22, CHICKENS:3, EXTRA:500 };   // board 75% larger; cell size unchanged
  // Admin-tunable difficulty knobs — see /admin/games/?game=boulderdash.
  // Same pattern as kaboom (see its HANDOFF.md): explicit allowlist, only
  // numeric values, safe no-op with no localStorage (headless tests).
  (function(){ try{
    const allow=["CHICKENS","EXTRA"];
    const o=JSON.parse(localStorage.getItem("boulderdash_config")||"{}");
    for(const k of allow) if(typeof o[k]==="number") C[k]=o[k];
  }catch(_){} })();
  const DIRS={left:[-1,0],right:[1,0],up:[0,-1],down:[0,1]};
  // Each screen is generated fresh; a little denser as the levels climb.
  function buildLevel(level){
    const g=[]; for(let r=0;r<C.rows;r++){ const row=[]; for(let c=0;c<C.cols;c++){
      if(r===0||c===0||r===C.rows-1||c===C.cols-1) row.push("wall"); else row.push("dirt"); } g.push(row); }
    g[1][1]="empty";
    let need=0;
    const TARGET=Math.round(24*(C.cols*C.rows)/(16*12)) + (level-1)*3;
    const boulderChance=Math.min(0.72, 0.55+(level-1)*0.04);
    let placed=0, tries=0; while(placed<TARGET && ++tries<20000){ const r=2+Math.floor(Math.random()*(C.rows-3)), c=2+Math.floor(Math.random()*(C.cols-3));
      if(g[r][c]==="dirt" && !(r<=2&&c<=2)){ g[r][c]=Math.random()<boulderChance?"boulder":"gem"; if(g[r][c]==="gem") need++; placed++; } }
    need=Math.max(6,Math.min(need, 14));
    g[C.rows-2][C.cols-2]="exit";
    return {grid:g, need};
  }
  function newState(){
    const {grid,need}=buildLevel(1);
    return { grid, need, player:{c:1,r:1}, gems:0, score:0, level:1,
             chickens:C.CHICKENS, nextExtra:C.EXTRA, crushed:false, over:false, won:false };
  }
  // Advance to the next screen — a new board, keeping your chickens and score.
  function nextScreen(s){
    s.level++; const {grid,need}=buildLevel(s.level);
    s.grid=grid; s.need=need; s.gems=0; s.player={c:1,r:1}; s.won=false; s.crushed=false;
  }
  // Lose a chicken but keep the board as it is — respawn at the start with all
  // your dug tunnels and collected eggs intact. Out of chickens ends the run.
  function loseChicken(s){ s.chickens--; if(s.chickens<=0) s.over=true; return s; }
  function respawnPlayer(s){ s.player={c:1,r:1}; s.grid[1][1]="empty"; s.crushed=false; }
  function awardExtras(s){ while(s.score>=s.nextExtra){ s.chickens++; s.nextExtra+=C.EXTRA; } }
  function inb(c,r){ return c>=0&&c<C.cols&&r>=0&&r<C.rows; }
  function move(s, dir){ if(s.over||s.won) return s; const d=DIRS[dir]; if(!d) return s; const nc=s.player.c+d[0], nr=s.player.r+d[1];
    if(!inb(nc,nr)) return s; const t=s.grid[nr][nc];
    if(t==="wall") return s;
    if(t==="dirt"||t==="empty"){ s.grid[nr][nc]="empty"; s.player.c=nc; s.player.r=nr; }
    else if(t==="gem"){ s.grid[nr][nc]="empty"; s.player.c=nc; s.player.r=nr; s.gems++; s.score+=10; }
    else if(t==="exit"){ if(s.gems>=s.need){ s.grid[nr][nc]="empty"; s.player.c=nc; s.player.r=nr; s.won=true; } }
    else if(t==="boulder"){ // push horizontally only, into an empty cell
      if(d[1]===0){ const bc=nc+d[0]; if(inb(bc,nr)&&s.grid[nr][bc]==="empty"){ s.grid[nr][bc]="boulder"; s.grid[nr][nc]="empty"; s.player.c=nc; s.player.r=nr; } } }
    return s; }
  function physicsStep(s){ // scan bottom-up so a falling stack resolves in one pass
    for(let r=C.rows-2;r>=1;r--) for(let c=1;c<C.cols-1;c++){ const cell=s.grid[r][c]; if(cell!=="boulder"&&cell!=="gem") continue;
      const below=s.grid[r+1][c];
      if(below==="empty"){ s.grid[r+1][c]=cell; s.grid[r][c]="empty"; if(s.player.c===c&&s.player.r===r+1) s.crushed=true; }
      else if(below==="boulder"||below==="gem"||below==="wall"){
        // roll off a rounded object to the side if both the side and the cell below the side are empty
        if(below!=="wall"){
          if(s.grid[r][c-1]==="empty"&&s.grid[r+1][c-1]==="empty"){ s.grid[r][c-1]=cell; s.grid[r][c]="empty"; if(s.player.c===c-1&&s.player.r===r) s.crushed=true; }
          else if(s.grid[r][c+1]==="empty"&&s.grid[r+1][c+1]==="empty"){ s.grid[r][c+1]=cell; s.grid[r][c]="empty"; if(s.player.c===c+1&&s.player.r===r) s.crushed=true; }
        }
      }
    }
    return s; }
  window.__boulderdash={ newState, buildLevel, nextScreen, loseChicken, respawnPlayer, awardExtras, move, physicsStep, inb, C };

  if(typeof document==="undefined") return;
  const $=(id)=>document.getElementById(id);
  const cv=$("game"), ctx=cv.getContext("2d"); const CELL=C.cell, W=cv.width,H=cv.height;
  // Hold the loop until the player asks for it (comment: Press Spacebar To Begin)
  const GATE = Arcade.startGate(cv, "Boulder Chicken");
  let s=newState(), best=0, physT=0, input=null, moveT=0;
  let dying=0, deadDebris=[], banner=0, bannerText="", flypast=null;
  const chixEl=$("chix");
  function renderChix(){ chixEl.textContent="🐔".repeat(Math.max(0,s.chickens)); }
  try{ best=parseInt(localStorage.getItem("boulder_best")||"0")||0; }catch(e){}

  function draw(){
    ctx.clearRect(0,0,W,H);
    for(let r=0;r<C.rows;r++) for(let c=0;c<C.cols;c++){ const t=s.grid[r][c]; const x=c*CELL,y=r*CELL;
      if(t==="wall"){ ctx.fillStyle="#5a5f7a"; ctx.fillRect(x,y,CELL,CELL); ctx.fillStyle="#40445c"; ctx.fillRect(x+2,y+2,CELL-4,CELL-4); }
      else if(t==="dirt"){ ctx.fillStyle="#4a3420"; ctx.fillRect(x,y,CELL,CELL); ctx.fillStyle="#5a4028"; for(let i=0;i<3;i++) ctx.fillRect(x+3+i*6,y+4+((i*7)%12),2,2); }
      else if(t==="empty"){
        // a dim cave floor rather than flat black, lit a touch toward the middle
        ctx.fillStyle="#241d2b"; ctx.fillRect(x,y,CELL,CELL);
        ctx.fillStyle="#2c2334"; ctx.fillRect(x+2,y+2,CELL-4,CELL-4);
        ctx.fillStyle="rgba(0,0,0,.28)"; const n=((c*7+r*13)%4);
        for(let i=0;i<n;i++) ctx.fillRect(x+3+((i*11+r)%14), y+3+((i*7+c)%14), 2,2);
      }
      else if(t==="boulder"){ ctx.fillStyle="#12141f"; ctx.fillRect(x,y,CELL,CELL); ctx.fillStyle="#9a9ab5"; ctx.beginPath(); ctx.arc(x+CELL/2,y+CELL/2,CELL/2-2,0,7); ctx.fill(); ctx.fillStyle="#c9c9e0"; ctx.beginPath(); ctx.arc(x+CELL/2-3,y+CELL/2-3,3,0,7); ctx.fill(); }
      else if(t==="gem"){ ctx.fillStyle="#12141f"; ctx.fillRect(x,y,CELL,CELL);   // eggs to collect
        const ex=x+CELL/2, ey=y+CELL/2, er=CELL*0.36;
        ctx.fillStyle="#f3ead7"; ctx.strokeStyle="#c9bda3"; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(ex,ey-er);
        ctx.bezierCurveTo(ex+er*0.72,ey-er,ex+er*0.86,ey+er*0.34,ex,ey+er);
        ctx.bezierCurveTo(ex-er*0.86,ey+er*0.34,ex-er*0.72,ey-er,ex,ey-er);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.fillStyle="rgba(255,255,255,.7)"; ctx.fillRect(ex-2,ey-er*0.4,2,3); }
      else if(t==="exit"){ ctx.fillStyle= s.gems>=s.need?"#34d399":"#2a2f4d"; ctx.fillRect(x+2,y+2,CELL-4,CELL-4); ctx.fillStyle="#0a0c18"; ctx.fillRect(x+CELL/2-2,y+5,4,CELL-10); }
    }
    // the digging chicken — eased toward its cell so it glides instead of snapping
    { const p=s.player, tx=p.c*CELL, ty=p.r*CELL;
      if(p.ax==null||Math.abs(tx-p.ax)>CELL*1.8||Math.abs(ty-p.ay)>CELL*1.8){ p.ax=tx; p.ay=ty; }
      else { p.ax+=(tx-p.ax)*0.4; p.ay+=(ty-p.ay)*0.4; }
      const hx=p.ax+CELL/2, hy=p.ay+CELL/2;
      ctx.fillStyle="#c96f14"; ctx.beginPath();                                                    // tail
      ctx.moveTo(hx-CELL*0.26,hy); ctx.lineTo(hx-CELL*0.52,hy-CELL*0.20); ctx.lineTo(hx-CELL*0.26,hy+CELL*0.22); ctx.closePath(); ctx.fill();
      ctx.fillStyle="#dc2626"; ctx.beginPath();                                                    // comb
      ctx.arc(hx-CELL*0.12,hy-CELL*0.36,CELL*0.09,0,7); ctx.arc(hx+CELL*0.02,hy-CELL*0.41,CELL*0.10,0,7); ctx.arc(hx+CELL*0.16,hy-CELL*0.36,CELL*0.09,0,7); ctx.fill();
      ctx.fillStyle="#ffcf5a"; ctx.beginPath(); ctx.arc(hx,hy,CELL*0.36,0,7); ctx.fill();          // body
      ctx.fillStyle="#fde68a"; ctx.beginPath(); ctx.ellipse(hx-CELL*0.04,hy+CELL*0.06,CELL*0.20,CELL*0.12,0,0,7); ctx.fill();
      ctx.fillStyle="#fb923c"; ctx.beginPath();                                                    // beak
      ctx.moveTo(hx+CELL*0.30,hy-CELL*0.06); ctx.lineTo(hx+CELL*0.56,hy+CELL*0.02); ctx.lineTo(hx+CELL*0.30,hy+CELL*0.10); ctx.closePath(); ctx.fill();
      ctx.fillStyle="#0b0c1a"; ctx.fillRect(hx-CELL*0.16,hy-CELL*0.14,3,3); ctx.fillRect(hx+CELL*0.06,hy-CELL*0.14,3,3); }
    // spacesuit chicken drifting across between screens — drawn from the
    // shared /mascots.js library (the "Flying" variant: jetpack + pack).
    if(flypast) Mascots.spacesuitChickenFlying(ctx, flypast.x, flypast.y, 14, flypast.vx);
    // the death shards
    if(dying>0){ ctx.fillStyle="#ffcf5a"; for(const d of deadDebris){ ctx.save(); ctx.translate(d.x,d.y); ctx.rotate(d.rot); ctx.globalAlpha=Math.max(0,d.life/90); ctx.fillRect(-3,-3,6,6); ctx.restore(); } ctx.globalAlpha=1; }
    // CHICKEN DOWN, shaking for two seconds
    if(dying>0){
      const sh=Math.max(0,(dying-40)/80)*7+2, ox=(Math.random()*2-1)*sh, oy=(Math.random()*2-1)*sh;
      ctx.textAlign="center"; ctx.font="bold 30px system-ui"; ctx.lineWidth=5; ctx.strokeStyle="#0a0c18";
      ctx.strokeText("CHICKEN DOWN",W/2+ox,H/2+oy); ctx.fillStyle="#f43f5e"; ctx.fillText("CHICKEN DOWN",W/2+ox,H/2+oy);
    }
    // between-screen banner
    if(banner>0){ ctx.fillStyle="rgba(5,6,15,.72)"; ctx.fillRect(0,H/2-40,W,80); ctx.textAlign="center";
      ctx.fillStyle="#34d399"; ctx.font="bold 22px system-ui"; ctx.fillText(bannerText,W/2,H/2-4);
      ctx.fillStyle="#e6e6f0"; ctx.font="14px system-ui"; ctx.fillText("Chickens: "+"🐔".repeat(Math.max(0,s.chickens)),W/2,H/2+20); }
    if(s.over){ ctx.fillStyle="rgba(0,0,0,.6)"; ctx.fillRect(0,0,W,H); ctx.fillStyle="#f43f5e"; ctx.font="bold 22px system-ui"; ctx.textAlign="center"; ctx.fillText("OUT OF CHICKENS",W/2,H/2-6); ctx.fillStyle="#e6e6f0"; ctx.font="14px system-ui"; ctx.fillText("Reached screen "+s.level+" · Score "+s.score+"  ·  Best "+best,W/2,H/2+16); }
  }
  function frame(){
    if(!GATE.open){ draw(); GATE.paint(); return requestAnimationFrame(frame); }
    if(flypast){ flypast.x+=flypast.vx; if(flypast.x<-40||flypast.x>W+40) flypast=null; }
    if(dying>0){
      for(const d of deadDebris){ d.x+=d.vx; d.y+=d.vy; d.vy+=0.15; d.rot+=d.vr; d.life--; }
      if(--dying<=0){ loseChicken(s); if(!s.over) respawnPlayer(s); }
    } else if(banner>0){
      if(--banner<=0){ nextScreen(s); if(s.level%5===0){ const fl=Math.random()<0.5; flypast={x:fl?-30:W+30,y:36,vx:(fl?1:-1)*2.4}; } }
    } else if(!s.over&&!s.won){
      if(input && ++moveT>=5){ moveT=0; move(s,input); awardExtras(s); }
      if(++physT>=12){ physT=0; physicsStep(s); }
      if(typeof Arcade!=="undefined")Arcade.stats.record("boulderdash",s.score);
      if(s.crushed){ // start the CHICKEN DOWN sequence
        dying=120; deadDebris=[]; const p=s.player;
        for(let i=0;i<14;i++){ const a=Math.random()*Math.PI*2, sp=1+Math.random()*2.6;
          deadDebris.push({x:p.c*CELL+CELL/2,y:p.r*CELL+CELL/2,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:90,rot:Math.random()*7,vr:(Math.random()-0.5)*0.4}); }
        if(typeof Arcade!=="undefined") Arcade.sfx.death();
        $("msg").textContent="CHICKEN DOWN!";
      } else if(s.won){ // screen cleared
        banner=90; bannerText="SCREEN "+s.level+" CLEARED"; s.score+=100;
        if(typeof Arcade!=="undefined") Arcade.sfx.win();
        $("msg").textContent="🎉 Screen "+s.level+" cleared! Score "+s.score;
      }
      if(s.over && s.score>best){ best=s.score; try{localStorage.setItem("boulder_best",String(best));}catch(e){} }
    }
    $("gems").textContent=s.gems; $("need").textContent=s.need; $("score").textContent=s.score; $("best").textContent=best; renderChix(); draw(); requestAnimationFrame(frame);
  }
  document.querySelectorAll(".dpad button").forEach(b=>{ const d=b.getAttribute("data-d"); const on=(e)=>{e.preventDefault();input=d;move(s,d);moveT=0;}; const off=(e)=>{e.preventDefault();if(input===d)input=null;};
    b.addEventListener("touchstart",on,{passive:false}); b.addEventListener("touchend",off); b.addEventListener("mousedown",on); b.addEventListener("mouseup",off); b.addEventListener("mouseleave",off); });
  addEventListener("keydown",(e)=>{ const m={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down",a:"left",d:"right",w:"up",s:"down"}[e.key]; if(m){ e.preventDefault(); input=m; move(s,m); moveT=0; } });
  addEventListener("keyup",(e)=>{ const m={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down",a:"left",d:"right",w:"up",s:"down"}[e.key]; if(m&&input===m)input=null; });
  $("new").addEventListener("click",()=>{ s=newState(); input=null; dying=0; deadDebris=[]; banner=0; flypast=null; renderChix(); $("msg").textContent="Dig for eggs, dodge falling rocks, reach the exit!"; });
  requestAnimationFrame(frame);
})();
</script>
<script src="/comments.js" defer></script>
  <script src="/fullscreen.js" defer></script>
</body>
</html>
