<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Chicken Lander — Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>🐔</text></svg>" />
<style>
  :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;--good:#34d399;--bad:#f43f5e;}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
    background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.2),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.14),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;touch-action:none;}
  .wrap{max-width:620px;margin:0 auto;padding:14px 12px 30px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
  .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
  .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
  h1{margin:0;font-size:1.3rem;background:linear-gradient(120deg,var(--accent-2),#c9c9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer}
  .hud{width:100%;max-width:360px;display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);gap:6px}
  .hud b{color:var(--text)}
  .hud .warn{color:var(--bad)}
  .fuel{width:100%;max-width:360px;height:8px;background:#20244a;border-radius:6px;overflow:hidden}
  .fuel > div{height:100%;background:linear-gradient(90deg,var(--good),#a7f3d0);transition:width .1s}
  canvas{width:min(96vw,680px);aspect-ratio:4/3;height:auto;image-rendering:pixelated;border-radius:10px;border:2px solid #2a2f55;background:#05060f;touch-action:none}
  .msg{min-height:1.3em;font-weight:800;text-align:center}
  .controls{display:flex;gap:10px;align-items:center}
  .cbtn{background:var(--panel);color:var(--text);border:1px solid rgba(255,255,255,.12);border-radius:12px;width:64px;height:56px;font-size:1.3rem;cursor:pointer;user-select:none}
  .cbtn:active,.cbtn.on{background:var(--accent);color:#0b0c1a}
  .hint{font-size:.78rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="home" href="/">← Home</a><h1>🐔 Chicken Lander</h1><button class="btn" id="new">New Game</button></div>
  <div class="hud"><span>Vert: <b id="vy">0.0</b></span><span>Horiz: <b id="vx">0.0</b></span><span>Alt: <b id="alt">0</b></span><span>Round: <b id="round">1</b></span><span>Score: <b id="score">0</b></span><span>Chickens: <b id="lives">🐔🐔🐔</b></span></div>
  <div class="fuel"><div id="fuelbar" style="width:100%"></div></div>
  <canvas id="game" width="624" height="468"></canvas>
  <div class="msg" id="msg">Land gently on a pad to advance to the next round. Higher pads pay more — watch your speed!</div>
  <div class="controls">
    <button class="cbtn" id="bl">◀</button>
    <button class="cbtn" id="bu">🔥</button>
    <button class="cbtn" id="br">▶</button>
  </div>
  <div class="hint">↑/Space thrust · ←/→ steer · touch the buttons on mobile</div>
</div>
<script src="/arcade.js"></script>
<script src="/mascots.js"></script>
<script>
(function(){
  // Board scaled up ~1.3x (was 480x360) — everything below is proportional.
  const W=624,H=468, GROUND_Y=434, LW=34, LH=34;
  const C={ GRAVITY:0.04536, THRUST:0.176, LATERAL:0.08, FUEL:100,
    // Burn rates eased ~35% then halved again per player feedback ("use
    // fuel at half the rate") — were 0.5/0.28, then 0.32/0.18, now 0.16/0.09.
    // Gravity also cut 30% per the same feedback (was 0.0648).
    BURN_UP:0.16, BURN_SIDE:0.09,
    LIVES:3, MAX_LIVES:6, DEATH_FRAMES:45,
    // A good landing no longer ends the run — it freezes briefly on the pad
    // (LAND_FRAMES) then a fresh terrain loads for the next round. A chicken
    // is earned every CHICKEN_EVERY rounds. Every FLYBY_EVERY rounds a
    // spacesuit chicken flies in and tops off the fuel tank — that's also
    // now the ONLY way fuel is replenished; a tank has to last ~FLYBY_EVERY
    // rounds of careful flying, matching the "one tank per 5 screens" ask.
    LAND_FRAMES:60, CHICKEN_EVERY:3, FLYBY_EVERY:5, FLY_W:36, FLY_H:28,
    W, H, GROUND_Y, LW, LH };
  // Admin-tunable difficulty knobs — see /admin/games/?game=lander. Same
  // pattern as kaboom (see its HANDOFF.md): explicit allowlist, only
  // numeric values, safe no-op with no localStorage (headless tests).
  (function(){ try{
    const allow=["GRAVITY","THRUST","LATERAL","FUEL","BURN_UP","BURN_SIDE","LIVES","CHICKEN_EVERY","FLYBY_EVERY"];
    const o=JSON.parse(localStorage.getItem("lander_config")||"{}");
    for(const k of allow) if(typeof o[k]==="number") C[k]=o[k];
  }catch(_){} })();
  // Higher-value pads reward more precision: the safe landing speed window
  // tightens as the pad's multiplier climbs (Valley 1x is forgiving, Peak 3x
  // demands a genuinely gentle touch) instead of one flat threshold for
  // every pad regardless of payout.
  function landThresholds(mult){ return { vmax: 2.6-(mult-1)*0.6, vxmax: 1.6-(mult-1)*0.4 }; }

  function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  // Three landing pads at three different elevations — a wide safe valley pad,
  // a mid ridge plateau, and a narrow high-risk mountain peak — each worth a
  // different score multiplier so where you choose to land actually matters.
  const PAD_TYPES=[ {name:"Valley",w:110,yOff:0,mult:1}, {name:"Ridge",w:70,yOff:60,mult:2}, {name:"Peak",w:46,yOff:130,mult:3} ];
  function choosePads(){
    const zoneW=W/3;
    return shuffle(PAD_TYPES).map((t,zone)=>{
      const lo=zone*zoneW+20, hi=(zone+1)*zoneW-20-t.w;
      const x=lo+Math.random()*Math.max(10,hi-lo);
      return { name:t.name, w:t.w, mult:t.mult, y:GROUND_Y-t.yOff, x };
    }).sort((a,b)=>a.x-b.x);
  }
  // Jagged mountains everywhere except the three pads, which are carved flat at
  // their own elevation — that's what makes them read as plateaus on the peaks.
  function buildTerrain(){
    const pads=choosePads(), STEP=16, pts=[];
    for(let x=0;x<=W;x+=STEP){
      const onPad=pads.find(p=>x>=p.x-2 && x<=p.x+p.w+2);
      let y;
      if(onPad) y=onPad.y;
      else { const n1=Math.sin(x*0.021)*46, n2=Math.sin(x*0.057+1.7)*22, n3=Math.sin(x*0.11+3.1)*10;
        y=GROUND_Y-10-Math.max(0,n1+n2+n3); }
      pts.push({x,y});
    }
    for(const p of pads){ pts.push({x:p.x,y:p.y}); pts.push({x:p.x+p.w,y:p.y}); }
    pts.sort((a,b)=>a.x-b.x);
    return { points:pts, pads };
  }
  // Ground height under any x, interpolated between the two nearest terrain
  // points — needed now that the ground is a real jagged profile, not one flat line.
  function terrainYAt(points,x){
    for(let i=0;i<points.length-1;i++){ const a=points[i], b=points[i+1];
      if(x>=a.x && x<=b.x){ const t=(b.x-a.x)?(x-a.x)/(b.x-a.x):0; return a.y+(b.y-a.y)*t; } }
    return points[points.length-1].y;
  }

  function makeState(opts){ opts=opts||{};
    const built = opts.terrainData || buildTerrain();
    return { x: opts.x!=null?opts.x:(60+Math.random()*(W-120)), y: opts.y!=null?opts.y:24,
      vx: opts.vx!=null?opts.vx:(Math.random()*1.2-0.6), vy: opts.vy!=null?opts.vy:0,
      fuel: opts.fuel!=null?opts.fuel:C.FUEL, lives: opts.lives!=null?opts.lives:C.LIVES,
      landed:false, crashed:false, over:false, dying:0, landing:0,
      round: opts.round!=null?opts.round:1, totalScore:0, roundScore:0, padHit:null, flyby:null, justRefueled:false,
      terrain: built.points, pads: built.pads };
  }
  // Fuel is NOT reset here any more — it's a resource that persists across
  // both round transitions and crash-respawns; only the periodic refuel
  // (nextRound, every FLYBY_EVERY rounds) tops it back up.
  function respawnShip(s){ s.x=60+Math.random()*(W-120); s.y=24; s.vx=Math.random()*1.2-0.6; s.vy=0; s.crashed=false; }
  // A purely decorative spacesuit chicken flyby, every FLYBY_EVERY rounds —
  // cosmetic only, doesn't interact with the ship or scoring.
  function spawnFlyby(){ const goRight=Math.random()<0.5;
    return { x: goRight?-C.FLY_W:W+C.FLY_W, y: 28+Math.random()*40, vx:(goRight?1:-1)*1.6 }; }
  // A successful landing no longer ends the run: it freezes briefly on the pad
  // (LAND_FRAMES, driven from step()) then this loads a fresh terrain/pads for
  // the next round, carries the ship's lives/score forward, and hands out a
  // bonus chicken or a flyby cameo on the appropriate round cadence.
  function nextRound(s){
    s.round++;
    if(s.round % C.CHICKEN_EVERY === 0 && s.lives < C.MAX_LIVES) s.lives++;
    s.justRefueled=false;
    if(s.round % C.FLYBY_EVERY === 0){
      if(!s.flyby) s.flyby = spawnFlyby();
      s.fuel = C.FUEL; s.justRefueled=true;
    }
    const built = buildTerrain();
    s.terrain = built.points; s.pads = built.pads;
    respawnShip(s);
    s.landed=false; s.landing=0; s.padHit=null; s.roundScore=0;
  }

  function step(s, input){
    if(s.flyby){ s.flyby.x+=s.flyby.vx; if(s.flyby.x<-C.FLY_W-10||s.flyby.x>W+C.FLY_W+10) s.flyby=null; }
    if(s.over) return s;
    // The pad freeze after a good landing, and the crash freeze, both just
    // count down and then hand off — to the next round, or a respawn in place.
    if(s.landing>0){ if(--s.landing<=0) nextRound(s); return s; }
    if(s.dying>0){ if(--s.dying<=0) respawnShip(s); return s; }
    if(s.fuel>0){
      if(input.up){ s.vy-=C.THRUST; s.fuel-=C.BURN_UP; }
      if(input.left){ s.vx-=C.LATERAL; s.fuel-=C.BURN_SIDE; }
      if(input.right){ s.vx+=C.LATERAL; s.fuel-=C.BURN_SIDE; }
      if(s.fuel<0) s.fuel=0;
    }
    s.vy+=C.GRAVITY;
    s.x+=s.vx; s.y+=s.vy;
    if(s.x<0){ s.x=0; s.vx=0; } if(s.x>W-LW){ s.x=W-LW; s.vx=0; }
    const cx=s.x+LW/2, groundY=terrainYAt(s.terrain,cx);
    if(s.y+LH>=groundY){
      s.y=groundY-LH;
      const pad=s.pads.find(p=>cx>=p.x && cx<=p.x+p.w);
      const th=pad?landThresholds(pad.mult):null;
      if(pad && s.vy<=th.vmax && Math.abs(s.vx)<=th.vxmax){
        s.landed=true; s.roundScore=Math.round(s.fuel*10*pad.mult); s.totalScore+=s.roundScore;
        s.padHit=pad; s.landing=C.LAND_FRAMES;
      } else {
        s.crashed=true; s.lives--;
        if(s.lives<=0) s.over=true; else s.dying=C.DEATH_FRAMES;
      }
    }
    return s;
  }
  window.__lander={ makeState, step, buildTerrain, terrainYAt, choosePads, respawnShip, nextRound, spawnFlyby, landThresholds, C, PAD_TYPES };

  if(typeof document==="undefined") return;
  const $=(id)=>document.getElementById(id);
  const cv=$("game"), ctx=cv.getContext("2d");
  const GATE = (typeof Arcade!=="undefined"&&Arcade.startGate) ? Arcade.startGate(cv,"Chicken Lander") : {open:true,paint:()=>{}};
  let s=makeState(), input={up:false,left:false,right:false}, best=null, done=false;
  try{ best=parseInt(localStorage.getItem("lander_best")||"")||null; }catch(e){}

  const PAD_COLOR={1:"#34d399",2:"#ffcf5a",3:"#f43f5e"};   // green/gold/red = safe/risky/hardest
  function draw(){
    ctx.clearRect(0,0,W,H); ctx.fillStyle="#05060f"; ctx.fillRect(0,0,W,H);
    // stars
    ctx.fillStyle="#233"; for(let i=0;i<40;i++){ const x=(i*73)%W, y=(i*151)%(GROUND_Y-30); ctx.fillRect(x,y,1,1); }
    // terrain
    ctx.beginPath(); ctx.moveTo(0,H); ctx.lineTo(0,s.terrain[0].y);
    for(const p of s.terrain) ctx.lineTo(p.x,p.y); ctx.lineTo(W,H); ctx.closePath();
    ctx.fillStyle="#2b2f4d"; ctx.fill();
    // pads — colour-coded by risk/reward, each labelled with its multiplier
    for(const pad of s.pads){
      const col=PAD_COLOR[pad.mult]||"#34d399";
      ctx.fillStyle=col; ctx.fillRect(pad.x,pad.y-3,pad.w,4);
      ctx.fillStyle=hexA(col,.25); ctx.fillRect(pad.x,pad.y-14,pad.w,11);
      ctx.fillStyle="#e6e6f0"; ctx.font="bold 10px system-ui"; ctx.textAlign="center";
      ctx.fillText(pad.mult+"x", pad.x+pad.w/2, pad.y-18);
    }
    // lander
    ctx.save(); ctx.translate(s.x,s.y);
    ctx.fillStyle= s.crashed?"#f43f5e":(s.landed?"#34d399":"#cdd3ff");
    ctx.fillRect(3,2,LW-6,LH-8); ctx.fillRect(1,LH-8,LW-2,4);
    ctx.fillStyle="#7c5cff"; ctx.fillRect(5,0,LW-10,3);
    ctx.fillStyle="#333"; ctx.fillRect(1,LH-4,3,4); ctx.fillRect(LW-4,LH-4,3,4);
    // hen pilot in the dome
    ctx.fillStyle="#dc2626"; ctx.fillRect(LW/2-3,-6,2,3); ctx.fillRect(LW/2,-7,2,4); ctx.fillRect(LW/2+3,-6,2,3);
    ctx.fillStyle="#facc15"; ctx.beginPath(); ctx.arc(LW/2,-1,5,0,7); ctx.fill();
    ctx.fillStyle="#0b1030"; ctx.fillRect(LW/2-3,-3,2,2); ctx.fillRect(LW/2+1,-3,2,2);
    ctx.fillStyle="#fb923c"; ctx.fillRect(LW/2-1,1,3,2);
    if(input.up&&s.fuel>0&&!done&&s.dying<=0&&s.landing<=0){ ctx.fillStyle="#ffcf5a"; ctx.beginPath(); ctx.moveTo(4,LH-4); ctx.lineTo(LW/2,LH+7+Math.random()*4); ctx.lineTo(LW-4,LH-4); ctx.fill(); }
    ctx.restore();
    // A cameo spacesuit chicken sailing across the sky — every FLYBY_EVERY
    // rounds. Purely decorative: no collision, no scoring, doesn't react
    // to the ship. Drawn from the shared /mascots.js library — this used
    // to be a hand-copied version that was missing the eye detail other
    // games' copies had; one shared drawing fixes that drift for good.
    if(s.flyby) Mascots.spacesuitChicken(ctx, s.flyby.x, s.flyby.y, C.FLY_H*0.42, s.flyby.vx);
    if(s.landing>0){ overlay("#34d399","TOUCHDOWN!","+"+s.roundScore+" ("+s.padHit.name+" "+s.padHit.mult+"x)  ·  Total "+s.totalScore); }
    else if(s.over){ overlay("#f43f5e","OUT OF CHICKENS","Final score "+s.totalScore+(best?"  ·  Best "+best:"")+" — Press New Game"); }
    else if(s.dying>0){ ctx.fillStyle="#f43f5e"; ctx.font="bold 20px system-ui"; ctx.textAlign="center"; ctx.fillText("CHICKEN DOWN — "+s.lives+" left",W/2,H/2); }
  }
  function hexA(hex,a){ const n=parseInt(hex.slice(1),16); return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")"; }
  function overlay(col,t1,t2){ ctx.fillStyle="rgba(0,0,0,.5)"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle=col; ctx.font="bold 26px system-ui"; ctx.textAlign="center"; ctx.fillText(t1,W/2,H/2-6);
    ctx.fillStyle="#e6e6f0"; ctx.font="14px system-ui"; ctx.fillText(t2,W/2,H/2+18); }
  function hud(){
    // Warn against whichever pad the ship is currently over (its threshold
    // is what actually matters right now); default to the most forgiving
    // (Valley) threshold while over open terrain, same as landing on any pad
    // requires at least that much control.
    const cx=s.x+LW/2, underPad=s.pads.find(p=>cx>=p.x&&cx<=p.x+p.w);
    const th=landThresholds(underPad?underPad.mult:1);
    $("vy").textContent=s.vy.toFixed(1); $("vy").className=s.vy>th.vmax?"warn":"";
    $("vx").textContent=s.vx.toFixed(1); $("vx").className=Math.abs(s.vx)>th.vxmax?"warn":"";
    $("alt").textContent=Math.max(0,Math.round(GROUND_Y-LH-s.y)); $("fuelbar").style.width=(s.fuel/C.FUEL*100)+"%";
    $("round").textContent=s.round; $("score").textContent=s.totalScore;
    const livesEl=$("lives"); if(livesEl) livesEl.textContent="🐔".repeat(Math.max(0,s.lives)); }

  let prevDying=0, prevLanding=0;
  function frame(){
    if(!GATE.open){ draw(); GATE.paint(); return requestAnimationFrame(frame); }
    if(!done){ step(s,input);
      if(typeof Arcade!=="undefined" && s.dying>0 && prevDying<=0) Arcade.sfx.explode();
      prevDying=s.dying;
      if(typeof Arcade!=="undefined" && s.landing>0 && prevLanding<=0) Arcade.sfx.win();
      prevLanding=s.landing;
      if(s.landing>0){ $("msg").textContent="🚀 Touchdown! +"+s.roundScore+" ("+s.padHit.name+" "+s.padHit.mult+"x)  ·  Total "+s.totalScore; }
      else if(s.justRefueled){
        // One-shot: nextRound() sets this true only on a refuel round: consume
        // it here (own sound + message) so it doesn't repeat every frame.
        if(typeof Arcade!=="undefined") Arcade.sfx.pickup();
        $("msg").textContent="⛽ The space chicken topped off your tank! Round "+s.round+" — full fuel.";
        s.justRefueled=false;
      }
      else if(s.over){ done=true; if(typeof Arcade!=="undefined"){ Arcade.stats.record("lander",s.totalScore); Arcade.sfx.lose(); } if(!best||(s.totalScore>best)){ best=s.totalScore; try{localStorage.setItem("lander_best",String(best));}catch(e){} } $("msg").textContent="💥 Out of chickens. Final score "+s.totalScore+(best?"  ·  Best "+best:"")+". Try again!"; }
      else if(s.crashed && s.dying>0){ $("msg").textContent="CHICKEN DOWN — "+s.lives+" left"; }
      else if(s.landing<=0 && s.dying<=0 && !s.crashed){ $("msg").textContent="Round "+s.round+" — land gently on a pad to advance!"; } }
    draw(); hud(); requestAnimationFrame(frame); }

  function reset(){ s=makeState(); input={up:false,left:false,right:false}; done=false; prevDying=0; prevLanding=0; $("msg").textContent="Land gently on a pad to advance to the next round. Higher pads pay more — watch your speed!"; }
  const set=(k,v)=>{ input[k]=v; };
  addEventListener("keydown",(e)=>{ if(e.key==="ArrowUp"||e.key===" "||e.key==="w"){e.preventDefault();set("up",true);} else if(e.key==="ArrowLeft"||e.key==="a")set("left",true); else if(e.key==="ArrowRight"||e.key==="d")set("right",true); });
  addEventListener("keyup",(e)=>{ if(e.key==="ArrowUp"||e.key===" "||e.key==="w")set("up",false); else if(e.key==="ArrowLeft"||e.key==="a")set("left",false); else if(e.key==="ArrowRight"||e.key==="d")set("right",false); });
  function bindHold(id,k){ const el=$(id); const on=(e)=>{e.preventDefault();set(k,true);el.classList.add("on");}; const off=(e)=>{e.preventDefault();set(k,false);el.classList.remove("on");};
    el.addEventListener("touchstart",on,{passive:false});el.addEventListener("touchend",off);el.addEventListener("mousedown",on);el.addEventListener("mouseup",off);el.addEventListener("mouseleave",off); }
  bindHold("bu","up"); bindHold("bl","left"); bindHold("br","right");
  $("new").addEventListener("click",reset);
  requestAnimationFrame(frame);
})();
</script>
<script src="/comments.js" defer></script>
</body>
</html>
