<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chicken-Man — Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>🐔</text></svg>" />
  <style>
    :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
      background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.22),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.16),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;}
    .wrap{max-width:440px;margin:0 auto;padding:16px 16px 30px;display:flex;flex-direction:column;align-items:center;gap:12px}
    .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
    .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
    .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
    h1{margin:0;font-size:1.6rem;background:linear-gradient(120deg,#eab308,var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
    .scores{display:flex;gap:12px;width:100%}
    .stat{flex:1;background:var(--panel);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:8px;text-align:center}
    .stat .label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    .stat .value{font-size:1.3rem;font-weight:700}
    .board-wrap{position:relative;width:100%}
    canvas{width:100%;height:auto;display:block;background:#05060f;border:1px solid rgba(255,255,255,.08);border-radius:14px;touch-action:none}
    .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(15,16,32,.85);border-radius:14px;text-align:center}
    .overlay.hidden{display:none}
    .overlay h2{margin:0}.overlay p{margin:0;color:var(--muted)}
    .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:12px 28px;border-radius:999px;cursor:pointer}
    .dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,44px);gap:6px;margin-top:4px}
    .dpad button{background:var(--panel);border:1px solid rgba(255,255,255,.14);color:var(--text);border-radius:10px;font-size:1.2rem;cursor:pointer}
    .dpad .up{grid-column:2}
    .hint{color:var(--muted);font-size:.82rem;text-align:center}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar"><a class="home" href="/">← Home</a><h1>🐔 Chicken-Man</h1><span style="width:64px"></span></div>
    <div class="scores">
      <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">Lives</div><div class="value" id="lives">3</div></div>
      <div class="stat"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
    <div class="board-wrap">
      <canvas id="c" width="380" height="420"></canvas>
      <div class="overlay" id="ov"><h2 id="ot">Chicken-Man</h2><p id="om">Eat all the seed. Avoid the weasels.</p><button class="btn" id="start">Play</button></div>
    </div>
    <div class="dpad">
      <button class="up" data-d="up">▲</button>
      <button data-d="left">◀</button>
      <button data-d="down">▼</button>
      <button data-d="right">▶</button>
    </div>
    <p class="hint">Arrows / WASD / swipe / d-pad · power corn lets you eat weasels</p>
  </div>
  <script src="/arcade.js"></script>
  <script>
  (function(){
    const DEFAULT_MAP=[
      "###################",
      "#........#........#",
      "#O##.###.#.###.##O#",
      "#.................#",
      "#.##.#.#####.#.##.#",
      "#....#...#...#....#",
      "####.###.#.###.####",
      "#....#.......#....#",
      "#.##.#.#G#G#.#.##.#",
      "#.....G....G......#",
      "#.##.#.#####.#.##.#",
      "#....#...#...#....#",
      "####.###.#.###.####",
      "#........#........#",
      "#O##.###.#.###.##O#",
      "#..#.....P.....#..#",
      "##.#.#.#####.#.#.##",
      "#....#...#...#....#",
      "#.######.#.######.#",
      "#.................#",
      "###################",
    ];
    // Admin-designed maze (/admin/games/?game=pacman, "Configuration" panel)
    // overrides the built-in one — same convention as quest/chickenmania/
    // adventure/minigolf/sokoban. Falls back to DEFAULT_MAP on anything
    // malformed, including ragged rows (every row must share one width, or
    // `MAP[r][c]` for a too-short row silently reads as open floor past its
    // end instead of a wall, punching a hole in the boundary).
    function isValidMap(o){ return Array.isArray(o)&&o.length>0&&o.every(row=>typeof row==="string"&&row.length===o[0].length); }
    let MAP=DEFAULT_MAP;
    try{ const j=localStorage.getItem("pacman_map"); if(j){ const o=JSON.parse(j); if(isValidMap(o)) MAP=o; } }catch(e){}
    const ROWS=MAP.length, COLS=MAP[0].length;
    const cv=document.getElementById("c"),ctx=cv.getContext("2d");
    const T=cv.width/COLS;
    const scoreEl=document.getElementById("score"),livesEl=document.getElementById("lives"),bestEl=document.getElementById("best");
    const ov=document.getElementById("ov"),ot=document.getElementById("ot"),om=document.getElementById("om"),startBtn=document.getElementById("start");
    const GHOST_COLORS=["#ff0000","#ffb8ff","#00ffff","#ffb852"];  // Blinky, Pinky, Inky, Clyde
    let grid,dots,pac,ghosts,score,lives,fright,running,stepTimer,raf,pacStart,ghostStarts,best=+localStorage.getItem("pacman_best")||0;
    const STEP_MS=150, DEATH_MS=2000;          // one grid step; length of the death animation
    // Player feedback: "the blue does not last long enough, we need sound
    // indications that the chickens are blue and that they are about to turn
    // back." FRIGHT_TICKS was 28 (4.2s) -- up to 45 (6.75s). The flash-warning
    // window scaled up proportionally, from the last 8 ticks to the last 12.
    const FRIGHT_TICKS=45, FRIGHT_WARN_TICKS=12;
    const SCATTER_STEPS=47, CHASE_STEPS=133;   // ~7s scatter / ~20s chase at 150ms a step
    let mode="scatter", modeTick=0, lastStep=0, dying=0, pendingGameOver=false, ghostTick=0, ghostCum=0;
    bestEl.textContent=best;

    function parse(){
      grid=[];dots=0;ghostStarts=[];pacStart={r:1,c:1};
      const dotmap=[];
      for(let r=0;r<ROWS;r++){grid[r]=[];dotmap[r]=[];
        for(let c=0;c<COLS;c++){const ch=MAP[r][c];
          grid[r][c]=(ch==="#")?1:0;
          dotmap[r][c]=0;
          if(ch==="."){dotmap[r][c]=1;dots++;}
          else if(ch==="O"){dotmap[r][c]=2;dots++;}
          else if(ch==="P"){pacStart={r,c};}
          else if(ch==="G"){ghostStarts.push({r,c});}
        }
      }
      return dotmap;
    }
    let dotmap;
    function reset(full){
      if(full){score=0;lives=3;}
      dotmap=parse();
      pac={r:pacStart.r,c:pacStart.c,pr:pacStart.r,pc:pacStart.c,dir:"left",next:"left",mouth:0};
      // Personalities follow the original arcade ghosts: a direct chaser, an
      // ambusher that aims ahead of you, and a shy one that backs off up close.
      ghosts=ghostStarts.map((g,i)=>({r:g.r,c:g.c,pr:g.r,pc:g.c,dir:"up",color:GHOST_COLORS[i%4],
        eaten:false,home:{r:g.r,c:g.c},kind:["chaser","ambusher","flanker","shy"][i%4],
        corner:[{r:1,c:COLS-2},{r:1,c:1},{r:ROWS-2,c:COLS-2},{r:ROWS-2,c:1}][i%4]}));
      fright=0; modeTick=0; mode="scatter";
      scoreEl.textContent=score;livesEl.textContent=lives;
      recountDots();
    }
    function recountDots(){dots=0;for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(dotmap[r][c])dots++;}
    function start(){reset(true);ov.classList.add("hidden");running=true;dying=0;pendingGameOver=false;
      lastStep=performance.now();clearInterval(stepTimer);stepTimer=setInterval(step,STEP_MS);
      cancelAnimationFrame(raf);raf=requestAnimationFrame(frame);}
    // Rendering runs every frame so movement can be interpolated between grid steps.
    function frame(){
      if(dying && performance.now()-dying>=DEATH_MS) finishDeath();
      draw();
      raf=requestAnimationFrame(frame);
    }
    function open(r,c){return r>=0&&r<ROWS&&c>=0&&c<COLS&&grid[r][c]===0;}
    const DIRS={up:[-1,0],down:[1,0],left:[0,-1],right:[0,1]};
    function step(){
      if(!running||dying)return;
      lastStep=performance.now();
      // scatter/chase alternation — ghosts reverse direction the moment it flips
      if(fright<=0){
        modeTick++;
        const limit = mode==="scatter" ? SCATTER_STEPS : CHASE_STEPS;
        if(modeTick>=limit){ modeTick=0; mode = mode==="scatter"?"chase":"scatter";
          ghosts.forEach(g=>{ if(!g.eaten) g.dir=oppositeOf(g.dir); }); }
      }
      // pac
      pac.pr=pac.r; pac.pc=pac.c;
      if(canGo(pac.r,pac.c,pac.next))pac.dir=pac.next;
      if(canGo(pac.r,pac.c,pac.dir)){const[d]=[DIRS[pac.dir]];pac.r+=d[0];pac.c+=d[1];}
      pac.mouth=(pac.mouth+1)%2;
      // eat
      if(dotmap[pac.r][pac.c]===1){dotmap[pac.r][pac.c]=0;score+=10;dots--;if(typeof Arcade!=="undefined")Arcade.sfx.step();}
      else if(dotmap[pac.r][pac.c]===2){dotmap[pac.r][pac.c]=0;score+=50;dots--;fright=FRIGHT_TICKS;if(typeof Arcade!=="undefined")Arcade.sfx.power();}
      scoreEl.textContent=score;
      if(fright>0){
        fright--;
        // tick a warning beep in sync with the flash (see the coat colour
        // below, which goes white on the same odd/even parity) so there's
        // an audible countdown, not just a visual one
        if(fright>0&&fright<FRIGHT_WARN_TICKS&&fright%2===1&&typeof Arcade!=="undefined")Arcade.sfx.warn();
      }
      // ghosts
      // Ghosts skip every 4th step, so they are strictly slower than you.
      // At equal speed they were inescapable in a corridor.
      // Ghosts are slower than you. Skipping every 4th step did that, but it
      // also froze them for a whole tick every fourth one, which is what read as
      // jumping. Instead each ghost carries a fractional step budget and moves
      // when it has banked a full cell, so it glides at a steady 3/4 pace.
      ghostTick++;
      const grate=fright>0?1:0.75;
      ghostCum+=grate;
      for(const g of ghosts){
        g.prog=(g.prog||0)+grate;
        while(g.prog>=1){
          g.prog-=1; const fromR=g.r,fromC=g.c; moveGhost(g);
          // the exact point on the shared timeline where this move landed, so
          // the glide can finish precisely as the next one begins
          g.moveAt=ghostCum-g.prog;
          // Pac and a ghost can cross paths in the same tick without ever
          // landing on the same cell (pac moves into the ghost's old cell
          // while the ghost moves into pac's old cell). checkCollisions()
          // below only catches same-cell overlap, so a chasing ghost could
          // glide straight through the player in a 1-wide corridor. Catch
          // that swap here, right when we know the ghost's before/after cell.
          if(!g.eaten&&g.r===pac.pr&&g.c===pac.pc&&pac.r===fromR&&pac.c===fromC)catchPac(g);
        }
      }
      checkCollisions();
      if(dots<=0){win();return;}
    }
    function canGo(r,c,dir){const d=DIRS[dir];return open(r+d[0],c+d[1]);}
    // Where each ghost wants to be this tick. Mirrors the arcade behaviour:
    // in scatter every ghost heads for its own corner; in chase each has its
    // own way of hunting you.
    function ghostTarget(g){
      if(g.eaten) return g.home;                        // eaten: back to the pen
      if(mode==="scatter") return g.corner;
      const d=DIRS[pac.dir];
      if(g.kind==="ambusher") return {r:pac.r+d[0]*4, c:pac.c+d[1]*4};   // four tiles ahead of you
      if(g.kind==="flanker"){
        // Inky: reflect the lead ghost through the point two tiles ahead of you,
        // so he cuts you off from the far side rather than tailing you.
        const p={r:pac.r+d[0]*2, c:pac.c+d[1]*2};
        const lead=ghosts.find(x=>x.kind==="chaser")||g;
        return {r:p.r+(p.r-lead.r), c:p.c+(p.c-lead.c)};
      }
      if(g.kind==="shy"){                                                // backs off when close
        return dist(g.r,g.c,pac)>8 ? pac : g.corner;
      }
      return pac;                                                        // chaser: straight at you
    }
    function moveGhost(g){
      const opts=[];
      for(const dir in DIRS){const d=DIRS[dir];const nr=g.r+d[0],nc=g.c+d[1];
        if(!open(nr,nc))continue;
        if(oppositeOf(g.dir)===dir)continue; // ghosts never reverse mid-corridor
        opts.push({dir,nr,nc});
      }
      if(!opts.length){const d=DIRS[oppositeOf(g.dir)];if(open(g.r+d[0],g.c+d[1]))opts.push({dir:oppositeOf(g.dir),nr:g.r+d[0],nc:g.c+d[1]});}
      if(!opts.length)return;
      g.pr=g.r; g.pc=g.c;
      let choice;
      if(fright>0&&!g.eaten){
        // frightened ghosts pick at random, as in the original
        choice=opts[Math.floor(Math.random()*opts.length)];
      }else{
        const t=ghostTarget(g);
        choice=opts.reduce((a,b)=>dist(b.nr,b.nc,t)<dist(a.nr,a.nc,t)?b:a);
      }
      g.dir=choice.dir;g.r=choice.nr;g.c=choice.nc;
      if(g.eaten&&g.r===g.home.r&&g.c===g.home.c)g.eaten=false;
    }
    function oppositeOf(d){return {up:"down",down:"up",left:"right",right:"left"}[d];}
    function dist(r,c,t){return Math.abs(r-t.r)+Math.abs(c-t.c);}
    function checkCollisions(){
      for(const g of ghosts){
        if(g.r===pac.r&&g.c===pac.c){
          if(g.eaten)continue;
          catchPac(g);
        }
      }
    }
    function catchPac(g){
      if(fright>0){g.eaten=true;score+=200;scoreEl.textContent=score;if(typeof Arcade!=="undefined")Arcade.sfx.coin();}
      else die();
    }
    // Death plays out over two seconds before anything resets.
    function die(){
      if(dying)return;
      lives--;livesEl.textContent=lives;
      dying=performance.now();
      pendingGameOver = lives<=0;
      if(typeof Arcade!=="undefined")Arcade.sfx.death();
    }
    function finishDeath(){
      dying=0;
      if(pendingGameOver){
        pendingGameOver=false;running=false;clearInterval(stepTimer);
        if(typeof Arcade!=="undefined"){Arcade.stats.record("pacman",score);Arcade.sfx.lose();} if(score>best){best=score;localStorage.setItem("pacman_best",best);bestEl.textContent=best;}
        ot.textContent="Game Over";om.textContent="Score "+score;startBtn.textContent="Play again";ov.classList.remove("hidden");return;
      }
      pac={r:pacStart.r,c:pacStart.c,pr:pacStart.r,pc:pacStart.c,dir:"left",next:"left",mouth:0};
      ghosts.forEach(g=>{g.r=g.home.r;g.c=g.home.c;g.pr=g.home.r;g.pc=g.home.c;g.eaten=false;g.dir="up";});
      fright=0;mode="scatter";modeTick=0;lastStep=performance.now();
    }
    function win(){running=false;clearInterval(stepTimer);score+=500;scoreEl.textContent=score;if(score>best){best=score;localStorage.setItem("pacman_best",best);bestEl.textContent=best;}
      if(typeof Arcade!=="undefined")Arcade.sfx.win();
      ot.textContent="🎉 Level cleared!";om.textContent="Score "+score;startBtn.textContent="Play again";ov.classList.remove("hidden");}
    function draw(){
      ctx.clearRect(0,0,cv.width,cv.height);
      for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
        if(grid[r][c]===1){ctx.fillStyle="#1c2a6b";roundRect(c*T+1,r*T+1,T-2,T-2,4);ctx.fill();}
        else if(dotmap[r][c]===1){ctx.fillStyle="#f5d76e";ctx.beginPath();ctx.arc((c+.5)*T,(r+.5)*T,T*0.08,0,7);ctx.fill();}
        else if(dotmap[r][c]===2){ctx.fillStyle="#fff";ctx.beginPath();ctx.arc((c+.5)*T,(r+.5)*T,T*0.22,0,7);ctx.fill();}
      }
      // Positions are interpolated between the last grid step and this one, so
      // movement reads as continuous instead of snapping a whole tile at a time.
      const a=Math.max(0,Math.min(1,(performance.now()-lastStep)/STEP_MS));
      const lerp=(p,n)=>Math.abs(n-p)>1 ? n : p+(n-p)*a;   // big jumps (respawn) snap
      // pac
      const px=(lerp(pac.pc==null?pac.c:pac.pc,pac.c)+.5)*T, py=(lerp(pac.pr==null?pac.r:pac.pr,pac.r)+.5)*T, rad=T*0.42;
      const open=pac.mouth?0.28:0.03;
      const ang={left:Math.PI,right:0,up:-Math.PI/2,down:Math.PI/2}[pac.dir];
      if(dying){   // 2-second death: the hen spins, shrinks and fades away
        const t=Math.min(1,(performance.now()-dying)/DEATH_MS);
        ctx.save();ctx.translate(px,py);ctx.rotate(t*Math.PI*4);ctx.scale(1-t*0.85,1-t*0.85);
        ctx.globalAlpha=1-t*0.9;
        ctx.fillStyle="#dc2626";
        ctx.beginPath();ctx.arc(-rad*.30,-rad*.90,rad*.20,0,7);ctx.arc(0,-rad*1.02,rad*.22,0,7);ctx.arc(rad*.30,-rad*.90,rad*.20,0,7);ctx.fill();
        ctx.fillStyle="#facc15";ctx.beginPath();ctx.arc(0,0,rad,0,7);ctx.fill();
        ctx.fillStyle="#0b1030";ctx.beginPath();ctx.arc(rad*.18,-rad*.40,rad*.15,0,7);ctx.fill();
        ctx.restore();
        ctx.globalAlpha=1;
        // a few feathers puffing outward
        ctx.fillStyle="rgba(253,230,138,"+(1-t)+")";
        for(let i=0;i<6;i++){const fa=i/6*Math.PI*2, fd=t*T*2.2;
          ctx.beginPath();ctx.arc(px+Math.cos(fa)*fd,py+Math.sin(fa)*fd,2.5*(1-t),0,7);ctx.fill();}
        return;
      }
      ctx.save();ctx.translate(px,py);ctx.rotate(ang);
      // comb (three points along the top of the head)
      ctx.fillStyle="#dc2626";
      ctx.beginPath();ctx.arc(-rad*.30,-rad*.90,rad*.20,0,7);ctx.arc(0,-rad*1.02,rad*.22,0,7);ctx.arc(rad*.30,-rad*.90,rad*.20,0,7);ctx.fill();
      // head, mouth wedge opens toward travel direction
      ctx.fillStyle="#facc15";ctx.beginPath();ctx.moveTo(0,0);
      ctx.arc(0,0,rad,open,-open+Math.PI*2);ctx.closePath();ctx.fill();
      // wattle under the beak
      ctx.fillStyle="#dc2626";ctx.beginPath();ctx.arc(rad*.62,rad*.46,rad*.17,0,7);ctx.fill();
      // eye
      ctx.fillStyle="#0b1030";ctx.beginPath();ctx.arc(rad*.18,-rad*.40,rad*.15,0,7);ctx.fill();
      ctx.restore();
      // weasels
      for(const g of ghosts){
        // Ghosts run on their own cumulative timeline, so one cell of travel is
        // spread evenly over the time until their next move — no stutter, and no
        // arriving early and waiting.
        const cumNow=ghostCum+(fright>0?1:0.75)*a;
        const ga=Math.max(0,Math.min(1,cumNow-(g.moveAt==null?cumNow:g.moveAt)));
        const glerp=(p,n)=>Math.abs(n-p)>1 ? n : p+(n-p)*ga;
        const gx=(glerp(g.pc==null?g.c:g.pc,g.c)+.5)*T, gy=(glerp(g.pr==null?g.r:g.pr,g.r)+.5)*T, r=T*0.4;
        const coat=g.eaten?"#334155":(fright>0?(fright<FRIGHT_WARN_TICKS&&fright%2?"#fff":"#3b82f6"):g.color);
        const face=(g.dir==="left")?-1:1;
        ctx.save();ctx.translate(gx,gy);ctx.scale(face,1);
        ctx.fillStyle=coat;
        // long low body and tail
        ctx.beginPath();ctx.ellipse(-r*.10,r*.10,r*.78,r*.44,0,0,7);ctx.fill();
        ctx.beginPath();ctx.moveTo(-r*.62,r*.06);ctx.lineTo(-r*1.35,-r*.30);ctx.lineTo(-r*.55,r*.36);ctx.closePath();ctx.fill();
        // head, raised on a long neck
        ctx.beginPath();ctx.arc(r*.52,-r*.34,r*.40,0,7);ctx.fill();
        // small rounded ears
        ctx.beginPath();ctx.arc(r*.34,-r*.68,r*.15,0,7);ctx.arc(r*.68,-r*.66,r*.15,0,7);ctx.fill();
        // pale muzzle and bib
        ctx.fillStyle=g.eaten?"#475569":"#fdeed6";
        ctx.beginPath();ctx.ellipse(r*.86,-r*.22,r*.26,r*.18,0,0,7);ctx.fill();
        ctx.beginPath();ctx.ellipse(r*.16,r*.26,r*.34,r*.18,0,0,7);ctx.fill();
        // eye and nose
        ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(r*.58,-r*.42,r*.16,0,7);ctx.fill();
        ctx.fillStyle="#0b1030";ctx.beginPath();ctx.arc(r*.62,-r*.42,r*.09,0,7);ctx.fill();
        ctx.beginPath();ctx.arc(r*1.08,-r*.20,r*.09,0,7);ctx.fill();
        ctx.restore();
      }
    }
    function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
    function setDir(d){pac.next=d;}
    document.addEventListener("keydown",e=>{const m={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",w:"up",s:"down",a:"left",d:"right"}[e.key];if(m){e.preventDefault();if(pac)setDir(m);}});
    document.querySelectorAll(".dpad button").forEach(b=>b.addEventListener("click",()=>pac&&setDir(b.dataset.d)));
    let ts=null;cv.addEventListener("touchstart",e=>ts={x:e.touches[0].clientX,y:e.touches[0].clientY},{passive:true});
    cv.addEventListener("touchend",e=>{if(!ts||!pac)return;const dx=e.changedTouches[0].clientX-ts.x,dy=e.changedTouches[0].clientY-ts.y;if(Math.abs(dx)<18&&Math.abs(dy)<18)return;if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?"right":"left");else setDir(dy>0?"down":"up");ts=null;},{passive:true});
    startBtn.addEventListener("click",start);
    window.__pacman={MAP,DEFAULT_MAP,isValidMap,ROWS,COLS,getPacStart:()=>pacStart,getGhostStarts:()=>ghostStarts,getDots:()=>dots};
    reset(true);draw();
  })();
  </script>
  <script src="/startgate.js" defer></script>
  <script src="/comments.js" defer></script>
  <script src="/fullscreen.js" defer></script>
</body>
