<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Chickenpede — Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>🐔</text></svg>" />
<style>
  :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;--bad:#f43f5e;}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
    background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.2),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.14),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;touch-action:none;}
  .wrap{max-width:600px;margin:0 auto;padding:14px 12px 30px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
  .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
  .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
  h1{margin:0;font-size:1.3rem;background:linear-gradient(120deg,#8ad48a,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
  .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer}
  .hud{width:100%;max-width:300px;display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
  .hud b{color:var(--text)}
  canvas{width:min(96vw,560px);aspect-ratio:4/3;height:auto;image-rendering:pixelated;border-radius:10px;border:2px solid #2a2f55;background:#080a14;touch-action:none}
  .msg{min-height:1.3em;font-weight:800;text-align:center}
  .hint{font-size:.78rem;color:var(--muted);text-align:center}
  .ctl{display:flex;gap:8px;align-items:center}
  .dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:4px}
  .dpad button{background:var(--panel);color:var(--text);border:1px solid rgba(255,255,255,.1);border-radius:9px;font-size:1.1rem;cursor:pointer;user-select:none}
  .dpad button:active{background:var(--accent);color:#0b0c1a}
  .dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .dn{grid-area:2/2}.dpad .r{grid-area:2/3}
  .fire{background:var(--bad);color:#fff;border:none;border-radius:14px;padding:20px 22px;font-weight:800;cursor:pointer;user-select:none}
  .fire:active{filter:brightness(1.2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="home" href="/">← Home</a><h1>🐔 Chickenpede</h1><button class="btn" id="new">New Game</button></div>
  <div class="hud"><span>Score: <b id="score">0</b></span><span>Wave: <b id="wave">1</b></span><span>Chickens: <b id="lives">🐔🐔🐔</b></span></div>
  <canvas id="game" width="480" height="360"></canvas>
  <div class="msg" id="msg">Shoot the centipede. Each hit splits it and leaves a mushroom!</div>
  <div class="ctl">
    <div class="dpad"><button class="u" data-d="up">▲</button><button class="l" data-d="left">◀</button><button class="dn" data-d="down">▼</button><button class="r" data-d="right">▶</button></div>
    <button class="fire" id="fire">FIRE</button>
  </div>
  <div class="hint">Arrows/WASD move · Space/FIRE to shoot · drag on canvas to aim</div>
</div>
<script src="/arcade.js"></script>
<script src="/mascots.js"></script>
<script>
(function(){
  const C={ cols:24, rows:18, cell:20, playerZone:4, mushHp:3, EXTRA_EVERY:5000, CHICKENS:3, FLYPAST_EVERY:5,
            DEATH_FRAMES:50, BANNER_FRAMES:110 };
  // Admin-tunable difficulty knobs — see /admin/games/?game=centipede.
  // Same pattern as kaboom (see its HANDOFF.md): explicit allowlist, only
  // numeric values, safe no-op with no localStorage (headless tests).
  (function(){ try{
    const allow=["CHICKENS","EXTRA_EVERY","FLYPAST_EVERY","mushHp"];
    const o=JSON.parse(localStorage.getItem("centipede_config")||"{}");
    for(const k of allow) if(typeof o[k]==="number") C[k]=o[k];
  }catch(_){} })();
  const key=(c,r)=>c+","+r;
  function newState(){ const start={c:Math.floor(C.cols/2), r:C.rows-1};
    const s={ cols:C.cols, rows:C.rows, trains:[], mush:{}, bullet:null,
    player:{...start, pc:start.c, pr:start.r}, lives:C.CHICKENS, score:0, wave:0, over:false, tickEvery:14, tc:0,
    nextExtra:C.EXTRA_EVERY, gotExtra:0, flypast:null, waveBreak:0, dying:0, banner:null };
    // scatter a mushroom field
    for(let i=0;i<22;i++){ const c=Math.floor(Math.random()*C.cols), r=2+Math.floor(Math.random()*(C.rows-7)); s.mush[key(c,r)]=C.mushHp; }
    spawnWave(s); return s; }
  // Every wave (including the very first, and any restart via newState) gets a
  // title card — the number and the chickens you have left — before it plays.
  function spawnWave(s){ s.wave++; const len=Math.min(s.cols-1, 8+s.wave*2); const cells=[]; for(let i=0;i<len;i++) cells.push({c:len-1-i, r:0});
    s.trains=[{cells, dir:1}]; s.tickEvery=Math.max(5, 15-s.wave*2);
    s.banner={ title:"WAVE "+s.wave, sub:"🐔 "+Math.max(0,s.lives)+" left", t:C.BANNER_FRAMES }; }
  // A hit doesn't end the wave instantly — it starts a death animation first
  // (freeze + shake) so losing a chicken actually reads as an event.
  function killPlayer(s){ if(s.dying>0) return; s.lives--; s.dying=C.DEATH_FRAMES; }
  // Counts down the death animation; when it finishes, the flock clears and
  // either the next wave breathes in or, out of chickens, the run ends.
  // Returns true while still dying, so the caller freezes normal play.
  function stepDeath(s){ if(s.dying<=0) return false;
    if(--s.dying<=0){ s.trains=[]; if(s.lives<=0){ s.over=true; } else { s.waveBreak=90; } }
    return true; }
  function awardExtras(s){
    while(s.score>=s.nextExtra){ s.lives++; s.nextExtra+=C.EXTRA_EVERY; s.gotExtra++; }
  }
  // Waves are separated by a short breather rather than the next flock appearing
  // on top of you, and every fifth one the spacesuit chicken crosses for bonus points.
  function ensureCentipede(s){
    if(s.over || s.trains.length) return;
    if(s.waveBreak>0){ s.waveBreak--; return; }
    spawnWave(s);
    if(s.wave%C.FLYPAST_EVERY===0){
      const fromLeft=Math.random()<0.5;
      s.flypast={ x: fromLeft?-30:C.cols*C.cell+30, y: 30, vx:(fromLeft?1:-1)*2.2, pts:500, alive:true };
    }
  }
  function stepCentipede(s){
    for(const t of s.trains){
      const head=t.cells[0]; const nc=head.c+t.dir;
      const blocked = nc<0 || nc>=s.cols || s.mush[key(nc,head.r)];
      let nh;
      if(blocked){ nh={c:head.c, r:head.r+1}; t.dir=-t.dir; } else nh={c:nc, r:head.r};
      // Reaching the bottom row used to be an instant kill regardless of where
      // the player actually was — a centipede segment merely getting behind you
      // shouldn't be fatal. It just stays at the bottom row and keeps zigzagging;
      // only an actual touch (checked in the frame loop below) costs a chicken.
      if(nh.r>=s.rows-1) nh.r=s.rows-1;
      // Record where each slot was before the shift, so every segment carries its
      // own previous cell. The old render inferred it from the cell behind, which
      // has nothing to point at on a one-segment train — so single segments
      // teleported a whole cell per tick, and the more the flock was split the
      // jerkier the whole thing looked.
      const wasAt=t.cells.map(c=>({c:c.c,r:c.r}));
      t.cells.unshift(nh); t.cells.pop();
      t.cells.forEach((seg,i)=>{ const o=wasAt[i]||{c:seg.c,r:seg.r}; seg.pc=o.c; seg.pr=o.r; });
    }
    return s;
  }
  function segmentAt(s,c,r){ for(let ti=0;ti<s.trains.length;ti++){ const cells=s.trains[ti].cells; for(let si=0;si<cells.length;si++) if(cells[si].c===c&&cells[si].r===r) return {ti,si}; } return null; }
  function hitCell(s,c,r){
    const seg=segmentAt(s,c,r);
    if(seg){ const t=s.trains[seg.ti]; const before=t.cells.slice(0,seg.si), after=t.cells.slice(seg.si+1);
      s.mush[key(c,r)]=C.mushHp; const nt=[]; if(before.length) nt.push({cells:before,dir:t.dir}); if(after.length) nt.push({cells:after,dir:t.dir});
      s.trains.splice(seg.ti,1,...nt); s.score+=10; return "segment"; }
    const k=key(c,r); if(s.mush[k]){ s.mush[k]--; if(s.mush[k]<=0) delete s.mush[k]; s.score+=1; return "mushroom"; }
    return "miss";
  }
  window.__centipede={ newState, spawnWave, ensureCentipede, stepCentipede, segmentAt, hitCell, killPlayer, stepDeath, key, C };

  if(typeof document==="undefined") return;
  const $=(id)=>document.getElementById(id);
  const cv=$("game"), ctx=cv.getContext("2d"); const W=cv.width,H=cv.height, CELL=C.cell;
  // Hold the loop until the player asks for it (comment: Press Spacebar To Begin)
  const GATE = Arcade.startGate(cv, "Chickenpede");
  let s=newState(), best=0, input={left:false,right:false,up:false,down:false}, fireHeld=false, moveT=0;
  try{ best=parseInt(localStorage.getItem("centipede_best")||"0")||0; }catch(e){}

  function draw(){
    ctx.clearRect(0,0,W,H); ctx.fillStyle="#080a14"; ctx.fillRect(0,0,W,H);
    // The field is eggs rather than blocks — cracked shells show the damage.
    for(const k in s.mush){ const [c,r]=k.split(",").map(Number); const hp=s.mush[k];
      const x=c*CELL+CELL/2, y=r*CELL+CELL/2, w=CELL*0.30, h=CELL*0.40;
      ctx.fillStyle = hp>=3?"#f3ead7" : hp===2?"#ded2b8" : "#c2b393";
      ctx.beginPath();
      ctx.moveTo(x,y-h);
      ctx.bezierCurveTo(x+w*1.05,y-h*0.66, x+w*1.12,y+h*0.45, x,y+h);
      ctx.bezierCurveTo(x-w*1.12,y+h*0.45, x-w*1.05,y-h*0.66, x,y-h);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle="rgba(120,105,80,.55)"; ctx.lineWidth=1; ctx.stroke();
      if(hp<3){                                        // a crack once it is chipped
        ctx.strokeStyle="rgba(90,75,55,.8)"; ctx.beginPath();
        ctx.moveTo(x-w*0.6,y-h*0.1); ctx.lineTo(x-w*0.1,y+h*0.05);
        ctx.lineTo(x+w*0.3,y-h*0.25); if(hp<2) ctx.lineTo(x+w*0.8,y+h*0.1);
        ctx.stroke();
      }
      ctx.fillStyle="rgba(255,255,255,.5)";
      ctx.beginPath(); ctx.ellipse(x-w*0.35,y-h*0.4,w*0.22,h*0.2,-0.5,0,7); ctx.fill(); }
    // The centipede steps a whole cell at a time, which looked like it was
    // teleporting. Draw each segment part-way between where it was and where it
    // is, using the same tick counter the logic runs on — the simulation stays
    // exactly as it was, only the rendering is smoothed.
    // After a step cells[i] holds what cells[i-1] held, so a segment's previous
    // position is simply the cell behind it.
    const u=Math.min(1, s.tc/Math.max(1,s.tickEvery));
    for(const t of s.trains){
      for(let i=t.cells.length-1;i>=0;i--){
        // each segment now carries its own previous cell, so a one-segment train
        // glides the same as a long one instead of teleporting
        const cur=t.cells[i];
        const prev={ c: cur.pc==null?cur.c:cur.pc, r: cur.pr==null?cur.r:cur.pr };
        const x=(prev.c+(cur.c-prev.c)*u)*CELL+CELL/2;
        const y=(prev.r+(cur.r-prev.r)*u)*CELL+CELL/2;
        const rad=CELL/2-2;
        if(i===0){
          // the head is a chicken, facing the way the train is travelling
          ctx.save(); ctx.translate(x,y); ctx.scale(t.dir<0?-1:1,1);
          ctx.fillStyle="#c96f14";                                  // tail feathers
          ctx.beginPath(); ctx.moveTo(-rad*0.5,0); ctx.lineTo(-rad*1.5,-rad*0.7); ctx.lineTo(-rad*0.5,rad*0.5); ctx.closePath(); ctx.fill();
          ctx.fillStyle="#dc2626";                                  // comb
          ctx.beginPath(); ctx.arc(-rad*0.18,-rad*0.92,rad*0.24,0,7); ctx.arc(rad*0.14,-rad*1.02,rad*0.26,0,7); ctx.arc(rad*0.44,-rad*0.9,rad*0.22,0,7); ctx.fill();
          ctx.fillStyle="#ffcf5a"; ctx.beginPath(); ctx.arc(0,0,rad,0,7); ctx.fill();
          ctx.fillStyle="#fb923c";                                  // beak
          ctx.beginPath(); ctx.moveTo(rad*0.7,-rad*0.05); ctx.lineTo(rad*1.5,rad*0.2); ctx.lineTo(rad*0.7,rad*0.4); ctx.closePath(); ctx.fill();
          ctx.fillStyle="#dc2626"; ctx.beginPath(); ctx.arc(rad*0.66,rad*0.5,rad*0.2,0,7); ctx.fill();  // wattle
          ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(rad*0.3,-rad*0.28,rad*0.3,0,7); ctx.fill();
          ctx.fillStyle="#0b0c1a"; ctx.beginPath(); ctx.arc(rad*0.38,-rad*0.28,rad*0.15,0,7); ctx.fill();
          ctx.restore();
        } else {
          ctx.fillStyle="#f0616e";
          ctx.beginPath(); ctx.arc(x,y,rad,0,7); ctx.fill();
          ctx.fillStyle="#c9455a";
          ctx.beginPath(); ctx.arc(x,y,rad*0.55,0,7); ctx.fill();
        }
      }
    }
    // player
    // spacesuit chicken, worth a bonus if you can hit it — drawn from the
    // shared /mascots.js library (the "Flying" variant: jetpack + pack).
    if(s.flypast) Mascots.spacesuitChickenFlying(ctx, s.flypast.x, s.flypast.y, 11, s.flypast.vx);
    // glide from the previous cell to the current one over the same 5-tick move
    // window movePlayer() runs on, matching the centipede's own interpolation
    const pl=s.player, pu=Math.min(1, moveT/5);
    const ppc=pl.pc==null?pl.c:pl.pc, ppr=pl.pr==null?pl.r:pl.pr;
    let px=(ppc+(pl.c-ppc)*pu)*CELL, py=(ppr+(pl.r-ppr)*pu)*CELL;
    if(s.dying>0){ px+=(Math.random()-0.5)*6; py+=(Math.random()-0.5)*6; }   // death shake
    ctx.save(); if(s.dying>0) ctx.globalAlpha=0.5+0.5*Math.sin(s.dying*1.2);
    ctx.fillStyle="#22d3ee"; ctx.fillRect(px+3, py+3, CELL-6, CELL-6); ctx.fillStyle="#7de8ff"; ctx.fillRect(px+CELL/2-2, py+1, 4, 4);
    ctx.restore();
    if(s.dying>0){ const j=()=>(Math.random()-0.5)*4; ctx.fillStyle="#f43f5e"; ctx.font="bold 14px system-ui"; ctx.textAlign="center";
      ctx.fillText("CAUGHT!", px+CELL/2+j(), py-8+j()); }
    // the wave/restart title card — the number and the chickens you have left
    if(s.banner){
      ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillRect(0,H/2-30,W,60);
      ctx.fillStyle="#8ad48a"; ctx.font="bold 22px system-ui"; ctx.textAlign="center"; ctx.fillText(s.banner.title,W/2,H/2-4);
      ctx.fillStyle="#e6e6f0"; ctx.font="14px system-ui"; ctx.fillText(s.banner.sub,W/2,H/2+18); }
    if(s.bullet){ ctx.fillStyle="#fff"; ctx.fillRect(s.bullet.c*CELL+CELL/2-1, s.bullet.y-6, 3, 8); }
    ctx.strokeStyle="rgba(124,92,255,.3)"; ctx.beginPath(); ctx.moveTo(0,(C.rows-C.playerZone)*CELL); ctx.lineTo(W,(C.rows-C.playerZone)*CELL); ctx.stroke();
    if(s.over){ ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillRect(0,0,W,H); ctx.fillStyle="#f43f5e"; ctx.font="bold 22px system-ui"; ctx.textAlign="center"; ctx.fillText("GAME OVER",W/2,H/2-6); ctx.fillStyle="#e6e6f0"; ctx.font="14px system-ui"; ctx.fillText("Score "+s.score+"  ·  Best "+best,W/2,H/2+16); }
  }
  // Same fix as the centipede itself: record the cell the player is moving FROM
  // so draw() can glide toward the new cell instead of snapping a full cell on
  // the tick the move lands — that instant jump read as "not smooth".
  function movePlayer(){ const minR=C.rows-C.playerZone;
    s.player.pc=s.player.c; s.player.pr=s.player.r;
    if(input.left) s.player.c=Math.max(0,s.player.c-1); if(input.right) s.player.c=Math.min(C.cols-1,s.player.c+1);
    if(input.up) s.player.r=Math.max(minR,s.player.r-1); if(input.down) s.player.r=Math.min(C.rows-1,s.player.r+1); }
  function fire(){ if(!s.bullet && !s.over){ s.bullet={c:s.player.c, y:s.player.r*CELL, lastR:s.player.r}; } }
  function frame(){
    if(!GATE.open){ draw(); GATE.paint(); return requestAnimationFrame(frame); }
    if(!s.over){
      if(s.banner){ if(--s.banner.t<=0) s.banner=null; }
      else if(stepDeath(s)){ if(typeof Arcade!=="undefined" && s.dying===C.DEATH_FRAMES-1) Arcade.sfx.death(); }
      else {
        if(++moveT>=5){ moveT=0; movePlayer(); }
        if(fireHeld) fire();
        if(s.bullet){ s.bullet.y-=8; const r=Math.floor(s.bullet.y/CELL);
          if(r<0){ s.bullet=null; } else if(r!==s.bullet.lastR){ s.bullet.lastR=r; if(hitCell(s,s.bullet.c,r)!=="miss") s.bullet=null; } }
        if(++s.tc>=s.tickEvery){ s.tc=0; stepCentipede(s);
          for(const t of s.trains) for(const seg of t.cells) if(seg.c===s.player.c&&seg.r===s.player.r){ killPlayer(s); } }
        // the spacesuit chicken drifts across on every fifth wave; shoot it for a bonus
        if(s.flypast){
          s.flypast.x+=s.flypast.vx;
          if(s.bullet){
            const bx=s.bullet.c*CELL+CELL/2, by=s.bullet.y;
            if(Math.abs(bx-s.flypast.x)<16 && Math.abs(by-s.flypast.y)<14){
              s.score+=s.flypast.pts; s.bullet=null; s.flypast=null;
              $("msg").textContent="🚀 Space chicken! +500";
              if(typeof Arcade!=="undefined") Arcade.sfx.win();
            }
          }
          if(s.flypast && (s.flypast.x<-40 || s.flypast.x>W+40)) s.flypast=null;
        }
        const extras0=s.gotExtra; awardExtras(s);
        if(s.gotExtra>extras0){ $("msg").textContent="🐔 Extra chicken!"; if(typeof Arcade!=="undefined") Arcade.sfx.win(); }
        ensureCentipede(s);
      }
      if(typeof Arcade!=="undefined")Arcade.stats.record("centipede",s.score); if(s.over && s.score>best){ best=s.score; try{localStorage.setItem("centipede_best",String(best));}catch(e){} $("msg").textContent="Game over! Score "+s.score+"  ·  Best "+best; }
    }
    $("score").textContent=s.score; $("wave").textContent=s.wave; $("lives").textContent="🐔".repeat(Math.max(0,s.lives));
    draw(); requestAnimationFrame(frame);
  }
  document.querySelectorAll(".dpad button").forEach(b=>{ const d=b.getAttribute("data-d"); const on=(e)=>{e.preventDefault();input[d]=true;}; const off=(e)=>{e.preventDefault();input[d]=false;};
    b.addEventListener("touchstart",on,{passive:false}); b.addEventListener("touchend",off); b.addEventListener("mousedown",on); b.addEventListener("mouseup",off); b.addEventListener("mouseleave",off); });
  const fb=$("fire"); const fon=(e)=>{e.preventDefault();fireHeld=true;fire();}; const foff=(e)=>{e.preventDefault();fireHeld=false;};
  fb.addEventListener("touchstart",fon,{passive:false}); fb.addEventListener("touchend",foff); fb.addEventListener("mousedown",fon); fb.addEventListener("mouseup",foff); fb.addEventListener("mouseleave",foff);
  addEventListener("keydown",(e)=>{ const m={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down",a:"left",d:"right",w:"up",s:"down"}[e.key]; if(m){e.preventDefault();input[m]=true;} if(e.key===" "){e.preventDefault();fireHeld=true;fire();} });
  addEventListener("keyup",(e)=>{ const m={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down",a:"left",d:"right",w:"up",s:"down"}[e.key]; if(m)input[m]=false; if(e.key===" ")fireHeld=false; });
  cv.addEventListener("touchmove",(e)=>{ e.preventDefault(); const rct=cv.getBoundingClientRect(); const x=(e.touches[0].clientX-rct.left)*(W/rct.width), y=(e.touches[0].clientY-rct.top)*(H/rct.height);
    s.player.c=Math.max(0,Math.min(C.cols-1,Math.floor(x/CELL))); s.player.r=Math.max(C.rows-C.playerZone,Math.min(C.rows-1,Math.floor(y/CELL)));
    s.player.pc=s.player.c; s.player.pr=s.player.r;   // a drag is a direct placement, not a glide — snap the trail too
    fire(); },{passive:false});
  $("new").addEventListener("click",()=>{ s=newState(); $("msg").textContent="Shoot the centipede!"; });
  requestAnimationFrame(frame);
})();
</script>
<script src="/comments.js" defer></script>
  <script src="/fullscreen.js" defer></script>
</body>
</html>
