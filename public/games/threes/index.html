<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Threes — Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>3️⃣</text></svg>" />
  <style>
    :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;--grid:#232752;--empty:#2a2e56;}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
      background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.22),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.16),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;}
    .wrap{max-width:420px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;align-items:center;gap:14px}
    .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
    .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
    .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
    h1{margin:0;font-size:1.6rem;background:linear-gradient(120deg,#ef4444,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
    .top{display:flex;gap:12px;width:100%;align-items:stretch}
    .stat{flex:1;background:var(--panel);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:10px;text-align:center}
    .stat .label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    .stat .value{font-size:1.4rem;font-weight:700}
    .next{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
    .nt{width:34px;height:46px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1rem}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:var(--grid);border-radius:14px;padding:10px;width:100%;aspect-ratio:1;touch-action:none}
    .tile{background:var(--empty);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(1.1rem,6vw,2rem)}
    .status{min-height:1.2em;font-weight:600;color:#fde68a;text-align:center}
    .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:10px 24px;border-radius:999px;cursor:pointer}
    .hint{color:var(--muted);font-size:.8rem;text-align:center}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar"><a class="home" href="/">← Home</a><h1>3️⃣ Threes</h1><span style="width:56px"></span></div>
    <div class="top">
      <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">Best</div><div class="value" id="best">0</div></div>
      <div class="stat next"><div class="label">Next</div><div class="nt" id="next">1</div></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="status" id="status"></div>
    <button class="btn" id="new">New Game</button>
    <p class="hint">Arrows / WASD / swipe. 1 + 2 = 3, then equal whites merge (3+3=6…). Tiles slide just one step!</p>
  </div>
  <script src="/arcade.js"></script>
  <script>
  (function(){
    const N=4;
    const gridEl=document.getElementById("grid"),scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),statusEl=document.getElementById("status"),nextEl=document.getElementById("next");
    let board,next,over,best=+localStorage.getItem("threes_best")||0,tiles=[];
    bestEl.textContent=best;
    const color=(v)=>v===1?"#3b82f6":v===2?"#ef4444":v===0?"":"#f5f5fa";
    const textColor=(v)=>v>=3?"#15151f":"#fff";

    function canMerge(a,b){return (a===1&&b===2)||(a===2&&b===1)||(a>=3&&a===b);}
    function merged(a,b){return (a===1&&b===2)||(a===2&&b===1)?3:a+b;}
    // slide one line toward index 0; returns {line, moved}
    function slideLine(src){const line=src.slice();
      for(let i=0;i<N-1;i++){
        if(line[i]===0){if(line[i+1]!==0){line[i]=line[i+1];line[i+1]=0;shiftTail(line,i);return{line,moved:true};}continue;}
        if(canMerge(line[i],line[i+1])){line[i]=merged(line[i],line[i+1]);line[i+1]=0;shiftTail(line,i);return{line,moved:true};}
      }
      return{line,moved:false};}
    function shiftTail(line,from){for(let j=from+1;j<N-1;j++)line[j]=line[j+1];line[N-1]=0;}

    function getLine(dir,idx){const l=[];for(let k=0;k<N;k++){
      if(dir==="left")l.push(board[idx][k]);else if(dir==="right")l.push(board[idx][N-1-k]);
      else if(dir==="up")l.push(board[k][idx]);else l.push(board[N-1-k][idx]);}return l;}
    function setLine(dir,idx,line){for(let k=0;k<N;k++){
      if(dir==="left")board[idx][k]=line[k];else if(dir==="right")board[idx][N-1-k]=line[k];
      else if(dir==="up")board[k][idx]=line[k];else board[N-1-k][idx]=line[k];}}

    function move(dir){
      if(over)return;
      const changedLines=[];let any=false;
      for(let idx=0;idx<N;idx++){const {line,moved}=slideLine(getLine(dir,idx));if(moved){setLine(dir,idx,line);changedLines.push(idx);any=true;}}
      if(!any)return;
      // spawn next tile on opposite edge in a changed line
      const idx=changedLines[Math.floor(Math.random()*changedLines.length)];
      const edge=N-1;
      if(dir==="left")board[idx][edge]=next;else if(dir==="right")board[idx][0]=next;
      else if(dir==="up")board[edge][idx]=next;else board[0][idx]=next;
      next=genNext();nextEl.textContent=next;nextEl.style.background=color(next);nextEl.style.color=textColor(next);
      render();updateScore();
      if(!anyMove())gameOver();
    }
    function genNext(){const r=Math.random();return r<0.45?1:r<0.9?2:3;}
    function anyMove(){for(const d of["left","right","up","down"]){for(let idx=0;idx<N;idx++)if(slideLine(getLine(d,idx)).moved)return true;}return false;}
    function tileScore(v){if(v<3)return 0;let k=Math.round(Math.log2(v/3));return Math.pow(3,k+1);}
    function score(){let s=0;for(let r=0;r<N;r++)for(let c=0;c<N;c++)s+=tileScore(board[r][c]);return s;}
    function updateScore(){const s=score();scoreEl.textContent=s;if(typeof Arcade!=="undefined")Arcade.stats.record("threes",s); if(s>best){best=s;bestEl.textContent=best;localStorage.setItem("threes_best",best);}}

    function build(){gridEl.innerHTML="";tiles=[];for(let i=0;i<16;i++){const d=document.createElement("div");d.className="tile";gridEl.appendChild(d);tiles.push(d);}}
    function render(){for(let r=0;r<N;r++)for(let c=0;c<N;c++){const v=board[r][c],el=tiles[r*N+c];
      el.textContent=v||"";el.style.background=v?color(v):"var(--empty)";el.style.color=textColor(v);}}
    function newGame(){board=Array.from({length:N},()=>Array(N).fill(0));over=false;statusEl.textContent="";
      // seed 9 tiles
      const spots=[];for(let i=0;i<16;i++)spots.push(i);spots.sort(()=>Math.random()-0.5);
      for(let i=0;i<9;i++){const p=spots[i];board[Math.floor(p/N)][p%N]=genNext();}
      next=genNext();nextEl.textContent=next;nextEl.style.background=color(next);nextEl.style.color=textColor(next);
      render();updateScore();}
    function gameOver(){over=true;statusEl.textContent="No moves left — final score "+score()+".";}
    document.addEventListener("keydown",e=>{const m={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down",a:"left",d:"right",w:"up",s:"down"}[e.key];if(m){e.preventDefault();move(m);}});
    let ts=null;gridEl.addEventListener("touchstart",e=>ts={x:e.touches[0].clientX,y:e.touches[0].clientY},{passive:true});
    gridEl.addEventListener("touchend",e=>{if(!ts)return;const dx=e.changedTouches[0].clientX-ts.x,dy=e.changedTouches[0].clientY-ts.y;if(Math.abs(dx)<20&&Math.abs(dy)<20)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?"right":"left");else move(dy>0?"down":"up");ts=null;},{passive:true});
    document.getElementById("new").addEventListener("click",newGame);
    window.__threes={slideLine,canMerge,merged};
    build();newGame();
  })();
  </script>
  <script src="/comments.js" defer></script>
</body>
</html>
