<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tower of Hanoi — Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='60'>🗼</text></svg>" />
  <style>
    :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
      background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.22),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.16),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;}
    .wrap{max-width:460px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;align-items:center;gap:14px}
    .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
    .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
    .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
    h1{margin:0;font-size:1.5rem;background:linear-gradient(120deg,#eab308,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
    .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
    .stat{background:var(--panel);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:6px 14px;font-weight:700}
    .size{display:flex;gap:5px;background:var(--panel);padding:4px;border-radius:999px}
    .size button{background:transparent;border:none;color:var(--muted);padding:6px 10px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.85rem}
    .size button.active{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a}
    .pegs{display:flex;gap:8px;width:100%;height:240px;align-items:flex-end}
    .peg{flex:1;position:relative;height:100%;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;padding-bottom:8px}
    .peg::before{content:"";position:absolute;bottom:0;left:0;right:0;height:8px;background:#3a2f5f;border-radius:4px}
    .peg::after{content:"";position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:8px;height:calc(100% - 8px);background:#3a2f5f;border-radius:4px;z-index:0}
    .peg.sel::after{background:#34d399}
    .disk{height:22px;border-radius:6px;z-index:1;box-shadow:0 1px 3px rgba(0,0,0,.4)}
    .status{min-height:1.2em;font-weight:600;color:#fde68a;text-align:center}
    .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:9px 20px;border-radius:999px;cursor:pointer;font-size:.85rem}
    .hint{color:var(--muted);font-size:.8rem;text-align:center}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar"><a class="home" href="/">← Home</a><h1>🗼 Tower of Hanoi</h1><span style="width:56px"></span></div>
    <div class="bar">
      <div class="stat">Moves: <span id="moves">0</span></div>
      <div class="stat">Best possible: <span id="opt">7</span></div>
      <div class="size" id="size"><button data-n="3" class="active">3</button><button data-n="4">4</button><button data-n="5">5</button><button data-n="6">6</button><button data-n="7">7</button></div>
    </div>
    <div class="pegs" id="pegs"></div>
    <div class="status" id="status">Move all disks to the right peg.</div>
    <button class="btn" id="new">Restart</button>
    <p class="hint">Tap a peg to pick up its top disk, then tap a peg to drop it. A disk can't sit on a smaller one.</p>
  </div>
  <script>
  (function(){
    let N=3;
    const pegsEl=document.getElementById("pegs"),statusEl=document.getElementById("status"),movesEl=document.getElementById("moves"),optEl=document.getElementById("opt");
    const COLORS=["#ef4444","#f97316","#eab308","#22c55e","#22d3ee","#3b82f6","#a855f7"];
    let pegs,sel,moves,over;

    // 2^N-1 is the proven minimum move count for N-disk Towers of Hanoi
    // (shown to the player as the target to beat, in optEl).
    function reset(){pegs=[[],[],[]];for(let d=N;d>=1;d--)pegs[0].push(d);sel=null;moves=0;over=false;
      movesEl.textContent=0;optEl.textContent=Math.pow(2,N)-1;statusEl.textContent="Move all disks to the right peg.";render();}
    function top(p){return pegs[p][pegs[p].length-1];}
    // Tap-to-select, tap-again-to-move (no drag). Tapping the same peg
    // twice deselects. Tapping a DIFFERENT peg while one's already
    // selected either completes the move (if legal — that peg is empty or
    // its top disk is bigger than the one being moved) or, if the move
    // would be illegal (landing a bigger disk on a smaller one), just
    // switches the selection to that peg instead of doing nothing — lets
    // the player redirect a move without an extra tap to deselect first.
    function click(p){
      if(over)return;
      if(sel===null){if(pegs[p].length===0)return;sel=p;render();return;}
      if(sel===p){sel=null;render();return;}
      const d=top(sel);
      if(pegs[p].length===0||top(p)>d){pegs[p].push(pegs[sel].pop());moves++;movesEl.textContent=moves;sel=null;render();check();}
      else{sel=p;render();}
    }
    function check(){if(pegs[2].length===N){over=true;const opt=Math.pow(2,N)-1;
      statusEl.textContent=moves===opt?`🏆 Perfect! Solved in the minimum ${moves} moves!`:`🎉 Solved in ${moves} moves (best: ${opt}).`;}}
    function render(){
      pegsEl.innerHTML="";
      for(let p=0;p<3;p++){const pe=document.createElement("div");pe.className="peg"+(sel===p?" sel":"");pe.addEventListener("click",()=>click(p));
        pegs[p].slice().reverse().forEach(d=>{const dk=document.createElement("div");dk.className="disk";dk.style.width=(30+d/N*65)+"%";dk.style.background=COLORS[(d-1)%COLORS.length];pe.appendChild(dk);});
        pegsEl.appendChild(pe);}
    }
    document.querySelectorAll("#size button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("#size button").forEach(x=>x.classList.remove("active"));b.classList.add("active");N=+b.dataset.n;reset();}));
    document.getElementById("new").addEventListener("click",reset);
    reset();
  })();
  </script>
  <script src="/comments.js" defer></script>
  <script src="/fullscreen.js" defer></script>
</body>
</html>
