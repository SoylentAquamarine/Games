<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Chixxon — Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>🐔</text></svg>" />
<style>
  :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
    background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.2),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.14),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;touch-action:none;}
  .wrap{max-width:640px;margin:0 auto;padding:14px 12px 30px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
  .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
  .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
  h1{margin:0;font-size:1.3rem;background:linear-gradient(120deg,#8ad48a,#ffcf5a);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hud{width:100%;display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
  .hud b{color:var(--text)}
  canvas{width:min(96vw,560px);height:auto;border-radius:10px;border:2px solid #2a2f55;background:#12305a;touch-action:none}
  .msg{min-height:1.3em;font-weight:800;text-align:center}
  .controls{display:flex;gap:16px;align-items:center;justify-content:center;width:100%;margin-top:2px}
  .dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,40px);gap:4px}
  .dpad button{background:var(--panel);border:1px solid rgba(255,255,255,.14);color:var(--text);border-radius:9px;font-size:1.1rem;cursor:pointer;user-select:none;touch-action:none}
  .dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .r{grid-area:2/3}.dpad .d{grid-area:3/2}
  .fire{width:76px;height:76px;border-radius:50%;background:linear-gradient(120deg,#eab308,#f97316);border:none;color:#0b0c1a;font-size:1.6rem;font-weight:800;cursor:pointer;user-select:none;touch-action:none}
  .hint{font-size:.78rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="home" href="/">← Home</a><h1>🐔 Chixxon</h1><button class="home" id="new">New Game</button></div>
  <div class="hud"><span>Score: <b id="score">0</b></span><span>Stage: <b id="stage">1</b></span><span id="lives">🐔🐔🐔</span></div>
  <canvas id="game" width="640" height="480"></canvas>
  <div class="msg" id="msg">Up/Down = altitude, Left/Right = strafe, Space = shoot. Watch your shadow.</div>
  <div class="controls">
    <div class="dpad">
      <button class="u" data-k="up">▲</button><button class="l" data-k="left">◀</button>
      <button class="r" data-k="right">▶</button><button class="d" data-k="down">▼</button>
    </div>
    <button class="fire" data-k="fire">🔫</button>
  </div>
  <p class="hint">Fly high to clear walls, dive low to duck under overhangs and snipe ground turrets. Ram or shoot enemy fliers. Reach the fortress cannon to clear the stage.</p>
</div>
<script src="/arcade.js"></script>
<script>
(function(){
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  const rnd=(n)=>Math.floor(Math.random()*n);
  const C={
    W:640, H:480, GROUND_Y:340, SKY_Y:120,
    PLAYER_X_MIN:70, PLAYER_X_MAX:260, PLAYER_SPEED:3, ALT_SPEED:0.02,
    WALL_CLEAR:0.55, TUNNEL_CLEAR:0.38,
    BULLET_SPEED:9, SHOT_COOLDOWN:14,
    SCROLL_BASE:2.6, SPAWN_GAP_BASE:130, STAGE_DIST:3600,
    HP:3, LIVES:3, INV_FRAMES:80, DEAD_FRAMES:120,
    BOSS_HP:12,
  };
  // Admin-tunable difficulty knobs — see /admin/games/?game=chixxon.
  // Same pattern as kaboom (see its HANDOFF.md): explicit allowlist, only
  // numeric values, safe no-op with no localStorage (headless tests).
  (function(){ try{
    const allow=["LIVES","HP","SCROLL_BASE","SPAWN_GAP_BASE","BOSS_HP"];
    const o=JSON.parse(localStorage.getItem("chixxon_config")||"{}");
    for(const k of allow) if(typeof o[k]==="number") C[k]=o[k];
  }catch(_){} })();
  function screenY(alt){ return C.GROUND_Y - alt*(C.GROUND_Y-C.SKY_Y); }

  // Splashes are plain data — shaped exactly like Arcade.splash's objects so the
  // DOM layer can hand them straight to Arcade.splash.draw() without a second
  // rendering path, but the pure logic below never touches Arcade itself.
  function mkSplash(kind,title,sub,frames){ return { kind, title, sub:sub||"", life:frames||120, max:frames||120 }; }

  function newState(){
    return {
      player:{ x:150, alt:0.2, hp:C.HP, lives:C.LIVES, inv:C.INV_FRAMES, shotT:0 },
      bullets:[], enemyShots:[], obstacles:[], flyers:[], pickups:[],
      dist:0, stage:1, score:0, over:false, dead:false, deadT:0,
      boss:null, spawnT:70, scroll:C.SCROLL_BASE,
      splash: mkSplash("wave","STAGE 1","Fly safe, chicken",120),
    };
  }

  function fireAimed(s, fromX, fromY){
    const p=s.player, py=screenY(p.alt);
    const dx0=p.x-fromX, dy0=py-fromY, len=Math.hypot(dx0,dy0)||1, sp=4.2;
    s.enemyShots.push({ x:fromX, y:fromY, dx:dx0/len*sp, dy:dy0/len*sp });
  }
  function hit(s){
    if(s.player.inv>0 || s.dead || s.over) return;
    s.player.hp--; s.player.inv=C.INV_FRAMES;
    if(s.player.hp<=0){
      s.player.lives--;
      if(s.player.lives<=0){ s.over=true; s.splash=mkSplash("death","GAME OVER","Score "+s.score,160); }
      else { s.dead=true; s.deadT=C.DEAD_FRAMES; s.splash=mkSplash("death","YOU CRASHED","Lives left: "+s.player.lives,C.DEAD_FRAMES); }
    }
  }
  function respawn(s){
    const p=s.player;
    p.hp=C.HP; p.alt=0.2; p.x=150; p.inv=C.INV_FRAMES; p.shotT=0;
    s.dead=false;
    // clear anything sitting right on the respawn point so it isn't an instant re-hit
    s.obstacles=s.obstacles.filter(o=>o.x<p.x-60||o.x>p.x+120);
    s.enemyShots=[];
    s.flyers=s.flyers.filter(f=>Math.abs(f.x-p.x)>100);
  }
  function nextStage(s){
    s.stage++; s.dist=0; s.scroll=C.SCROLL_BASE+(s.stage-1)*0.3;
    s.obstacles=[]; s.flyers=[]; s.enemyShots=[]; s.pickups=[]; s.spawnT=70; s.boss=null;
    s.splash=mkSplash("wave","STAGE "+s.stage,"Fly safe, chicken",120);
  }
  function spawnObstacle(s){
    const r=Math.random();
    if(r<0.28) s.obstacles.push({type:"wall",x:C.W+20,passed:false});
    else if(r<0.5) s.obstacles.push({type:"tunnel",x:C.W+20,passed:false});
    else if(r<0.78) s.obstacles.push({type:"turret",x:C.W+20,alive:true,shotT:60+rnd(60)});
    else s.flyers.push({x:C.W+30,alt:0.2+Math.random()*0.6,vx:-(s.scroll+2.2),vAlt:(Math.random()<0.5?1:-1)*0.006,alive:true});
  }
  function spawnBoss(s){
    s.boss={x:C.W-140,alt:0.4,hp:C.BOSS_HP,maxhp:C.BOSS_HP,shotT:70,t:0,dead:false};
    s.obstacles=[]; s.flyers=[];
    s.splash=mkSplash("wave","STAGE "+s.stage+" BOSS","Fortress Cannon",150);
  }

  function step(s, input){
    if(s.over) return s;
    if(s.splash){ s.splash.life--; if(s.splash.life<=0) s.splash=null; return s; }
    if(s.dead){ s.deadT--; if(s.deadT<=0) respawn(s); return s; }

    const p=s.player;
    if(input.left) p.x-=C.PLAYER_SPEED; if(input.right) p.x+=C.PLAYER_SPEED;
    if(input.up) p.alt+=C.ALT_SPEED; if(input.down) p.alt-=C.ALT_SPEED;
    p.x=clamp(p.x,C.PLAYER_X_MIN,C.PLAYER_X_MAX); p.alt=clamp(p.alt,0,1);
    if(p.inv>0) p.inv--;
    if(p.shotT>0) p.shotT--;
    if(input.fire && p.shotT<=0){ s.bullets.push({x:p.x+22,alt:p.alt,dead:false}); p.shotT=C.SHOT_COOLDOWN; }

    s.dist+=s.scroll; s.score+=Math.floor(0.2*s.scroll);

    if(!s.boss){
      s.spawnT--;
      if(s.spawnT<=0){ spawnObstacle(s); s.spawnT=Math.max(46,C.SPAWN_GAP_BASE-s.stage*6-rnd(30)); }
      if(s.dist>=C.STAGE_DIST) spawnBoss(s);
    }

    // ground obstacles: walls need altitude, tunnels need to duck, turrets snipe back
    for(const o of s.obstacles){
      o.x-=s.scroll;
      if(o.type==="turret" && o.alive){
        o.shotT--; if(o.shotT<=0){ fireAimed(s,o.x,C.GROUND_Y); o.shotT=70+rnd(50); }
      }
      if(!o.passed && o.x<p.x+14 && o.x>p.x-14){
        o.passed=true;
        if(o.type==="wall" && p.alt<C.WALL_CLEAR) hit(s);
        else if(o.type==="tunnel" && p.alt>C.TUNNEL_CLEAR) hit(s);
      }
    }
    s.obstacles=s.obstacles.filter(o=>o.x>-50);

    // flyers weave up and down, hurt on touch, killable by ramming or shooting
    for(const f of s.flyers){
      if(!f.alive) continue;
      f.x+=f.vx; f.alt+=f.vAlt; if(f.alt>0.92||f.alt<0.05) f.vAlt=-f.vAlt;
      if(Math.abs(f.x-p.x)<20 && Math.abs(f.alt-p.alt)<0.10){ f.alive=false; hit(s); }
    }
    s.flyers=s.flyers.filter(f=>f.alive && f.x>-50);

    // fuel pickups: heal a point of damage
    for(const u of s.pickups){
      if(u.taken) continue; u.x-=s.scroll;
      if(Math.abs(u.x-p.x)<18 && Math.abs(u.alt-p.alt)<0.09){ u.taken=true; p.hp=Math.min(C.HP,p.hp+1); s.score+=150; }
    }
    s.pickups=s.pickups.filter(u=>!u.taken && u.x>-40);
    if(!s.boss && !s.dead && Math.random()<0.006) s.pickups.push({x:C.W+20,alt:0.2+Math.random()*0.6,taken:false});

    for(const b of s.bullets) b.x+=C.BULLET_SPEED;

    // bullets vs turrets (only while flying low — you have to dive to snipe them),
    // flyers, and the boss
    for(const b of s.bullets){
      if(b.dead) continue;
      for(const o of s.obstacles){ if(o.type==="turret" && o.alive && Math.abs(b.x-o.x)<18 && b.alt<0.18){ o.alive=false; b.dead=true; s.score+=300; } }
      if(b.dead) continue;
      for(const f of s.flyers){ if(f.alive && Math.abs(b.x-f.x)<16 && Math.abs(b.alt-f.alt)<0.10){ f.alive=false; b.dead=true; s.score+=150; } }
      if(b.dead) continue;
      if(s.boss && !s.boss.dead && Math.abs(b.x-s.boss.x)<26 && Math.abs(b.alt-s.boss.alt)<0.12){
        s.boss.hp--; b.dead=true;
        if(s.boss.hp<=0){ s.boss.dead=true; s.score+=2000; nextStage(s); }
      }
    }
    s.bullets=s.bullets.filter(b=>!b.dead && b.x<C.W+30);

    for(const es of s.enemyShots){ es.x+=es.dx; es.y+=es.dy; }
    s.enemyShots=s.enemyShots.filter(es=>{
      if(!s.dead && Math.abs(es.x-p.x)<14 && Math.abs(es.y-screenY(p.alt))<14){ hit(s); return false; }
      return es.x>-30 && es.x<C.W+30 && es.y>-30 && es.y<C.H+30;
    });

    if(s.boss && !s.boss.dead){
      const b=s.boss;
      b.t++; b.alt=0.35+0.18*Math.sin(b.t/45);
      b.shotT--; if(b.shotT<=0){ fireAimed(s,b.x,screenY(b.alt)); b.shotT=50+rnd(30); }
    }
    return s;
  }

  window.__chixxon={ newState, step, spawnObstacle, spawnBoss, nextStage, hit, respawn, screenY, mkSplash, C };

  // ---- rendering / wiring --------------------------------------------------
  if(typeof document==="undefined") return;
  const $=(id)=>document.getElementById(id);
  const cv=$("game"), ctx=cv.getContext("2d");
  if(typeof Arcade!=="undefined" && Arcade.fitScreen) Arcade.fitScreen(cv,"large");
  const GATE=(typeof Arcade!=="undefined" && Arcade.startGate)?Arcade.startGate(cv,"Chixxon"):{open:true,paint:()=>{}};

  let s=newState(), best=0;
  try{ best=parseInt(localStorage.getItem("chixxon_best")||"0")||0; }catch(e){}
  const keyState={up:false,down:false,left:false,right:false,fire:false};

  function drawShip(p){
    const x=p.x, y=screenY(p.alt), flick=p.inv>0 && Math.floor(p.inv/4)%2===0;
    if(flick) return;
    // shadow on the ground plane — shifts with altitude so you can judge height
    const shx=x+p.alt*36, shy=C.GROUND_Y+6;
    ctx.fillStyle="rgba(0,0,0,.35)"; ctx.beginPath(); ctx.ellipse(shx,shy,18,6,0,0,7); ctx.fill();
    // the chicken bomber
    ctx.save(); ctx.translate(x,y);
    ctx.fillStyle="#c96f14"; ctx.beginPath(); ctx.moveTo(-22,0); ctx.lineTo(-38,-10); ctx.lineTo(-20,8); ctx.closePath(); ctx.fill(); // tail
    ctx.fillStyle="#facc15"; ctx.beginPath(); ctx.ellipse(0,0,20,12,0,0,7); ctx.fill(); // body
    ctx.fillStyle="#fde68a"; ctx.beginPath(); ctx.ellipse(-2,10,16,6,0,0,7); ctx.fill(); // wing, swept below
    ctx.fillStyle="#dc2626"; ctx.beginPath(); ctx.arc(16,-8,5,0,7); ctx.arc(22,-6,5,0,7); ctx.fill(); // comb
    ctx.fillStyle="#fb923c"; ctx.beginPath(); ctx.moveTo(20,-2); ctx.lineTo(32,0); ctx.lineTo(20,4); ctx.closePath(); ctx.fill(); // beak
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(10,-4,4,0,7); ctx.fill();
    ctx.fillStyle="#0b0c1a"; ctx.beginPath(); ctx.arc(12,-4,2,0,7); ctx.fill();
    ctx.restore();
  }
  function drawObstacle(o){
    if(o.type==="wall"){
      const gapTop=screenY(C.WALL_CLEAR);
      ctx.fillStyle="#5a5f7a"; ctx.fillRect(o.x-13,gapTop,26,C.GROUND_Y-gapTop+10);
      ctx.fillStyle="#7a7fa0"; ctx.fillRect(o.x-13,gapTop,26,6);
    } else if(o.type==="tunnel"){
      const gapBot=screenY(C.TUNNEL_CLEAR);
      ctx.fillStyle="#5a5f7a"; ctx.fillRect(o.x-15,C.SKY_Y-20,30,gapBot-(C.SKY_Y-20));
      ctx.fillStyle="#7a7fa0"; ctx.fillRect(o.x-15,gapBot-6,30,6);
    } else if(o.type==="turret"){
      ctx.fillStyle=o.alive?"#3a5f3a":"#3a3a3a"; ctx.beginPath(); ctx.arc(o.x,C.GROUND_Y+2,12,Math.PI,0); ctx.fill();
      ctx.fillStyle=o.alive?"#5a8a5a":"#5a5a5a"; ctx.fillRect(o.x-3,C.GROUND_Y-14,20,6);
    }
  }
  function drawFlyer(f){
    ctx.save(); ctx.translate(f.x,screenY(f.alt));
    ctx.fillStyle="#8b5a2b"; ctx.beginPath(); ctx.ellipse(0,0,13,8,0,0,7); ctx.fill();
    ctx.fillStyle="#dc2626"; ctx.beginPath(); ctx.arc(-9,-5,3,0,7); ctx.fill();
    ctx.fillStyle="#fb923c"; ctx.beginPath(); ctx.moveTo(-13,-1); ctx.lineTo(-20,0); ctx.lineTo(-13,3); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function drawBoss(b){
    const y=screenY(b.alt), flash=Math.floor(b.t/3)%4===0 && b.hp<C.BOSS_HP;
    ctx.fillStyle="rgba(0,0,0,.35)"; ctx.beginPath(); ctx.ellipse(b.x,C.GROUND_Y+6,42,10,0,0,7); ctx.fill();
    ctx.fillStyle=flash?"#fff":"#7a2a2a"; ctx.fillRect(b.x-40,y-24,80,48);
    ctx.fillStyle="#5a1e1e"; ctx.fillRect(b.x-46,y+18,92,14);
    ctx.fillStyle="#241a12"; ctx.beginPath(); ctx.arc(b.x,y,14,0,7); ctx.fill();
    ctx.fillStyle="#3a3a3a"; ctx.fillRect(b.x+8,y-6,30,12);
    const bw=90; ctx.fillStyle="rgba(0,0,0,.5)"; ctx.fillRect(b.x-bw/2,y-46,bw,6);
    ctx.fillStyle="#e0533e"; ctx.fillRect(b.x-bw/2,y-46,bw*(b.hp/b.maxhp),6);
  }
  function draw(){
    const g=ctx.createLinearGradient(0,0,0,C.GROUND_Y); g.addColorStop(0,"#12305a"); g.addColorStop(1,"#3b6ea5");
    ctx.fillStyle=g; ctx.fillRect(0,0,C.W,C.GROUND_Y);
    ctx.fillStyle="#2f6b34"; ctx.fillRect(0,C.GROUND_Y,C.W,C.H-C.GROUND_Y);
    // scrolling fortress-floor stripes sell forward motion
    const off=(s.dist*1.4)%40;
    ctx.strokeStyle="rgba(0,0,0,.15)"; ctx.lineWidth=2;
    for(let x=-40+off%40; x<C.W; x+=40){ ctx.beginPath(); ctx.moveTo(x,C.GROUND_Y); ctx.lineTo(x-16,C.H); ctx.stroke(); }

    for(const o of s.obstacles) drawObstacle(o);
    for(const u of s.pickups){ ctx.font="18px serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("🌽",u.x,screenY(u.alt)); }
    for(const f of s.flyers) drawFlyer(f);
    if(s.boss && !s.boss.dead) drawBoss(s.boss);
    ctx.fillStyle="#fde68a"; for(const b of s.bullets){ ctx.beginPath(); ctx.ellipse(b.x,screenY(b.alt),6,3,0,0,7); ctx.fill(); }
    ctx.fillStyle="#f43f5e"; for(const es of s.enemyShots){ ctx.beginPath(); ctx.arc(es.x,es.y,4,0,7); ctx.fill(); }
    drawShip(s.player);

    if(s.splash && typeof Arcade!=="undefined" && Arcade.splash) Arcade.splash.draw(ctx,C.W,C.H,s.splash);
    if(s.over){ ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillRect(0,0,C.W,C.H); }
  }
  function hud(){
    $("score").textContent=s.score; $("stage").textContent=s.stage;
    let h=""; for(let i=0;i<C.LIVES;i++) h+=i<s.player.lives?"🐔":"💀";
    $("lives").textContent=h;
  }
  function frame(){
    if(!GATE.open){ draw(); GATE.paint(); return requestAnimationFrame(frame); }
    const prevScore=s.score, prevLives=s.player.lives, prevStage=s.stage, prevBulletCount=s.bullets.length;
    step(s, keyState);
    if(typeof Arcade!=="undefined"){
      if(s.bullets.length>prevBulletCount) Arcade.sfx.shoot();
      if(s.player.lives<prevLives) Arcade.sfx.death();
      else if(s.score>prevScore) Arcade.sfx.hit();
      if(s.stage>prevStage) Arcade.sfx.win();
      Arcade.stats.record("chixxon", s.score);
      if(s.over && s.score>best){ best=s.score; try{localStorage.setItem("chixxon_best",String(best));}catch(e){} }
    }
    if(s.over){ $("msg").textContent="🐔 Shot down! Score "+s.score+(best?"  ·  Best "+best:"")+". New Game to retry."; }
    draw(); hud(); requestAnimationFrame(frame);
  }

  const map={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",w:"up",s:"down",a:"left",d:"right"};
  document.addEventListener("keydown",e=>{ if(map[e.key]){ e.preventDefault(); keyState[map[e.key]]=true; } if(e.key===" "){ e.preventDefault(); keyState.fire=true; } });
  document.addEventListener("keyup",e=>{ if(map[e.key]) keyState[map[e.key]]=false; if(e.key===" ") keyState.fire=false; });
  document.querySelectorAll("[data-k]").forEach(b=>{ const k=b.dataset.k;
    const on=(e)=>{ e.preventDefault(); keyState[k]=true; };
    const off=(e)=>{ e.preventDefault(); keyState[k]=false; };
    b.addEventListener("touchstart",on,{passive:false}); b.addEventListener("touchend",off,{passive:false});
    b.addEventListener("mousedown",on); b.addEventListener("mouseup",off); b.addEventListener("mouseleave",off);
  });
  $("new").addEventListener("click",()=>{ s=newState(); GATE.reset && GATE.reset(); $("msg").textContent="Up/Down = altitude, Left/Right = strafe, Space = shoot."; });

  requestAnimationFrame(frame);
})();
</script>
<script src="/comments.js" defer></script>
  <script src="/fullscreen.js" defer></script>
</body>
</html>
