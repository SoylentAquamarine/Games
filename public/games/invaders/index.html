<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chicken Invaders — Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>🐔</text></svg>" />
  <style>
    :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
      background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.22),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.16),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;}
    .wrap{max-width:460px;margin:0 auto;padding:16px 16px 30px;display:flex;flex-direction:column;align-items:center;gap:12px}
    .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
    .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
    .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
    h1{margin:0;font-size:1.4rem;background:linear-gradient(120deg,#4ade80,var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
    .scores{display:flex;gap:12px;width:100%}
    .stat{flex:1;background:var(--panel);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:8px;text-align:center}
    .stat .label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    .stat .value{font-size:1.3rem;font-weight:700}
    .board-wrap{position:relative;width:100%}
    canvas{width:100%;height:auto;display:block;background:#05060f;border:1px solid rgba(255,255,255,.08);border-radius:14px;touch-action:none}
    .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(15,16,32,.85);border-radius:14px;text-align:center}
    .overlay.hidden{display:none}
    .overlay h2{margin:0}.overlay p{margin:0;color:var(--muted)}
    .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:12px 28px;border-radius:999px;cursor:pointer}
    .pad{display:flex;gap:8px;width:100%;justify-content:center}
    .pad button{background:var(--panel);border:1px solid rgba(255,255,255,.14);color:var(--text);border-radius:10px;padding:14px 22px;font-size:1.2rem;cursor:pointer;user-select:none;touch-action:none;flex:1;max-width:120px}
    .hint{color:var(--muted);font-size:.82rem;text-align:center}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar"><a class="home" href="/">← Home</a><h1>🐔 Chicken Invaders</h1><span style="width:64px"></span></div>
    <div class="scores">
      <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">Lives</div><div class="value" id="lives">3</div></div>
      <div class="stat"><div class="label">Wave</div><div class="value" id="wave">1</div></div>
    </div>
    <div class="board-wrap">
      <canvas id="c" width="420" height="460"></canvas>
      <div class="overlay" id="ov"><h2 id="ot">Chicken Invaders</h2><p id="om">Defend Earth. Clear the flock.</p><button class="btn" id="start">Play</button></div>
    </div>
    <div class="pad">
      <button data-k="left">◀</button>
      <button data-k="fire">● FIRE</button>
      <button data-k="right">▶</button>
    </div>
    <p class="hint">← → move · Space fire · take cover behind the bunkers</p>
  </div>
  <script>
  (function(){
    const cv=document.getElementById("c"),ctx=cv.getContext("2d"),W=cv.width,H=cv.height;
    const scoreEl=document.getElementById("score"),livesEl=document.getElementById("lives"),waveEl=document.getElementById("wave");
    const ov=document.getElementById("ov"),ot=document.getElementById("ot"),om=document.getElementById("om"),startBtn=document.getElementById("start");
    const COLS=8,ROWS=4,IW=24,IH=16,GAPX=14,GAPY=14;
    let player,invaders,dir,drop,pBullet,eBullets,shields,score,lives,wave,running,raf,stepAcc,moveEvery;
    const keys={left:false,right:false};
    let best=+localStorage.getItem("invaders_best")||0;

    function makeInvaders(){const arr=[];const startX=40,startY=50;
      for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)arr.push({x:startX+c*(IW+GAPX),y:startY+r*(IH+GAPY),row:r,alive:true});
      return arr;}
    function makeShields(){const s=[];const ys=H-110;for(let b=0;b<4;b++){const bx=30+b*((W-60)/4)+((W-60)/4-56)/2;
      for(let i=0;i<7;i++)for(let j=0;j<4;j++)s.push({x:bx+i*8,y:ys+j*8,hp:2});}return s;}
    function reset(full){if(full){score=0;lives=3;wave=1;}
      player={x:W/2-16,y:H-30,w:32,h:12};
      invaders=makeInvaders();dir=1;drop=0;pBullet=null;eBullets=[];shields=makeShields();
      stepAcc=0;moveEvery=Math.max(10,42-wave*4);
      scoreEl.textContent=score;livesEl.textContent=lives;waveEl.textContent=wave;}
    function start(){reset(true);ov.classList.add("hidden");running=true;loop();}
    function loop(){if(!running)return;update();render();raf=requestAnimationFrame(loop);}
    function alive(){return invaders.filter(i=>i.alive);}
    function update(){
      // player
      if(keys.left)player.x-=4;if(keys.right)player.x+=4;
      player.x=Math.max(4,Math.min(W-player.w-4,player.x));
      // player bullet
      if(pBullet){pBullet.y-=7;if(pBullet.y<-10)pBullet=null;}
      // invader step (block move on a timer)
      stepAcc++;
      const live=alive();
      const speed=Math.max(6,moveEvery-(ROWS*COLS-live.length)*0.4);
      if(stepAcc>=speed){stepAcc=0;
        let edge=false;
        for(const iv of live){if((dir>0&&iv.x+IW>=W-6)||(dir<0&&iv.x<=6))edge=true;}
        if(edge){dir*=-1;live.forEach(iv=>iv.y+=12);}
        else live.forEach(iv=>iv.x+=dir*8);
        // random bomb from a column-bottom invader
        if(live.length&&Math.random()<0.5){const shooter=live[Math.floor(Math.random()*live.length)];
          eBullets.push({x:shooter.x+IW/2,y:shooter.y+IH,vy:3+wave*0.3});}
      }
      eBullets.forEach(b=>b.y+=b.vy);
      eBullets=eBullets.filter(b=>b.y<H+10);
      // collisions: player bullet vs invaders
      if(pBullet){for(const iv of live){if(pBullet.x>iv.x&&pBullet.x<iv.x+IW&&pBullet.y>iv.y&&pBullet.y<iv.y+IH){
        iv.alive=false;pBullet=null;score+=(ROWS-iv.row)*10+10;scoreEl.textContent=score;break;}}}
      // bullets vs shields
      const hitShield=(b,up)=>{for(const s of shields){if(s.hp>0&&b.x>s.x&&b.x<s.x+8&&b.y>s.y&&b.y<s.y+8){s.hp--;return true;}}return false;};
      if(pBullet&&hitShield(pBullet))pBullet=null;
      eBullets=eBullets.filter(b=>!hitShield(b));
      // enemy bullets vs player
      for(const b of eBullets){if(b.x>player.x&&b.x<player.x+player.w&&b.y>player.y&&b.y<player.y+player.h){eBullets=eBullets.filter(x=>x!==b);die();break;}}
      // invaders reach player line
      for(const iv of live){if(iv.y+IH>=player.y){die(true);break;}}
      // wave cleared
      if(live.length===0){wave++;waveEl.textContent=wave;reset(false);}
    }
    function fire(){if(!running||pBullet)return;pBullet={x:player.x+player.w/2,y:player.y-6};}
    function die(overrun){lives--;livesEl.textContent=lives;eBullets=[];
      if(lives<=0||overrun){running=false;cancelAnimationFrame(raf);if(score>best){best=score;localStorage.setItem("invaders_best",best);}
        ot.textContent=overrun&&lives>0?"Overrun!":"Game Over";om.textContent="Score "+score+(score>=best?" · best!":"");startBtn.textContent="Play again";ov.classList.remove("hidden");return;}
      player.x=W/2-16;}
    // Four chicken breeds — one per invader row.
    // 0 red hen · 1 brown hen · 2 yellow chick · 3 white rooster
    function drawChicken(x,y,w,h,style,flap){
      const cx=x+w/2, cy=y+h/2;
      const body=["#f43f5e","#fb923c","#facc15","#e9e9f2"][style];
      const shade=["#b91c1c","#c2620e","#ca9a06","#b9b9c8"][style];
      const combCol="#dc2626";
      // tail (breed-specific)
      ctx.fillStyle=shade;
      if(style===3){ ctx.beginPath(); ctx.moveTo(cx-w*0.24,cy); ctx.lineTo(cx-w*0.50,cy-h*0.42); ctx.lineTo(cx-w*0.44,cy+h*0.10); ctx.closePath(); ctx.fill(); }
      else if(style===0){ ctx.beginPath(); ctx.moveTo(cx-w*0.24,cy); ctx.lineTo(cx-w*0.44,cy-h*0.22); ctx.lineTo(cx-w*0.30,cy+h*0.14); ctx.closePath(); ctx.fill(); }
      else if(style===1){ ctx.fillRect(cx-w*0.42,cy-h*0.10,w*0.16,h*0.26); }
      else { ctx.fillRect(cx-w*0.34,cy-h*0.02,w*0.12,h*0.18); }
      // body
      ctx.fillStyle=body; ctx.beginPath(); ctx.ellipse(cx,cy+h*0.10,w*0.30,h*0.30,0,0,7); ctx.fill();
      // head
      const hx=cx+w*0.16, hy=cy-h*0.20, hr=(style===2?h*0.22:h*0.25);
      ctx.beginPath(); ctx.arc(hx,hy,hr,0,7); ctx.fill();
      // comb / tuft (breed-specific)
      ctx.fillStyle=combCol;
      if(style===0){ ctx.fillRect(hx-4,hy-hr-3,3,4); ctx.fillRect(hx,hy-hr-4,3,5); ctx.fillRect(hx+4,hy-hr-3,3,4); }
      else if(style===1){ ctx.fillRect(hx-2,hy-hr-2,6,3); }
      else if(style===2){ ctx.fillStyle="#f59e0b"; ctx.fillRect(hx,hy-hr-3,2,4); }
      else { ctx.fillRect(hx-4,hy-hr-4,3,5); ctx.fillRect(hx,hy-hr-6,3,7); ctx.fillRect(hx+4,hy-hr-4,3,5);
             ctx.fillRect(hx+1,hy+hr-1,3,4); } // rooster wattle
      // beak + eye
      ctx.fillStyle="#f59e0b"; ctx.fillRect(hx+hr-1,hy-1,4,3);
      ctx.fillStyle="#0b0c1a"; ctx.fillRect(hx+1,hy-3,2,2);
      // wing (flaps)
      ctx.fillStyle=shade; ctx.beginPath();
      ctx.ellipse(cx-w*0.04, cy+h*0.10+(flap?-2:2), w*0.15, h*0.17, flap?-0.4:0.3, 0, 7); ctx.fill();
      // legs
      ctx.fillStyle="#f59e0b"; ctx.fillRect(cx-2,cy+h*0.36,1.5,3); ctx.fillRect(cx+3,cy+h*0.36,1.5,3);
    }
    function render(){
      ctx.clearRect(0,0,W,H);
      // chickens — a different breed per row
      const flap=Math.floor(Date.now()/260)%2===0;
      invaders.forEach(iv=>{if(!iv.alive)return; drawChicken(iv.x,iv.y,IW,IH,iv.row%4,flap);});
      // shields
      shields.forEach(s=>{if(s.hp<=0)return;ctx.fillStyle=s.hp===2?"#4ade80":"#166534";ctx.fillRect(s.x,s.y,7,7);});
      // player
      ctx.fillStyle="#22d3ee";ctx.fillRect(player.x,player.y,player.w,player.h);ctx.fillRect(player.x+player.w/2-2,player.y-6,4,6);
      // bullets
      if(pBullet){ctx.fillStyle="#facc15";ctx.fillRect(pBullet.x-1.5,pBullet.y-8,3,10);}
      ctx.fillStyle="#f87171";eBullets.forEach(b=>ctx.fillRect(b.x-1.5,b.y,3,9));
    }
    document.addEventListener("keydown",e=>{const m={ArrowLeft:"left",ArrowRight:"right",a:"left",d:"right"}[e.key];
      if(m){e.preventDefault();keys[m]=true;}if(e.key===" "){e.preventDefault();fire();}});
    document.addEventListener("keyup",e=>{const m={ArrowLeft:"left",ArrowRight:"right",a:"left",d:"right"}[e.key];if(m)keys[m]=false;});
    document.querySelectorAll(".pad button").forEach(b=>{const k=b.dataset.k;
      const on=(e)=>{e.preventDefault();if(k==="fire")fire();else keys[k]=true;},off=(e)=>{e.preventDefault();if(k!=="fire")keys[k]=false;};
      b.addEventListener("touchstart",on,{passive:false});b.addEventListener("touchend",off,{passive:false});
      b.addEventListener("mousedown",on);b.addEventListener("mouseup",off);b.addEventListener("mouseleave",off);
    });
    startBtn.addEventListener("click",start);
    reset(true);render();
  })();
  </script>
  <script src="/comments.js" defer></script>
</body>
</html>
