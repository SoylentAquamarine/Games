<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Chicken Joust — Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>🐔</text></svg>" />
<style>
  :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;--bad:#f43f5e;}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
    background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.2),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.14),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;touch-action:none;}
  .wrap{max-width:690px;margin:0 auto;padding:14px 12px 30px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
  .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
  .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
  h1{margin:0;font-size:1.3rem;background:linear-gradient(120deg,#ffcf5a,#f0616e);-webkit-background-clip:text;background-clip:text;color:transparent}
  .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer}
  .hud{width:100%;max-width:690px;display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
  .hud b{color:var(--text)}
  canvas{width:100%;max-width:1128px;aspect-ratio:4/3;image-rendering:pixelated;border-radius:10px;border:2px solid #2a2f55;background:#08040f;touch-action:none}
  .msg{min-height:1.3em;font-weight:800;text-align:center}
  .ctl{display:flex;gap:10px;align-items:center}
  .cbtn{background:var(--panel);color:var(--text);border:1px solid rgba(255,255,255,.12);border-radius:12px;width:60px;height:52px;font-size:1.3rem;cursor:pointer;user-select:none}
  .cbtn:active{background:var(--accent);color:#0b0c1a}
  .flap{background:var(--accent-2);color:#0b0c1a;border:none;border-radius:12px;padding:0 24px;height:52px;font-weight:800;cursor:pointer;user-select:none}
  .hint{font-size:.78rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="home" href="/">← Home</a><h1>🐔 Chicken Joust</h1><button class="btn" id="new">New Game</button></div>
  <div class="hud"><span>Score: <b id="score">0</b></span><span>Wave: <b id="wave">1</b></span><span>Lives: <b id="lives">3</b></span></div>
  <canvas id="game" width="1128" height="846"></canvas>
  <div class="msg" id="msg">Flap to fly. Hit an enemy from ABOVE to win the joust!</div>
  <div class="ctl"><button class="cbtn" id="bl">◀</button><button class="flap" id="bf">FLAP</button><button class="cbtn" id="br">▶</button></div>
  <div class="hint">Space/↑ flap · ←/→ steer · win when you're higher on contact</div>
</div>
<script src="/arcade.js"></script>
<script>
(function(){
  // Scaled up 25% from 600x450. Speeds and gravity scale with the screen so the
  // arc of a flap covers the same fraction of the arena as before.
  // The game is authored in a base 752x564 design space, then scaled: the SCREEN
  // (canvas) is 50% bigger and the board + sprites + physics are 25% bigger, which
  // leaves more open flying room around a chunkier board.
  const BASE={ W:752, H:564, LAVA:549, PW:25, PH:23, TOL:10, LAND_BAND:16 };
  const SCREEN=1.5, BOARD=1.25;
  const SPRITE=2.0;      // hero + enemies 100% larger than the board scale
  // 10% less gravity from an earlier pass, then a further "reduce gravity
  // by 25%" player request on top of that (0.9 * 0.75 = 0.675 total).
  const GRAV_MUL=0.9*0.75;
  const C={ W:Math.round(BASE.W*SCREEN), H:Math.round(BASE.H*SCREEN),
            GRAV:0.401*BOARD*GRAV_MUL, FLAP:-6.77*BOARD, MOVE:0.564*BOARD, MAXVX:4.51*BOARD,
            PW:Math.round(BASE.PW*BOARD*SPRITE), PH:Math.round(BASE.PH*BOARD*SPRITE), TOL:BASE.TOL*BOARD,
            LAND_BAND:BASE.LAND_BAND*BOARD, LAVA:Math.round(BASE.H*SCREEN-(BASE.H-BASE.LAVA)*BOARD),
            SPAWN_FRAMES:48, INVULN_FRAMES:96, FLIP_CHANCE:0.004, SPAWN_GAP:45, EGG_CHANCE:0.25 };
  // Admin-tunable difficulty knobs — see /admin/games/?game=joust. Same
  // pattern as kaboom (see its HANDOFF.md): explicit allowlist, only
  // numeric values, safe no-op with no localStorage (headless tests).
  // Core flight feel (GRAV/FLAP/MOVE/MAXVX) is deliberately NOT exposed.
  (function(){ try{
    const allow=["SPAWN_FRAMES","INVULN_FRAMES","FLIP_CHANCE"];
    const o=JSON.parse(localStorage.getItem("joust_config")||"{}");
    for(const k of allow) if(typeof o[k]==="number") C[k]=o[k];
  }catch(_){} })();
  // Map a base-space point/box into the scaled world: content is centred
  // horizontally and anchored to the bottom of the taller canvas.
  const sx=(bx)=>C.W/2+(bx-BASE.W/2)*BOARD;
  const sy=(by)=>C.H-(BASE.H-by)*BOARD;
  const rov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
  const rect=(o)=>({x:o.x,y:o.y,w:C.PW,h:C.PH});
  function joustResult(ay, by){ if(ay < by-C.TOL) return "aWins"; if(by < ay-C.TOL) return "bWins"; return "bounce"; }
  const PLATS_BASE=[{x:0,y:470,w:150,h:13},{x:602,y:470,w:150,h:13},{x:313,y:376,w:125,h:13},{x:75,y:263,w:113,h:13},{x:564,y:263,w:113,h:13},{x:320,y:175,w:113,h:13}];
  const PLATS=PLATS_BASE.map(p=>({x:sx(p.x), y:sy(p.y), w:p.w*BOARD, h:p.h*BOARD}));
  // Player feedback: "we need several respawn nests." The two ground-level
  // side platforms (both wide, both at the same low elevation) are the
  // natural candidates — spawnOnNest() below picks one at random each time
  // instead of always using the same fixed platform.
  const NESTS=[0,1];
  function land(o){ o.onGround=false;
    for(const p of PLATS){
      if(!(o.x+C.PW>p.x && o.x<p.x+p.w)) continue;
      // settling onto the top of an island
      if(o.vy>=0 && o.y+C.PH>=p.y && o.y+C.PH<=p.y+C.LAND_BAND){ o.y=p.y-C.PH; o.vy=0; o.onGround=true; }
      // clipping the underside — bounce off instead of rising straight through it
      else if(o.vy<0 && o.y<p.y+p.h && o.y+C.PH>p.y+p.h){ o.y=p.y+p.h; o.vy=Math.abs(o.vy)*0.35; }
    }
    // nothing leaves the top of the screen
    if(o.y<0){ o.y=0; o.vy=Math.abs(o.vy)*0.35; }
  }
  function physics(o, input){
    if(input.flap) o.vy=C.FLAP;
    if(input.left){ o.vx=Math.max(-C.MAXVX,o.vx-C.MOVE); o.facing=-1; } if(input.right){ o.vx=Math.min(C.MAXVX,o.vx+C.MOVE); o.facing=1; }
    o.vy+=C.GRAV; o.x+=o.vx; o.y+=o.vy;
    if(o.x<-C.PW) o.x=C.W; if(o.x>C.W) o.x=-C.PW;   // screen wrap
    land(o);
    return o;
  }
  // Player feedback: "the enemies have to spawn one at a time at the
  // beginning of a level." Enemies used to all appear at once, already
  // airborne. They're now queued (s.enemyQueue) and released into
  // s.enemies one every SPAWN_GAP frames — see drainSpawnQueue(), called
  // from both the normal and hatching branches of step().
  function makeWave(s){ s.wave++; const n=2+s.wave; s.enemyQueue=[];
    for(let i=0;i<n;i++){ const d=(Math.random()<.5?-1:1); s.enemyQueue.push({x:40+Math.random()*(C.W-80),y:40+Math.random()*170,vx:d*1.5,vy:0,facing:d,dir:d,alive:true,flapT:Math.random()*30}); }
    s.enemies=[]; s.spawnQueueT=0;
  }
  function drainSpawnQueue(s){
    if(!s.enemyQueue || !s.enemyQueue.length) return;
    if(--s.spawnQueueT<=0){ s.enemies.push(s.enemyQueue.shift()); s.spawnQueueT=C.SPAWN_GAP; }
  }
  function waveClear(s){ return s.enemies.length===0 && (!s.enemyQueue || s.enemyQueue.length===0); }
  // Drop the player onto a random nest and start the hatch: a short animation
  // while she climbs out, then a longer safe window where nothing can hit her.
  function spawnOnNest(s){
    const nest=PLATS[NESTS[Math.floor(Math.random()*NESTS.length)]], p=s.player;
    p.x=nest.x+nest.w/2-C.PW/2; p.y=nest.y-C.PH;
    p.vx=0; p.vy=0; p.facing=1; p.onGround=true;
    p.spawning=C.SPAWN_FRAMES; p.invuln=C.SPAWN_FRAMES+C.INVULN_FRAMES;
  }
  function newState(){ const s={ player:{x:60,y:355,vx:0,vy:0,facing:1,onGround:false,spawning:0,invuln:0}, enemies:[], eggs:[], score:0, wave:0, lives:3, over:false }; makeWave(s); spawnOnNest(s); return s; }
  // Enemies cruise left-to-right or right-to-left and flap to stay aloft, flipping
  // now and then — they no longer home in on the player.
  function moveEnemy(s, e){
    e.flapT--;
    if(e.dir==null) e.dir = e.vx<0?-1:1;
    if(Math.random()<C.FLIP_CHANCE) e.dir=-e.dir;
    e.facing=e.dir;
    const ei={flap:e.flapT<=0, left:e.dir<0, right:e.dir>0};
    if(e.flapT<=0) e.flapT=18+Math.random()*22;
    physics(e, ei);
    if(e.y+C.PH>=C.LAVA) e.alive=false;
  }
  function step(s, input){
    if(s.over) return s;
    const p=s.player;
    if(p.invuln>0) p.invuln--;
    // Hatching: she sits in the nest, immune, while the world keeps moving.
    if(p.spawning>0){
      p.spawning--;
      drainSpawnQueue(s);
      for(const e of s.enemies){ if(e.alive) moveEnemy(s,e); }
      s.enemies=s.enemies.filter(e=>e.alive);
      if(waveClear(s)) makeWave(s);
      return s;
    }
    physics(p, input);
    if(p.y+C.PH>=C.LAVA){ die(s); return s; }
    const vulnerable = p.invuln<=0;          // the safe window ignores all jousts
    drainSpawnQueue(s);
    for(const e of s.enemies){ if(!e.alive) continue;
      moveEnemy(s,e);
      if(!e.alive) continue;
      if(vulnerable && rov(rect(p),rect(e))){ const r=joustResult(p.y, e.y);
        if(r==="aWins"){ e.alive=false; s.score+=500; p.vy=C.FLAP*0.6;
          // Player feedback: "when an enemy is killed, 25% chance it will
          // drop an egg." A dropped egg just falls (gravity, same as any
          // other object) — collect it by flying into it for a bonus, or
          // lose it to the lava like anything else that falls in.
          if(Math.random()<C.EGG_CHANCE) s.eggs.push({x:e.x,y:e.y,vy:0}); }
        else if(r==="bWins"){ die(s); return s; }
        else { p.vx=-p.vx; e.vx=-e.vx; p.x-=p.facing*4; } }
    }
    s.enemies=s.enemies.filter(e=>e.alive);
    for(const eg of s.eggs){ eg.vy+=C.GRAV*0.5; eg.y+=eg.vy; }
    s.eggs=s.eggs.filter(eg=>{
      if(eg.y>=C.LAVA) return false;
      if(vulnerable && rov({x:eg.x-6,y:eg.y-8,w:12,h:16},rect(p))){ s.score+=200; if(typeof Arcade!=="undefined")Arcade.sfx.coin(); return false; }
      return true;
    });
    if(waveClear(s)) makeWave(s);
    return s;
  }
  function die(s){ s.lives--; if(s.lives<=0){ s.over=true; } else { spawnOnNest(s); } }
  window.__joust={ newState, step, physics, joustResult, makeWave, moveEnemy, spawnOnNest, die, drainSpawnQueue, waveClear, PLATS, NESTS, C };

  if(typeof document==="undefined") return;
  const $=(id)=>document.getElementById(id);
  const cv=$("game"), ctx=cv.getContext("2d"); const W=C.W,H=C.H;
  // Hold the loop until the player asks for it (comment: Press Spacebar To Begin)
  const GATE = Arcade.startGate(cv, "Chicken Joust");
  let s=newState(), input={flap:false,left:false,right:false}, best=0, flapEdge=false;
  try{ best=parseInt(localStorage.getItem("joust_best")||"0")||0; }catch(e){}

  // The sprite is authored against the original 20-wide bird and scaled to the
  // current size, so the comb, beak and rider grow with the body instead of
  // staying tiny on a larger chicken.
  const ART_W=20;
  function bird(o, col){ const f=o.facing||1, K=C.PW/ART_W;
    ctx.save(); ctx.translate(o.x+C.PW/2,o.y+C.PH/2); ctx.scale(f*K,K);
    const P=ART_W;
    ctx.fillStyle=col; ctx.fillRect(-P/2,-2,P,8); ctx.fillRect(P/2-6,-8,7,8);
    const w=Math.sin(Date.now()/70)*5; ctx.fillStyle=col; ctx.fillRect(-P/2-4,-2+w,8,4);
    ctx.fillStyle="#dc2626"; ctx.fillRect(P/2-5,-11,2,3); ctx.fillRect(P/2-2,-12,2,4);   // comb
    ctx.fillStyle="#ffcf5a"; ctx.fillRect(P/2-2,-6,4,3);                                  // beak
    ctx.fillStyle="#dc2626"; ctx.fillRect(P/2-3,-3,2,3);                                  // wattle
    ctx.fillStyle="#0b0c1a"; ctx.fillRect(P/2-4,-6,2,2);                                  // eye
    ctx.fillStyle=col; ctx.beginPath();                                                    // tail feathers
    ctx.moveTo(-P/2,-2); ctx.lineTo(-P/2-7,-9); ctx.lineTo(-P/2,4); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#e6e6f0"; ctx.fillRect(-2,-9,7,6);                                      // rider
    ctx.restore(); }
  // The respawn hatch: an egg that cracks open, then the chick rises with a sparkle.
  function drawHatch(o){
    const cx=o.x+C.PW/2, cy=o.y+C.PH/2, t=1-o.spawning/C.SPAWN_FRAMES;   // 0..1
    ctx.save();
    ctx.strokeStyle="rgba(255,207,90,"+(0.7*(1-t)).toFixed(2)+")"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(cx,cy,7+t*16,0,7); ctx.stroke();
    ctx.restore();
    if(t<0.55){ // egg with a widening crack
      ctx.fillStyle="#f3ead7"; ctx.beginPath(); ctx.ellipse(cx,cy+2,9,12,0,0,7); ctx.fill();
      ctx.strokeStyle="#c9bda3"; ctx.lineWidth=1.5; ctx.beginPath();
      ctx.moveTo(cx-9,cy); ctx.lineTo(cx-3,cy-2-t*4); ctx.lineTo(cx+2,cy+1); ctx.lineTo(cx+9,cy-1); ctx.stroke();
    } else { // the chick emerging
      bird(o,"#22d3ee");
    }
  }
  function draw(){
    ctx.clearRect(0,0,W,H); ctx.fillStyle="#08040f"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#8a1e1e"; ctx.fillRect(0,C.LAVA,W,H-C.LAVA); ctx.fillStyle="#f0616e"; for(let x=0;x<W;x+=16) ctx.fillRect(x,C.LAVA+(Math.sin(Date.now()/200+x)*2),8,3);
    // Player feedback: "we need ground covering the lava" — a purely visual
    // dirt layer covering most of the lava strip (the death line itself,
    // C.LAVA, is unchanged); lava still peeks through in patches every
    // third segment so it still reads as a hazard, not solid floor.
    ctx.fillStyle="#4a3320";
    for(let x=0;x<W;x+=54){ if((Math.floor(x/54))%3!==2) ctx.fillRect(x,C.LAVA,50,H-C.LAVA); }
    for(let i=0;i<PLATS.length;i++){ const p=PLATS[i];
      if(NESTS.includes(i)){ // a respawn nest: a woven twig platform with a couple of eggs
        ctx.fillStyle="#6b4a2a"; ctx.fillRect(p.x,p.y,p.w,p.h);
        ctx.strokeStyle="#8a6238"; ctx.lineWidth=2;
        for(let x=p.x+4;x<p.x+p.w-2;x+=9){ ctx.beginPath(); ctx.moveTo(x,p.y+p.h); ctx.lineTo(x+6,p.y+1); ctx.stroke(); }
        ctx.fillStyle="#4a3320"; ctx.fillRect(p.x,p.y,p.w,3);
        ctx.fillStyle="#f3ead7"; const ex=p.x+p.w/2;
        for(const dx of [-9,3]){ ctx.beginPath(); ctx.ellipse(ex+dx,p.y-3,4,6,0,0,7); ctx.fill(); }
      } else { ctx.fillStyle="#5a4a6a"; ctx.fillRect(p.x,p.y,p.w,p.h); ctx.fillStyle="#7a6a8a"; ctx.fillRect(p.x,p.y,p.w,3); } }
    for(const e of s.enemies) if(e.alive) bird(e,"#f0616e");
    // eggs dropped by defeated enemies, falling and collectible for a bonus
    for(const eg of s.eggs){ ctx.fillStyle="#f3ead7"; ctx.beginPath(); ctx.ellipse(eg.x,eg.y,6,8,0,0,7); ctx.fill();
      ctx.strokeStyle="#c9bda3"; ctx.lineWidth=1; ctx.stroke(); }
    // the player: hatch animation while spawning, a blink through the safe window
    const pl=s.player;
    if(pl.spawning>0){ drawHatch(pl); }
    else if(pl.invuln<=0 || Math.floor(Date.now()/90)%2===0){ bird(pl,"#22d3ee"); }
    if(s.over){ ctx.fillStyle="rgba(0,0,0,.6)"; ctx.fillRect(0,0,W,H); ctx.fillStyle="#f43f5e"; ctx.font="bold 24px system-ui"; ctx.textAlign="center"; ctx.fillText("GAME OVER",W/2,H/2-6); ctx.fillStyle="#e6e6f0"; ctx.font="14px system-ui"; ctx.fillText("Score "+s.score+"  ·  Best "+best,W/2,H/2+16); }
  }
  function frame(){
    if(!GATE.open){ draw(); GATE.paint(); return requestAnimationFrame(frame); } input.flap=flapEdge; flapEdge=false;
    if(!s.over){ step(s,input);
      if(typeof Arcade!=="undefined")Arcade.stats.record("joust",s.score); if(s.over && s.score>best){ best=s.score; try{localStorage.setItem("joust_best",String(best));}catch(e){} $("msg").textContent="Fell! Score "+s.score+"  ·  Best "+best; } }
    $("score").textContent=s.score; $("wave").textContent=s.wave; $("lives").textContent=Math.max(0,s.lives); draw(); requestAnimationFrame(frame);
  }
  function flap(){ if(!s.over) flapEdge=true; }
  addEventListener("keydown",(e)=>{ if(e.key===" "||e.key==="ArrowUp"||e.key==="w"){ e.preventDefault(); flap(); } else if(e.key==="ArrowLeft"||e.key==="a") input.left=true; else if(e.key==="ArrowRight"||e.key==="d") input.right=true; });
  addEventListener("keyup",(e)=>{ if(e.key==="ArrowLeft"||e.key==="a") input.left=false; else if(e.key==="ArrowRight"||e.key==="d") input.right=false; });
  cv.addEventListener("touchstart",(e)=>{ e.preventDefault(); flap(); },{passive:false});
  const bindHold=(id,k)=>{ const el=$(id); const on=(e)=>{e.preventDefault();input[k]=true;}; const off=(e)=>{e.preventDefault();input[k]=false;};
    el.addEventListener("touchstart",on,{passive:false});el.addEventListener("touchend",off);el.addEventListener("mousedown",on);el.addEventListener("mouseup",off);el.addEventListener("mouseleave",off); };
  bindHold("bl","left"); bindHold("br","right");
  $("bf").addEventListener("touchstart",(e)=>{e.preventDefault();flap();},{passive:false}); $("bf").addEventListener("mousedown",flap);
  $("new").addEventListener("click",()=>{ s=newState(); input={flap:false,left:false,right:false}; $("msg").textContent="Flap to fly. Hit enemies from above!"; });
  requestAnimationFrame(frame);
})();
</script>
<script src="/comments.js" defer></script>
</body>
</html>
