<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chicken1 — Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='64'>🏎️</text></svg>" />
  <style>
    :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
      background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.2),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.14),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;touch-action:none;}
    .wrap{max-width:560px;margin:0 auto;padding:14px 12px 30px;display:flex;flex-direction:column;align-items:center;gap:10px}
    .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
    .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
    h1{margin:0;font-size:1.4rem;background:linear-gradient(120deg,#f43f5e,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
    .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer}
    .hud{width:100%;max-width:480px;display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
    .hud b{color:var(--text)}
    canvas{border-radius:10px;border:2px solid #2a2f55;background:#0a0c18;touch-action:none}
    .msg{min-height:1.3em;font-weight:800;text-align:center}
    .ctl{display:flex;gap:8px;align-items:center;margin-top:2px}
    .cbtn{background:var(--panel);color:var(--text);border:1px solid rgba(255,255,255,.1);border-radius:10px;width:58px;height:50px;font-size:1.3rem;cursor:pointer;user-select:none}
    .cbtn:active{background:var(--accent);color:#0b0c1a}
    .gas{background:var(--accent-2);color:#0b0c1a;border:none;border-radius:10px;padding:0 20px;height:50px;font-weight:800;cursor:pointer}
    .hint{font-size:.78rem;color:var(--muted);text-align:center}
  </style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="home" href="/">← Home</a><h1>🏎️ Chicken1</h1><button class="btn" id="new">New Game</button></div>
  <div class="hud"><span>Score: <b id="score">0</b></span><span>Speed: <b id="spd">0</b></span><span>Chickens: <b id="lives">🐔🐔🐔</b></span><span>Best: <b id="best">0</b></span></div>
  <canvas id="game" width="480" height="360"></canvas>
  <div class="msg" id="msg">Hold GAS, steer with ◀ ▶. Dodge the pack, stay on the tarmac!</div>
  <div class="ctl"><button class="cbtn" id="bl">◀</button><button class="gas" id="bg">GAS</button><button class="cbtn" id="bk">BRAKE</button><button class="cbtn" id="br">▶</button></div>
  <p class="hint">Arrows/A·D steer · ↑/Space/W gas · ↓/S brake. Off the tarmac and the grass drags you down. Hit a rival and you lose a chicken.</p>
</div>
<script src="/arcade.js"></script>
<script>
(function(){
  const C={ W:480, H:360, ROADW:264, CARW:26, CARH:40, PLAYER_Y:292,
    MAXSPD:9.2, ACCEL:0.075, BRAKE:0.26, DRAG:0.045, IDLE:1.1, OFFSPD:3.2, STEER:3.3,
    SPAWN_GAP:56, LIVES:3 };
  C.LEFT = (C.W-C.ROADW)/2; C.RIGHT = C.LEFT+C.ROADW;   // tarmac edges
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  const rov=(ax,ay,aw,ah,bx,by,bw,bh)=> ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;
  const RIVAL_COLORS=["#f43f5e","#22d3ee","#a3e635","#c084fc","#fb923c"];

  function newState(){ return {
    x: C.W/2 - C.CARW/2, speed:0, dist:0, scroll:0,
    traffic:[], spawnT:40, lives:C.LIVES, score:0, offroad:false, crashT:0, over:false }; }

  function spawnTraffic(s){
    const x = C.LEFT+6 + Math.random()*(C.ROADW-12-C.CARW);
    s.traffic.push({ x, y:-C.CARH-8, speed:1.6+Math.random()*3.4, hit:false,
      col:RIVAL_COLORS[Math.floor(Math.random()*RIVAL_COLORS.length)] });
  }
  function crash(s){ s.lives--; s.speed=0; s.crashT=48;
    if(s.lives<=0){ s.over=true; } }

  function step(s, input){
    if(s.over) return s;
    input=input||{};
    if(s.crashT>0){ s.crashT--; }
    // speed
    if(s.crashT>36){ /* stalled a beat after a crash */ }
    else if(input.gas) s.speed=Math.min(C.MAXSPD, s.speed+C.ACCEL);
    else if(input.brake) s.speed=Math.max(0, s.speed-C.BRAKE);
    else s.speed=Math.max(C.IDLE, s.speed-C.DRAG);
    // steering
    if(input.left)  s.x-=C.STEER;
    if(input.right) s.x+=C.STEER;
    s.x=clamp(s.x, 6, C.W-6-C.CARW);
    // off the tarmac drags you down
    const pcx=s.x+C.CARW/2;
    s.offroad = pcx < C.LEFT+4 || pcx > C.RIGHT-4;
    if(s.offroad) s.speed=Math.min(s.speed, C.OFFSPD);
    // advance
    s.dist+=s.speed; s.scroll+=s.speed;
    s.score=Math.floor(s.dist/18);
    // rivals drift toward you by the speed difference
    for(const t of s.traffic){ t.y += (s.speed - t.speed); }
    // spawn
    if(--s.spawnT<=0){ spawnTraffic(s); s.spawnT=Math.max(26, C.SPAWN_GAP - Math.floor(s.dist/1400)); }
    // collisions
    if(s.crashT<=0) for(const t of s.traffic){
      if(t.hit) continue;
      if(rov(s.x,C.PLAYER_Y,C.CARW,C.CARH, t.x,t.y,C.CARW,C.CARH)){ t.hit=true; crash(s); break; }
    }
    s.traffic=s.traffic.filter(t=>t.y<C.H+48 && !t.hit);
    return s;
  }

  window.__chicken1={ newState, step, spawnTraffic, crash, C };

  // ---- rendering / wiring --------------------------------------------------
  if(typeof document==="undefined"||!document.getElementById) return;
  const $=(id)=>document.getElementById(id);
  const cv=$("game"); if(!cv) return; const ctx=cv.getContext("2d");
  if(typeof Arcade!=="undefined"&&Arcade.fitScreen) Arcade.fitScreen(cv,"medium");
  let s=newState(), best=0, input={left:false,right:false,gas:false,brake:false}, GATE=null;
  try{ best=parseInt(localStorage.getItem("chicken1_best")||"0")||0; }catch(e){}

  function carArt(x,y,col,facingUp){
    ctx.save(); ctx.translate(x+C.CARW/2, y+C.CARH/2);
    // wings/tyres
    ctx.fillStyle="#0b0c1a"; ctx.fillRect(-C.CARW/2-2,-C.CARH*0.32,4,8); ctx.fillRect(C.CARW/2-2,-C.CARH*0.32,4,8);
    ctx.fillRect(-C.CARW/2-2,C.CARH*0.16,4,9); ctx.fillRect(C.CARW/2-2,C.CARH*0.16,4,9);
    // body
    ctx.fillStyle=col; ctx.beginPath();
    ctx.moveTo(0,-C.CARH/2); ctx.lineTo(C.CARW*0.28,-C.CARH*0.1); ctx.lineTo(C.CARW*0.30,C.CARH*0.42);
    ctx.lineTo(-C.CARW*0.30,C.CARH*0.42); ctx.lineTo(-C.CARW*0.28,-C.CARH*0.1); ctx.closePath(); ctx.fill();
    // rear wing
    ctx.fillStyle="#0b0c1a"; ctx.fillRect(-C.CARW*0.34,C.CARH*0.40,C.CARW*0.68,4);
    // cockpit chicken
    ctx.fillStyle="#facc15"; ctx.beginPath(); ctx.arc(0,-C.CARH*0.02,5,0,7); ctx.fill();
    ctx.fillStyle="#dc2626"; ctx.fillRect(-3,-C.CARH*0.02-8,2,3); ctx.fillRect(0,-C.CARH*0.02-9,2,4); ctx.fillRect(3,-C.CARH*0.02-8,2,3);
    ctx.fillStyle="#fb923c"; ctx.fillRect(-1,-C.CARH*0.02-1,2,3);
    ctx.fillStyle="#0b0c1a"; ctx.fillRect(-2,-C.CARH*0.02-2,1.5,1.5); ctx.fillRect(1,-C.CARH*0.02-2,1.5,1.5);
    ctx.restore();
  }

  function draw(){
    // grass
    ctx.fillStyle="#1c6b2e"; ctx.fillRect(0,0,C.W,C.H);
    ctx.fillStyle="#175c27"; for(let y=(-s.scroll*0.6%40); y<C.H; y+=40){ ctx.fillRect(0,y,C.LEFT,20); ctx.fillRect(C.RIGHT,y,C.W-C.RIGHT,20); }
    // tarmac
    ctx.fillStyle="#3a3f4b"; ctx.fillRect(C.LEFT,0,C.ROADW,C.H);
    // rumble strips
    for(let y=(-s.scroll%36); y<C.H; y+=36){ const on=(Math.floor((y+s.scroll)/36)%2)===0;
      ctx.fillStyle=on?"#f43f5e":"#f4f4f4"; ctx.fillRect(C.LEFT-6,y,6,18); ctx.fillRect(C.RIGHT,y,6,18); }
    // centre dashes
    ctx.fillStyle="#e8e8b0"; for(let y=(-s.scroll%54); y<C.H; y+=54){ ctx.fillRect(C.W/2-2,y,4,26); }
    // rivals
    for(const t of s.traffic){ if(t.y>-C.CARH && t.y<C.H) carArt(t.x,t.y,t.col,true); }
    // player (blink briefly after a crash)
    if(s.crashT<=0 || Math.floor(s.crashT/5)%2===0) carArt(s.x, C.PLAYER_Y, "#ffcf5a", true);
    if(s.offroad && !s.over){ ctx.fillStyle="rgba(120,200,120,.16)"; ctx.fillRect(0,0,C.W,C.H); }
    if(s.over){ ctx.fillStyle="rgba(0,0,0,.62)"; ctx.fillRect(0,0,C.W,C.H);
      ctx.fillStyle="#f43f5e"; ctx.font="bold 24px system-ui"; ctx.textAlign="center"; ctx.fillText("OUT OF CHICKENS",C.W/2,C.H/2-6);
      ctx.fillStyle="#e6e6f0"; ctx.font="14px system-ui"; ctx.fillText("Score "+s.score+"  ·  Best "+best,C.W/2,C.H/2+16); }
  }
  function renderChix(){ $("lives").textContent="🐔".repeat(Math.max(0,s.lives)); }
  function frame(){
    if(GATE && !GATE.open){ draw(); GATE.paint(); return requestAnimationFrame(frame); }
    if(!s.over){ const wasSpd=s.speed; step(s,input);
      if(typeof Arcade!=="undefined"){ Arcade.stats.record("chicken1",s.score);
        if(s.crashT===48 && wasSpd>0) Arcade.sfx.explode(); }
      if(s.over){ if(s.score>best){ best=s.score; try{localStorage.setItem("chicken1_best",String(best));}catch(e){} } $("msg").textContent="Crashed out! Score "+s.score; }
      else $("msg").textContent = s.offroad ? "On the grass — get back on the tarmac!" : "";
    }
    $("score").textContent=s.score; $("spd").textContent=Math.round(s.speed/C.MAXSPD*220); $("best").textContent=best; renderChix();
    draw(); requestAnimationFrame(frame);
  }
  const press=(k,v)=>{ input[k]=v; };
  addEventListener("keydown",e=>{ const m={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"gas",ArrowDown:"brake",a:"left",d:"right",w:"gas",s:"brake"," ":"gas"}[e.key]; if(m){e.preventDefault(); press(m,true);} });
  addEventListener("keyup",e=>{ const m={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"gas",ArrowDown:"brake",a:"left",d:"right",w:"gas",s:"brake"," ":"gas"}[e.key]; if(m){ press(m,false);} });
  const hold=(id,k)=>{ const el=$(id); const on=(e)=>{e.preventDefault();press(k,true);}; const off=(e)=>{e.preventDefault();press(k,false);};
    el.addEventListener("touchstart",on,{passive:false}); el.addEventListener("touchend",off); el.addEventListener("mousedown",on); el.addEventListener("mouseup",off); el.addEventListener("mouseleave",off); };
  hold("bl","left"); hold("br","right"); hold("bg","gas"); hold("bk","brake");
  $("new").addEventListener("click",()=>{ s=newState(); renderChix(); $("msg").textContent="Hold GAS, dodge the pack!"; });
  renderChix();
  GATE = (typeof Arcade!=="undefined"&&Arcade.startGate) ? Arcade.startGate(cv,"Chicken1") : {open:true,paint:()=>{}};
  requestAnimationFrame(frame);
})();
</script>
<script src="/comments.js" defer></script>
</body>
</html>
