<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sokoban — Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='60'>📦</text></svg>" />
  <style>
    :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;--wall:#3a3550;--floor:#171a30;--target:#4a3a1a;}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
      background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.22),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.16),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;}
    .wrap{max-width:420px;margin:0 auto;padding:16px 16px 30px;display:flex;flex-direction:column;align-items:center;gap:12px}
    .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
    .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
    .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
    h1{margin:0;font-size:1.5rem;background:linear-gradient(120deg,#f97316,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
    .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
    .stat{background:var(--panel);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:6px 14px;font-weight:700}
    .board{display:grid;gap:2px;background:#0c0f1e;padding:6px;border-radius:12px}
    .cell{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;border-radius:4px}
    .cell.wall{background:var(--wall)}.cell.floor{background:var(--floor)}.cell.target{background:var(--target)}
    .status{min-height:1.2em;font-weight:600;color:#fde68a;text-align:center}
    .dpad{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(2,42px);gap:5px}
    .dpad button{background:var(--panel);border:1px solid rgba(255,255,255,.14);color:var(--text);border-radius:9px;font-size:1.1rem;cursor:pointer;user-select:none;touch-action:none}
    .dpad .u{grid-column:2}
    .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:9px 18px;border-radius:999px;cursor:pointer;font-size:.85rem}
    .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.18);color:var(--muted)}
    .row{display:flex;gap:8px;align-items:center}
    .hint{color:var(--muted);font-size:.8rem;text-align:center}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar"><a class="home" href="/">← Home</a><h1>📦 Sokoban</h1><span style="width:56px"></span></div>
    <div class="bar">
      <div class="stat">Level <span id="lvl">1</span>/<span id="lvltot">4</span></div>
      <div class="stat">Moves <span id="moves">0</span></div>
    </div>
    <div class="board" id="board"></div>
    <div class="status" id="status">Push every box onto a target.</div>
    <div class="row">
      <div class="dpad">
        <button class="u" data-d="up">▲</button><button data-d="left">◀</button>
        <button data-d="right">▶</button><button data-d="down">▼</button>
      </div>
      <div class="row" style="flex-direction:column">
        <button class="btn ghost" id="undo">↶ Undo</button>
        <button class="btn ghost" id="restart">Restart</button>
      </div>
    </div>
    <p class="hint">Arrows / WASD / d-pad to move. Push boxes 📦 onto the targets ⭐. You can't pull.</p>
  </div>
  <script>
  (function(){
    const DEFAULT_LEVELS=[
      ["######","#    #","# .$@#","#    #","######"],
      ["#######","#  .  #","#  $  #","#  @  #","#######"],
      ["######","#@$ .#","#  $.#","######"],
      ["#######","# . . #","# $ $ #","#  @  #","#######"],
    ];
    // Admin-designed levels (/admin/games/?game=sokoban, "Configuration" panel)
    // override the built-in set — same convention as quest/chickenmania/
    // adventure/minigolf. Falls back to DEFAULT_LEVELS on anything malformed.
    function isValidLevels(o){ return Array.isArray(o)&&o.length>0&&o.every(lvl=>Array.isArray(lvl)&&lvl.length>0&&lvl.every(row=>typeof row==="string")); }
    let LEVELS=DEFAULT_LEVELS;
    try{ const j=localStorage.getItem("sokoban_levels"); if(j){ const o=JSON.parse(j); if(isValidLevels(o)) LEVELS=o; } }catch(e){}
    const boardEl=document.getElementById("board"),statusEl=document.getElementById("status"),movesEl=document.getElementById("moves"),lvlEl=document.getElementById("lvl");
    document.getElementById("lvltot").textContent=LEVELS.length;
    let walls,targets,boxes,player,rows,cols,moves,undoStack,level=0,solved,advanceTimer=null;

    function parse(map){walls=new Set();targets=new Set();boxes=new Set();rows=map.length;cols=Math.max(...map.map(r=>r.length));
      for(let r=0;r<rows;r++)for(let c=0;c<map[r].length;c++){const ch=map[r][c];const k=r+","+c;
        if(ch==="#")walls.add(k);
        if(ch==="."||ch==="*"||ch==="+")targets.add(k);
        if(ch==="$"||ch==="*")boxes.add(k);
        if(ch==="@"||ch==="+")player={r,c};}}
    function load(i){
      // Cancel any pending "level solved, auto-advancing…" timer from a
      // previous solve — otherwise Restart (or the admin editor's Test
      // button) right after solving a level gets silently overridden a
      // moment later when that stale timer fires and jumps to the next
      // level regardless of what the player is doing on the reloaded one.
      if(advanceTimer){clearTimeout(advanceTimer);advanceTimer=null;}
      level=i;parse(LEVELS[i]);moves=0;solved=false;undoStack=[];movesEl.textContent=0;lvlEl.textContent=i+1;statusEl.textContent="Push every box onto a target.";render();
    }
    function key(r,c){return r+","+c;}
    function snapshot(){return{p:{...player},b:new Set(boxes),m:moves};}
    function move(dr,dc){
      if(solved)return;
      const nr=player.r+dr,nc=player.c+dc,nk=key(nr,nc);
      if(walls.has(nk))return;
      if(boxes.has(nk)){const br=nr+dr,bc=nc+dc,bk=key(br,bc);if(walls.has(bk)||boxes.has(bk))return;
        undoStack.push(snapshot());boxes.delete(nk);boxes.add(bk);player={r:nr,c:nc};}
      else{undoStack.push(snapshot());player={r:nr,c:nc};}
      moves++;movesEl.textContent=moves;render();checkWin();
    }
    function undo(){if(!undoStack.length||solved)return;const s=undoStack.pop();player=s.p;boxes=s.b;moves=s.m;movesEl.textContent=moves;render();}
    function checkWin(){for(const t of targets)if(!boxes.has(t))return;solved=true;
      statusEl.textContent=level+1<LEVELS.length?"🎉 Level solved! Loading next…":"🏆 All levels complete!";
      if(level+1<LEVELS.length)advanceTimer=setTimeout(()=>{advanceTimer=null;load(level+1);},1100);}
    function render(){boardEl.style.gridTemplateColumns=`repeat(${cols},32px)`;boardEl.innerHTML="";
      for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const k=key(r,c),d=document.createElement("div");
        const isWall=walls.has(k),isTarget=targets.has(k);
        d.className="cell "+(isWall?"wall":isTarget?"target":"floor");
        if(player.r===r&&player.c===c)d.textContent="🧑";
        else if(boxes.has(k))d.textContent=isTarget?"✅":"📦";
        else if(isTarget)d.textContent="⭐";
        boardEl.appendChild(d);}}
    document.addEventListener("keydown",e=>{const m={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1],w:[-1,0],s:[1,0],a:[0,-1],d:[0,1]}[e.key];if(m){e.preventDefault();move(m[0],m[1]);}});
    document.querySelectorAll(".dpad button").forEach(b=>b.addEventListener("click",()=>{const m={up:[-1,0],down:[1,0],left:[0,-1],right:[0,1]}[b.dataset.d];move(m[0],m[1]);}));
    document.getElementById("undo").addEventListener("click",undo);
    document.getElementById("restart").addEventListener("click",()=>load(level));
    window.__soko={LEVELS,DEFAULT_LEVELS,isValidLevels,loadTest:(i)=>{load(i);return{boxes:[...boxes],targets:[...targets],player};},moveTest:(dr,dc)=>{move(dr,dc);return{boxes:[...boxes],player,moves,solved};}};
    // The admin level editor's "Test this level" button passes ?level=<n>
    // (1-based) so testing always jumps straight to the exact level being
    // edited, skipping levels 1..n-1.
    const urlLevel=parseInt(new URLSearchParams(location.search).get("level"))||0;
    load((urlLevel>=1&&urlLevel<=LEVELS.length)?urlLevel-1:0);
  })();
  </script>
  <script src="/comments.js" defer></script>
  <script src="/fullscreen.js" defer></script>
</body>
</html>
