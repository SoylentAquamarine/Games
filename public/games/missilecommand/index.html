<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Chicken Command — Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>🥚</text></svg>" />
<style>
  :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;--bad:#f43f5e;}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
    background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.2),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.14),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;touch-action:none;}
  .wrap{max-width:480px;margin:0 auto;padding:14px 12px 30px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
  .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
  .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
  h1{margin:0;font-size:1.25rem;background:linear-gradient(120deg,var(--bad),#ffcf5a);-webkit-background-clip:text;background-clip:text;color:transparent}
  .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer}
  .hud{width:100%;max-width:420px;display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
  .hud b{color:var(--text)}
  canvas{width:min(96vw,560px);height:calc(min(96vw,560px)*0.8333);image-rendering:auto;border-radius:10px;border:2px solid #2a2f55;background:#05060f;cursor:crosshair;touch-action:none}
  .msg{min-height:1.3em;font-weight:800;text-align:center}
  .hint{font-size:.78rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="home" href="/">← Home</a><h1>🥚 Chicken Command</h1><button class="btn" id="new">New Game</button></div>
  <div class="hud"><span>Score: <b id="score">0</b></span><span>Wave: <b id="wave">1</b></span><span>Coops: <b id="cities">6</b></span></div>
  <canvas id="game" width="360" height="300"></canvas>
  <div class="msg" id="msg">Tap to detonate an interceptor and destroy incoming missiles.</div>
  <div class="hint">Tap above the ground — an interceptor flies from the nearest base with ammo. Ammo is limited (shown on each base) and refills each wave.</div>
</div>
<script src="/arcade.js"></script>
<script src="/mascots.js"></script>
<script>
(function(){
  const C={ W:360,H:300, GROUND_Y:280, N_CITIES:6, EXP_MAX_R:30, EXP_GROW:1.0, EXP_LIFE:55, ENEMY_SPEED:0.55, INT_SPEED:6, BASE_AMMO:10, BASE_X:[20,180,340], CITY_X:[60,100,140,220,260,300], INTERMISSION:120, RECOVER_EVERY:8000, FLYBY_EVERY:5 };
  // Admin-tunable difficulty knobs — see /admin/games/?game=missilecommand.
  // Same pattern as kaboom (see its HANDOFF.md): explicit allowlist, only
  // numeric values, safe no-op with no localStorage (headless tests).
  // N_CITIES is deliberately NOT overridable — it must stay in sync with
  // CITY_X's fixed 6-entry array of x-positions, or city rendering/damage
  // indexing goes out of bounds.
  (function(){ try{
    const allow=["BASE_AMMO","ENEMY_SPEED","INTERMISSION","RECOVER_EVERY","FLYBY_EVERY"];
    const o=JSON.parse(localStorage.getItem("missilecommand_config")||"{}");
    for(const k of allow) if(typeof o[k]==="number") C[k]=o[k];
  }catch(_){} })();
  const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);

  function newGame(){
    // Two groups of three, tucked between the three bases so nothing overlaps.
    const cities=C.CITY_X.map(x=>({x,alive:true}));
    const bases=C.BASE_X.map(x=>({x,ammo:C.BASE_AMMO,dead:false}));
    const s={cities,bases,enemies:[],interceptors:[],explosions:[],score:0,wave:0,waveLeftToSpawn:0,spawnTimer:0,spawnEvery:80,intermission:null,enemySpeed:C.ENEMY_SPEED,over:false,
      nextRecover:C.RECOVER_EVERY, flyers:[], chickensLeft:0, chickenWave:false, chickenSpawnT:0, flybyMsg:0};
    startWave(s); return s;
  }
  // Player feedback: "difficulty curve too difficult... the rounds get
  // EXTREMELY difficult too quickly." Eased a THIRD time — the per-wave
  // growth terms below are the ones already described as "eased further"
  // in the comment underneath, and they were still too steep. Missile
  // count growth cut from 1.25/wave to 0.9/wave, the spawn-gap floor
  // raised (closes more slowly AND never gets as tight), and the speed
  // ramp both gentler and capped lower.
  function startWave(s){ s.wave++;
    s.waveLeftToSpawn=Math.round(3+s.wave*0.9);
    s.spawnEvery=Math.max(38,92-s.wave*3.5);
    s.spawnTimer=25;
    s.enemySpeed=Math.min(1.05, C.ENEMY_SPEED+s.wave*0.045);
    if(s.bases) for(const b of s.bases) if(!b.dead) b.ammo=C.BASE_AMMO;
    // Every 5th wave is a chicken raid: no missiles at all, just a squad of
    // five spacesuit chickens streaming across the top. Player feedback:
    // "the bonus chicken round is 10x as difficult as it should be, space
    // them out and make them not shoot" — they used to drop bombs at
    // cities/bases just like a real wave (see the removed code this
    // replaced), which made a "bonus" round more dangerous than a normal
    // one. Now purely a shooting-gallery bonus: no bombs, ever.
    if(s.wave%C.FLYBY_EVERY===0){
      s.chickenWave=true; s.chickensLeft=5; s.waveLeftToSpawn=0; s.chickenSpawnT=10; s.flybyMsg=90;
    } else { s.chickenWave=false; s.chickensLeft=0; }
  }
  function spawnChicken(s){
    const fromLeft=Math.random()<0.5;
    s.flyers.push({ x: fromLeft?-24:C.W+24, y:24+Math.random()*26, vx:(fromLeft?1:-1)*(1.7+Math.random()*0.5), alive:true });
    s.chickensLeft--;
  }
  // Score milestones rebuild a lost coop, or failing that a dead launcher.
  function recover(s){
    while(s.score>=s.nextRecover){
      s.nextRecover+=C.RECOVER_EVERY;
      const city=s.cities.find(c=>!c.alive);
      if(city){ city.alive=true; city.rebuilt=30; continue; }
      const base=s.bases.find(b=>b.dead);
      if(base){ base.dead=false; base.ammo=C.BASE_AMMO; base.rebuilt=30; }
    }
  }
  // Each round gets its own missile and trail colours, cycling through a set of
  // clearly distinct hues so you can tell waves apart at a glance.
  const WAVE_COLORS=[
    { missile:"#f43f5e", trail:"244,63,94",   name:"Crimson" },
    { missile:"#f59e0b", trail:"245,158,11",  name:"Amber"   },
    { missile:"#a3e635", trail:"163,230,53",  name:"Lime"    },
    { missile:"#22d3ee", trail:"34,211,238",  name:"Cyan"    },
    { missile:"#c084fc", trail:"192,132,252", name:"Violet"  },
    { missile:"#fb7185", trail:"251,113,133", name:"Rose"    },
  ];
  function waveColor(w){ return WAVE_COLORS[Math.max(0,(w-1))%WAVE_COLORS.length]; }
  function stepInterceptor(m){ const dx=m.tx-m.x,dy=m.ty-m.y,d=Math.hypot(dx,dy); if(d<=C.INT_SPEED){ m.x=m.tx; m.y=m.ty; return true; } m.x+=dx/d*C.INT_SPEED; m.y+=dy/d*C.INT_SPEED; return false; }
  function spawnEnemy(s){
    // Bases are targets too, not just the coops.
    const targets=[...s.cities.filter(c=>c.alive), ...(s.bases||[]).filter(b=>!b.dead)];
    const target=targets.length?targets[Math.floor(Math.random()*targets.length)]:s.cities[Math.floor(Math.random()*s.cities.length)];
    const x0=10+Math.random()*(C.W-20); s.enemies.push({x:x0,y:0,ox:x0,oy:0,tx:target.x,ty:C.GROUND_Y,alive:true});
  }
  function stepEnemy(m,speed){ const dx=m.tx-m.x,dy=m.ty-m.y,d=Math.hypot(dx,dy)||1; m.x+=dx/d*speed; m.y+=dy/d*speed; }
  function fire(s,x,y){ if(s.over||y>=C.GROUND_Y) return false;
    let best=-1,bd=1e9; for(let i=0;i<s.bases.length;i++){ const b=s.bases[i]; if(b.dead||b.ammo<=0) continue; const d=Math.abs(b.x-x); if(d<bd){bd=d;best=i;} }
    if(best<0) return false;                          // no base has ammo
    const b=s.bases[best]; b.ammo--;
    s.interceptors.push({x:b.x,y:C.GROUND_Y-10,ox:b.x,oy:C.GROUND_Y-10,tx:x,ty:y});
    if(typeof Arcade!=="undefined") Arcade.sfx.shoot();
    return true;
  }
  function stepExplosion(e){ if(e.phase==="grow"){ e.r+=C.EXP_GROW; if(e.r>=C.EXP_MAX_R) e.phase="shrink"; } else { e.r-=C.EXP_GROW*0.8; if(e.r<0)e.r=0; } e.life--; }
  function explosionHits(e,m){ return e.life>0 && e.r>0 && m.alive && dist(e.x,e.y,m.x,m.y)<=e.r; }
  function cityIndexAtX(cities,x){ let best=-1,bd=1e9; for(let i=0;i<cities.length;i++){ const d=Math.abs(x-cities[i].x); if(d<bd){bd=d;best=i;} } return best; }

  function tick(s){
    if(s.over) return s;
    if(s.waveLeftToSpawn>0){ s.spawnTimer--; if(s.spawnTimer<=0){ spawnEnemy(s); s.waveLeftToSpawn--; s.spawnTimer=s.spawnEvery; } }
    for(const m of s.enemies){ if(!m.alive) continue; stepEnemy(m,s.enemySpeed);
      if(m.y>=C.GROUND_Y){ m.alive=false; m.landed=true;
        // A direct hit on a launcher knocks it out for the rest of the game.
        const bi=s.bases.findIndex(b=>!b.dead && Math.abs(b.x-m.x)<=14);
        if(bi>=0){ s.bases[bi].dead=true; s.bases[bi].ammo=0; }
        else { const ci=cityIndexAtX(s.cities,m.x);
          if(ci>=0&&s.cities[ci].alive){ s.cities[ci].alive=false;
            if(typeof Arcade!=="undefined") Arcade.sfx.death(); } } } }
    for(const it of s.interceptors){ if(stepInterceptor(it)){ it.done=true; s.explosions.push({x:it.tx,y:it.ty,r:1,phase:"grow",life:C.EXP_LIFE});
      if(typeof Arcade!=="undefined") Arcade.sfx.explode(); } }
    s.interceptors=s.interceptors.filter(it=>!it.done);
    for(const e of s.explosions) stepExplosion(e);
    for(const e of s.explosions){ if(e.life<=0) continue; for(const m of s.enemies){ if(explosionHits(e,m)){ m.alive=false; s.score+=25;
      if(typeof Arcade!=="undefined") Arcade.sfx.hit(); } } }
    stepFlyby(s);
    if(s.flybyMsg>0) s.flybyMsg--;
    recover(s);
    s.enemies=s.enemies.filter(m=>m.alive);
    s.explosions=s.explosions.filter(e=>e.life>0);
    // Breather between waves: hold for 2 seconds and announce the next one.
    if(s.waveLeftToSpawn===0 && s.chickensLeft===0 && s.flyers.length===0 && s.enemies.length===0 && s.explosions.length===0 && s.interceptors.length===0){
      if(s.intermission==null) s.intermission=C.INTERMISSION;
      if(s.intermission>0){ s.intermission--; }
      else { s.intermission=null; startWave(s); }
    }
    if(s.cities.every(c=>!c.alive)) s.over=true;
    return s;
  }
  function stepFlyby(s){
    // Player feedback: "the bonus chicken round is 10x as difficult as it
    // should be, space them out and make them not shoot." A raid used to
    // drop real city/base-destroying bombs (see the removed code this
    // replaced) — a "bonus" round shouldn't be more dangerous than a real
    // wave. Now it's a pure risk-free shooting gallery: chickens just fly
    // across for bonus points, no bombs, ever. The spawn gap is also wide
    // enough that two are never on-screen at once: a chicken travels the
    // full 414px span (off one edge to off the other) at 1.7-2.2px/frame,
    // so the slowest possible chicken takes up to ~244 frames to clear —
    // the 250-290 frame gap below always exceeds that worst case.
    if(s.chickensLeft>0){ if(--s.chickenSpawnT<=0){ spawnChicken(s); s.chickenSpawnT=250+Math.floor(Math.random()*40); } }
    for(const fb of s.flyers){
      if(!fb.alive) continue;
      fb.x+=fb.vx;
      for(const e of s.explosions){ if(e.life>0 && dist(e.x,e.y,fb.x,fb.y)<=e.r+8){ s.score+=1000; fb.alive=false; if(typeof Arcade!=="undefined") Arcade.sfx.hit(); break; } }
      if(fb.alive && (fb.x<-30||fb.x>C.W+30)) fb.alive=false;
    }
    s.flyers=s.flyers.filter(f=>f.alive);
  }
  window.__mc={ newGame, startWave, spawnEnemy, spawnChicken, stepEnemy, fire, stepExplosion, explosionHits, cityIndexAtX, tick, stepFlyby, recover, dist, C };

  if(typeof document==="undefined") return;
  const $=(id)=>document.getElementById(id);
  const cv=$("game"), ctx=cv.getContext("2d");
  // Player feedback: "screen needs to be bigger, need standard arcade
  // screen size." 420px CSS display width was noticeably smaller than the
  // site's most common canvas display size (560px, used by every 480x360
  // game). C.W/C.H (360x300) stay the LOGICAL/gameplay coordinate system —
  // every existing draw call and canvasXY's click-mapping (which already
  // divides by C.W/C.H, not cv.width/height) keep working unchanged — the
  // actual backing store is scaled up to display crisply at the bigger
  // CSS size, further scaled for devicePixelRatio so it's sharp on
  // high-DPI screens too.
  const LOGICAL_W=cv.width, LOGICAL_H=cv.height;
  const RENDER_SCALE=480/LOGICAL_W;
  const DPR=Math.max(1, window.devicePixelRatio||1);
  cv.width=Math.round(LOGICAL_W*RENDER_SCALE*DPR); cv.height=Math.round(LOGICAL_H*RENDER_SCALE*DPR);
  ctx.scale(RENDER_SCALE*DPR, RENDER_SCALE*DPR);
  // Hold the loop until the player asks for it (comment: Press Spacebar To Begin)
  // Player feedback: "at the beginning there are 2 conflicting texts
  // showing, and one of them is too big for the screen. Remove the coop
  // command one." draw()'s own "INCOMING MISSILES / ALL CHICKENS REPORT"
  // opening call-to-arms (below, gated on `opening>0`) already shows the
  // whole time the gate is closed, so a second startGate title on top of
  // it was redundant even before the oversized-text bug (fixed in
  // arcade.js's startGate itself) made it worse. No title here now.
  const GATE = Arcade.startGate(cv, null);
  let s=newGame(), best=null, pointer={x:180,y:120};
  // Opening call-to-arms, then it hands over to the normal wave flow.
  let opening=170;
  try{ best=parseInt(localStorage.getItem("mc_best")||"")||null; }catch(e){}

  function draw(){
    ctx.clearRect(0,0,C.W,C.H); ctx.fillStyle="#05060f"; ctx.fillRect(0,0,C.W,C.H);
    ctx.fillStyle="#233"; for(let i=0;i<50;i++){ const x=(i*97)%C.W,y=(i*53)%(C.GROUND_Y-20); ctx.fillRect(x,y,1,1); }
    ctx.fillStyle="#2b2f4d"; ctx.fillRect(0,C.GROUND_Y,C.W,C.H-C.GROUND_Y);
    for(const c of s.cities){ if(c.alive){
        ctx.fillStyle="#b45309"; ctx.fillRect(c.x-14,C.GROUND_Y-16,28,16);                       // coop body
        ctx.fillStyle="#dc2626"; ctx.beginPath();                                                 // pitched roof
        ctx.moveTo(c.x-17,C.GROUND_Y-16); ctx.lineTo(c.x,C.GROUND_Y-26); ctx.lineTo(c.x+17,C.GROUND_Y-16); ctx.closePath(); ctx.fill();
        ctx.fillStyle="#78350f"; ctx.fillRect(c.x-5,C.GROUND_Y-11,10,11);                         // doorway
        ctx.fillStyle="#facc15"; ctx.beginPath(); ctx.arc(c.x,C.GROUND_Y-6,3,0,7); ctx.fill();     // hen peeking out
        if(c.rebuilt>0){ ctx.strokeStyle="rgba(52,211,153,"+(c.rebuilt/30)+")"; ctx.lineWidth=2;   // rebuild glow
          ctx.strokeRect(c.x-16,C.GROUND_Y-27,32,27); c.rebuilt--; } }
      else { ctx.fillStyle="#3a2f2f"; ctx.fillRect(c.x-12,C.GROUND_Y-5,24,5); } }
    // missile bases with ammo count
    for(const b of s.bases){
      // a destroyed launcher is drawn as rubble and never comes back
      ctx.fillStyle = b.dead ? "#4a2020" : (b.ammo>0?"#34d399":"#3a2f2f");
      if(b.dead){ ctx.beginPath(); ctx.moveTo(b.x-12,C.GROUND_Y); ctx.lineTo(b.x+12,C.GROUND_Y); ctx.lineTo(b.x+5,C.GROUND_Y-5); ctx.lineTo(b.x-2,C.GROUND_Y-2); ctx.lineTo(b.x-7,C.GROUND_Y-6); ctx.closePath(); ctx.fill(); }
      else { ctx.beginPath(); ctx.moveTo(b.x-12,C.GROUND_Y); ctx.lineTo(b.x+12,C.GROUND_Y); ctx.lineTo(b.x,C.GROUND_Y-14); ctx.closePath(); ctx.fill(); }
      ctx.fillStyle=b.ammo>0?"#e6e6f0":"#8a8f9a"; ctx.font="bold 10px system-ui"; ctx.textAlign="center"; ctx.fillText(b.ammo, b.x, C.GROUND_Y-17); }
    for(const it of s.interceptors){ ctx.strokeStyle="rgba(52,211,153,.6)"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(it.ox,it.oy); ctx.lineTo(it.x,it.y); ctx.stroke();
      ctx.fillStyle="#34d399"; ctx.beginPath(); ctx.arc(it.x,it.y,2,0,7); ctx.fill(); ctx.strokeStyle="rgba(52,211,153,.4)"; ctx.strokeRect(it.tx-3,it.ty-3,6,6); }
    const wc=waveColor(s.wave);
    for(const m of s.enemies){ ctx.strokeStyle="rgba("+wc.trail+",.55)"; ctx.lineWidth=1.4; ctx.beginPath(); ctx.moveTo(m.ox,m.oy); ctx.lineTo(m.x,m.y); ctx.stroke();
      ctx.fillStyle=wc.missile; ctx.beginPath(); ctx.arc(m.x,m.y,2.8,0,7); ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.85)"; ctx.beginPath(); ctx.arc(m.x,m.y,1.1,0,7); ctx.fill(); }
    // the bomber squad — drawn from the shared /mascots.js library (the
    // "Flying" variant: jetpack + pack).
    for(const fb of s.flyers) Mascots.spacesuitChickenFlying(ctx, fb.x, fb.y, 9, fb.vx);
    for(const e of s.explosions){ const g=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,Math.max(1,e.r));
      g.addColorStop(0,"rgba(255,255,255,.95)"); g.addColorStop(.5,"rgba(34,211,238,.7)"); g.addColorStop(1,"rgba(124,92,255,0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(e.x,e.y,Math.max(1,e.r),0,7); ctx.fill(); }
    if(!s.over){ ctx.strokeStyle="rgba(255,255,255,.5)"; ctx.lineWidth=1; ctx.beginPath();
      ctx.moveTo(pointer.x-6,pointer.y); ctx.lineTo(pointer.x+6,pointer.y); ctx.moveTo(pointer.x,pointer.y-6); ctx.lineTo(pointer.x,pointer.y+6); ctx.stroke(); }
    // Opening call-to-arms.
    if(opening>0){
      const j=()=>(Math.random()-0.5)*5;
      ctx.font="bold 21px system-ui"; ctx.textAlign="center";
      ctx.fillStyle="rgba(244,63,94,.55)"; ctx.fillText("INCOMING MISSILES",C.W/2+j(),C.H/2-14+j());
      ctx.fillStyle="#ffcf5a";            ctx.fillText("INCOMING MISSILES",C.W/2+j(),C.H/2-14+j());
      ctx.font="bold 15px system-ui"; ctx.fillStyle="#e6e6f0";
      ctx.fillText("ALL CHICKENS REPORT",C.W/2+j()*0.5,C.H/2+12);
    }
    // Between-wave announcement, jittering a couple of pixels each frame.
    if(!s.over && s.intermission>0){
      const j=()=>(Math.random()-0.5)*5;
      ctx.font="bold 24px system-ui"; ctx.textAlign="center";
      ctx.fillStyle="rgba(244,63,94,.55)"; ctx.fillText("NEXT WAVE COMING",C.W/2+j(),C.H/2+j());
      ctx.fillStyle="#ffcf5a";            ctx.fillText("NEXT WAVE COMING",C.W/2+j(),C.H/2+j());
      ctx.fillStyle="#e6e6f0"; ctx.font="13px system-ui";
      ctx.fillText("Wave "+(s.wave+1)+" · ammo reloaded",C.W/2,C.H/2+24);
    }
    // the bomber's arrival, called out over the intermission
    if(!s.over && s.flybyMsg>0){
      const j=()=>(Math.random()-0.5)*4;
      ctx.font="bold 16px system-ui"; ctx.textAlign="center";
      ctx.fillStyle="#f43f5e"; ctx.fillText("🚀 CHICKEN RAID — shoot them down!",C.W/2+j(),C.H/2+48+j());
    }
    if(s.over){ ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillRect(0,0,C.W,C.H); ctx.fillStyle="#f43f5e"; ctx.font="bold 26px system-ui"; ctx.textAlign="center"; ctx.fillText("GAME OVER",C.W/2,C.H/2-6);
      ctx.fillStyle="#e6e6f0"; ctx.font="14px system-ui"; ctx.fillText("Score "+s.score+(best?"  ·  Best "+best:""),C.W/2,C.H/2+18); }
  }
  function hud(){ $("score").textContent=s.score; $("wave").textContent=s.wave; $("cities").textContent=s.cities.filter(c=>c.alive).length; }
  function frame(){
    if(!GATE.open){ draw(); GATE.paint(); return requestAnimationFrame(frame); } if(opening>0){ opening--; } else tick(s);
    if(s.over && best!==s.score){ if(typeof Arcade!=="undefined")Arcade.stats.record("missilecommand",s.score); if(!best||s.score>best){ best=s.score; try{localStorage.setItem("mc_best",String(best));}catch(e){} $("msg").textContent="💥 All cities lost. Score "+s.score+" — New Game to retry."; } }
    draw(); hud(); requestAnimationFrame(frame); }

  function canvasXY(ev){ const r=cv.getBoundingClientRect(); const cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left, cy=(ev.touches?ev.touches[0].clientY:ev.clientY)-r.top;
    return { x:cx*(C.W/r.width), y:cy*(C.H/r.height) }; }
  cv.addEventListener("mousemove",(e)=>{ pointer=canvasXY(e); });
  function shoot(p){ pointer=p; if(!fire(s,p.x,p.y) && !s.over && p.y<C.GROUND_Y && s.bases.every(b=>b.ammo<=0)) $("msg").textContent="Out of ammo — reloads next wave!"; }
  cv.addEventListener("mousedown",(e)=>{ e.preventDefault(); shoot(canvasXY(e)); });
  cv.addEventListener("touchstart",(e)=>{ e.preventDefault(); shoot(canvasXY(e)); },{passive:false});
  $("new").addEventListener("click",()=>{ s=newGame(); opening=170; $("msg").textContent="Tap to detonate an interceptor and destroy incoming missiles."; });
  requestAnimationFrame(frame);
})();
</script>

</body>
