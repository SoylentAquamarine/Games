<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Chicken Command — Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>🥚</text></svg>" />
<style>
  :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;--bad:#f43f5e;}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
    background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.2),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.14),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;touch-action:none;}
  .wrap{max-width:480px;margin:0 auto;padding:14px 12px 30px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
  .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
  .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
  h1{margin:0;font-size:1.25rem;background:linear-gradient(120deg,var(--bad),#ffcf5a);-webkit-background-clip:text;background-clip:text;color:transparent}
  .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer}
  .hud{width:100%;max-width:420px;display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
  .hud b{color:var(--text)}
  canvas{width:min(96vw,420px);height:calc(min(96vw,420px)*0.8333);image-rendering:auto;border-radius:10px;border:2px solid #2a2f55;background:#05060f;cursor:crosshair;touch-action:none}
  .msg{min-height:1.3em;font-weight:800;text-align:center}
  .hint{font-size:.78rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="home" href="/">← Home</a><h1>🥚 Chicken Command</h1><button class="btn" id="new">New Game</button></div>
  <div class="hud"><span>Score: <b id="score">0</b></span><span>Wave: <b id="wave">1</b></span><span>Coops: <b id="cities">6</b></span></div>
  <canvas id="game" width="360" height="300"></canvas>
  <div class="msg" id="msg">Tap to detonate an interceptor and destroy incoming missiles.</div>
  <div class="hint">Tap above the ground — an interceptor flies from the nearest base with ammo. Ammo is limited (shown on each base) and refills each wave.</div>
</div>
<script>
(function(){
  const C={ W:360,H:300, GROUND_Y:280, N_CITIES:6, EXP_MAX_R:30, EXP_GROW:1.0, EXP_LIFE:55, ENEMY_SPEED:0.55, INT_SPEED:6, BASE_AMMO:10, BASE_X:[20,180,340], INTERMISSION:120 };   // 2s pause between waves at 60fps
  const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);

  function newGame(){
    const cities=[]; for(let i=0;i<C.N_CITIES;i++) cities.push({x:(i+0.5)*(C.W/C.N_CITIES),alive:true});
    const bases=C.BASE_X.map(x=>({x,ammo:C.BASE_AMMO}));
    const s={cities,bases,enemies:[],interceptors:[],explosions:[],score:0,wave:0,waveLeftToSpawn:0,spawnTimer:0,spawnEvery:80,intermission:null,enemySpeed:C.ENEMY_SPEED,over:false};
    startWave(s); return s;
  }
  function startWave(s){ s.wave++; s.waveLeftToSpawn=3+s.wave*2; s.spawnEvery=Math.max(22,90-s.wave*8); s.spawnTimer=25; s.enemySpeed=C.ENEMY_SPEED+s.wave*0.1;
    if(s.bases) for(const b of s.bases) b.ammo=C.BASE_AMMO; }   // ammo replenishes between waves
  function stepInterceptor(m){ const dx=m.tx-m.x,dy=m.ty-m.y,d=Math.hypot(dx,dy); if(d<=C.INT_SPEED){ m.x=m.tx; m.y=m.ty; return true; } m.x+=dx/d*C.INT_SPEED; m.y+=dy/d*C.INT_SPEED; return false; }
  function spawnEnemy(s){
    const alive=s.cities.filter(c=>c.alive); const target=alive.length?alive[Math.floor(Math.random()*alive.length)]:s.cities[Math.floor(Math.random()*s.cities.length)];
    const x0=10+Math.random()*(C.W-20); s.enemies.push({x:x0,y:0,ox:x0,oy:0,tx:target.x,ty:C.GROUND_Y,alive:true});
  }
  function stepEnemy(m,speed){ const dx=m.tx-m.x,dy=m.ty-m.y,d=Math.hypot(dx,dy)||1; m.x+=dx/d*speed; m.y+=dy/d*speed; }
  function fire(s,x,y){ if(s.over||y>=C.GROUND_Y) return false;
    let best=-1,bd=1e9; for(let i=0;i<s.bases.length;i++){ const b=s.bases[i]; if(b.ammo<=0) continue; const d=Math.abs(b.x-x); if(d<bd){bd=d;best=i;} }
    if(best<0) return false;                          // no base has ammo
    const b=s.bases[best]; b.ammo--;
    s.interceptors.push({x:b.x,y:C.GROUND_Y-10,ox:b.x,oy:C.GROUND_Y-10,tx:x,ty:y});
    return true;
  }
  function stepExplosion(e){ if(e.phase==="grow"){ e.r+=C.EXP_GROW; if(e.r>=C.EXP_MAX_R) e.phase="shrink"; } else { e.r-=C.EXP_GROW*0.8; if(e.r<0)e.r=0; } e.life--; }
  function explosionHits(e,m){ return e.life>0 && e.r>0 && m.alive && dist(e.x,e.y,m.x,m.y)<=e.r; }
  function cityIndexAtX(cities,x){ let best=-1,bd=1e9; for(let i=0;i<cities.length;i++){ const d=Math.abs(x-cities[i].x); if(d<bd){bd=d;best=i;} } return best; }

  function tick(s){
    if(s.over) return s;
    if(s.waveLeftToSpawn>0){ s.spawnTimer--; if(s.spawnTimer<=0){ spawnEnemy(s); s.waveLeftToSpawn--; s.spawnTimer=s.spawnEvery; } }
    for(const m of s.enemies){ if(!m.alive) continue; stepEnemy(m,s.enemySpeed);
      if(m.y>=C.GROUND_Y){ m.alive=false; m.landed=true; const ci=cityIndexAtX(s.cities,m.x); if(ci>=0&&s.cities[ci].alive) s.cities[ci].alive=false; } }
    for(const it of s.interceptors){ if(stepInterceptor(it)){ it.done=true; s.explosions.push({x:it.tx,y:it.ty,r:1,phase:"grow",life:C.EXP_LIFE}); } }
    s.interceptors=s.interceptors.filter(it=>!it.done);
    for(const e of s.explosions) stepExplosion(e);
    for(const e of s.explosions){ if(e.life<=0) continue; for(const m of s.enemies){ if(explosionHits(e,m)){ m.alive=false; s.score+=25; } } }
    s.enemies=s.enemies.filter(m=>m.alive);
    s.explosions=s.explosions.filter(e=>e.life>0);
    // Breather between waves: hold for 2 seconds and announce the next one.
    if(s.waveLeftToSpawn===0 && s.enemies.length===0 && s.explosions.length===0 && s.interceptors.length===0){
      if(s.intermission==null) s.intermission=C.INTERMISSION;
      if(s.intermission>0){ s.intermission--; }
      else { s.intermission=null; startWave(s); }
    }
    if(s.cities.every(c=>!c.alive)) s.over=true;
    return s;
  }
  window.__mc={ newGame, startWave, spawnEnemy, stepEnemy, fire, stepExplosion, explosionHits, cityIndexAtX, tick, dist, C };

  if(typeof document==="undefined") return;
  const $=(id)=>document.getElementById(id);
  const cv=$("game"), ctx=cv.getContext("2d");
  let s=newGame(), best=null, pointer={x:180,y:120};
  try{ best=parseInt(localStorage.getItem("mc_best")||"")||null; }catch(e){}

  function draw(){
    ctx.clearRect(0,0,C.W,C.H); ctx.fillStyle="#05060f"; ctx.fillRect(0,0,C.W,C.H);
    ctx.fillStyle="#233"; for(let i=0;i<50;i++){ const x=(i*97)%C.W,y=(i*53)%(C.GROUND_Y-20); ctx.fillRect(x,y,1,1); }
    ctx.fillStyle="#2b2f4d"; ctx.fillRect(0,C.GROUND_Y,C.W,C.H-C.GROUND_Y);
    for(const c of s.cities){ if(c.alive){
        ctx.fillStyle="#b45309"; ctx.fillRect(c.x-14,C.GROUND_Y-16,28,16);                       // coop body
        ctx.fillStyle="#dc2626"; ctx.beginPath();                                                 // pitched roof
        ctx.moveTo(c.x-17,C.GROUND_Y-16); ctx.lineTo(c.x,C.GROUND_Y-26); ctx.lineTo(c.x+17,C.GROUND_Y-16); ctx.closePath(); ctx.fill();
        ctx.fillStyle="#78350f"; ctx.fillRect(c.x-5,C.GROUND_Y-11,10,11);                         // doorway
        ctx.fillStyle="#facc15"; ctx.beginPath(); ctx.arc(c.x,C.GROUND_Y-6,3,0,7); ctx.fill(); }  // hen peeking out
      else { ctx.fillStyle="#3a2f2f"; ctx.fillRect(c.x-12,C.GROUND_Y-5,24,5); } }
    // missile bases with ammo count
    for(const b of s.bases){ ctx.fillStyle=b.ammo>0?"#34d399":"#3a2f2f"; ctx.beginPath(); ctx.moveTo(b.x-12,C.GROUND_Y); ctx.lineTo(b.x+12,C.GROUND_Y); ctx.lineTo(b.x,C.GROUND_Y-14); ctx.closePath(); ctx.fill();
      ctx.fillStyle=b.ammo>0?"#e6e6f0":"#8a8f9a"; ctx.font="bold 10px system-ui"; ctx.textAlign="center"; ctx.fillText(b.ammo, b.x, C.GROUND_Y-17); }
    for(const it of s.interceptors){ ctx.strokeStyle="rgba(52,211,153,.6)"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(it.ox,it.oy); ctx.lineTo(it.x,it.y); ctx.stroke();
      ctx.fillStyle="#34d399"; ctx.beginPath(); ctx.arc(it.x,it.y,2,0,7); ctx.fill(); ctx.strokeStyle="rgba(52,211,153,.4)"; ctx.strokeRect(it.tx-3,it.ty-3,6,6); }
    for(const m of s.enemies){ ctx.strokeStyle="rgba(244,63,94,.5)"; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(m.ox,m.oy); ctx.lineTo(m.x,m.y); ctx.stroke();
      ctx.fillStyle="#f43f5e"; ctx.beginPath(); ctx.arc(m.x,m.y,2.5,0,7); ctx.fill(); }
    for(const e of s.explosions){ const g=ctx.createRadialGradient(e.x,e.y,0,e.x,e.y,Math.max(1,e.r));
      g.addColorStop(0,"rgba(255,255,255,.95)"); g.addColorStop(.5,"rgba(34,211,238,.7)"); g.addColorStop(1,"rgba(124,92,255,0)");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(e.x,e.y,Math.max(1,e.r),0,7); ctx.fill(); }
    if(!s.over){ ctx.strokeStyle="rgba(255,255,255,.5)"; ctx.lineWidth=1; ctx.beginPath();
      ctx.moveTo(pointer.x-6,pointer.y); ctx.lineTo(pointer.x+6,pointer.y); ctx.moveTo(pointer.x,pointer.y-6); ctx.lineTo(pointer.x,pointer.y+6); ctx.stroke(); }
    // Between-wave announcement, jittering a couple of pixels each frame.
    if(!s.over && s.intermission>0){
      const j=()=>(Math.random()-0.5)*5;
      ctx.font="bold 24px system-ui"; ctx.textAlign="center";
      ctx.fillStyle="rgba(244,63,94,.55)"; ctx.fillText("NEXT WAVE COMING",C.W/2+j(),C.H/2+j());
      ctx.fillStyle="#ffcf5a";            ctx.fillText("NEXT WAVE COMING",C.W/2+j(),C.H/2+j());
      ctx.fillStyle="#e6e6f0"; ctx.font="13px system-ui";
      ctx.fillText("Wave "+(s.wave+1)+" · ammo reloaded",C.W/2,C.H/2+24);
    }
    if(s.over){ ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillRect(0,0,C.W,C.H); ctx.fillStyle="#f43f5e"; ctx.font="bold 26px system-ui"; ctx.textAlign="center"; ctx.fillText("GAME OVER",C.W/2,C.H/2-6);
      ctx.fillStyle="#e6e6f0"; ctx.font="14px system-ui"; ctx.fillText("Score "+s.score+(best?"  ·  Best "+best:""),C.W/2,C.H/2+18); }
  }
  function hud(){ $("score").textContent=s.score; $("wave").textContent=s.wave; $("cities").textContent=s.cities.filter(c=>c.alive).length; }
  function frame(){ tick(s);
    if(s.over && best!==s.score){ if(!best||s.score>best){ best=s.score; try{localStorage.setItem("mc_best",String(best));}catch(e){} $("msg").textContent="💥 All cities lost. Score "+s.score+" — New Game to retry."; } }
    draw(); hud(); requestAnimationFrame(frame); }

  function canvasXY(ev){ const r=cv.getBoundingClientRect(); const cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left, cy=(ev.touches?ev.touches[0].clientY:ev.clientY)-r.top;
    return { x:cx*(C.W/r.width), y:cy*(C.H/r.height) }; }
  cv.addEventListener("mousemove",(e)=>{ pointer=canvasXY(e); });
  function shoot(p){ pointer=p; if(!fire(s,p.x,p.y) && !s.over && p.y<C.GROUND_Y && s.bases.every(b=>b.ammo<=0)) $("msg").textContent="Out of ammo — reloads next wave!"; }
  cv.addEventListener("mousedown",(e)=>{ e.preventDefault(); shoot(canvasXY(e)); });
  cv.addEventListener("touchstart",(e)=>{ e.preventDefault(); shoot(canvasXY(e)); },{passive:false});
  $("new").addEventListener("click",()=>{ s=newGame(); $("msg").textContent="Tap to detonate an interceptor and destroy incoming missiles."; });
  requestAnimationFrame(frame);
})();
</script>
<script src="/comments.js" defer></script>
</body>
</html>
