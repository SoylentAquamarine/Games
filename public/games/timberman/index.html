<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Timber! — Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>🪓</text></svg>" />
<style>
  :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;--bad:#f43f5e;--good:#34d399;}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
    background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.2),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.14),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;touch-action:none;}
  .wrap{max-width:420px;margin:0 auto;padding:14px 12px 30px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
  .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
  .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
  h1{margin:0;font-size:1.3rem;background:linear-gradient(120deg,#8ad48a,#c9a06a);-webkit-background-clip:text;background-clip:text;color:transparent}
  .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer}
  canvas{width:min(92vw,320px);height:calc(min(92vw,320px)*1.5);border-radius:10px;border:2px solid #2a2f55;background:#0c1420;cursor:pointer;touch-action:none}
  .msg{min-height:1.3em;font-weight:800;text-align:center}
  .ctl{display:flex;gap:12px}
  .cbtn{background:var(--panel);color:var(--text);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:14px 30px;font-weight:800;font-size:1.1rem;cursor:pointer;user-select:none}
  .cbtn:active{background:var(--accent);color:#0b0c1a}
  .hint{font-size:.78rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="home" href="/">← Home</a><h1>Timber!</h1><button class="btn" id="new">New Game</button></div>
  <canvas id="game" width="240" height="360"></canvas>
  <div class="msg" id="msg">Chop fast! Tap the side away from the branches. Don't let the timer run out.</div>
  <div class="ctl"><button class="cbtn" id="bl">◀ Chop</button><button class="cbtn" id="br">Chop ▶</button></div>
  <div class="hint">Tap the left/right side of the tree, the buttons, or ← →</div>
</div>
<script src="/arcade.js"></script>
<script>
(function(){
  const C={ TRUNK_LEN:9, TIMER_MAX:100, TIMER_GAIN:15, TIMER_DRAIN:0.4 };
  function genBlock(){ const r=Math.random(); return { branch: r<0.32?"left":r<0.64?"right":"none" }; }
  function newState(){ const trunk=[{branch:"none"},{branch:"none"}]; while(trunk.length<C.TRUNK_LEN) trunk.push(genBlock());
    return { trunk, score:0, timer:C.TIMER_MAX, side:"left", over:false, started:false }; }
  function chop(s, side){ if(s.over) return s; s.started=true; s.side=side;
    const nb=s.trunk[1]; if(nb && nb.branch===side){ s.over=true; return s; }
    s.trunk.shift(); s.trunk.push(genBlock()); s.score++; s.timer=Math.min(C.TIMER_MAX,s.timer+C.TIMER_GAIN); return s; }
  function tickTimer(s, amt){ if(s.over||!s.started) return s; s.timer-=amt; if(s.timer<=0){ s.timer=0; s.over=true; } return s; }
  window.__timberman={ newState, chop, tickTimer, genBlock, C };

  if(typeof document==="undefined") return;
  const $=(id)=>document.getElementById(id);
  const cv=$("game"), ctx=cv.getContext("2d"); const W=cv.width,H=cv.height;
  // Hold the loop until the player asks for it (comment: Press Spacebar To Begin)
  const GATE = Arcade.startGate(cv, "Timber Chicken");
  let s=newState(), best=0, shake=0;
  try{ best=parseInt(localStorage.getItem("timber_best")||"0")||0; }catch(e){}
  const BW=46, BH=40, TX=W/2;

  function draw(){
    ctx.clearRect(0,0,W,H); ctx.fillStyle="#0c1420"; ctx.fillRect(0,0,W,H);
    // timer bar
    ctx.fillStyle="#20244a"; ctx.fillRect(20,12,W-40,10); ctx.fillStyle=s.timer>30?"#34d399":"#f43f5e"; ctx.fillRect(20,12,(W-40)*(s.timer/C.TIMER_MAX),10);
    const ox=shake>0?(Math.random()*6-3):0; if(shake>0)shake--;
    // trunk
    for(let i=0;i<7;i++){ const b=s.trunk[i]; if(!b) continue; const y=H-56-i*BH;
      ctx.fillStyle="#7a4a24"; ctx.fillRect(TX-BW/2+ox,y,BW,BH-2); ctx.fillStyle="#5c3a18"; ctx.fillRect(TX-BW/2+ox,y+BH/2-2,BW,3);
      if(b.branch==="left"){ ctx.fillStyle="#5c3a18"; ctx.fillRect(TX-BW/2-34+ox,y+8,34,12); ctx.fillStyle="#3f8f4f"; ctx.beginPath(); ctx.arc(TX-BW/2-34+ox,y+14,14,0,7); ctx.fill(); }
      if(b.branch==="right"){ ctx.fillStyle="#5c3a18"; ctx.fillRect(TX+BW/2+ox,y+8,34,12); ctx.fillStyle="#3f8f4f"; ctx.beginPath(); ctx.arc(TX+BW/2+34+ox,y+14,14,0,7); ctx.fill(); }
    }
    // lumberjack
    const lx = s.side==="left" ? TX-BW/2-26 : TX+BW/2+26; const ly=H-52;
    ctx.fillStyle=s.over?"#f43f5e":"#22d3ee"; ctx.fillRect(lx-8,ly,16,22); ctx.beginPath(); ctx.arc(lx,ly-6,8,0,7); ctx.fill();
    ctx.fillStyle="#c9a06a"; const ax=s.side==="left"?lx+8:lx-14; ctx.fillRect(ax,ly-2,8,4);
    // score
    ctx.fillStyle="#e6e6f0"; ctx.font="bold 22px system-ui"; ctx.textAlign="center"; ctx.fillText(s.score, W/2, 44);
    if(s.over){ ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillRect(0,0,W,H); ctx.fillStyle="#f43f5e"; ctx.font="bold 22px system-ui"; ctx.fillText("TIMBER!",W/2,H/2-6); ctx.fillStyle="#e6e6f0"; ctx.font="14px system-ui"; ctx.fillText("Score "+s.score+"  ·  Best "+best,W/2,H/2+16); }
    else if(!s.started){ ctx.fillStyle="#9a9ab5"; ctx.font="13px system-ui"; ctx.fillText("tap a side to chop",W/2,H/2); }
  }
  function frame(){
    if(!GATE.open){ draw(); GATE.paint(); return requestAnimationFrame(frame); } tickTimer(s,C.TIMER_DRAIN);
    if(typeof Arcade!=="undefined")Arcade.stats.record("timberman",s.score); if(s.over && s.score>best){ best=s.score; try{localStorage.setItem("timber_best",String(best));}catch(e){} $("msg").textContent="🪓 Down it goes! Score "+s.score+"  ·  Best "+best; }
    draw(); requestAnimationFrame(frame); }
  function doChop(side){ if(s.over) return; shake=4; chop(s,side); }
  cv.addEventListener("mousedown",(e)=>{ const r=cv.getBoundingClientRect(); doChop((e.clientX-r.left)<r.width/2?"left":"right"); });
  cv.addEventListener("touchstart",(e)=>{ e.preventDefault(); const r=cv.getBoundingClientRect(); doChop((e.touches[0].clientX-r.left)<r.width/2?"left":"right"); },{passive:false});
  $("bl").addEventListener("click",()=>doChop("left")); $("br").addEventListener("click",()=>doChop("right"));
  addEventListener("keydown",(e)=>{ if(e.key==="ArrowLeft"||e.key==="a")doChop("left"); else if(e.key==="ArrowRight"||e.key==="d")doChop("right"); });
  $("new").addEventListener("click",()=>{ s=newState(); $("msg").textContent="Chop fast! Tap the side away from the branches."; });
  requestAnimationFrame(frame);
})();
</script>
<script src="/comments.js" defer></script>
</body>
</html>
