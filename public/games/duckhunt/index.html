<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Duck Hunt — Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>🦆</text></svg>" />
<style>
  :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;--bad:#f43f5e;}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
    background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.2),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.14),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;touch-action:none;}
  .wrap{max-width:460px;margin:0 auto;padding:14px 12px 30px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
  .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
  .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
  h1{margin:0;font-size:1.3rem;background:linear-gradient(120deg,#8ad48a,#ffcf5a);-webkit-background-clip:text;background-clip:text;color:transparent}
  .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer}
  .hud{width:100%;max-width:360px;display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
  .hud b{color:var(--text)}
  canvas{width:min(94vw,360px);height:calc(min(94vw,360px)*0.75);image-rendering:pixelated;border-radius:10px;border:2px solid #2a2f55;background:#12305a;cursor:crosshair;touch-action:none}
  .msg{min-height:1.3em;font-weight:800;text-align:center}
  .hint{font-size:.78rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="home" href="/">← Home</a><h1>Duck Hunt</h1><button class="btn" id="new">New Game</button></div>
  <div class="hud"><span>Score: <b id="score">0</b></span><span>Ammo: <b id="ammo">3</b></span><span>Escaped: <b id="miss">0</b>/3</span></div>
  <canvas id="game" width="320" height="240"></canvas>
  <div class="msg" id="msg">Click / tap the ducks before they fly away. 3 shots each!</div>
  <div class="hint">3 ducks escape and it's game over</div>
</div>
<script>
(function(){
  const C={ W:320,H:240, GROUND:206, DUCK_W:24, DUCK_H:20, AMMO:3, SPEED:1.5 };
  function spawnDuck(level){ const x=40+Math.random()*(C.W-80), goRight=Math.random()<.5;
    const sp=C.SPEED+level*0.12; return { x, y:C.GROUND-10, vx:(goRight?1:-1)*sp*(0.8+Math.random()*0.6), vy:-(sp*(0.7+Math.random()*0.5)), alive:true, falling:false, escaped:false }; }
  function newState(){ return { duck:spawnDuck(0), ammo:C.AMMO, score:0, hits:0, miss:0, level:0, over:false }; }
  function hitDuck(d, x, y){ return d.alive && !d.falling && x>=d.x-C.DUCK_W/2 && x<=d.x+C.DUCK_W/2 && y>=d.y-C.DUCK_H/2 && y<=d.y+C.DUCK_H/2; }
  function next(s){ s.level++; s.duck=spawnDuck(s.level); s.ammo=C.AMMO; }
  function shoot(s, x, y){
    if(s.over || s.ammo<=0 || !s.duck.alive || s.duck.falling) return false;
    s.ammo--;
    if(hitDuck(s.duck,x,y)){ s.duck.falling=true; s.duck.vx=0; s.duck.vy=0; s.score += 10; s.hits++; return true; }
    if(s.ammo<=0){ s.duck.escaped=true; } // out of ammo -> it gets away
    return false;
  }
  function step(s){
    if(s.over) return s;
    const d=s.duck;
    if(d.falling){ d.vy+=0.5; d.y+=d.vy; if(d.y>C.GROUND){ next(s); } return s; }
    if(d.escaped){ d.vy=-3.2; d.falling=false; d.y+=d.vy; if(d.y< -C.DUCK_H){ s.miss++; if(s.miss>=3){ s.over=true; } else next(s); } return s; }
    d.x+=d.vx; d.y+=d.vy;
    if(d.x<C.DUCK_W/2){ d.x=C.DUCK_W/2; d.vx=Math.abs(d.vx); } if(d.x>C.W-C.DUCK_W/2){ d.x=C.W-C.DUCK_W/2; d.vx=-Math.abs(d.vx); }
    if(d.y<C.DUCK_H/2){ d.y=C.DUCK_H/2; d.vy=Math.abs(d.vy)*0.6; }
    if(d.y>C.GROUND-6){ d.y=C.GROUND-6; d.vy=-Math.abs(d.vy); }
    if(d.x<=C.DUCK_W/2||d.x>=C.W-C.DUCK_W/2){ /* bounce keeps it in play */ }
    return s;
  }
  window.__duckhunt={ newState, step, shoot, hitDuck, spawnDuck, C };

  if(typeof document==="undefined") return;
  const $=(id)=>document.getElementById(id);
  const cv=$("game"), ctx=cv.getContext("2d");
  let s=newState(), best=0, flash=0;
  try{ best=parseInt(localStorage.getItem("duckhunt_best")||"0")||0; }catch(e){}

  function draw(){
    ctx.clearRect(0,0,C.W,C.H);
    const g=ctx.createLinearGradient(0,0,0,C.GROUND); g.addColorStop(0,"#12305a"); g.addColorStop(1,"#3b6ea5"); ctx.fillStyle=g; ctx.fillRect(0,0,C.W,C.GROUND);
    ctx.fillStyle="#e6e6f0"; ctx.fillRect(40,40,34,10); ctx.fillRect(60,32,30,10); ctx.fillRect(220,54,40,10);
    ctx.fillStyle="#2f6b34"; ctx.fillRect(0,C.GROUND,C.W,C.H-C.GROUND); ctx.fillStyle="#215024"; for(let x=0;x<C.W;x+=18) ctx.fillRect(x,C.GROUND-6,10,8);
    const d=s.duck;
    if(d.alive){ ctx.save(); ctx.translate(d.x,d.y);
      ctx.fillStyle=d.falling?"#b98a2a":"#8ad48a"; ctx.fillRect(-C.DUCK_W/2,-C.DUCK_H/2,C.DUCK_W,C.DUCK_H-4);
      ctx.fillStyle="#5a9a4a"; ctx.fillRect(C.DUCK_W/2-4,-C.DUCK_H/2,4,6); ctx.fillStyle="#ffcf5a"; ctx.fillRect(C.DUCK_W/2,-2,5,3);
      ctx.fillStyle="#0b0c1a"; ctx.fillRect(C.DUCK_W/2-6,-4,2,2);
      const wf=Math.floor(Date.now()/90)%2; ctx.fillStyle="#cfeecf"; ctx.fillRect(-4,wf?-8:2,10,5);
      ctx.restore();
      if(d.falling){ ctx.fillStyle="#fff"; ctx.font="bold 12px system-ui"; ctx.textAlign="center"; ctx.fillText("+10",d.x,d.y-16); } }
    if(flash>0){ ctx.fillStyle="rgba(255,255,255,"+(flash/6*.4)+")"; ctx.fillRect(0,0,C.W,C.H); flash--; }
    if(s.over){ ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillRect(0,0,C.W,C.H); ctx.fillStyle="#f43f5e"; ctx.font="bold 22px system-ui"; ctx.textAlign="center"; ctx.fillText("GAME OVER",C.W/2,C.H/2-4); ctx.fillStyle="#e6e6f0"; ctx.font="14px system-ui"; ctx.fillText("Score "+s.score+(best?"  ·  Best "+best:""),C.W/2,C.H/2+18); }
  }
  function hud(){ $("score").textContent=s.score; $("ammo").textContent=s.ammo; $("miss").textContent=s.miss; }
  function frame(){ step(s);
    if(s.over && s.score>best){ best=s.score; try{localStorage.setItem("duckhunt_best",String(best));}catch(e){} $("msg").textContent="🦆 They got away! Score "+s.score+". New Game to retry."; }
    draw(); hud(); requestAnimationFrame(frame); }
  function fire(ev){ if(s.over) return; const r=cv.getBoundingClientRect(); const x=((ev.touches?ev.touches[0].clientX:ev.clientX)-r.left)*(C.W/r.width), y=((ev.touches?ev.touches[0].clientY:ev.clientY)-r.top)*(C.H/r.height);
    flash=6; shoot(s,x,y); }
  cv.addEventListener("mousedown",fire); cv.addEventListener("touchstart",(e)=>{ e.preventDefault(); fire(e); },{passive:false});
  $("new").addEventListener("click",()=>{ s=newState(); $("msg").textContent="Click / tap the ducks before they fly away!"; });
  requestAnimationFrame(frame);
})();
</script>
<script src="/comments.js" defer></script>
</body>
</html>
