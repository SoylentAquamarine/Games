<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Chicken Climb — Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>🥚</text></svg>" />
<style>
  :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;--bad:#f43f5e;}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
    background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.2),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.14),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;touch-action:none;}
  .wrap{max-width:400px;margin:0 auto;padding:14px 12px 30px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
  .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
  .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
  h1{margin:0;font-size:1.3rem;background:linear-gradient(120deg,#f0902a,#ffcf5a);-webkit-background-clip:text;background-clip:text;color:transparent}
  .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer}
  .hud{width:100%;max-width:320px;display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
  .hud b{color:var(--text)}
  canvas{width:min(94vw,420px);height:calc(min(94vw,420px)*1.25);image-rendering:pixelated;border-radius:10px;border:2px solid #2a2f55;background:#08040f;touch-action:none}
  .msg{min-height:1.3em;font-weight:800;text-align:center}
  .ctl{display:flex;gap:8px;align-items:center}
  .dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:4px}
  .dpad button{background:var(--panel);color:var(--text);border:1px solid rgba(255,255,255,.1);border-radius:9px;font-size:1.1rem;cursor:pointer;user-select:none}
  .dpad button:active{background:var(--accent);color:#0b0c1a}
  .dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .dn{grid-area:3/2}.dpad .r{grid-area:2/3}
  .jump{background:var(--accent-2);color:#0b0c1a;border:none;border-radius:14px;padding:18px 16px;font-weight:800;cursor:pointer;user-select:none}
  .hint{font-size:.78rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="home" href="/">← Home</a><h1>🥚 Chicken Climb</h1><button class="btn" id="new">New Game</button></div>
  <div class="hud"><span>Score: <b id="score">0</b></span><span>Level: <b id="level">1</b></span><span>Board: <b id="board">Girders</b></span><span>Lives: <b id="lives">3</b></span><span>Best: <b id="best">0</b></span></div>
  <canvas id="game" width="360" height="450"></canvas>
  <div class="msg" id="msg">Climb up and touch the hen — jump the eggs rolling down!</div>
  <div class="ctl">
    <div class="dpad"><button class="u" data-d="up">▲</button><button class="l" data-d="left">◀</button><button class="dn" data-d="down">▼</button><button class="r" data-d="right">▶</button></div>
    <button class="jump" id="jump">JUMP</button>
  </div>
  <div class="hint">Arrows/WASD move & climb ladders · Space/JUMP hops eggs</div>
</div>
<script src="/arcade.js"></script>
<script src="/mascots.js"></script>
<script>
(function(){
  // cols/rows are structural (the fixed ladder layout depends on them) and
  // deliberately NOT in the admin allowlist below — only the difficulty
  // knobs are. Same C-object + localStorage-override pattern every other
  // configurable game on the site uses (e.g. kaboom); see
  // /admin/games/?game=dk.
  const C={ cols:12, rows:6, DEATH_FRAMES:50, BELT_FLIP_AT:280, FLYBY_EVERY:5 };
  (function(){ try{
    const allow=["DEATH_FRAMES","BELT_FLIP_AT","FLYBY_EVERY"];
    const o=JSON.parse(localStorage.getItem("dk_config")||"{}");
    for(const k of allow) if(typeof o[k]==="number") C[k]=o[k];
  }catch(_){} })();
  const LADDERS=[{col:9,lower:5,upper:4},{col:2,lower:4,upper:3},{col:9,lower:3,upper:2},{col:4,lower:2,upper:1},{col:8,lower:1,upper:0}];
  // The hen (goal) sits at row 0, col HEN_COL. Player feedback: "the goal
  // needs to be for me to pluck the chicken's tail feathers, so I have to
  // touch the chicken to win" — reaching row 0 anywhere used to be enough;
  // now you have to actually walk over to her column too.
  const HEN_COL=1;
  // Player feedback (follow-up, after being asked which 2 board types to
  // add): "conveyor belts + elevators (classic)". 3 board types now cycle
  // by level, same ladder layout/win-by-touching-the-hen framework
  // reused across all of them so completability doesn't need re-proving —
  // each type changes ONE real mechanic, not just a palette swap:
  //  - "girders" (board 1, unchanged): sloped platforms, eggs always roll
  //    downhill per row.
  //  - "conveyor" (board 2): flat belts. Eggs roll a FIXED direction per
  //    row that has nothing to do with slope — and every row's direction
  //    flips AT ONCE partway through the level (BELT_FLIP_AT), a real
  //    surprise reversal distinct from board 1's fixed alternation.
  //  - "elevator" (board 3): flat platforms with rivets embedded in the
  //    middle 4 girders. Walking over a rivet pops it (+score); popping
  //    every rivet collapses the board and clears the level immediately —
  //    an alternate win condition alongside touching the hen (in case a
  //    rivet spot ever reads as awkward to reach, touching the hen still
  //    always works too), matching the original arcade's rivet stage.
  const BOARD_CYCLE=["girders","conveyor","elevator"];
  function boardTypeFor(level){ return BOARD_CYCLE[(level-1)%BOARD_CYCLE.length]; }
  const BOARD_LABEL={girders:"Girders",conveyor:"Conveyor",elevator:"Elevators"};
  const RIVET_ROWS=[1,2,3,4], RIVET_COLS=[3,8];
  function makeRivets(){ const r=[]; for(const row of RIVET_ROWS) for(const col of RIVET_COLS) r.push({row,col,taken:false}); return r; }
  function makeBeltDirs(){ const d=[]; for(let r=0;r<C.rows;r++) d.push(rowDir(r)); return d; }
  const FLY_W=30, FLY_H=22, WIN_FRAMES=90;
  function spawnStart(level){ return Math.max(50, 90-(level-1)*6); }
  // The ongoing gap between eggs also has to shrink with level — the delay
  // after each egg used to reset to a flat 190-280 frame range regardless
  // of level, which meant the difficulty curve only ever applied to the
  // very first egg of a run.
  function spawnGap(level){ return Math.max(90, 220-(level-1)*12) + Math.floor(Math.random()*90); }
  function ladderAt(s,col,row,dir){ if(dir==="up") return s.ladders.find(L=>L.lower===row&&L.col===col)||null; return s.ladders.find(L=>L.upper===row&&L.col===col)||null; }
  function newState(){
    const level=1, boardType=boardTypeFor(level);
    return { ladders:LADDERS.map(l=>({...l})), player:{col:1,row:C.rows-1,jump:0,climb:0,dying:0}, barrels:[], score:0, lives:3, level, boardType,
      beltDirs: boardType==="conveyor" ? makeBeltDirs() : null, beltFlipT:C.BELT_FLIP_AT, beltFlipped:false,
      rivets: boardType==="elevator" ? makeRivets() : null,
      over:false, won:false, winT:0, flyby:null, spawnT:spawnStart(1) }; }
  function resetPlayer(s){ s.player.col=1; s.player.row=C.rows-1; s.player.jump=0; s.player.climb=0; s.player.dying=0; }
  // Starts the next level, cycling the board type: fresh barrels, faster spawn
  // rate, a flyby cameo every FLYBY_EVERY levels, and a fresh belt/rivet setup
  // if the new board is a conveyor/elevator level.
  function nextLevel(s){
    s.level++; s.won=false; s.barrels=[]; s.spawnT=spawnStart(s.level);
    s.boardType=boardTypeFor(s.level);
    s.beltDirs = s.boardType==="conveyor" ? makeBeltDirs() : null;
    s.beltFlipT = C.BELT_FLIP_AT; s.beltFlipped=false;
    s.rivets = s.boardType==="elevator" ? makeRivets() : null;
    resetPlayer(s);
    if(s.level % C.FLYBY_EVERY === 0 && !s.flyby) s.flyby=spawnFlyby();
  }
  // Counts down the win celebration; when it finishes, starts the next
  // level. Returns true while still celebrating (caller should freeze
  // normal play for that frame) — the same pattern stepDying already uses.
  function stepWinning(s){ if(s.winT<=0) return false;
    if(--s.winT<=0){ nextLevel(s); }
    return true; }
  function spawnFlyby(){ const goRight=Math.random()<0.5;
    return { x: goRight?-FLY_W:C.cols*100+FLY_W, y: 20+Math.random()*30, vx:(goRight?1:-1)*1.6 }; }
  function move(s, dir){ if(s.over||s.won||s.player.dying>0) return s; const p=s.player;
    if(dir==="left") p.col=Math.max(0,p.col-1);
    else if(dir==="right") p.col=Math.min(C.cols-1,p.col+1);
    else if(dir==="up"){ const l=ladderAt(s,p.col,p.row,"up"); if(l){ p.row=l.upper; p.climb=32; } }
    else if(dir==="down"){ const l=ladderAt(s,p.col,p.row,"down"); if(l){ p.row=l.lower; p.climb=32; } }
    if(p.row===0 && p.col===HEN_COL){ s.won=true; s.winT=WIN_FRAMES; s.score+=500; }
    return s; }
  const JUMP_FRAMES=34, JUMP_APEX=30;      // longer, higher, and shaped like an arc
  function jump(s){ if(!s.over&&!s.won&&s.player.dying<=0 && s.player.jump<=0) s.player.jump=JUMP_FRAMES; return s; }
  // Height above the girder at this point in the jump: a parabola peaking mid-flight.
  function jumpHeight(p){
    if(!p.jump||p.jump<=0) return 0;
    const u=1-(p.jump/JUMP_FRAMES);        // 0 at take-off, 1 on landing
    return 4*JUMP_APEX*(u-u*u);
  }
  // Girders alternate their slope row to row. An egg always rolls DOWN its
  // girder — it used to keep whatever direction it had, so on half the rows it
  // visibly rolled uphill.
  const rowDir=(row)=>(row%2?-1:1);                       // +1 = falls to the right
  // On the girders/elevator boards this is just "downhill" (gravity via
  // slope). On the conveyor board it's whatever direction that row's belt
  // is currently running — independent of row parity, and flips for every
  // row at once when stepBelt() fires (see BELT_FLIP_AT).
  function beltDirFor(s,row){ return s.boardType==="conveyor" ? s.beltDirs[row] : rowDir(row); }
  function spawnBarrel(s){ s.barrels.push({col:0,row:0,dir:beltDirFor(s,0),dodged:false}); }
  function barrelStep(s){ for(const b of s.barrels){
      b.dir=beltDirFor(s,b.row);
      const atEnd=(b.dir>0&&b.col>=C.cols-1)||(b.dir<0&&b.col<=0);
      if(atEnd){
        // drop to the girder below, or off the bottom of the screen and gone
        if(b.row<C.rows-1){ b.row++; b.dir=beltDirFor(s,b.row); } else b.remove=true;
      }
      else { const l=s.ladders.find(L=>L.upper===b.row&&L.col===b.col);
        if(l&&Math.random()<0.3){ b.row=l.lower; b.dir=beltDirFor(s,b.row); } else b.col+=b.dir; } }
    s.barrels=s.barrels.filter(b=>!b.remove); return s; }
  // Conveyor board only: every row's belt direction flips at once, once
  // per level, partway through — a surprise reversal that has nothing to
  // do with row parity (unlike the girders board's fixed alternation).
  function stepBelt(s){
    if(s.boardType!=="conveyor"||s.beltFlipped) return s;
    if(--s.beltFlipT<=0){ s.beltDirs=s.beltDirs.map(d=>-d); s.beltFlipped=true; }
    return s;
  }
  // Elevator board only: walking onto a rivet pops it; popping every rivet
  // on the board collapses it and clears the level immediately, alongside
  // (not instead of) the usual touch-the-hen win.
  function checkRivets(s){
    if(!s.rivets||s.won||s.over||s.player.dying>0) return s;
    const p=s.player;
    for(const rv of s.rivets){ if(!rv.taken&&rv.row===p.row&&rv.col===p.col){ rv.taken=true; s.score+=50; } }
    if(s.rivets.length && s.rivets.every(rv=>rv.taken)){ s.won=true; s.winT=WIN_FRAMES; s.score+=500; }
    return s;
  }
  // A hit costs a life immediately (for the HUD) but the reset/game-over is
  // deferred until the death animation (DEATH_FRAMES) finishes — see stepDying.
  function collide(s){ if(s.player.dying>0) return s;
    for(const b of s.barrels){ if(b.col===s.player.col&&b.row===s.player.row){
      if(s.player.jump>0){ if(!b.dodged){ b.dodged=true; s.score+=100; } }
      else { s.lives--; s.player.dying=C.DEATH_FRAMES; s.player.jump=0; return s; } } } return s; }
  // Counts down the death animation; when it finishes, respawns the farmer or,
  // if that was the last life, ends the run. Returns true while still dying (the
  // caller should freeze movement/barrels/collide for that frame).
  function stepDying(s){ if(s.player.dying<=0) return false;
    if(--s.player.dying<=0){ if(s.lives<=0){ s.over=true; } else { resetPlayer(s); } }
    return true; }
  // The admin config panel tunes C.DEATH_FRAMES/BELT_FLIP_AT/FLYBY_EVERY
  // (see /admin/games/?game=dk; C.cols/C.rows are structural, not exposed
  // as knobs). C is exported both nested (C) and spread flat (...C), so
  // G.BELT_FLIP_AT and G.C.BELT_FLIP_AT are both valid — existing tests
  // keep working unchanged.
  window.__dk={ newState, move, jump, jumpHeight, barrelStep, collide, ladderAt, spawnBarrel, resetPlayer, stepDying, nextLevel, stepWinning, spawnFlyby, spawnStart, spawnGap, C, ...C,
                JUMP_FRAMES, JUMP_APEX, WIN_FRAMES, HEN_COL,
                BOARD_CYCLE, boardTypeFor, RIVET_ROWS, RIVET_COLS, makeRivets, makeBeltDirs, stepBelt, checkRivets, beltDirFor };

  if(typeof document==="undefined") return;
  const $=(id)=>document.getElementById(id);
  const cv=$("game"), ctx=cv.getContext("2d"); const W=cv.width,H=cv.height, CW=W/C.cols, RH=H/C.rows;
  // Hold the loop until the player asks for it (comment: Press Spacebar To Begin)
  const GATE = Arcade.startGate(cv, "Chicken Kong");
  let s=newState(), best=0, barrelT=0, moveT=0, input=null;
  try{ best=parseInt(localStorage.getItem("dk_best")||"0")||0; }catch(e){}
  // Girders slope, alternating direction row to row, like the arcade cabinet
  // — but only on the "girders" board; conveyor/elevator boards are flat
  // (SLOPE collapses to 0), matching their own real mechanics instead of
  // reusing gravity-driven rolling. SLOPE is the total rise across the
  // full width.
  const SLOPE=16;
  const gy=(row,col)=>{ const base=row*RH+RH*0.72;
    const f2=(col==null?0.5:col/(C.cols-1));
    const slope = s.boardType==="girders" ? SLOPE : 0;
    return base + rowDir(row)*slope*(f2-0.5); };
  const cx=(col)=>col*CW+CW/2;

  // The game logic is cell-stepped, which looks jerky if drawn raw. Each entity keeps
  // an animated position that eases toward its logical cell; big jumps (row changes,
  // wrap-arounds, respawns) snap instead of sliding across the screen.
  function ease(o, tx, ty, k){
    if(o.ax==null || Math.abs(tx-o.ax)>CW*1.6 || Math.abs(ty-o.ay)>RH*1.2){ o.ax=tx; o.ay=ty; return; }
    o.ax+=(tx-o.ax)*k; o.ay+=(ty-o.ay)*k;
  }
  // The farmer walks at a steady pace instead of easing. Exponential ease restarts
  // from a near-stop at every cell, so it lurched fast-then-slow each step — that is
  // the "accelerates too much / jerky" feel. A constant-speed glide reads as walking.
  function glide(o, tx, ty, spx, spy){
    if(o.ax==null || Math.abs(tx-o.ax)>CW*1.6 || Math.abs(ty-o.ay)>RH*1.2){ o.ax=tx; o.ay=ty; return; }
    const dx=tx-o.ax, dy=ty-o.ay;
    o.ax += Math.abs(dx)<=spx ? dx : Math.sign(dx)*spx;
    o.ay += Math.abs(dy)<=spy ? dy : Math.sign(dy)*spy;
  }

  function draw(){
    ctx.clearRect(0,0,W,H); ctx.fillStyle="#08040f"; ctx.fillRect(0,0,W,H);
    // Girder tint identifies the board type at a glance: pink girders/sloped
    // (unchanged), teal flat conveyor belts, amber flat elevator platforms.
    const girderColor = s.boardType==="conveyor" ? "#22c3b0" : s.boardType==="elevator" ? "#c98a30" : "#c9558a";
    const beamMarkColor = s.boardType==="conveyor" ? "#4fe0cc" : s.boardType==="elevator" ? "#e0ab5a" : "#e07ab0";
    for(let r=0;r<C.rows;r++){
      const y0=gy(r,0)+6, y1=gy(r,C.cols-1)+6;
      ctx.strokeStyle=girderColor; ctx.lineWidth=5; ctx.lineCap="butt";
      ctx.beginPath(); ctx.moveTo(0,y0); ctx.lineTo(W,y1); ctx.stroke();
      ctx.strokeStyle=beamMarkColor; ctx.lineWidth=2;            // rivets along the beam (decorative)
      for(let x=0;x<W;x+=12){ const yy=y0+(y1-y0)*(x/W);
        ctx.beginPath(); ctx.moveTo(x,yy); ctx.lineTo(x+6,yy+(y1-y0)*(6/W)); ctx.stroke(); }
      // Conveyor board: small chevrons showing this row's CURRENT belt
      // direction, so the mid-level flip actually reads as a flip.
      if(s.boardType==="conveyor" && r<C.rows-1){
        const dir=s.beltDirs[r];
        ctx.fillStyle="#0b0c1a"; ctx.font="bold 10px system-ui"; ctx.textAlign="center";
        for(let bx=24;bx<W;bx+=48) ctx.fillText(dir>0?"▶":"◀", bx, y0-4);
      }
    }
    // Elevator board: unpopped rivets, drawn as bolt-heads sitting on their girder.
    if(s.rivets){
      for(const rv of s.rivets){ if(rv.taken) continue;
        const x=cx(rv.col), y=gy(rv.row,rv.col)+1;
        ctx.fillStyle="#3a2f1e"; ctx.beginPath(); ctx.arc(x,y,4,0,7); ctx.fill();
        ctx.strokeStyle="#e0ab5a"; ctx.lineWidth=1; ctx.stroke();
      }
    }
    for(const l of s.ladders){ ctx.strokeStyle="#22d3ee"; ctx.lineWidth=2;
      const x=cx(l.col), yTop=gy(l.upper,l.col)+8, yBot=gy(l.lower,l.col)+8;
      ctx.beginPath(); ctx.moveTo(x-6,yTop); ctx.lineTo(x-6,yBot); ctx.moveTo(x+6,yTop); ctx.lineTo(x+6,yBot); ctx.stroke();
      for(let y=yTop;y<yBot;y+=8){ ctx.beginPath(); ctx.moveTo(x-6,y); ctx.lineTo(x+6,y); ctx.stroke(); } }
    // goal / kong
    // the hen up top rolling eggs down, and the prize
    { const kx=cx(1), ky=gy(0,1)-14;
      ctx.fillStyle="#c96f14"; ctx.beginPath();                                   // tail
      ctx.moveTo(kx-9,ky+2); ctx.lineTo(kx-20,ky-8); ctx.lineTo(kx-9,ky+9); ctx.closePath(); ctx.fill();
      ctx.fillStyle="#dc2626";                                                     // comb
      ctx.fillRect(kx-4,ky-16,3,5); ctx.fillRect(kx,ky-18,3,7); ctx.fillRect(kx+4,ky-16,3,5);
      ctx.fillStyle="#facc15"; ctx.beginPath(); ctx.ellipse(kx,ky,13,10,0,0,7); ctx.fill();
      ctx.fillStyle="#fde68a"; ctx.beginPath(); ctx.ellipse(kx-1,ky+2,7,5,0,0,7); ctx.fill();
      ctx.fillStyle="#0b0c1a"; ctx.beginPath(); ctx.arc(kx+6,ky-5,2,0,7); ctx.fill();
      ctx.fillStyle="#fb923c"; ctx.beginPath();                                    // beak
      ctx.moveTo(kx+11,ky-4); ctx.lineTo(kx+20,ky-1); ctx.lineTo(kx+11,ky+2); ctx.closePath(); ctx.fill();
      ctx.fillStyle="#dc2626"; ctx.beginPath(); ctx.arc(kx+11,ky+4,3,0,7); ctx.fill(); }
    ctx.font="20px system-ui"; ctx.textAlign="center"; ctx.fillText("🥚",cx(3),gy(0,3)-4);
    for(const b of s.barrels){ ease(b,cx(b.col),gy(b.row,b.col)-4,0.18);
      // Spin follows the egg's actual screen movement, so it always rolls the way
      // it travels. The old `*b.dir` factor flipped the spin on every leftward
      // ramp — which is why half the ramps rotated the wrong way.
      ctx.save(); ctx.translate(b.ax,b.ay); ctx.rotate(b.ax*0.06);
      const er=CW*0.32;                                                    // tumbling egg
      ctx.fillStyle="#f3ead7"; ctx.strokeStyle="#c9bda3"; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(0,-er);
      ctx.bezierCurveTo(er*0.72,-er,er*0.86,er*0.34,0,er);
      ctx.bezierCurveTo(-er*0.86,er*0.34,-er*0.72,-er,0,-er);
      ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
    // the farmer
    const p=s.player;
    if(p.climb>0) p.climb--;
    glide(p, cx(p.col), gy(p.row,p.col), CW/12, p.climb>0?RH/16:RH/12);   // steady walk; gentler climb rate
    // while dying, the farmer shakes in place rather than gliding or animating
    const shake=p.dying>0 ? (Math.random()-0.5)*6 : 0;
    const py=p.ay-6-jumpHeight(p);
    ctx.save(); if(p.dying>0) ctx.globalAlpha=0.55+0.45*Math.sin(p.dying*1.3);
    ctx.fillStyle="#d9c27a"; ctx.beginPath();                              // straw hat brim
    ctx.ellipse(p.ax+shake,py-15,10,3.5,0,0,7); ctx.fill();
    ctx.fillRect(p.ax+shake-5,py-20,10,5);                                 // hat crown
    ctx.fillStyle="#f2c49b"; ctx.fillRect(p.ax+shake-4,py-14,8,5);         // face
    ctx.fillStyle="#0b0c1a"; ctx.fillRect(p.ax+shake-3,py-12,1.5,1.5); ctx.fillRect(p.ax+shake+1.5,py-12,1.5,1.5);
    ctx.fillStyle="#2563eb"; ctx.fillRect(p.ax+shake-6,py-9,12,9);         // denim overalls
    ctx.fillStyle="#dc2626"; ctx.fillRect(p.ax+shake-6,py-9,12,3);         // shirt collar
    // boots: alternating rungs while climbing, tucked up mid-jump, a walk cycle otherwise
    ctx.fillStyle="#78350f";
    if(p.dying>0){ ctx.fillRect(p.ax+shake-5,py-1,3,3); ctx.fillRect(p.ax+shake+2,py-1,3,3); }
    else if(p.climb>0){ const k=Math.floor(Date.now()/110)%2;
      ctx.fillRect(p.ax-5,py+(k?0:-3),3,4); ctx.fillRect(p.ax+2,py+(k?-3:0),3,4); }
    else if(p.jump>0){ ctx.fillRect(p.ax-5,py-2,3,3); ctx.fillRect(p.ax+2,py-2,3,3); }
    else { const k=Math.floor(Date.now()/140)%2;
      ctx.fillRect(p.ax-5,py,3,k?4:2); ctx.fillRect(p.ax+2,py,3,k?2:4); }
    ctx.restore();
    if(p.dying>0 && !s.over){ const j=()=>(Math.random()-0.5)*4;
      ctx.fillStyle="#f43f5e"; ctx.font="bold 15px system-ui"; ctx.textAlign="center";
      ctx.fillText("SQUASHED!",p.ax+j(),py-30+j()); }
    // A cameo spacesuit chicken, every FLYBY_EVERY levels — purely
    // decorative, matching the site-wide cameo pattern. Drawn from the
    // shared /mascots.js library.
    if(s.flyby) Mascots.spacesuitChicken(ctx, s.flyby.x, s.flyby.y, FLY_H*0.42, s.flyby.vx);
    if(s.over){ ctx.fillStyle="rgba(0,0,0,.6)"; ctx.fillRect(0,0,W,H); ctx.fillStyle="#f43f5e"; ctx.font="bold 22px system-ui"; ctx.fillText("GAME OVER",W/2,H/2-6); ctx.fillStyle="#e6e6f0"; ctx.font="14px system-ui"; ctx.fillText("Score "+s.score+"  ·  Best "+best,W/2,H/2+16); }
    else if(s.won){ ctx.fillStyle="rgba(0,0,0,.5)"; ctx.fillRect(0,0,W,H); ctx.fillStyle="#34d399"; ctx.font="bold 22px system-ui"; ctx.fillText("RESCUED!",W/2,H/2-6); ctx.fillStyle="#e6e6f0"; ctx.font="14px system-ui"; ctx.fillText("Level "+s.level+" cleared — next level coming up...",W/2,H/2+16); }
  }
  let prevDying=0, prevScore=0, wasWon=false, wasOver=false, prevLevel=1;
  function frame(){
    if(!GATE.open){ draw(); GATE.paint(); return requestAnimationFrame(frame); }
    if(!s.over){
      if(s.flyby){ s.flyby.x+=s.flyby.vx; if(s.flyby.x<-FLY_W-10||s.flyby.x>W+FLY_W+10) s.flyby=null; }
      if(s.won){
        // Touching the hen no longer ends the run outright — this counts
        // down (stepWinning), then starts the next level on the same board
        // with eggs coming faster (spawnGap scales with s.level).
        stepWinning(s);
      } else if(stepDying(s)){
        // Frozen except for the death shake — barrels, jump and movement all hold
        // still so the animation reads clearly before the farmer resets or falls.
      } else {
        if(s.player.jump>0) s.player.jump--;
        // slower overall, and a good deal slower still on a ladder — a full rung
        // used to complete in the same ~0.3s as a sideways step, which read as a
        // teleport up the ladder rather than a climb
        if(input && ++moveT>=(s.player.climb>0?32:13)){ moveT=0; move(s,input); }
        checkRivets(s);
        if(--s.spawnT<=0){ spawnBarrel(s); s.spawnT=spawnGap(s.level); }   // gap shrinks as the level climbs
        if(++barrelT>=16){ barrelT=0; barrelStep(s); }
        stepBelt(s);
        collide(s);
      }
      const leveledUp = s.level>prevLevel;
      if(typeof Arcade!=="undefined"){
        Arcade.stats.record("dk",s.score);
        if(s.player.dying>0 && prevDying<=0) Arcade.sfx.death();
        else if(s.score>prevScore && prevDying<=0 && !s.won) Arcade.sfx.coin();   // barrel dodge bonus, not a hit or the rescue jingle
        if(s.won && !wasWon) Arcade.sfx.win();
        if(s.over && !wasOver) Arcade.sfx.lose();
        if(leveledUp) Arcade.sfx.wave();
      }
      prevDying=s.player.dying; prevScore=s.score; wasWon=s.won; wasOver=s.over; prevLevel=s.level;
      if(s.score>best){ best=s.score; try{localStorage.setItem("dk_best",String(best));}catch(e){} }
      if(s.won) $("msg").textContent="🎉 Rescued! Level "+s.level+" cleared — next level coming up...";
      else if(s.over) $("msg").textContent="Squashed! Score "+s.score+"  ·  Best "+best;
      else if(s.player.dying>0) $("msg").textContent="Squashed! "+Math.max(0,s.lives)+" left...";
      else if(leveledUp){
        const tips={girders:"climb up and touch the hen! Eggs come faster now.",
          conveyor:"flat conveyor belts — eggs will suddenly reverse partway through!",
          elevator:"elevators! Pop every rivet (or touch the hen) to clear it."};
        $("msg").textContent="Level "+s.level+" — "+BOARD_LABEL[s.boardType]+". "+tips[s.boardType];
      }
    }
    $("score").textContent=s.score; $("level").textContent=s.level; $("lives").textContent=Math.max(0,s.lives); $("best").textContent=best;
    if($("board")) $("board").textContent=BOARD_LABEL[s.boardType];
    draw(); requestAnimationFrame(frame);
  }
  document.querySelectorAll(".dpad button").forEach(b=>{ const d=b.getAttribute("data-d"); const on=(e)=>{e.preventDefault(); input=d; move(s,d); moveT=0; }; const off=(e)=>{e.preventDefault(); if(input===d)input=null;};
    b.addEventListener("touchstart",on,{passive:false}); b.addEventListener("touchend",off); b.addEventListener("mousedown",on); b.addEventListener("mouseup",off); b.addEventListener("mouseleave",off); });
  function doJump(){ const before=s.player.jump; jump(s); if(s.player.jump>before && typeof Arcade!=="undefined") Arcade.sfx.jump(); }
  const jb=$("jump"); const jf=(e)=>{e.preventDefault();doJump();}; jb.addEventListener("touchstart",jf,{passive:false}); jb.addEventListener("mousedown",jf);
  // All movement is held-key: one step on press, then the frame loop repeats at a
  // fixed cadence. Ignoring the OS key-repeat (e.repeat) is what stops the farmer
  // from bolting across the screen at the keyboard's repeat rate.
  addEventListener("keydown",(e)=>{ const m={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down",a:"left",d:"right",w:"up",s:"down"}[e.key]; if(m){e.preventDefault(); if(e.repeat) return; input=m; move(s,m); moveT=0; } if(e.key===" "){e.preventDefault(); if(!e.repeat) doJump();} });
  addEventListener("keyup",(e)=>{ const m={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"up",ArrowDown:"down",a:"left",d:"right",w:"up",s:"down"}[e.key]; if(m&&input===m)input=null; });
  $("new").addEventListener("click",()=>{ s=newState(); input=null; prevLevel=1; $("msg").textContent="Climb up and touch the hen — jump the eggs rolling down!"; });
  requestAnimationFrame(frame);
})();
</script>
<script src="/comments.js" defer></script>
  <script src="/fullscreen.js" defer></script>
