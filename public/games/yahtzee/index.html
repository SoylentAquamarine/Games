<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yahtzee — Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>🎲</text></svg>" />
  <style>
    :root{--bg:#0f1020;--panel:#1e2140;--panel2:#252a4d;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;--good:#34d399;}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
      background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.22),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.16),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;}
    .wrap{max-width:460px;margin:0 auto;padding:16px 12px 40px;display:flex;flex-direction:column;align-items:center;gap:12px}
    .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
    .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
    .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
    h1{margin:0;font-size:1.6rem;background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
    .status{min-height:1.2em;font-weight:600;color:var(--accent-2);text-align:center}
    .dice{display:flex;gap:10px;justify-content:center}
    .die{width:56px;height:56px;border-radius:12px;background:#fff;color:#0b0c1a;display:flex;align-items:center;justify-content:center;font-size:2.4rem;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.3);user-select:none;line-height:1}
    .die.held{background:#fde68a;outline:3px solid var(--accent-2);outline-offset:2px}
    .die.blank{background:#3a3f66;color:#3a3f66}
    .roll-row{display:flex;gap:12px;align-items:center}
    .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:11px 24px;border-radius:999px;cursor:pointer}
    .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.18);color:var(--muted)}
    .btn:disabled{opacity:.4;cursor:default}
    table{width:100%;border-collapse:collapse;font-size:.9rem}
    td{padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06)}
    tr.cat{cursor:pointer}
    tr.cat:hover:not(.filled){background:var(--panel2)}
    td.sc{text-align:right;font-weight:700;width:70px}
    td.sc.preview{color:var(--good);opacity:.85}
    tr.filled td.sc{color:var(--text)}
    tr.filled{cursor:default;opacity:.85}
    tr.sub td{color:var(--muted);font-size:.82rem;border-bottom:1px solid rgba(255,255,255,.12)}
    tr.total td{font-weight:800;color:var(--accent-2);border-top:2px solid rgba(255,255,255,.15)}
    .section{width:100%;background:var(--panel);border:1px solid rgba(255,255,255,.06);border-radius:12px;overflow:hidden}
    .hint{color:var(--muted);font-size:.8rem;text-align:center}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar"><a class="home" href="/">← Home</a><h1>🎲 Yahtzee</h1><span style="width:64px"></span></div>
    <div class="status" id="status">Roll to begin. Tap dice to hold.</div>
    <div class="dice" id="dice"></div>
    <div class="roll-row">
      <button class="btn" id="roll">🎲 Roll (3)</button>
      <button class="btn ghost" id="new">New Game</button>
    </div>
    <div class="section"><table id="card"></table></div>
    <p class="hint">3 rolls per turn · hold dice between rolls · tap a category to score it.</p>
  </div>
  <script>
  (function(){
    const FACES=["","⚀","⚁","⚂","⚃","⚄","⚅"];
    const CATS=[
      {id:"ones",name:"Ones",fn:d=>sumOf(d,1)},
      {id:"twos",name:"Twos",fn:d=>sumOf(d,2)},
      {id:"threes",name:"Threes",fn:d=>sumOf(d,3)},
      {id:"fours",name:"Fours",fn:d=>sumOf(d,4)},
      {id:"fives",name:"Fives",fn:d=>sumOf(d,5)},
      {id:"sixes",name:"Sixes",fn:d=>sumOf(d,6)},
      {id:"3kind",name:"Three of a Kind",fn:d=>maxCount(d)>=3?sum(d):0,lower:true},
      {id:"4kind",name:"Four of a Kind",fn:d=>maxCount(d)>=4?sum(d):0,lower:true},
      {id:"full",name:"Full House",fn:d=>fullHouse(d)?25:0,lower:true},
      {id:"sm",name:"Small Straight",fn:d=>straight(d,4)?30:0,lower:true},
      {id:"lg",name:"Large Straight",fn:d=>straight(d,5)?40:0,lower:true},
      {id:"yah",name:"Yahtzee",fn:d=>maxCount(d)>=5?50:0,lower:true},
      {id:"chance",name:"Chance",fn:d=>sum(d),lower:true},
    ];
    function counts(d){const c=[0,0,0,0,0,0,0];d.forEach(v=>c[v]++);return c;}
    function sum(d){return d.reduce((a,b)=>a+b,0);}
    function sumOf(d,n){return d.filter(v=>v===n).length*n;}
    function maxCount(d){return Math.max(...counts(d).slice(1));}
    // A 3-and-2 split of two different values is the normal full house;
    // c.includes(5) also qualifies 5-of-a-kind (all five dice the same
    // value) as a full house too, matching this implementation's ruling
    // on that edge case.
    function fullHouse(d){const c=counts(d).slice(1).filter(x=>x);return (c.includes(3)&&c.includes(2))||c.includes(5);}
    // Longest run of consecutive values in the (de-duplicated, sorted)
    // roll -- de-duping first means a hand like [2,2,3,4,5] still counts
    // as a 4-long run despite the repeated 2. Shared by both straight
    // categories, just called with a different `len` threshold (4 for
    // small, 5 for large).
    function straight(d,len){const s=[...new Set(d)].sort((a,b)=>a-b);let run=1,best=1;for(let i=1;i<s.length;i++){if(s[i]===s[i-1]+1){run++;best=Math.max(best,run);}else run=1;}return best>=len;}

    const diceEl=document.getElementById("dice"),cardEl=document.getElementById("card"),statusEl=document.getElementById("status"),rollBtn=document.getElementById("roll");
    let dice,held,rolls,scores,rolledThisTurn,over;

    function newGame(){dice=[0,0,0,0,0];held=[false,false,false,false,false];rolls=3;scores={};rolledThisTurn=false;over=false;
      statusEl.textContent="Roll to begin. Tap dice to hold.";buildDice();renderCard();updateRoll();}
    function buildDice(){diceEl.innerHTML="";dice.forEach((v,i)=>{const d=document.createElement("div");
      d.className="die"+(v===0?" blank":"")+(held[i]?" held":"");d.textContent=v===0?"⚄":FACES[v];
      d.addEventListener("click",()=>toggleHold(i));diceEl.appendChild(d);});}
    function toggleHold(i){if(!rolledThisTurn||over)return;held[i]=!held[i];buildDice();}
    function roll(){
      if(over||rolls<=0)return;
      dice=dice.map((v,i)=>held[i]&&rolledThisTurn?v:1+Math.floor(Math.random()*6));
      rolls--;rolledThisTurn=true;
      buildDice();renderCard();updateRoll();
      statusEl.textContent=rolls>0?`Hold dice & roll again, or score. (${rolls} left)`:"Last roll — pick a category to score.";
    }
    function updateRoll(){rollBtn.disabled=over||rolls<=0;rollBtn.textContent=`🎲 Roll (${rolls})`;}
    function renderCard(){
      cardEl.innerHTML="";
      const upperCats=CATS.slice(0,6),lowerCats=CATS.slice(6);
      const add=(cat)=>{
        const tr=document.createElement("tr");tr.className="cat"+(cat.id in scores?" filled":"");
        const filled=cat.id in scores;
        const val=filled?scores[cat.id]:(rolledThisTurn?cat.fn(dice):"");
        tr.innerHTML=`<td>${cat.name}</td><td class="sc${!filled&&rolledThisTurn?" preview":""}">${val===""?"":val}</td>`;
        if(!filled)tr.addEventListener("click",()=>score(cat));
        cardEl.appendChild(tr);
      };
      upperCats.forEach(add);
      const up=upperSubtotal(),bonus=up>=63?35:0;
      row(`Upper subtotal`,up,"sub");row(`Bonus (63+)`,bonus,"sub");
      lowerCats.forEach(add);
      row("Total",grandTotal(),"total");
    }
    function row(label,val,cls){const tr=document.createElement("tr");tr.className=cls;tr.innerHTML=`<td>${label}</td><td class="sc">${val}</td>`;cardEl.appendChild(tr);}
    function upperSubtotal(){return CATS.slice(0,6).reduce((a,c)=>a+(c.id in scores?scores[c.id]:0),0);}
    // Standard Yahtzee upper-section bonus: score at least 63 across the
    // six number categories (Ones-Sixes -- roughly "three of each," since
    // 3+6+9+12+15+18=63) and get a flat +35 on top. Same threshold is
    // duplicated in render()'s "Bonus (63+)" row label/value.
    function grandTotal(){const up=upperSubtotal();const bonus=up>=63?35:0;const low=CATS.slice(6).reduce((a,c)=>a+(c.id in scores?scores[c.id]:0),0);return up+bonus+low;}
    function score(cat){
      if(over||!rolledThisTurn||cat.id in scores)return;
      scores[cat.id]=cat.fn(dice);
      // next turn
      held=[false,false,false,false,false];rolls=3;rolledThisTurn=false;dice=[0,0,0,0,0];
      buildDice();renderCard();updateRoll();
      if(CATS.every(c=>c.id in scores)){over=true;statusEl.textContent=`🏁 Game over! Final score: ${grandTotal()}`;updateRoll();}
      else statusEl.textContent="Scored. Roll for your next turn.";
    }
    rollBtn.addEventListener("click",roll);
    document.getElementById("new").addEventListener("click",newGame);
    newGame();
  })();
  </script>
  <script src="/comments.js" defer></script>
  <script src="/fullscreen.js" defer></script>
</body>
</html>
