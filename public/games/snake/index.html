<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Snake — Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>" />
  <style>
    :root {
      --bg: #0f1020;
      --panel: #1e2140;
      --text: #e6e6f0;
      --muted: #9a9ab5;
      --accent: #7c5cff;
      --accent-2: #22d3ee;
      --snake: #34d399;
      --snake-head: #6ee7b7;
      --food: #f472b6;
      --grid: rgba(255, 255, 255, 0.04);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1000px 500px at 70% -10%, rgba(124,92,255,.22), transparent 60%),
        radial-gradient(800px 400px at 10% 110%, rgba(34,211,238,.16), transparent 60%),
        var(--bg);
      -webkit-tap-highlight-color: transparent;
    }
    .wrap {
      max-width: 560px; margin: 0 auto; padding: 16px 16px 40px;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .topbar {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
    }
    .home {
      color: var(--muted); text-decoration: none; font-size: .9rem;
      padding: 6px 12px; border: 1px solid rgba(255,255,255,.12); border-radius: 999px;
      transition: border-color .15s, color .15s;
    }
    .home:hover { color: var(--text); border-color: rgba(124,92,255,.6); }
    h1 {
      margin: 0; font-size: 1.6rem; letter-spacing: -.02em;
      background: linear-gradient(120deg, var(--snake), var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .scores {
      width: 100%; display: flex; justify-content: space-between; gap: 12px;
    }
    .stat {
      flex: 1; background: var(--panel); border: 1px solid rgba(255,255,255,.06);
      border-radius: 12px; padding: 10px 14px; text-align: center;
    }
    .stat .label {
      font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted);
    }
    .stat .value { font-size: 1.5rem; font-weight: 700; margin-top: 2px; }
    .board-wrap { position: relative; width: 100%; }
    canvas {
      width: 100%; height: auto; display: block;
      background: rgba(0,0,0,.25);
      border: 1px solid rgba(255,255,255,.08); border-radius: 16px;
      touch-action: none;
    }
    .overlay {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; text-align: center;
      background: rgba(15,16,32,.82); border-radius: 16px; backdrop-filter: blur(3px);
    }
    .overlay.hidden { display: none; }
    .overlay h2 { margin: 0; font-size: 1.8rem; }
    .overlay p { margin: 0; color: var(--muted); }
    .btn {
      background: linear-gradient(120deg, var(--accent), var(--accent-2));
      color: #0b0c1a; border: none; font-weight: 700; font-size: 1rem;
      padding: 12px 28px; border-radius: 999px; cursor: pointer;
      transition: transform .12s;
    }
    .btn:hover { transform: translateY(-2px); }
    .hint { color: var(--muted); font-size: .85rem; text-align: center; }
    @media (hover: none) { .hint-desktop { display: none; } }
    @media (hover: hover) { .hint-touch { display: none; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="home" href="/">← Home</a>
      <h1>🐍 Snake</h1>
      <span style="width:64px"></span>
    </div>

    <div class="scores">
      <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>

    <div class="board-wrap">
      <canvas id="board" width="400" height="400"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="overlay-title">Snake</h2>
        <p id="overlay-msg">Eat the food. Don't hit yourself.</p>
        <button class="btn" id="start-btn">Play</button>
        <p class="hint">or press Space</p>
      </div>
    </div>

    <p class="hint hint-desktop">Arrow keys or WASD to move · Space or P to start/pause</p>
    <p class="hint hint-touch">Swipe to move · tap to pause</p>
  </div>

  <script>
  (function () {
    const GRID = 20;                 // cells per side
    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    const cell = canvas.width / GRID;

    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlay-title");
    const overlayMsg = document.getElementById("overlay-msg");
    const startBtn = document.getElementById("start-btn");

    const BEST_KEY = "snake_best";
    let best = Number(localStorage.getItem(BEST_KEY) || 0);
    bestEl.textContent = best;

    let snake, dir, nextDir, food, score, speed, timer, running, paused;

    function reset() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      speed = 130;
      scoreEl.textContent = 0;
      placeFood();
    }

    function placeFood() {
      while (true) {
        const f = { x: rand(GRID), y: rand(GRID) };
        if (!snake.some((s) => s.x === f.x && s.y === f.y)) { food = f; return; }
      }
    }
    function rand(n) { return Math.floor(Math.random() * n); }

    function start() {
      reset();
      overlay.classList.add("hidden");
      running = true; paused = false;
      loop();
    }

    function loop() {
      clearTimeout(timer);
      if (!running || paused) return;
      timer = setTimeout(() => { step(); loop(); }, speed);
    }

    function step() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // wall or self collision -> game over
      if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID ||
          snake.some((s) => s.x === head.x && s.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = score;
        if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem(BEST_KEY, best); }
        if (speed > 60) speed -= 3;        // speed up gradually
        placeFood();
      } else {
        snake.pop();
      }
      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // subtle grid
      ctx.strokeStyle = "rgba(255,255,255,0.04)";
      for (let i = 1; i < GRID; i++) {
        ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(canvas.width, i * cell); ctx.stroke();
      }

      // food
      drawCell(food.x, food.y, getVar("--food"), true);

      // snake
      snake.forEach((s, i) => {
        drawCell(s.x, s.y, i === 0 ? getVar("--snake-head") : getVar("--snake"));
      });
    }

    function drawCell(x, y, color, circle) {
      const pad = 1.5;
      ctx.fillStyle = color;
      const px = x * cell + pad, py = y * cell + pad, size = cell - pad * 2;
      if (circle) {
        ctx.beginPath();
        ctx.arc(px + size / 2, py + size / 2, size / 2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        roundRect(px, py, size, size, 4); ctx.fill();
      }
    }
    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }
    function getVar(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function gameOver() {
      running = false;
      overlayTitle.textContent = "Game Over";
      overlayMsg.textContent = `Score ${score}` + (score >= best ? " — new best!" : ` · best ${best}`);
      startBtn.textContent = "Play again";
      overlay.classList.remove("hidden");
    }

    function togglePause() {
      if (!running) return;
      paused = !paused;
      if (paused) {
        overlayTitle.textContent = "Paused";
        overlayMsg.textContent = "Take a breath.";
        startBtn.textContent = "Resume";
        overlay.classList.remove("hidden");
      } else {
        overlay.classList.add("hidden");
        loop();
      }
    }

    // input
    function setDir(x, y) {
      // prevent reversing directly into self
      if (x === -dir.x && y === -dir.y) return;
      nextDir = { x, y };
    }

    document.addEventListener("keydown", (e) => {
      switch (e.key) {
        case "ArrowUp": case "w": case "W": setDir(0, -1); break;
        case "ArrowDown": case "s": case "S": setDir(0, 1); break;
        case "ArrowLeft": case "a": case "A": setDir(-1, 0); break;
        case "ArrowRight": case "d": case "D": setDir(1, 0); break;
        case " ": case "p": case "P":
          if (running) togglePause(); else start();
          e.preventDefault();
          return;
        default: return;
      }
      e.preventDefault();
    });

    // touch / swipe
    let touchStart = null;
    canvas.addEventListener("touchstart", (e) => {
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: true });
    canvas.addEventListener("touchend", (e) => {
      if (!touchStart) return;
      const dx = e.changedTouches[0].clientX - touchStart.x;
      const dy = e.changedTouches[0].clientY - touchStart.y;
      if (Math.abs(dx) < 20 && Math.abs(dy) < 20) { if (running) togglePause(); return; }
      if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
      else setDir(0, dy > 0 ? 1 : -1);
      touchStart = null;
    }, { passive: true });

    startBtn.addEventListener("click", start);

    // initial paint
    reset(); draw();
    overlay.classList.remove("hidden");
  })();
  </script>
  <script src="/comments.js" defer></script>
  <script src="/fullscreen.js" defer></script>
</body>
</html>
