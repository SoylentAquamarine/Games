<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>ChickenBert — Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>🐔</text></svg>" />
<style>
  :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
    background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.2),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.14),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;touch-action:none;}
  .wrap{max-width:600px;margin:0 auto;padding:14px 12px 30px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
  .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
  .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
  h1{margin:0;font-size:1.3rem;background:linear-gradient(120deg,#ffcf5a,#f0902a);-webkit-background-clip:text;background-clip:text;color:transparent}
  .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer}
  .hud{width:100%;max-width:340px;display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
  .hud b{color:var(--text)}
  canvas{width:min(96vw,560px);aspect-ratio:4/3;height:auto;border-radius:10px;border:2px solid #2a2f55;background:#080a14;touch-action:none}
  .msg{min-height:1.3em;font-weight:800;text-align:center}
  .pad{display:grid;grid-template-columns:repeat(2,56px);grid-template-rows:repeat(2,56px);gap:8px}
  .pad button{background:var(--panel);color:var(--text);border:1px solid rgba(255,255,255,.12);border-radius:12px;font-size:1.4rem;cursor:pointer;user-select:none}
  .pad button:active{background:var(--accent);color:#0b0c1a}
  .hint{font-size:.78rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="home" href="/">← Home</a><h1>🐔 ChickenBert</h1><button class="btn" id="new">New Game</button></div>
  <div class="hud"><span>Score: <b id="score">0</b></span><span>Level: <b id="level">1</b></span><span>Chickens: <b id="lives">🐔🐔🐔</b></span></div>
  <canvas id="game" width="480" height="360"></canvas>
  <div class="msg" id="msg">Hop on every cube to change its color — don't jump off the edge!</div>
  <div class="pad"><button data-d="ul">↖</button><button data-d="ur">↗</button><button data-d="dl">↙</button><button data-d="dr">↘</button></div>
  <div class="hint">↖ Q · ↗ E · ↙ A · ↘ D · or tap the pad</div>
</div>
<script src="/arcade.js"></script>
<script src="/mascots.js"></script>
<script>
(function(){
  const C={ rows:7, EXTRA_EVERY:10000, CHICKENS:3, PAD_ROWS:[2,4], DEATH_FRAMES:50 };
  // Admin-tunable difficulty knobs — see /admin/games/?game=qbert.
  // Same pattern as kaboom (see its HANDOFF.md): explicit allowlist, only
  // numeric values, safe no-op with no localStorage (headless tests).
  (function(){ try{
    const allow=["EXTRA_EVERY","CHICKENS","DEATH_FRAMES"];
    const o=JSON.parse(localStorage.getItem("qbert_config")||"{}");
    for(const k of allow) if(typeof o[k]==="number") C[k]=o[k];
  }catch(_){} })();

  // Five level shapes cycle, and each pass through them turns the pressure up
  // rather than changing the rules again — so 25 levels is five passes over a set
  // you already understand, each one harder than the last.
  const BASE=[
    { name:"Classic",     stages:1, toggle:false, pads:false },
    { name:"Two Coats",   stages:2, toggle:false, pads:false },
    { name:"Flip-Flop",   stages:1, toggle:true,  pads:false },
    { name:"Warp Pads",   stages:1, toggle:false, pads:true  },
    { name:"Three Coats", stages:3, toggle:false, pads:true  },
  ];
  function plan(level){
    const b=BASE[(level-1)%BASE.length], cycle=Math.floor((level-1)/BASE.length);
    return { ...b, level, cycle,
      enemies:   Math.min(3, 1+cycle),          // more hunters each pass
      weasel:    cycle>=1,                      // the second bad guy joins on pass 2
      spawnEvery:Math.max(70, 200-cycle*30),    // and they arrive sooner
      enemyEvery:Math.max(26, 48-cycle*5),      // and move quicker
      flypast:   level%5===0,                   // spacesuit chicken between blocks
    };
  }

  function emptyGrid(){ const g=[]; for(let r=0;r<C.rows;r++){ g.push(new Array(r+1).fill(0)); } return g; }
  function onPyramid(r,c){ return r>=0 && r<C.rows && c>=0 && c<=r; }
  function target(r,c,dir){ if(dir==="dl") return {row:r+1,col:c}; if(dir==="dr") return {row:r+1,col:c+1};
    if(dir==="ul") return {row:r-1,col:c-1}; return {row:r-1,col:c}; /* ur */ }

  // A cube is finished once it has taken as many coats as the level asks for.
  function done(s){ const need=plan(s.level).stages;
    for(let r=0;r<C.rows;r++) for(let c=0;c<=r;c++) if(s.cube[r][c]<need) return false; return true; }
  function allChanged(s){ return done(s); }

  // Warp pads sit off the left and right edges on two rows. Stepping onto one
  // carries you back to the apex instead of falling, and each is single use.
  function padAt(s,row,col){
    if(!plan(s.level).pads) return null;
    if(!C.PAD_ROWS.includes(row)) return null;
    const side = col===-1 ? "L" : col===row+1 ? "R" : null;
    if(!side) return null;
    const key=row+side;
    return s.padsUsed.includes(key) ? null : key;
  }

  function resetBoard(s){
    s.cube=emptyGrid(); s.q={row:0,col:0}; s.enemies=[]; s.padsUsed=[];
    s.cube[0][0]=1;                                  // the apex starts with a coat
  }
  function newState(){
    const s={ cube:emptyGrid(), q:{row:0,col:0}, enemies:[], padsUsed:[],
              chickens:C.CHICKENS, nextExtra:C.EXTRA_EVERY, gotExtra:0,
              score:0, level:1, over:false, warped:false, dying:0 };
    s.cube[0][0]=1;
    return s;
  }
  // Player feedback: "if the enemy lands on me I need a short death
  // animation." Getting caught used to reset s.q/s.enemies on the very
  // same tick — the hero's sprite (drawn at s.q) snapped back to the apex
  // instantly, with nothing but the death sfx to mark what happened. Now a
  // non-fatal catch freezes play for DEATH_FRAMES (s.dying, matching the
  // site-wide death-pause convention — e.g. breakout/invaders) with the
  // hero left exactly where she was caught; stepDying() below does the
  // actual apex reset once the freeze elapses. A fatal catch (last
  // chicken) skips the freeze entirely and goes straight to the Game Over
  // screen, same as breakout's final-life short-circuit.
  function loseChicken(s){
    s.chickens--;
    if(s.chickens<=0){ s.over=true; return s; }
    s.dying=C.DEATH_FRAMES;
    return s;
  }
  function stepDying(s){
    if(s.dying>0 && --s.dying<=0){ s.q={row:0,col:0}; s.enemies=[]; }
    return s;
  }
  function awardExtras(s){
    while(s.score>=s.nextExtra){ s.chickens++; s.nextExtra+=C.EXTRA_EVERY; s.gotExtra++; }
  }

  function hop(s, dir){
    if(s.over||s.dying>0) return s;
    const p=plan(s.level);
    const t=target(s.q.row,s.q.col,dir);
    s.warped=false;

    if(!onPyramid(t.row,t.col)){
      const pad=padAt(s,t.row,t.col);
      if(pad){ s.padsUsed.push(pad); s.q={row:0,col:0}; s.score+=50; s.warped=true; awardExtras(s); return s; }
      return loseChicken(s);
    }

    s.q=t;
    // Check for a hunter on the landing cube BEFORE coating it — getting
    // caught shouldn't still coat the cube. Coating it first (the old order)
    // let the board become secretly "done" underneath a collision death: the
    // early return here skipped the done(s) check for this hop, but the
    // cube stayed coated, so the very next unrelated hop would silently
    // re-trigger done(s)==true and award a bogus level-complete bonus.
    for(const e of s.enemies){
      if(e.row===t.row && e.col===t.col) return loseChicken(s);
    }
    const cur=s.cube[t.row][t.col];
    if(p.toggle){
      s.cube[t.row][t.col] = cur>0 ? 0 : 1;      // land again and the coat comes off
      if(cur===0) s.score+=25;
    } else if(cur<p.stages){
      s.cube[t.row][t.col]=cur+1; s.score+=25;
    }
    // a cube already at its final coat is left exactly as it is
    awardExtras(s);
    if(done(s)){ s.score+=100*p.level; s.level++; resetBoard(s); awardExtras(s); }
    return s;
  }

  // Two hunters: the ball tumbles blindly down the pyramid, the weasel works out
  // where you are and comes after you.
  function spawnEnemy(s, kind){
    const p=plan(s.level);
    if(s.enemies.length>=p.enemies) return s;
    if(s.q.row===0&&s.q.col===0) return s;
    kind = kind || (p.weasel && s.enemies.length>0 ? "weasel" : "ball");
    s.enemies.push({row:0,col:0,kind});
    return s;
  }
  function enemyStep(s, dirOverride){
    if(s.over||s.dying>0) return s;
    for(let i=s.enemies.length-1;i>=0;i--){
      const e=s.enemies[i];
      let dir=dirOverride;
      if(!dir){
        if(e.kind==="weasel"){
          if(e.row<s.q.row) dir = (s.q.col>e.col) ? "dr" : "dl";
          else if(e.row>s.q.row) dir = (s.q.col<e.col) ? "ul" : "ur";
          else dir = (s.q.col>e.col) ? "dr" : "dl";
        } else {
          dir = Math.random()<0.5 ? "dl" : "dr";
        }
      }
      const t=target(e.row,e.col,dir);
      if(!onPyramid(t.row,t.col)){ s.enemies.splice(i,1); continue; }
      e.row=t.row; e.col=t.col;
      if(t.row===s.q.row&&t.col===s.q.col){ loseChicken(s); return s; }
    }
    return s;
  }
  window.__qbert={ newState, hop, target, onPyramid, done, allChanged, resetBoard,
                   spawnEnemy, enemyStep, plan, padAt, loseChicken, stepDying, awardExtras, BASE, C };

  if(typeof document==="undefined") return;
  const $=(id)=>document.getElementById(id);
  const cv=$("game"), ctx=cv.getContext("2d"); const W=cv.width,H=cv.height;
  // Hold the loop until the player asks for it (comment: Press Spacebar To Begin)
  const GATE = Arcade.startGate(cv, "ChickenBert");
  const CW=44, TH=24, FH=24, ROWSTEP=37, TOPY=26;   // board + sprites 10% larger
  let s=newState(), best=0, hopAnim=0;
  try{ best=parseInt(localStorage.getItem("qbert_best")||"0")||0; }catch(e){}
  function cubeXY(r,c){ return { x: W/2 + (c - r/2)*CW, y: TOPY + r*ROWSTEP }; }
  // Each coat has its own colour, so a two- or three-coat level reads at a glance.
  const COAT=["#3b4fd6","#ffcf5a","#4ade80","#f43f5e"];
  function drawCube(r,c,stage){ const {x,y}=cubeXY(r,c);
    // left & right faces
    ctx.fillStyle="#4a2ea8"; ctx.beginPath(); ctx.moveTo(x-CW/2,y+TH/2); ctx.lineTo(x-CW/2,y+TH/2+FH); ctx.lineTo(x,y+TH+FH); ctx.lineTo(x,y+TH); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#361f80"; ctx.beginPath(); ctx.moveTo(x+CW/2,y+TH/2); ctx.lineTo(x+CW/2,y+TH/2+FH); ctx.lineTo(x,y+TH+FH); ctx.lineTo(x,y+TH); ctx.closePath(); ctx.fill();
    // top face
    ctx.fillStyle=COAT[Math.min(stage,COAT.length-1)];
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+CW/2,y+TH/2); ctx.lineTo(x,y+TH); ctx.lineTo(x-CW/2,y+TH/2); ctx.closePath(); ctx.fill();
    ctx.strokeStyle="rgba(0,0,0,.25)"; ctx.stroke();
  }
  function drawPad(row,side,used){
    const c = side==="L" ? -1 : row+1;
    const {x,y}=cubeXY(row,c);
    ctx.save(); ctx.globalAlpha = used?0.25:1;
    ctx.fillStyle="#22d3ee"; ctx.beginPath();
    ctx.ellipse(x,y+TH/2,CW*0.34,TH*0.55,0,0,7); ctx.fill();
    ctx.strokeStyle="#a5f3fc"; ctx.lineWidth=2; ctx.stroke();
    ctx.restore();
  }
  let anim=null, eAnims=new Map(), enemyT=0, spawnT=0;
  // While a hop is in flight the destination cube keeps the colour it had BEFORE
  // the hop, so it changes exactly on landing. Storing the previous stage rather
  // than forcing it unlit is what stops an already-finished cube flickering dark.
  let pendingCube=null;
  let levelBanner=0;                       // frames left on the LEVEL COMPLETE banner
  let bannerLevel=0;
  let flypast=null;                        // spacesuit chicken between blocks
  function draw(){
    ctx.clearRect(0,0,W,H); ctx.fillStyle="#080a14"; ctx.fillRect(0,0,W,H);
    const p=plan(s.level);
    if(p.pads) for(const row of C.PAD_ROWS) for(const side of ["L","R"])
      drawPad(row,side,s.padsUsed.includes(row+side));
    for(let r=0;r<C.rows;r++) for(let c=0;c<=r;c++){
      const held = pendingCube && pendingCube.row===r && pendingCube.col===c;
      drawCube(r,c, held ? pendingCube.prev : s.cube[r][c]);
    }
    // hunters
    for(const e of s.enemies){
      const key=e; const base=cubeXY(e.row,e.col);
      let ex=base.x, ey=base.y;
      const ea=eAnims.get(key);
      if(ea){ const t2=Math.min(1,(performance.now()-ea.t0)/200);
        ex=ea.fx+(ea.tx-ea.fx)*t2; ey=ea.fy+(ea.ty-ea.fy)*t2 - Math.sin(t2*Math.PI)*20;
        if(t2>=1) eAnims.delete(key); }
      if(e.kind==="weasel"){
        ctx.save(); ctx.translate(ex,ey+TH/2-5);
        ctx.fillStyle="#7c4a21"; ctx.beginPath(); ctx.ellipse(0,0,13,7,0,0,7); ctx.fill();
        ctx.fillStyle="#a8683a"; ctx.beginPath(); ctx.ellipse(-3,1,9,4,0,0,7); ctx.fill();
        ctx.fillStyle="#f43f5e"; ctx.beginPath(); ctx.arc(7,-2,2.2,0,7); ctx.fill();
        ctx.fillStyle="#3b2412"; ctx.beginPath(); ctx.moveTo(4,-5); ctx.lineTo(7,-10); ctx.lineTo(9,-5); ctx.closePath(); ctx.fill();
        ctx.restore();
      } else {
        const sq=ea?1+Math.sin(Math.min(1,(performance.now()-ea.t0)/200)*Math.PI)*0.22:1;
        ctx.fillStyle="#ff3b6b"; ctx.beginPath(); ctx.ellipse(ex,ey+TH/2-5,10/sq,10*sq,0,0,7); ctx.fill();
        ctx.strokeStyle="#ffe4ec"; ctx.lineWidth=2; ctx.stroke();
        ctx.fillStyle="#fff"; ctx.fillRect(ex-4,ey+TH/2-8,3,3); ctx.fillRect(ex+2,ey+TH/2-8,3,3);
      }
    }
    // spacesuit chicken drifting past every fifth level — drawn from the
    // shared /mascots.js library (the "Flying" variant: jetpack + pack).
    // NOTE: this is distinct from the player's own hero-chicken sprite
    // drawn elsewhere in this file (no visor/spacesuit) — that one is a
    // different character and is not part of this mascot migration.
    if(flypast) Mascots.spacesuitChickenFlying(ctx, flypast.x, flypast.y, 11, flypast.vx);
    // player (with jump arc)
    let px, py; const base=cubeXY(s.q.row,s.q.col);
    if(anim){ const t=Math.min(1,(performance.now()-anim.t0)/170); px=anim.fx+(anim.tx-anim.fx)*t; py=anim.fy+(anim.ty-anim.fy)*t - Math.sin(t*Math.PI)*22; if(t>=1) anim=null; }
    else { px=base.x; py=base.y; }
    const cy=py+TH/2-6;
    // tail feathers
    ctx.fillStyle="#c96f14"; ctx.beginPath(); ctx.moveTo(px-8,cy+2); ctx.lineTo(px-19,cy-8); ctx.lineTo(px-9,cy+8); ctx.closePath(); ctx.fill();
    // comb
    ctx.fillStyle="#dc2626"; ctx.fillRect(px-5,cy-14,3,5); ctx.fillRect(px-1,cy-16,3,7); ctx.fillRect(px+3,cy-14,3,5);
    // body
    ctx.fillStyle="#f0902a"; ctx.beginPath(); ctx.arc(px,cy,11,0,7); ctx.fill();
    // eyes
    ctx.fillStyle="#5a2a00"; ctx.fillRect(px-6,cy-3,4,4); ctx.fillRect(px+2,cy-3,4,4);
    // beak + wattle
    ctx.fillStyle="#facc15"; ctx.beginPath(); ctx.moveTo(px-3,cy+3); ctx.lineTo(px+3,cy+3); ctx.lineTo(px,cy+9); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#dc2626"; ctx.fillRect(px-2,cy+8,4,3);
    // feet
    ctx.fillStyle="#facc15"; ctx.fillRect(px-5,cy+10,2,4); ctx.fillRect(px+3,cy+10,2,4);
    if(levelBanner>0){
      ctx.fillStyle="rgba(0,0,0,.35)"; ctx.fillRect(0,H/2-34,W,58);
      ctx.textAlign="center";
      ctx.fillStyle="#ffcf5a"; ctx.font="bold 26px system-ui";
      ctx.fillText("LEVEL COMPLETE", W/2, H/2-6);
      ctx.fillStyle="#e6e6f0"; ctx.font="13px system-ui";
      ctx.fillText("Level "+bannerLevel+" next", W/2, H/2+15);
    }
    // Player feedback: "if the enemy lands on me I need a short death
    // animation." A brief red flash over the frozen scene, fading out as
    // s.dying counts down, so getting caught reads as a distinct moment
    // instead of an instant teleport back to the apex.
    if(s.dying>0){ ctx.fillStyle="rgba(244,63,94,"+(0.45*s.dying/C.DEATH_FRAMES)+")"; ctx.fillRect(0,0,W,H); }
    if(s.over){ ctx.fillStyle="rgba(0,0,0,.6)"; ctx.fillRect(0,0,W,H); ctx.fillStyle="#f43f5e"; ctx.font="bold 24px system-ui"; ctx.textAlign="center"; ctx.fillText("GAME OVER",W/2,H/2-6); ctx.fillStyle="#e6e6f0"; ctx.font="14px system-ui"; ctx.fillText("Score "+s.score+"  ·  Best "+best,W/2,H/2+16); }
  }
  function hud(){
    $("score").textContent=s.score;
    $("level").textContent=s.level;
    $("lives").textContent="🐔".repeat(Math.max(0,s.chickens));
  }
  function go(dir){ if(s.over||s.dying>0||anim||levelBanner>0) return;
    const lv=s.level, chickens0=s.chickens, extras0=s.gotExtra;
    const from=cubeXY(s.q.row,s.q.col);
    const tc=target(s.q.row,s.q.col,dir);
    const p=plan(s.level);

    // Would this hop finish the level? If so, apply it here and hold the board
    // reset back so the banner can run with her stood on the last cube.
    let finishes=false;
    if(onPyramid(tc.row,tc.col) && !s.enemies.some(e=>e.row===tc.row&&e.col===tc.col)){
      const after=s.cube.map(row=>row.slice());
      const cur=after[tc.row][tc.col];
      if(p.toggle) after[tc.row][tc.col]= cur>0?0:1;
      else if(cur<p.stages) after[tc.row][tc.col]=cur+1;
      finishes = after.every(row=>row.every(v=>v>=p.stages));
    }

    // Keep the cube's PREVIOUS colour on screen until she lands. An already
    // finished cube therefore never flickers dark.
    const prevStage = onPyramid(tc.row,tc.col) ? s.cube[tc.row][tc.col] : 0;

    if(finishes){
      const cur=s.cube[tc.row][tc.col];
      s.q=tc;
      if(p.toggle) s.cube[tc.row][tc.col]= cur>0?0:1; else if(cur<p.stages) s.cube[tc.row][tc.col]=cur+1;
      s.score+=25+100*p.level;
      awardExtras(s);
      pendingCube={row:tc.row,col:tc.col,prev:prevStage};
      const to2=cubeXY(tc.row,tc.col);
      anim={fx:from.x,fy:from.y,tx:to2.x,ty:to2.y,t0:performance.now()};
      levelBanner=120; bannerLevel=s.level+1;                 // 120 frames ≈ 2s
      if(typeof Arcade!=="undefined"){ Arcade.sfx.jump(); Arcade.sfx.win(); }
      $("msg").textContent="Level complete — "+plan(s.level+1).name+" next!";
      hud();
      return;
    }

    hop(s,dir);
    pendingCube={row:s.q.row,col:s.q.col,prev:prevStage};
    if(typeof Arcade!=="undefined") Arcade.sfx.jump();
    const to=cubeXY(s.q.row,s.q.col); anim={fx:from.x,fy:from.y,tx:to.x,ty:to.y,t0:performance.now()};
    if(s.warped){ $("msg").textContent="Warp pad! Back to the top."; if(typeof Arcade!=="undefined") Arcade.sfx.coin(); }
    if(s.gotExtra>extras0){ $("msg").textContent="🐔 Extra chicken!"; if(typeof Arcade!=="undefined") Arcade.sfx.win(); }
    if(s.chickens<chickens0 && typeof Arcade!=="undefined") Arcade.sfx.death();
    if(typeof Arcade!=="undefined")Arcade.stats.record("qbert",s.score);
    if(s.over && s.score>best){ best=s.score; try{localStorage.setItem("qbert_best",String(best));}catch(e){} $("msg").textContent="Out of chickens! Score "+s.score+"  ·  Best "+best; }
    else if(s.dying>0) $("msg").textContent="Caught! "+s.chickens+" left...";
    hud(); }
  function frame(){
    if(!GATE.open){ draw(); GATE.paint(); return requestAnimationFrame(frame); }
    if(anim && performance.now()-anim.t0>=170) pendingCube=null;
    if(flypast){
      flypast.x+=flypast.vx;
      if(flypast.x<-60||flypast.x>W+60) flypast=null;
    }
    if(levelBanner>0){
      if(--levelBanner===0){
        s.level++; resetBoard(s); enemyT=0; spawnT=0; eAnims.clear();
        const np=plan(s.level);
        // every fifth level, the spacesuit chicken drifts across before you start
        if(np.flypast){ const fromLeft=Math.random()<0.5;
          flypast={ x: fromLeft?-40:W+40, y: 34, vx:(fromLeft?1:-1)*1.7 }; }
        $("level").textContent=s.level;
        $("msg").textContent="Level "+s.level+" — "+np.name+
          (np.stages>1?" ("+np.stages+" coats)":"")+(np.toggle?" (land twice to strip it)":"");
      }
      draw(); return requestAnimationFrame(frame);
    }
    if(!s.over){
      if(s.dying>0){
        stepDying(s);
        if(s.dying===0){ eAnims.clear(); $("msg").textContent="Watch out for the hunters!"; hud(); }
      } else {
        const p=plan(s.level);
        if(++spawnT>=p.spawnEvery){ spawnT=0; spawnEnemy(s); }
        if(s.enemies.length && ++enemyT>=p.enemyEvery){ enemyT=0;
          const before=s.enemies.map(e=>({e, xy:cubeXY(e.row,e.col)}));
          const chickens0=s.chickens;
          enemyStep(s);
          for(const b of before){ if(s.enemies.includes(b.e)){
            const et=cubeXY(b.e.row,b.e.col);
            eAnims.set(b.e,{fx:b.xy.x,fy:b.xy.y,tx:et.x,ty:et.y,t0:performance.now()}); } }
          if(s.chickens<chickens0 && typeof Arcade!=="undefined") Arcade.sfx.death();
          if(s.over && s.score>best){ best=s.score; try{localStorage.setItem("qbert_best",String(best));}catch(e){} }
          hud();
          if(s.over) $("msg").textContent="Caught! Score "+s.score+"  ·  Best "+best;
          else if(s.dying>0) $("msg").textContent="Caught! "+s.chickens+" left...";
        }
      }
    }
    draw(); requestAnimationFrame(frame);
  }
  document.querySelectorAll(".pad button").forEach(b=>{ const d=b.getAttribute("data-d"); const f=(e)=>{e.preventDefault();go(d);}; b.addEventListener("click",f); b.addEventListener("touchstart",f,{passive:false}); });
  addEventListener("keydown",(e)=>{ const m={q:"ul",e:"ur",a:"dl",d:"dr"}[e.key.toLowerCase()]; if(m){ e.preventDefault(); go(m); } });
  $("new").addEventListener("click",()=>{ s=newState(); levelBanner=0; pendingCube=null; anim=null; eAnims.clear(); flypast=null; hud(); $("msg").textContent="Level 1 — Classic. Hop on every cube."; });
  hud();
  requestAnimationFrame(frame);
})();
</script>
<script src="/comments.js" defer></script>
  <script src="/fullscreen.js" defer></script>
</body>
