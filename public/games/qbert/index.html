<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>ChickenBert — Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>🐔</text></svg>" />
<style>
  :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
    background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.2),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.14),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;touch-action:none;}
  .wrap{max-width:600px;margin:0 auto;padding:14px 12px 30px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
  .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
  .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
  h1{margin:0;font-size:1.3rem;background:linear-gradient(120deg,#ffcf5a,#f0902a);-webkit-background-clip:text;background-clip:text;color:transparent}
  .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer}
  .hud{width:100%;max-width:340px;display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
  .hud b{color:var(--text)}
  canvas{width:min(96vw,560px);aspect-ratio:4/3;height:auto;border-radius:10px;border:2px solid #2a2f55;background:#080a14;touch-action:none}
  .msg{min-height:1.3em;font-weight:800;text-align:center}
  .pad{display:grid;grid-template-columns:repeat(2,56px);grid-template-rows:repeat(2,56px);gap:8px}
  .pad button{background:var(--panel);color:var(--text);border:1px solid rgba(255,255,255,.12);border-radius:12px;font-size:1.4rem;cursor:pointer;user-select:none}
  .pad button:active{background:var(--accent);color:#0b0c1a}
  .hint{font-size:.78rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="home" href="/">← Home</a><h1>🐔 ChickenBert</h1><button class="btn" id="new">New Game</button></div>
  <div class="hud"><span>Score: <b id="score">0</b></span><span>Level: <b id="level">1</b></span><span>Lives: <b id="lives">3</b></span></div>
  <canvas id="game" width="480" height="360"></canvas>
  <div class="msg" id="msg">Hop on every cube to change its color — don't jump off the edge!</div>
  <div class="pad"><button data-d="ul">↖</button><button data-d="ur">↗</button><button data-d="dl">↙</button><button data-d="dr">↘</button></div>
  <div class="hint">↖ Q · ↗ E · ↙ A · ↘ D · or tap the pad</div>
</div>
<script src="/arcade.js"></script>
<script>
(function(){
  const C={ rows:7 };
  function emptyGrid(){ const g=[]; for(let r=0;r<C.rows;r++){ g.push(new Array(r+1).fill(false)); } return g; }
  function onPyramid(r,c){ return r>=0 && r<C.rows && c>=0 && c<=r; }
  function target(r,c,dir){ if(dir==="dl") return {row:r+1,col:c}; if(dir==="dr") return {row:r+1,col:c+1};
    if(dir==="ul") return {row:r-1,col:c-1}; return {row:r-1,col:c}; /* ur */ }
  function allChanged(s){ for(let r=0;r<C.rows;r++) for(let c=0;c<=r;c++) if(!s.colored[r][c]) return false; return true; }
  function resetBoard(s){ s.colored=emptyGrid(); s.colored[0][0]=true; s.q={row:0,col:0}; s.enemy=null; }
  function newState(){ const s={ colored:emptyGrid(), q:{row:0,col:0}, enemy:null, lives:3, score:0, level:1, over:false }; s.colored[0][0]=true; return s; }
  function hop(s, dir){
    if(s.over) return s;
    const t=target(s.q.row,s.q.col,dir);
    if(!onPyramid(t.row,t.col)){ s.lives--; if(s.lives<=0){ s.over=true; } else { s.q={row:0,col:0}; } return s; }
    s.q=t;
    if(!s.colored[t.row][t.col]){ s.colored[t.row][t.col]=true; s.score+=25; }
    if(s.enemy && s.enemy.row===t.row && s.enemy.col===t.col){ s.lives--; if(s.lives<=0) s.over=true; else { s.q={row:0,col:0}; } s.enemy=null; return s; }
    if(allChanged(s)){ s.score+=100; s.level++; resetBoard(s); }
    return s;
  }
  function spawnEnemy(s){ if(!s.enemy && !(s.q.row===0&&s.q.col===0)) s.enemy={row:0,col:0}; return s; }
  function enemyStep(s, dir){ if(s.over||!s.enemy) return s; dir=dir||(Math.random()<0.5?"dl":"dr"); const t=target(s.enemy.row,s.enemy.col,dir);
    if(!onPyramid(t.row,t.col)){ s.enemy=null; return s; }
    s.enemy=t;
    if(t.row===s.q.row&&t.col===s.q.col){ s.lives--; if(s.lives<=0) s.over=true; else { s.q={row:0,col:0}; } s.enemy=null; }
    return s; }
  window.__qbert={ newState, hop, target, onPyramid, allChanged, resetBoard, spawnEnemy, enemyStep, C };

  if(typeof document==="undefined") return;
  const $=(id)=>document.getElementById(id);
  const cv=$("game"), ctx=cv.getContext("2d"); const W=cv.width,H=cv.height;
  // Hold the loop until the player asks for it (comment: Press Spacebar To Begin)
  const GATE = Arcade.startGate(cv, "ChickenBert");
  const CW=44, TH=24, FH=24, ROWSTEP=37, TOPY=26;   // board + sprites 10% larger
  let s=newState(), best=0, hopAnim=0;
  try{ best=parseInt(localStorage.getItem("qbert_best")||"0")||0; }catch(e){}
  function cubeXY(r,c){ return { x: W/2 + (c - r/2)*CW, y: TOPY + r*ROWSTEP }; }
  function drawCube(r,c,colored){ const {x,y}=cubeXY(r,c);
    // left & right faces
    ctx.fillStyle="#4a2ea8"; ctx.beginPath(); ctx.moveTo(x-CW/2,y+TH/2); ctx.lineTo(x-CW/2,y+TH/2+FH); ctx.lineTo(x,y+TH+FH); ctx.lineTo(x,y+TH); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#361f80"; ctx.beginPath(); ctx.moveTo(x+CW/2,y+TH/2); ctx.lineTo(x+CW/2,y+TH/2+FH); ctx.lineTo(x,y+TH+FH); ctx.lineTo(x,y+TH); ctx.closePath(); ctx.fill();
    // top face
    ctx.fillStyle= colored?"#ffcf5a":"#3b4fd6"; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+CW/2,y+TH/2); ctx.lineTo(x,y+TH); ctx.lineTo(x-CW/2,y+TH/2); ctx.closePath(); ctx.fill();
    ctx.strokeStyle="rgba(0,0,0,.25)"; ctx.stroke();
  }
  let anim=null, eAnim=null, enemyT=0, spawnT=0;
  // While a hop is in flight, the destination cube is drawn unlit — it should
  // only change colour at the moment she actually lands on it.
  let pendingCube=null;
  let levelBanner=0;                       // frames left on the LEVEL COMPLETE banner
  let bannerLevel=0;
  function draw(){
    ctx.clearRect(0,0,W,H); ctx.fillStyle="#080a14"; ctx.fillRect(0,0,W,H);
    for(let r=0;r<C.rows;r++) for(let c=0;c<=r;c++){
      const held = pendingCube && pendingCube.row===r && pendingCube.col===c;
      drawCube(r,c, held ? false : s.colored[r][c]);
    }
    // enemy (Coily-style ball)
    if(s.enemy){ const e=cubeXY(s.enemy.row,s.enemy.col);
      let ex=e.x, ey=e.y;
      // Bounce between cubes instead of teleporting, matching the player hop.
      if(eAnim){ const t2=Math.min(1,(performance.now()-eAnim.t0)/200);
        ex=eAnim.fx+(eAnim.tx-eAnim.fx)*t2; ey=eAnim.fy+(eAnim.ty-eAnim.fy)*t2 - Math.sin(t2*Math.PI)*20;
        if(t2>=1) eAnim=null; }
      const sq=eAnim?1+Math.sin(Math.min(1,(performance.now()-eAnim.t0)/200)*Math.PI)*0.22:1;
      ctx.fillStyle="#ff3b6b"; ctx.beginPath(); ctx.ellipse(ex,ey+TH/2-5,10/sq,10*sq,0,0,7); ctx.fill();
      ctx.strokeStyle="#ffe4ec"; ctx.lineWidth=2; ctx.stroke();
      ctx.fillStyle="#fff"; ctx.fillRect(ex-4,ey+TH/2-8,3,3); ctx.fillRect(ex+2,ey+TH/2-8,3,3); }
    // player (with jump arc)
    let px, py; const base=cubeXY(s.q.row,s.q.col);
    if(anim){ const t=Math.min(1,(performance.now()-anim.t0)/170); px=anim.fx+(anim.tx-anim.fx)*t; py=anim.fy+(anim.ty-anim.fy)*t - Math.sin(t*Math.PI)*22; if(t>=1) anim=null; }
    else { px=base.x; py=base.y; }
    const cy=py+TH/2-6;
    // tail feathers
    ctx.fillStyle="#c96f14"; ctx.beginPath(); ctx.moveTo(px-8,cy+2); ctx.lineTo(px-19,cy-8); ctx.lineTo(px-9,cy+8); ctx.closePath(); ctx.fill();
    // comb
    ctx.fillStyle="#dc2626"; ctx.fillRect(px-5,cy-14,3,5); ctx.fillRect(px-1,cy-16,3,7); ctx.fillRect(px+3,cy-14,3,5);
    // body
    ctx.fillStyle="#f0902a"; ctx.beginPath(); ctx.arc(px,cy,11,0,7); ctx.fill();
    // eyes
    ctx.fillStyle="#5a2a00"; ctx.fillRect(px-6,cy-3,4,4); ctx.fillRect(px+2,cy-3,4,4);
    // beak + wattle
    ctx.fillStyle="#facc15"; ctx.beginPath(); ctx.moveTo(px-3,cy+3); ctx.lineTo(px+3,cy+3); ctx.lineTo(px,cy+9); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#dc2626"; ctx.fillRect(px-2,cy+8,4,3);
    // feet
    ctx.fillStyle="#facc15"; ctx.fillRect(px-5,cy+10,2,4); ctx.fillRect(px+3,cy+10,2,4);
    if(levelBanner>0){
      ctx.fillStyle="rgba(0,0,0,.35)"; ctx.fillRect(0,H/2-34,W,58);
      ctx.textAlign="center";
      ctx.fillStyle="#ffcf5a"; ctx.font="bold 26px system-ui";
      ctx.fillText("LEVEL COMPLETE", W/2, H/2-6);
      ctx.fillStyle="#e6e6f0"; ctx.font="13px system-ui";
      ctx.fillText("Level "+bannerLevel+" next", W/2, H/2+15);
    }
    if(s.over){ ctx.fillStyle="rgba(0,0,0,.6)"; ctx.fillRect(0,0,W,H); ctx.fillStyle="#f43f5e"; ctx.font="bold 24px system-ui"; ctx.textAlign="center"; ctx.fillText("GAME OVER",W/2,H/2-6); ctx.fillStyle="#e6e6f0"; ctx.font="14px system-ui"; ctx.fillText("Score "+s.score+"  ·  Best "+best,W/2,H/2+16); }
  }
  function go(dir){ if(s.over||anim||levelBanner>0) return; const lv=s.level; const lives0=s.lives; const from=cubeXY(s.q.row,s.q.col);
    // Does this hop light the last cube? If so, colour it here and hold the
    // board reset until the banner has had its two seconds.
    const tc=target(s.q.row,s.q.col,dir);
    let finishes=false;
    if(onPyramid(tc.row,tc.col) && !s.colored[tc.row][tc.col] && !(s.enemy&&s.enemy.row===tc.row&&s.enemy.col===tc.col)){
      let remaining=0;
      for(let r=0;r<C.rows;r++) for(let c=0;c<=r;c++) if(!s.colored[r][c]) remaining++;
      finishes = remaining===1;
    }
    if(finishes){
      s.q=tc; s.colored[tc.row][tc.col]=true; s.score+=125;   // 25 for the cube + 100 level bonus
      pendingCube={row:tc.row,col:tc.col};
      const to2=cubeXY(tc.row,tc.col);
      anim={fx:from.x,fy:from.y,tx:to2.x,ty:to2.y,t0:performance.now()};
      levelBanner=120; bannerLevel=s.level+1;                 // 120 frames ≈ 2s
      if(typeof Arcade!=="undefined"){ Arcade.sfx.jump(); Arcade.sfx.win(); }
      $("msg").textContent="Level complete!";
      $("score").textContent=s.score; $("level").textContent=s.level; $("lives").textContent=Math.max(0,s.lives);
      return;
    }
    hop(s,dir);
    pendingCube={row:s.q.row,col:s.q.col};       // held unlit until she lands
    if(typeof Arcade!=="undefined") Arcade.sfx.jump();
    const to=cubeXY(s.q.row,s.q.col); anim={fx:from.x,fy:from.y,tx:to.x,ty:to.y,t0:performance.now()};
    if(s.level>lv) $("msg").textContent="Level "+s.level+"! Fresh pyramid.";
    if(s.lives<lives0 && typeof Arcade!=="undefined") Arcade.sfx.death();
    if(typeof Arcade!=="undefined")Arcade.stats.record("qbert",s.score); if(s.over && s.score>best){ best=s.score; try{localStorage.setItem("qbert_best",String(best));}catch(e){} $("msg").textContent="Fell off! Score "+s.score+"  ·  Best "+best; }
    $("score").textContent=s.score; $("level").textContent=s.level; $("lives").textContent=Math.max(0,s.lives); }
  function frame(){
    if(!GATE.open){ draw(); GATE.paint(); return requestAnimationFrame(frame); }
    if(anim && performance.now()-anim.t0>=170) pendingCube=null;
    if(levelBanner>0){
      if(--levelBanner===0){ s.level++; resetBoard(s); enemyT=0; spawnT=0; eAnim=null;
        $("level").textContent=s.level; $("msg").textContent="Level "+s.level+"! Fresh pyramid."; }
      draw(); return requestAnimationFrame(frame);
    }
    if(!s.over){
      if(++spawnT>=200){ spawnT=0; spawnEnemy(s); }
      if(s.enemy && ++enemyT>=48){ enemyT=0; const ef=s.enemy?cubeXY(s.enemy.row,s.enemy.col):null; enemyStep(s);
        if(ef&&s.enemy){ const et=cubeXY(s.enemy.row,s.enemy.col); eAnim={fx:ef.x,fy:ef.y,tx:et.x,ty:et.y,t0:performance.now()}; } if(s.over && s.score>best){ best=s.score; try{localStorage.setItem("qbert_best",String(best));}catch(e){} }
        $("lives").textContent=Math.max(0,s.lives); if(s.over) $("msg").textContent="Caught! Score "+s.score+"  ·  Best "+best; }
    }
    draw(); requestAnimationFrame(frame);
  }
  document.querySelectorAll(".pad button").forEach(b=>{ const d=b.getAttribute("data-d"); const f=(e)=>{e.preventDefault();go(d);}; b.addEventListener("click",f); b.addEventListener("touchstart",f,{passive:false}); });
  addEventListener("keydown",(e)=>{ const m={q:"ul",e:"ur",a:"dl",d:"dr"}[e.key.toLowerCase()]; if(m){ e.preventDefault(); go(m); } });
  $("new").addEventListener("click",()=>{ s=newState(); levelBanner=0; pendingCube=null; anim=null; eAnim=null; $("score").textContent=0; $("level").textContent=1; $("lives").textContent=3; $("msg").textContent="Hop on every cube to change its color!"; });
  $("score").textContent=0; $("level").textContent=1; $("lives").textContent=3;
  requestAnimationFrame(frame);
})();
</script>
<script src="/comments.js" defer></script>
</body>
</html>
