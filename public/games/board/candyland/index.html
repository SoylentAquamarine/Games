<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChickenCandy Land — Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>🐔</text></svg>" />
  <style>
    :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
      background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.22),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.16),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;}
    .wrap{max-width:520px;margin:0 auto;padding:14px 12px 40px;display:flex;flex-direction:column;align-items:center;gap:12px}
    .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
    .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
    .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
    h1{margin:0;font-size:1.5rem;background:linear-gradient(120deg,#f472b6,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
    .board{display:flex;flex-direction:column;gap:4px;width:100%}
    .brow{display:flex;gap:4px}
    .brow.rev{flex-direction:row-reverse}
    .sp{flex:1;aspect-ratio:1;border-radius:6px;position:relative;display:flex;align-items:center;justify-content:center;min-width:0}
    .sp.start{background:#e6e6f0;color:#111;font-size:.6rem;font-weight:700}
    .sp.end{background:linear-gradient(135deg,#f472b6,#22d3ee);font-size:1rem}
    .sp.lic{box-shadow:inset 0 0 0 2px #111}
    .tok{position:absolute;font-size:.8rem;line-height:1}
    .tok.t0{top:0;left:1px}.tok.t1{top:0;right:1px}.tok.t2{bottom:0;left:1px}
    .players{display:flex;gap:8px;width:100%}
    .pl{flex:1;background:var(--panel);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:6px;text-align:center;font-size:.82rem}
    .pl.turn{border-color:var(--accent-2)}
    .card{width:80px;height:56px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:4px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
    .chip{width:20px;height:20px;border-radius:5px;border:1px solid rgba(0,0,0,.3)}
    .status{min-height:1.2em;font-weight:600;color:#fde68a;text-align:center}
    .btns{display:flex;gap:10px}
    .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:11px 26px;border-radius:999px;cursor:pointer}
    .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.18);color:var(--muted)}
    .btn:disabled{opacity:.4;cursor:default}
    .hint{color:var(--muted);font-size:.8rem;text-align:center}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar"><a class="home" href="/games/board/">← Board</a><h1>🐔 ChickenCandy Land</h1><span style="width:56px"></span></div>
    <div class="players" id="players"></div>
    <div class="board" id="board"></div>
    <div class="status" id="status">Draw a card to move!</div>
    <div class="card" id="card"></div>
    <div class="btns">
      <button class="btn" id="draw">Draw</button>
      <button class="btn ghost" id="new">New Game</button>
    </div>
    <p class="hint">Draw a color card and hop to the next matching square. Double = the second one. Dark-edged licorice squares cost a turn. First to the castle wins!</p>
  </div>
  <script>
  (function(){
    const COLORS=[["Red","#ef4444"],["Orange","#f97316"],["Yellow","#eab308"],["Green","#22c55e"],["Blue","#3b82f6"],["Purple","#a855f7"]];
    const N=54, COLS=9;
    const TOKENS=["🐔","🐤","🐣"];
    const PNAMES=["You","CPU 1","CPU 2"];
    const boardEl=document.getElementById("board"),playersEl=document.getElementById("players"),statusEl=document.getElementById("status"),cardEl=document.getElementById("card"),drawBtn=document.getElementById("draw");
    let spaces,licorice,deck,pos,skip,turn,over;

    function buildSpaces(){spaces=[];for(let i=0;i<N;i++)spaces.push(i%6);licorice=new Set([12,31]);}
    function buildDeck(){const d=[];for(let ci=0;ci<6;ci++){for(let k=0;k<7;k++)d.push({c:ci,double:false});for(let k=0;k<3;k++)d.push({c:ci,double:true});}return shuffle(d);}
    function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
    function newGame(){buildSpaces();deck=buildDeck();pos=[-1,-1,-1];skip=[false,false,false];turn=0;over=false;
      statusEl.textContent="Your turn — draw a card!";cardEl.innerHTML="";renderBoard();renderPlayers();drawBtn.disabled=false;}
    function renderBoard(){
      boardEl.innerHTML="";const rows=Math.ceil(N/COLS);
      for(let r=0;r<rows;r++){const row=document.createElement("div");row.className="brow"+(r%2?" rev":"");
        for(let c=0;c<COLS;c++){const i=r*COLS+c;if(i>=N)break;const sp=document.createElement("div");
          sp.className="sp"+(licorice.has(i)?" lic":"");sp.style.background=COLORS[spaces[i]][1];sp.id="sp"+i;
          if(i===N-1){sp.className="sp end";sp.textContent="🏰";}
          row.appendChild(sp);}
        boardEl.appendChild(row);}
      // start markers + tokens
      renderTokens();
    }
    function renderTokens(){
      document.querySelectorAll(".tok").forEach(t=>t.remove());
      pos.forEach((p,pi)=>{if(p<0)return;const cell=document.getElementById("sp"+Math.min(p,N-1));if(!cell)return;
        const t=document.createElement("div");t.className="tok t"+pi;t.textContent=TOKENS[pi];cell.appendChild(t);});
    }
    function renderPlayers(){playersEl.innerHTML="";PNAMES.forEach((n,i)=>{const d=document.createElement("div");
      d.className="pl"+(i===turn&&!over?" turn":"");d.innerHTML=TOKENS[i]+" "+n+"<br>"+(pos[i]<0?"start":(pos[i]>=N-1?"🏰":"sq "+(pos[i]+1)));playersEl.appendChild(d);});}
    function showCard(card){cardEl.innerHTML="";const n=card.double?2:1;for(let k=0;k<n;k++){const chip=document.createElement("div");chip.className="chip";chip.style.background=COLORS[card.c][1];cardEl.appendChild(chip);}}
    function nextOf(color,from){let count=color.double?2:1,i=from;while(i<N-1){i++;if(i===N-1)return N-1;if(spaces[i]===color.c){count--;if(count===0)return i;}}return N-1;}
    function draw(){
      if(over)return;
      if(!deck.length)deck=buildDeck();
      const card=deck.pop();showCard(card);
      const dest=nextOf(card,pos[turn]);pos[turn]=dest;
      let msg=PNAMES[turn]+" → "+COLORS[card.c][0]+(card.double?" (double)":"");
      renderTokens();renderPlayers();
      if(dest>=N-1){over=true;statusEl.textContent="🏰 "+PNAMES[turn]+" reached the castle — "+(turn===0?"you win!":"CPU wins.");drawBtn.disabled=true;return;}
      if(licorice.has(dest)){skip[turn]=true;msg+=" — licorice! lose a turn.";}
      statusEl.textContent=msg;
      advance();
    }
    function advance(){
      // move to next player, honoring skip
      let next=turn;
      for(let k=0;k<3;k++){next=(next+1)%3;if(skip[next]){skip[next]=false;continue;}break;}
      turn=next;renderPlayers();
      if(turn===0){drawBtn.disabled=false;statusEl.textContent+=" · Your turn.";}
      else{drawBtn.disabled=true;setTimeout(()=>{if(!over)draw();},900);}
    }
    drawBtn.addEventListener("click",()=>{if(turn===0&&!over)draw();});
    document.getElementById("new").addEventListener("click",newGame);
    // expose for tests
    window.__cl={buildSpaces:()=>{buildSpaces();return{spaces,licorice};},nextOf,buildDeck};
    newGame();
  })();
  </script>
  <script src="/comments.js" defer></script>
</body>
</html>
