<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lights Out — Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>💡</text></svg>" />
  <style>
    :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;--off:#232752;--on:#fde047;}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
      background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.22),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.16),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;}
    .wrap{max-width:400px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;align-items:center;gap:14px}
    .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
    .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
    .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
    h1{margin:0;font-size:1.6rem;background:linear-gradient(120deg,#fde047,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
    .scores{display:flex;gap:12px}
    .stat{background:var(--panel);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:8px 18px;text-align:center}
    .stat .label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    .stat .value{font-size:1.4rem;font-weight:700}
    .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:320px}
    .cell{aspect-ratio:1;background:var(--off);border-radius:12px;cursor:pointer;transition:background .12s,box-shadow .12s;border:1px solid rgba(255,255,255,.06)}
    .cell.on{background:var(--on);box-shadow:0 0 16px rgba(253,224,71,.6)}
    .status{min-height:1.2em;font-weight:600;color:#fde68a;text-align:center}
    .btns{display:flex;gap:10px}
    .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:10px 20px;border-radius:999px;cursor:pointer}
    .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.18);color:var(--muted)}
    .hint{color:var(--muted);font-size:.82rem;text-align:center}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar"><a class="home" href="/">← Home</a><h1>💡 Lights Out</h1><span style="width:56px"></span></div>
    <div class="scores">
      <div class="stat"><div class="label">Moves</div><div class="value" id="moves">0</div></div>
      <div class="stat"><div class="label">Best</div><div class="value" id="best">—</div></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="status" id="status">Turn off every light.</div>
    <div class="btns"><button class="btn" id="new">New Puzzle</button></div>
    <p class="hint">Clicking a light toggles it and its 4 neighbors. Get the whole board dark. Every puzzle is solvable.</p>
  </div>
  <script>
  (function(){
    const N=5;
    const gridEl=document.getElementById("grid"),statusEl=document.getElementById("status"),movesEl=document.getElementById("moves"),bestEl=document.getElementById("best");
    let grid,moves,over,cells=[];
    let best=localStorage.getItem("lightsout_best");bestEl.textContent=best||"—";
    function press(g,r,c){[[0,0],[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{const nr=r+dr,nc=c+dc;if(nr>=0&&nr<N&&nc>=0&&nc<N)g[nr][nc]^=1;});}
    function newPuzzle(){
      grid=Array.from({length:N},()=>Array(N).fill(0));
      // scramble from solved with random presses -> guaranteed solvable, and not already solved
      let scrambles=6+Math.floor(Math.random()*8);
      do{for(let k=0;k<scrambles;k++)press(grid,Math.floor(Math.random()*N),Math.floor(Math.random()*N));}
      while(solved());
      moves=0;over=false;movesEl.textContent=0;statusEl.textContent="Turn off every light.";render();
    }
    function solved(){return grid.every(row=>row.every(v=>v===0));}
    function build(){gridEl.innerHTML="";cells=[];for(let r=0;r<N;r++){cells[r]=[];for(let c=0;c<N;c++){const d=document.createElement("div");d.className="cell";
      d.addEventListener("click",()=>click(r,c));gridEl.appendChild(d);cells[r][c]=d;}}}
    function render(){for(let r=0;r<N;r++)for(let c=0;c<N;c++)cells[r][c].classList.toggle("on",!!grid[r][c]);}
    function click(r,c){if(over)return;press(grid,r,c);moves++;movesEl.textContent=moves;render();
      if(solved()){over=true;statusEl.textContent="🎉 Solved in "+moves+" moves!";
        if(!best||moves<+best){best=moves;localStorage.setItem("lightsout_best",best);bestEl.textContent=best;statusEl.textContent+=" New best!";}}}
    document.getElementById("new").addEventListener("click",newPuzzle);
    build();newPuzzle();
  })();
  </script>
  <script src="/comments.js" defer></script>
</body>
</html>
