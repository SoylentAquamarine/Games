<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chickener — Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>🐔</text></svg>" />
  <style>
    :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
      background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.22),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.16),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;}
    .wrap{max-width:640px;margin:0 auto;padding:16px 16px 30px;display:flex;flex-direction:column;align-items:center;gap:12px}
    .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
    .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
    .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
    h1{margin:0;font-size:1.6rem;background:linear-gradient(120deg,#4ade80,var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
    .scores{display:flex;gap:12px;width:100%}
    .stat{flex:1;background:var(--panel);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:8px;text-align:center}
    .stat .label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    .stat .value{font-size:1.3rem;font-weight:700}
    .board-wrap{position:relative;width:100%}
    canvas{width:100%;height:auto;display:block;background:#0a1a0a;border:1px solid rgba(255,255,255,.08);border-radius:14px;touch-action:none}
    .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(15,16,32,.82);border-radius:14px;text-align:center}
    .overlay.hidden{display:none}
    .overlay h2{margin:0}
    .overlay p{margin:0;color:var(--muted)}
    .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:12px 28px;border-radius:999px;cursor:pointer}
    .dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,44px);gap:6px;margin-top:4px}
    .dpad button{background:var(--panel);border:1px solid rgba(255,255,255,.14);color:var(--text);border-radius:10px;font-size:1.2rem;cursor:pointer}
    .dpad .up{grid-column:2}
    .hint{color:var(--muted);font-size:.82rem;text-align:center}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar"><a class="home" href="/">← Home</a><h1>🐔 Chickener</h1><span style="width:64px"></span></div>
    <div class="scores">
      <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">Lives</div><div class="value" id="lives">3</div></div>
      <div class="stat"><div class="label">Home</div><div class="value" id="homes">0/3</div></div>
    </div>
    <div class="board-wrap">
      <canvas id="c" width="390" height="450"></canvas>
      <div class="overlay" id="ov"><h2 id="ot">Chickener</h2><p id="om">Cross the road and river.</p><button class="btn" id="start">Play</button></div>
    </div>
    <div class="dpad">
      <button class="up" data-d="up">▲</button>
      <button data-d="left">◀</button>
      <button data-d="down">▼</button>
      <button data-d="right">▶</button>
    </div>
    <p class="hint">Arrows / WASD / swipe / d-pad · reach the 3 lily pads up top</p>
  </div>
  <script src="/arcade.js"></script>
  <script>
  (function(){
    const cv=document.getElementById("c"),ctx=cv.getContext("2d");
    const COLS=13,ROWS=15,T=cv.width/COLS;   // 30px tiles
    const scoreEl=document.getElementById("score"),livesEl=document.getElementById("lives"),homesEl=document.getElementById("homes");
    const ov=document.getElementById("ov"),ot=document.getElementById("ot"),om=document.getElementById("om"),startBtn=document.getElementById("start");
    // row types: 0 safe, 1 road(cars), 2 water(logs). rows 0=home,1..13 play,14 start
    let frog,lanes,score,lives,homes,filled,running,raf,best=+localStorage.getItem("frogger_best")||0;
    function makeLanes(){
      const L=[];
      // index by row 1..13
      const cfg=[
        {r:1,t:2,sp:-1.0,len:3,gap:5,dir:-1}, // last water row — now flows left, opposite row 2

        {r:2,t:2,sp:1.2,len:3,gap:5,dir:1},
        {r:3,t:2,sp:-1.6,len:2,gap:4,dir:-1},
        {r:4,t:2,sp:1.0,len:4,gap:6,dir:1},
        {r:5,t:2,sp:-1.3,len:3,gap:5,dir:-1},
        {r:6,t:0},                             // median
        {r:7,t:1,sp:-1.5,len:1,gap:3,dir:-1},
        {r:8,t:1,sp:1.2,len:1,gap:4,dir:1},
        {r:9,t:1,sp:-1.8,len:2,gap:5,dir:-1},
        {r:10,t:1,sp:1.4,len:1,gap:3,dir:1},
        {r:11,t:1,sp:-1.1,len:1,gap:4,dir:-1},
        {r:12,t:0},
        {r:13,t:0},
      ];
      cfg.forEach(c=>{
        const lane={type:c.t,row:c.r,speed:c.sp||0,items:[]};
        if(c.t!==0){const span=c.len+c.gap;for(let x=-2;x<COLS+2;x+=span){lane.items.push({x,len:c.len});}}
        L[c.r]=lane;
      });
      return L;
    }
    function reset(full){
      if(full){score=0;lives=3;homes=0;filled=[false,false,false];}
      frog={c:6,r:14,onLog:null};
      lanes=makeLanes();
      scoreEl.textContent=score;livesEl.textContent=lives;homesEl.textContent=homes+"/3";
    }
    function start(){reset(true);ov.classList.add("hidden");running=true;loop();}
    function homeCols(){return [2,6,10];}   // lily pad columns
    function loop(){if(!running)return;update();render();raf=requestAnimationFrame(loop);}
    function update(){
      // move lanes
      for(let r=1;r<=13;r++){const ln=lanes[r];if(!ln||ln.type===0)continue;
        ln.items.forEach(it=>{it.x+=ln.speed*0.036;if(ln.speed>0&&it.x>COLS+1)it.x=-it.len-1;if(ln.speed<0&&it.x<-it.len-1)it.x=COLS+1;});
      }
      // if on water, ride log
      const ln=lanes[frog.r];
      if(ln&&ln.type===2){
        let on=null;ln.items.forEach(it=>{if(frog.c+0.5>=it.x&&frog.c+0.5<=it.x+it.len)on=it;});
        if(on){frog.c+=ln.speed*0.036;if(frog.c<0||frog.c>COLS-1)return die();}
        else return die();
      }
      // if on road, check car collision
      if(ln&&ln.type===1){
        for(const it of ln.items){if(frog.c+0.5>=it.x&&frog.c+0.5<=it.x+it.len)return die();}
      }
    }
    function move(dir){
      if(!running)return;
      if(dir==="up"&&frog.r>0)frog.r--;
      if(dir==="down"&&frog.r<14)frog.r++;
      if(dir==="left"&&frog.c>0)frog.c--;
      if(dir==="right"&&frog.c<COLS-1)frog.c++;
      if(typeof Arcade!=="undefined")Arcade.sfx.step();
      if(frog.r===0){
        // must land on an empty lily pad
        const fc=Math.round(frog.c); const pad=homeCols().findIndex(pc=>pc===fc);
        if(pad>=0&&!filled[pad]){filled[pad]=true;homes++;score+=50;scoreEl.textContent=score;homesEl.textContent=homes+"/3";
          if(typeof Arcade!=="undefined")Arcade.sfx.pickup();
          if(homes>=3){win();return;}
          frog={c:6,r:14};
        }else{die();}
      }
    }
    function die(){lives--;livesEl.textContent=lives;
      if(typeof Arcade!=="undefined")Arcade.sfx.death();
      if(lives<=0){running=false;cancelAnimationFrame(raf);if(typeof Arcade!=="undefined"){Arcade.stats.record("frogger",score);Arcade.sfx.lose();} if(score>best){best=score;localStorage.setItem("frogger_best",best);}ot.textContent="Game Over";om.textContent=`Score ${score}${score>=best?" · best!":""}`;startBtn.textContent="Play again";ov.classList.remove("hidden");return;}
      frog={c:6,r:14};
    }
    function win(){running=false;cancelAnimationFrame(raf);score+=100;scoreEl.textContent=score;if(score>best){best=score;localStorage.setItem("frogger_best",best);}
      if(typeof Arcade!=="undefined")Arcade.sfx.win();
      ot.textContent="🎉 All chickens home!";om.textContent=`Score ${score}`;startBtn.textContent="Play again";ov.classList.remove("hidden");}
    function render(){
      // background rows
      for(let r=0;r<ROWS;r++){
        let col="#12331a"; const ln=lanes[r];
        if(r===0)col="#0c2a12"; else if(ln&&ln.type===1)col="#26262e"; else if(ln&&ln.type===2)col="#123049"; else col="#173a20";
        ctx.fillStyle=col;ctx.fillRect(0,r*T,cv.width,T);
      }
      // home pads
      homeCols().forEach((pc,i)=>{ctx.fillStyle=filled[i]?"#4ade80":"#1c5a2c";ctx.beginPath();ctx.arc((pc+.5)*T,0.5*T,T*0.42,0,7);ctx.fill();});
      // lane items
      for(let r=1;r<=13;r++){const ln=lanes[r];if(!ln||ln.type===0)continue;
        ln.items.forEach(it=>{
          const ix=it.x*T, iw=it.len*T, iy=r*T;
          if(ln.type===1){ // car — body, cabin, headlight, wheels
            ctx.fillStyle="#f43f5e"; roundRect(ix+2,iy+6,iw-4,T-14,5); ctx.fill();
            ctx.fillStyle="#ffd0d6"; roundRect(ix+iw*0.3,iy+8,iw*0.4,T-24,3); ctx.fill();
            ctx.fillStyle="#ffcf5a"; ctx.fillRect(ln.speed>0?ix+iw-5:ix+1,iy+9,4,4);
            ctx.fillStyle="#0b0c1a"; ctx.beginPath(); ctx.arc(ix+iw*0.26,iy+T-6,3,0,7); ctx.arc(ix+iw*0.74,iy+T-6,3,0,7); ctx.fill();
          } else { // log — planks
            ctx.fillStyle="#8b5a2b"; roundRect(ix+2,iy+4,iw-4,T-8,6); ctx.fill();
            ctx.strokeStyle="#6a4420"; ctx.lineWidth=2; for(let k=1;k<it.len;k++){ ctx.beginPath(); ctx.moveTo(ix+k*T,iy+6); ctx.lineTo(ix+k*T,iy+T-6); ctx.stroke(); }
          }
        });
      }
      // chicken
      ctx.font=(T*0.8)+"px serif";ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText("🐔",(frog.c+.5)*T,(frog.r+.5)*T);
    }
    function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
    document.addEventListener("keydown",e=>{const m={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",w:"up",s:"down",a:"left",d:"right"}[e.key];if(m){e.preventDefault();move(m);}});
    document.querySelectorAll(".dpad button").forEach(b=>b.addEventListener("click",()=>move(b.dataset.d)));
    let ts=null;cv.addEventListener("touchstart",e=>ts={x:e.touches[0].clientX,y:e.touches[0].clientY},{passive:true});
    cv.addEventListener("touchend",e=>{if(!ts)return;const dx=e.changedTouches[0].clientX-ts.x,dy=e.changedTouches[0].clientY-ts.y;if(Math.abs(dx)<18&&Math.abs(dy)<18)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?"right":"left");else move(dy>0?"down":"up");ts=null;},{passive:true});
    startBtn.addEventListener("click",start);
    reset(true);render();
  })();
  </script>
  <script src="/startgate.js" defer></script>
  <script src="/comments.js" defer></script>
  <script src="/fullscreen.js" defer></script>
</body>
</html>
