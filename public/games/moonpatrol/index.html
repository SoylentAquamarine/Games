<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Chicken Patrol — Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>🐔</text></svg>" />
<style>
  :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;--bad:#f43f5e;}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
    background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.2),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.14),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;touch-action:none;}
  .wrap{max-width:760px;margin:0 auto;padding:14px 12px 30px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
  .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
  .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
  h1{margin:0;font-size:1.3rem;background:linear-gradient(120deg,#c9c9e6,#ffcf5a);-webkit-background-clip:text;background-clip:text;color:transparent}
  .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer}
  .hud{width:100%;max-width:720px;display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
  .hud b{color:var(--text)}
  canvas{width:100%;max-width:720px;aspect-ratio:720/360;image-rendering:pixelated;border-radius:10px;border:2px solid #2a2f55;background:#08040f;touch-action:none}
  .msg{min-height:1.3em;font-weight:800;text-align:center}
  .ctl{display:flex;gap:10px}
  .cbtn{background:var(--panel);color:var(--text);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:14px 26px;font-weight:800;cursor:pointer;user-select:none}
  .cbtn:active{background:var(--accent);color:#0b0c1a}
  .cbtn.fire{background:var(--bad);color:#fff}
  .hint{font-size:.78rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="home" href="/">← Home</a><h1>🐔 Chicken Patrol</h1><button class="btn" id="new">New Game</button></div>
  <div class="hud"><span>Score: <b id="score">0</b></span><span>Chickens: <b id="lives">🐔🐔🐔</b></span><span>Best: <b id="best">0</b></span></div>
  <canvas id="game" width="720" height="360"></canvas>
  <div class="msg" id="msg">Jump craters, shoot the rocks. Keep the buggy rolling!</div>
  <div class="ctl"><button class="cbtn" id="bleft">◀</button><button class="cbtn" id="bjump">▲ JUMP</button><button class="cbtn" id="bright">▶</button><button class="cbtn fire" id="bfire">FIRE</button></div>
  <div class="hint">Space fires · ↑ jumps · ←/→ nudge the buggy — the road keeps rolling at its own pace · tap canvas to jump</div>
</div>
<script src="/arcade.js"></script>
<script>
(function(){
  const C={ W:720,H:360, GROUND:316, BUGGY_X:70, BW:44, BH:22, GRAV:0.7, JUMP_V:-11, SPEED0:3.2, SPEEDMAX:6.5, BSPEED:9, MAX_VOLLEYS:2, CHICKENS:3, EXTRA:1500, BOARD_DIST:5000, FLYBY_SCORE:500,
             BUGGY_MOVE:3, BUGGY_RANGE:44 };   // how far left/right the buggy can nudge from BUGGY_X — the screen itself always scrolls at s.speed, untouched by steering
  // Admin-tunable difficulty knobs — see /admin/games/?game=moonpatrol.
  // Same pattern as kaboom (see its HANDOFF.md): explicit allowlist, only
  // numeric values, safe no-op with no localStorage (headless tests).
  (function(){ try{
    const allow=["SPEED0","SPEEDMAX","BSPEED","MAX_VOLLEYS","CHICKENS","EXTRA","BOARD_DIST"];
    const o=JSON.parse(localStorage.getItem("moonpatrol_config")||"{}");
    for(const k of allow) if(typeof o[k]==="number") C[k]=o[k];
  }catch(_){} })();
  const rov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
  function buggyRect(s){ return {x:s.x,y:s.y,w:C.BW,h:C.BH}; }
  // Three background bands scrolling at different rates — distant hills barely
  // move, near dunes rush past, which is what sells the speed.
  const LAYERS=[
    { speed:0.12, y:C.GROUND-96, h:64, color:"#241a3a", step:150, amp:34 },
    { speed:0.30, y:C.GROUND-62, h:48, color:"#33244f", step:104, amp:24 },
    { speed:0.62, y:C.GROUND-30, h:30, color:"#432f63", step:70,  amp:15 },
  ];
  function newState(){ return { x:C.BUGGY_X, y:C.GROUND-C.BH, vy:0, onGround:true, obstacles:[], bullets:[], scroll:[0,0,0], speed:C.SPEED0, dist:0, score:0, lives:C.CHICKENS, nextExtra:C.EXTRA, gotExtra:0, board:1, over:false, spawnGap:60, volleys:0, nextVid:0, justCrashed:false, newBoard:false, flyby:null, flybyDone:false }; }
  function step(s, input){
    if(s.over) return s;
    // Player feedback: "left and right should move the car each direction a
    // little, while the screen is still rolling a constant speed." The
    // buggy can nudge within BUGGY_RANGE of its base BUGGY_X; s.speed (the
    // world's forward scroll) is completely untouched by this.
    if(input.left)  s.x=Math.max(C.BUGGY_X-C.BUGGY_RANGE, s.x-C.BUGGY_MOVE);
    if(input.right) s.x=Math.min(C.BUGGY_X+C.BUGGY_RANGE, s.x+C.BUGGY_MOVE);
    // buggy vertical
    if(input.jump && s.onGround){ s.vy=C.JUMP_V; s.onGround=false; }
    if(!s.onGround){ s.vy+=C.GRAV; s.y+=s.vy; const floor=C.GROUND-C.BH; if(s.y>=floor){ s.y=floor; s.vy=0; s.onGround=true; } }
    // parallax bands drift at their own fractions of the buggy's speed
    for(let i=0;i<LAYERS.length;i++) s.scroll[i]=(s.scroll[i]+s.speed*LAYERS[i].speed)%100000;
    // world scroll
    for(const o of s.obstacles) o.x-=s.speed;
    for(const b of s.bullets){ b.x += (b.vx==null?C.BSPEED:b.vx); b.y += (b.vy||0); }
    s.obstacles=s.obstacles.filter(o=>o.x+o.w>-4);
    s.bullets=s.bullets.filter(b=>b.x<C.W+10 && b.x>-14 && b.y>-14);
    s.volleys=new Set(s.bullets.map(b=>b.vid)).size;   // a volley is live while any of its shots is
    s.dist+=s.speed; s.score=Math.floor(s.dist/10);
    if(s.speed<C.SPEEDMAX) s.speed+=0.0016;
    // an extra chicken as the score climbs
    while(s.score>=s.nextExtra){ s.lives++; s.nextExtra+=C.EXTRA; s.gotExtra++; }
    // each stretch of ground is a "board"; announce a new one at the milestone
    if(s.dist >= s.board*C.BOARD_DIST){ s.board++; s.newBoard=true; s.flybyDone=false; s.flyby=null; }
    // the spacesuit chicken drifts over once a board — bonus if the up-shot hits it
    if(!s.flybyDone && !s.flyby && Math.random()<0.006){
      const fromLeft=Math.random()<0.5;
      s.flyby={ x: fromLeft?-24:C.W+24, y:52+Math.random()*40, vx:(fromLeft?1:-1)*(1.8+Math.random()*0.8), r:12 };
    }
    if(s.flyby){
      s.flyby.x+=s.flyby.vx;
      for(const b of s.bullets){ if(!b.dead && Math.hypot(b.x-s.flyby.x,b.y-s.flyby.y)<s.flyby.r+4){ s.score+=C.FLYBY_SCORE; s.flybyHit=true; b.dead=true; s.flyby=null; s.flybyDone=true; break; } }
      if(s.flyby && (s.flyby.x<-40||s.flyby.x>C.W+40)){ s.flyby=null; s.flybyDone=true; }
    }
    // bullets destroy rocks
    for(const b of s.bullets){
      if(b.dir==="up") continue;                       // the upward shot is for what flies over
      for(const o of s.obstacles){
        if(o.type==="rock" && o.alive!==false && rov({x:b.x,y:b.y,w:6,h:3},{x:o.x,y:o.y,w:o.w,h:o.h})){
          o.alive=false; b.dead=true; s.score+=25;
        } } }
    s.bullets=s.bullets.filter(b=>!b.dead);
    s.obstacles=s.obstacles.filter(o=>o.alive!==false);
    s.bullets=s.bullets.filter(b=>b.x<C.W+10);
    // collisions
    const br=buggyRect(s);
    for(const o of s.obstacles){
      if(o.type==="rock"){ if(rov(br,{x:o.x,y:o.y,w:o.w,h:o.h})){ crash(s); return s; } }
      else if(o.type==="crater"){ // fall in if on the ground and horizontally over the pit
        if(s.onGround && s.x+C.BW>o.x+4 && s.x<o.x+o.w-4){ crash(s); return s; } }
    }
    return s;
  }
  function crash(s){ s.lives--; s.justCrashed=true; if(s.lives<=0){ s.over=true; } else { s.obstacles=[]; s.bullets=[]; s.x=C.BUGGY_X; s.y=C.GROUND-C.BH; s.vy=0; s.onGround=true; } }
  // One press fires three ways at once: ahead, behind, and straight up.
  // Forward and back clear rocks; the upward shot is what reaches the hawks.
  function fire(s){
    if(s.over) return s;
    if(new Set(s.bullets.map(b=>b.vid)).size>=C.MAX_VOLLEYS) return s;
    const vid=++s.nextVid;
    s.bullets.push({ vid, x:s.x+C.BW,   y:s.y+4, vx: C.BSPEED, vy:0,         dir:"fwd" });
    s.bullets.push({ vid, x:s.x-6,      y:s.y+4, vx:-C.BSPEED, vy:0,         dir:"back" });
    s.bullets.push({ vid, x:s.x+C.BW/2, y:s.y-4, vx:0,         vy:-C.BSPEED, dir:"up" });
    return s;
  }
  function spawn(s){ if(Math.random()<0.5){ const w=18+Math.floor(Math.random()*16); s.obstacles.push({type:"crater",x:C.W,y:C.GROUND,w,h:C.H-C.GROUND}); }
    else { const w=16+Math.floor(Math.random()*14); s.obstacles.push({type:"rock",x:C.W,y:C.GROUND-16,w,h:16,alive:true}); } }
  window.__moonpatrol={ LAYERS, newState, step, fire, spawn, buggyRect, C };

  if(typeof document==="undefined") return;
  const $=(id)=>document.getElementById(id);
  const cv=$("game"), ctx=cv.getContext("2d"); const W=C.W,H=C.H;
  // Hold the loop until the player asks for it (comment: Press Spacebar To Begin)
  const GATE = Arcade.startGate(cv, "Moon Chicken");
  let s=newState(), input={jump:false,left:false,right:false}, best=0, stars=[], wheel=0;
  try{ best=parseInt(localStorage.getItem("moon_best")||"0")||0; }catch(e){}
  for(let i=0;i<40;i++) stars.push({x:Math.random()*W,y:Math.random()*C.GROUND*0.8});

  function draw(){
    ctx.clearRect(0,0,W,H); ctx.fillStyle="#08040f"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#2a2f55"; for(const st of stars) ctx.fillRect(st.x,st.y,1,1);
    // three parallax bands, far to near
    for(let i=0;i<LAYERS.length;i++){
      const L=LAYERS[i], off=s.scroll[i]%L.step;
      ctx.fillStyle=L.color; ctx.beginPath(); ctx.moveTo(-L.step,C.GROUND);
      for(let x=-L.step; x<=W+L.step; x+=L.step){
        const px=x-off;
        ctx.lineTo(px, L.y);
        ctx.lineTo(px+L.step*0.5, L.y-L.amp);
        ctx.lineTo(px+L.step, L.y);
      }
      ctx.lineTo(W+L.step,C.GROUND); ctx.lineTo(-L.step,C.GROUND); ctx.closePath(); ctx.fill();
    }
    // ground
    ctx.fillStyle="#4a3a5a"; ctx.fillRect(0,C.GROUND,W,H-C.GROUND);
    for(const o of s.obstacles){ if(o.type==="crater"){ ctx.fillStyle="#08040f"; ctx.fillRect(o.x,C.GROUND,o.w,H-C.GROUND); ctx.strokeStyle="#6a5a7a"; ctx.beginPath(); ctx.arc(o.x+o.w/2,C.GROUND,o.w/2,Math.PI,0); ctx.stroke(); }
      else { ctx.fillStyle="#9a8aa5"; ctx.beginPath(); ctx.arc(o.x+o.w/2,o.y+o.h,o.w/2,Math.PI,0); ctx.fill(); ctx.fillStyle="#7a6a85"; ctx.fillRect(o.x+3,o.y+6,4,3); } }
    for(const b of s.bullets){ ctx.fillStyle = b.dir==="up" ? "#22d3ee" : "#ffcf5a";
      if(b.dir==="up") ctx.fillRect(b.x,b.y,3,7); else ctx.fillRect(b.x,b.y,7,3); }
    // the spacesuit chicken drifting across, once a board
    if(s.flyby){ const f=s.flyby;
      ctx.fillStyle="#e6e6f0"; ctx.beginPath(); ctx.arc(f.x,f.y,7,0,7); ctx.fill();           // helmet
      ctx.fillStyle="#facc15"; ctx.beginPath(); ctx.arc(f.x,f.y,4.5,0,7); ctx.fill();          // head
      ctx.fillStyle="#0b1030"; ctx.fillRect(f.x-2,f.y-1,1.5,1.5); ctx.fillRect(f.x+1,f.y-1,1.5,1.5);
      ctx.fillStyle="#fb923c"; ctx.fillRect(f.x+(f.vx<0?-6:4),f.y,3,2);                          // beak
      ctx.fillStyle="#cbd5e1"; ctx.fillRect(f.x-3,f.y+6,6,6); }                                  // suit
    if(dying>0){
      // buggy in pieces
      for(const d of debris){ if(d.life<=0) continue; ctx.save(); ctx.translate(d.x,d.y); ctx.rotate(d.rot);
        ctx.fillStyle = d.life>40? "#22d3ee" : (d.life>18? "#fb923c" : "#7a2a2a"); ctx.fillRect(-3,-2,6,4); ctx.restore(); }
      if(banner>0||s.over){} // (banner/over drawn below)
      // draw the board banner / game over below; skip the intact buggy
      wheel=(wheel+s.speed*0.3)%(Math.PI*2);
      if(banner>0){ ctx.fillStyle="#facc15"; ctx.font="bold 22px system-ui"; ctx.textAlign="center"; ctx.fillText("BOARD "+s.board,W/2,64); }
      if(s.over){ ctx.fillStyle="rgba(0,0,0,.6)"; ctx.fillRect(0,0,W,H); ctx.fillStyle="#f43f5e"; ctx.font="bold 24px system-ui"; ctx.textAlign="center"; ctx.fillText("GAME OVER",W/2,H/2-6); ctx.fillStyle="#e6e6f0"; ctx.font="14px system-ui"; ctx.fillText("Score "+s.score+"  ·  Best "+best,W/2,H/2+16); }
      return;
    }
    // buggy
    wheel=(wheel+s.speed*0.3)%(Math.PI*2);
    ctx.fillStyle="#22d3ee"; ctx.fillRect(s.x,s.y,C.BW,C.BH-6); ctx.fillRect(s.x+8,s.y-8,C.BW-20,10);
    // hen at the wheel, poking out of the cockpit
    { const hx=s.x+C.BW/2-2, hy=s.y-12;
      ctx.fillStyle="#dc2626"; ctx.fillRect(hx-3,hy-5,2,3); ctx.fillRect(hx,hy-6,2,4); ctx.fillRect(hx+3,hy-5,2,3);
      ctx.fillStyle="#facc15"; ctx.beginPath(); ctx.arc(hx,hy,5,0,7); ctx.fill();
      ctx.fillStyle="#0b1030"; ctx.fillRect(hx-3,hy-2,2,2); ctx.fillRect(hx+1,hy-2,2,2);
      ctx.fillStyle="#fb923c"; ctx.fillRect(hx+4,hy,4,2); }
    ctx.fillStyle="#0b0c1a"; for(const wx of [s.x+9,s.x+C.BW-9]){ ctx.beginPath(); ctx.arc(wx,s.y+C.BH-4,6,0,7); ctx.fill(); ctx.strokeStyle="#5a5f7a"; ctx.beginPath(); ctx.moveTo(wx,s.y+C.BH-4); ctx.lineTo(wx+Math.cos(wheel)*5,s.y+C.BH-4+Math.sin(wheel)*5); ctx.stroke(); }
    if(banner>0){ ctx.fillStyle="#facc15"; ctx.font="bold 22px system-ui"; ctx.textAlign="center"; ctx.fillText("BOARD "+s.board,W/2,64); }
    if(s.over){ ctx.fillStyle="rgba(0,0,0,.6)"; ctx.fillRect(0,0,W,H); ctx.fillStyle="#f43f5e"; ctx.font="bold 24px system-ui"; ctx.textAlign="center"; ctx.fillText("GAME OVER",W/2,H/2-6); ctx.fillStyle="#e6e6f0"; ctx.font="14px system-ui"; ctx.fillText("Score "+s.score+"  ·  Best "+best,W/2,H/2+16); }
  }
  function frame(){
    if(!GATE.open){ draw(); GATE.paint(); return requestAnimationFrame(frame); }
    if(banner>0) banner--;
    if(dying>0){
      for(const d of debris){ d.x+=d.vx; d.y+=d.vy; d.vy+=0.35; d.rot+=d.vr; d.life--; }
      if(--dying<=0 && !s.over){ /* resume from the same point */ }
    } else if(!s.over){
      if(--s.spawnGap<=0){ spawn(s); s.spawnGap=Math.max(28, 70-Math.floor(s.speed*4)); }
      step(s,input); input.jump=false;
      if(s.newBoard){ s.newBoard=false; banner=110; if(typeof Arcade!=="undefined") Arcade.sfx.wave(); $("msg").textContent="Board "+s.board+"!"; }
      if(s.flybyHit){ s.flybyHit=false; if(typeof Arcade!=="undefined") Arcade.sfx.win(); $("msg").textContent="🚀 Space chicken! +"+C.FLYBY_SCORE; }
      if(s.justCrashed){ s.justCrashed=false;
        dying=70; debris=[]; const bx=s.x+C.BW/2, by=s.y+C.BH/2;
        for(let i=0;i<16;i++){ const a=Math.random()*Math.PI*2, sp=1.4+Math.random()*3.2;
          debris.push({x:bx,y:by,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1.6,life:70,rot:Math.random()*7,vr:(Math.random()-0.5)*0.5}); }
        if(typeof Arcade!=="undefined") Arcade.sfx.explode();
        $("msg").textContent = s.over ? "Out of chickens! Score "+s.score : "CHICKEN DOWN — "+s.lives+" left"; }
      if(typeof Arcade!=="undefined")Arcade.stats.record("moonpatrol",s.score);
      if(s.over && s.score>best){ best=s.score; try{localStorage.setItem("moon_best",String(best));}catch(e){} }
    }
    $("score").textContent=s.score; renderChix(); $("best").textContent=best; draw(); requestAnimationFrame(frame);
  }
  let dying=0, debris=[], banner=0;
  function renderChix(){ $("lives").textContent="🐔".repeat(Math.max(0,s.lives)); }
  function jump(){ if(!s.over && dying<=0) input.jump=true; }
  // Player feedback: "make the space bar fire and the up arrow jump. Left
  // and right should move the car each direction a little, while the
  // screen is still rolling a constant speed." Space used to also jump;
  // now it's fire-only, ArrowUp/W are jump-only, and Left/Right are new
  // held (not edge-triggered) inputs that nudge s.x — see step().
  addEventListener("keydown",(e)=>{
    if(e.key==="ArrowUp"||e.key==="w"){ e.preventDefault(); jump(); }
    else if(e.key===" "||e.key==="f"||e.key==="Control"){ e.preventDefault(); fire(s); }
    else if(e.key==="ArrowLeft"||e.key==="a"){ e.preventDefault(); input.left=true; }
    else if(e.key==="ArrowRight"||e.key==="d"){ e.preventDefault(); input.right=true; }
  });
  addEventListener("keyup",(e)=>{
    if(e.key==="ArrowLeft"||e.key==="a") input.left=false;
    else if(e.key==="ArrowRight"||e.key==="d") input.right=false;
  });
  cv.addEventListener("touchstart",(e)=>{ e.preventDefault(); jump(); },{passive:false});
  const jb=$("bjump"), fb=$("bfire"), lb=$("bleft"), rb=$("bright");
  jb.addEventListener("touchstart",(e)=>{e.preventDefault();jump();},{passive:false}); jb.addEventListener("mousedown",jump);
  fb.addEventListener("touchstart",(e)=>{e.preventDefault();fire(s);},{passive:false}); fb.addEventListener("mousedown",()=>fire(s));
  const bindHold=(el,k)=>{ const on=(e)=>{e.preventDefault();input[k]=true;}; const off=(e)=>{e.preventDefault();input[k]=false;};
    el.addEventListener("touchstart",on,{passive:false}); el.addEventListener("touchend",off); el.addEventListener("mousedown",on); el.addEventListener("mouseup",off); el.addEventListener("mouseleave",off); };
  bindHold(lb,"left"); bindHold(rb,"right");
  $("new").addEventListener("click",()=>{ s=newState(); input={jump:false,left:false,right:false}; dying=0; debris=[]; banner=0; renderChix(); $("msg").textContent="Jump craters, shoot the rocks!"; });
  requestAnimationFrame(frame);
})();
</script>
<script src="/comments.js" defer></script>
</body>
</html>
