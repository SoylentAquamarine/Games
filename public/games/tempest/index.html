<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Chicken Tempest — Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>🐔</text></svg>" />
  <style>
    :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#f43f5e;--accent-2:#22d3ee;}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
      background:radial-gradient(1000px 500px at 70% -10%,rgba(244,63,94,.2),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.16),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;}
    .wrap{max-width:560px;margin:0 auto;padding:16px 16px 30px;display:flex;flex-direction:column;align-items:center;gap:12px}
    .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
    .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
    .home:hover{color:var(--text);border-color:rgba(244,63,94,.6)}
    h1{margin:0;font-size:1.6rem;background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
    .scores{display:flex;gap:12px;width:100%}
    .stat{flex:1;background:var(--panel);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:8px;text-align:center}
    .stat .label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    .stat .value{font-size:1.3rem;font-weight:700}
    .board-wrap{position:relative;width:100%}
    canvas{width:100%;height:auto;display:block;background:#05060f;border:1px solid rgba(255,255,255,.08);border-radius:14px;touch-action:none}
    .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(15,16,32,.85);border-radius:14px;text-align:center}
    .overlay.hidden{display:none}
    .overlay h2{margin:0}.overlay p{margin:0;color:var(--muted)}
    .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:12px 28px;border-radius:999px;cursor:pointer}
    .pad{display:flex;gap:8px;width:100%;justify-content:center;flex-wrap:wrap}
    .pad button{background:var(--panel);border:1px solid rgba(255,255,255,.14);color:var(--text);border-radius:10px;padding:12px 16px;font-size:1.1rem;cursor:pointer;min-width:56px;user-select:none;touch-action:none}
    .pad button.zap{background:linear-gradient(120deg,var(--accent),#facc15);color:#0b0c1a;font-weight:800}
    .hint{color:var(--muted);font-size:.82rem;text-align:center}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar"><a class="home" href="/">← Home</a><h1>🐔 Chicken Tempest</h1><span style="width:64px"></span></div>
    <div class="scores">
      <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">Lives</div><div class="value" id="lives">3</div></div>
      <div class="stat"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
    <div class="board-wrap">
      <canvas id="c" width="560" height="480"></canvas>
      <div class="overlay" id="ov"><h2 id="ot">Chicken Tempest</h2><p id="om">Ride the rim of the coop, blast foxes climbing out of the well.</p><button class="btn" id="start">Play</button></div>
    </div>
    <div class="pad">
      <button data-k="left">◀</button>
      <button data-k="fire">● Fire</button>
      <button data-k="right">▶</button>
      <button data-k="zap" class="zap">⚡ Zap</button>
    </div>
    <p class="hint">← → move around the rim · hold Space to fire · Z or ⚡ Zap clears the well (1 per wave)</p>
  </div>
  <script src="/arcade.js"></script>
  <script>
  (function(){
    // Canvas's static width/height attributes, kept as plain numbers (not read
    // from the DOM element) so the pure sim below has no DOM dependency at all.
    const W=560,H=480;
    let best=+localStorage.getItem("tempest_best")||0;

    // ------------------------------------------------------------ pure sim
    // Everything a game frame needs lives in a plain state object `s`, updated
    // by these standalone functions — no closures over DOM/canvas — so the
    // whole thing is testable headlessly via window.__tempest.
    const LANES=16;
    const CENTER={x:W/2,y:H*0.56};
    const RIM_R=190, RIM_R_IN=128;           // star shape's outer/inner radii; circle uses RIM_R for every lane
    const MOVE_EVERY=6;                      // frames per lane-step while held
    const SHOT_SPEED=0.05, SHOT_START=0.94;  // shots travel rim(1) -> center(0)
    const HOP_EVERY=26;                      // frames between a rim-walking fox's hops
    const HIT_EPS=0.05;
    const SPAWN_GAP=55;
    const SUPERZAPS_PER_WAVE=1;
    const RESPAWN_INV=100;

    function waveShape(wave){ return wave%2===1?"circle":"star"; }
    function laneAngle(lane){ return (lane/LANES)*Math.PI*2 - Math.PI/2; }
    function laneRimR(lane,shape){ return shape==="star" ? (lane%2===0?RIM_R:RIM_R_IN) : RIM_R; }
    function laneRim(lane,shape){ const a=laneAngle(lane), r=laneRimR(lane,shape); return {x:CENTER.x+Math.cos(a)*r,y:CENTER.y+Math.sin(a)*r}; }
    function laneWorldXY(lane,t,shape){ const p=laneRim(lane,shape); return {x:CENTER.x+(p.x-CENTER.x)*t,y:CENTER.y+(p.y-CENTER.y)*t}; }
    function laneDist(a,b){ const d=Math.abs(a-b); return Math.min(d,LANES-d); }
    function laneStepToward(from,to){
      if(from===to) return 0;
      const fwd=(to-from+LANES)%LANES, back=(from-to+LANES)%LANES;
      return fwd<=back ? 1 : -1;
    }
    function enemyCountFor(wave){ return Math.min(14, 4+wave*2); }
    function enemySpeedFor(wave){ return 0.006+Math.min(0.01,wave*0.0009); }

    function newGame(){
      return { wave:1, shape:waveShape(1), lane:0, moveDir:0, moveT:0, fireHeld:false, fireT:0,
        shots:[], enemies:[], spawnQueue:enemyCountFor(1), spawnT:SPAWN_GAP,
        score:0, lives:3, inv:60, superzaps:SUPERZAPS_PER_WAVE, over:false, flash:0 };
    }
    function nextWave(s){
      s.wave++; s.shape=waveShape(s.wave); s.enemies=[]; s.shots=[];
      s.spawnQueue=enemyCountFor(s.wave); s.spawnT=SPAWN_GAP; s.superzaps=SUPERZAPS_PER_WAVE; s.inv=RESPAWN_INV;
    }
    function moveLane(s){
      if(s.moveDir===0) return;
      s.moveT++;
      if(s.moveT>=MOVE_EVERY){ s.moveT=0; s.lane=(s.lane+s.moveDir+LANES)%LANES; }
    }
    function fire(s){
      if(s.fireT>0) return;
      s.fireT=13; s.shots.push({lane:s.lane,t:SHOT_START});
    }
    function stepShots(s){
      if(s.fireT>0) s.fireT--;
      s.shots.forEach(b=>b.t-=SHOT_SPEED);
      s.shots=s.shots.filter(b=>b.t>0);
    }
    function spawnEnemies(s){
      if(s.spawnQueue<=0) return;
      if(--s.spawnT>0) return;
      s.spawnT=SPAWN_GAP;
      s.spawnQueue--;
      s.enemies.push({lane:Math.floor(Math.random()*LANES),t:0,atRim:false,hopT:HOP_EVERY});
    }
    // Returns true if a fox reached the player's lane at the rim (a hit).
    function stepEnemies(s){
      const speed=enemySpeedFor(s.wave);
      let hit=false;
      for(const e of s.enemies){
        if(!e.atRim){
          e.t+=speed;
          if(e.t>=1){ e.t=1; e.atRim=true; }
        }else{
          if(--e.hopT<=0){
            e.hopT=HOP_EVERY;
            const dir=Math.random()<0.8 ? laneStepToward(e.lane,s.lane) : (Math.random()<0.5?1:-1);
            if(dir) e.lane=(e.lane+dir+LANES)%LANES;
          }
        }
        if(e.atRim && e.lane===s.lane && s.inv<=0) hit=true;
      }
      return hit;
    }
    // Returns the total score gained this frame (0 if nothing was hit).
    function resolveHits(s){
      let gained=0;
      for(let i=s.enemies.length-1;i>=0;i--){
        const e=s.enemies[i];
        for(let j=s.shots.length-1;j>=0;j--){
          const b=s.shots[j];
          if(b.lane===e.lane && Math.abs(b.t-e.t)<HIT_EPS){
            s.shots.splice(j,1); s.enemies.splice(i,1);
            gained+=e.atRim?150:100;
            break;
          }
        }
      }
      s.score+=gained;
      return gained;
    }
    function zap(s){
      if(s.superzaps<=0 || s.enemies.length===0) return 0;
      s.superzaps--;
      const gained=s.enemies.length*50;
      s.score+=gained; s.enemies=[];
      return gained;
    }
    function waveClear(s){ return s.spawnQueue<=0 && s.enemies.length===0; }
    function die(s){
      s.lives--; s.flash=30; s.inv=RESPAWN_INV; s.enemies=[]; s.shots=[];
      if(s.lives<=0) s.over=true;
    }

    window.__tempest={ LANES, CENTER, RIM_R, RIM_R_IN, MOVE_EVERY, SHOT_SPEED, SHOT_START, HOP_EVERY, HIT_EPS,
      SPAWN_GAP, SUPERZAPS_PER_WAVE, waveShape, laneAngle, laneRimR, laneRim, laneWorldXY, laneDist, laneStepToward,
      enemyCountFor, enemySpeedFor, newGame, nextWave, moveLane, fire, stepShots, spawnEnemies, stepEnemies,
      resolveHits, zap, waveClear, die };
    if(typeof document==="undefined") return;

    // -------------------------------------------------------------- DOM layer
    const cv=document.getElementById("c"),ctx=cv.getContext("2d");
    const scoreEl=document.getElementById("score"),livesEl=document.getElementById("lives"),bestEl=document.getElementById("best");
    const ov=document.getElementById("ov"),ot=document.getElementById("ot"),om=document.getElementById("om"),startBtn=document.getElementById("start");
    bestEl.textContent=best;
    let s=newGame(), running=false, raf;
    function updateHud(){ scoreEl.textContent=s.score; livesEl.textContent=s.lives; }
    function start(){ s=newGame(); updateHud(); ov.classList.add("hidden"); running=true; loop(); }
    function loop(){ if(!running) return; update(); render(); raf=requestAnimationFrame(loop); }
    function update(){
      if(s.over) return;
      if(s.flash>0) s.flash--;
      if(s.inv>0) s.inv--;
      moveLane(s);
      if(s.fireHeld) fire(s);
      stepShots(s);
      spawnEnemies(s);
      const hit=stepEnemies(s);
      const gained=resolveHits(s);
      if(gained){ updateHud(); if(typeof Arcade!=="undefined") Arcade.sfx.explode(); }
      if(hit){ die(s); updateHud();
        if(s.over){ running=false; cancelAnimationFrame(raf);
          if(typeof Arcade!=="undefined") Arcade.stats.record("tempest",s.score);
          if(s.score>best){ best=s.score; localStorage.setItem("tempest_best",best); bestEl.textContent=best; }
          ot.textContent="Game Over"; om.textContent="Score "+s.score+" · wave "+s.wave; startBtn.textContent="Play again"; ov.classList.remove("hidden");
          return;
        }
      }
      if(waveClear(s)) nextWave(s);
    }
    function render(){
      ctx.clearRect(0,0,W,H);
      // the tube: every lane drawn as a glowing line from the rim to the hub
      for(let lane=0;lane<LANES;lane++){
        const p=laneRim(lane,s.shape);
        ctx.strokeStyle="rgba(124,92,255,.35)"; ctx.lineWidth=1.4;
        ctx.beginPath(); ctx.moveTo(CENTER.x,CENTER.y); ctx.lineTo(p.x,p.y); ctx.stroke();
      }
      // rim outline
      ctx.strokeStyle="rgba(34,211,238,.6)"; ctx.lineWidth=2; ctx.beginPath();
      for(let lane=0;lane<=LANES;lane++){ const p=laneRim(lane%LANES,s.shape); lane===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y); }
      ctx.stroke();
      // hub
      ctx.fillStyle="#05060f"; ctx.strokeStyle="rgba(244,63,94,.5)"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(CENTER.x,CENTER.y,10,0,7); ctx.fill(); ctx.stroke();
      // shots
      ctx.fillStyle="#facc15";
      for(const b of s.shots){ const p=laneWorldXY(b.lane,b.t,s.shape); ctx.beginPath(); ctx.arc(p.x,p.y,3,0,7); ctx.fill(); }
      // foxes
      for(const e of s.enemies){
        const p=laneWorldXY(e.lane,e.t,s.shape);
        ctx.save(); ctx.translate(p.x,p.y);
        ctx.fillStyle=e.atRim?"#f43f5e":"#fb923c";
        ctx.beginPath(); ctx.moveTo(0,-8); ctx.lineTo(7,7); ctx.lineTo(-7,7); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      // player claw, blinking while invulnerable
      if(s.inv<=0 || Math.floor(s.inv/4)%2===0){
        const p=laneWorldXY(s.lane,1.06,s.shape), inward=laneWorldXY(s.lane,0.9,s.shape);
        const ang=Math.atan2(inward.y-p.y,inward.x-p.x);
        ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(ang);
        ctx.strokeStyle=s.flash>0?"#f43f5e":"#22d3ee"; ctx.lineWidth=2.5; ctx.beginPath();
        ctx.moveTo(9,0); ctx.lineTo(-6,-7); ctx.lineTo(-2,0); ctx.lineTo(-6,7); ctx.closePath(); ctx.stroke();
        ctx.restore();
      }
      // hud extras
      ctx.fillStyle="rgba(230,230,240,.7)"; ctx.font="12px system-ui"; ctx.textAlign="left";
      ctx.fillText("Wave "+s.wave+" · Zap x"+s.superzaps,10,H-10);
    }
    // input
    document.addEventListener("keydown",e=>{
      if(e.key==="ArrowLeft"||e.key==="a"){ e.preventDefault(); s.moveDir=-1; }
      else if(e.key==="ArrowRight"||e.key==="d"){ e.preventDefault(); s.moveDir=1; }
      else if(e.key===" "){ e.preventDefault(); s.fireHeld=true; }
      else if(e.key==="z"||e.key==="Z"){ e.preventDefault(); const g=zap(s); if(g)updateHud(); }
    });
    document.addEventListener("keyup",e=>{
      if(e.key==="ArrowLeft"||e.key==="a"){ if(s.moveDir===-1)s.moveDir=0; }
      else if(e.key==="ArrowRight"||e.key==="d"){ if(s.moveDir===1)s.moveDir=0; }
      else if(e.key===" "){ s.fireHeld=false; }
    });
    document.querySelectorAll(".pad button").forEach(b=>{
      const k=b.dataset.k;
      const on=(e)=>{e.preventDefault();
        if(k==="left")s.moveDir=-1; else if(k==="right")s.moveDir=1; else if(k==="fire")s.fireHeld=true;
        else if(k==="zap"){ const g=zap(s); if(g)updateHud(); }
      };
      const off=(e)=>{e.preventDefault();
        if(k==="left"&&s.moveDir===-1)s.moveDir=0; else if(k==="right"&&s.moveDir===1)s.moveDir=0; else if(k==="fire")s.fireHeld=false;
      };
      b.addEventListener("touchstart",on,{passive:false}); b.addEventListener("touchend",off,{passive:false});
      b.addEventListener("mousedown",on); b.addEventListener("mouseup",off); b.addEventListener("mouseleave",off);
    });
    startBtn.addEventListener("click",start);
    render();
  })();
  </script>
  <script src="/startgate.js" defer></script>
  <script src="/comments.js" defer></script>
  <script src="/fullscreen.js" defer></script>
</body>
</html>
