<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rock Paper Scissors — Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>✊</text></svg>" />
<style>
  :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;--good:#34d399;--bad:#f43f5e;}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
    background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.2),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.14),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;}
  .wrap{max-width:460px;margin:0 auto;padding:16px 14px 40px;display:flex;flex-direction:column;align-items:center;gap:16px}
  .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
  .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
  .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
  h1{margin:0;font-size:1.4rem;background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:9px 18px;border-radius:999px;cursor:pointer}
  .score{display:flex;gap:18px;font-weight:800;font-size:1.05rem}
  .score .you{color:var(--accent-2)}.score .cpu{color:var(--bad)}
  .score small{display:block;font-size:.7rem;color:var(--muted);font-weight:600;text-align:center}
  .arena{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;background:var(--panel);border-radius:16px;padding:22px 10px;min-height:130px}
  .hand{font-size:3.4rem;line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
  .hand.me{transform:scaleX(-1)}
  .vs{color:var(--muted);font-weight:800}
  .result{min-height:1.4em;font-weight:800;font-size:1.15rem}
  .result.win{color:var(--good)}.result.lose{color:var(--bad)}.result.tie{color:#fde68a}
  .picks{display:flex;gap:12px}
  .pick{background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:16px;width:84px;height:84px;font-size:2.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .08s}
  .pick:hover{border-color:var(--accent);transform:translateY(-3px)}
  .pick:active{transform:translateY(0)}
  .streak{font-size:.85rem;color:var(--muted)}
  .streak b{color:#fde68a}
  .banner{min-height:1.3em;font-weight:800;color:#fde68a;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="home" href="/">← Home</a><h1>Rock Paper Scissors</h1><button class="btn" id="new">New Game</button></div>
  <div class="score"><div class="you"><span id="youScore">0</span><small>YOU</small></div><div class="cpu"><span id="cpuScore">0</span><small>CPU</small></div></div>
  <div class="arena"><span class="hand me" id="meHand">✊</span><span class="vs">VS</span><span class="hand cpu" id="cpuHand">✊</span></div>
  <div class="result" id="result">First to 5 wins. Make your move!</div>
  <div class="picks">
    <button class="pick" data-c="rock" title="Rock (R)">✊</button>
    <button class="pick" data-c="paper" title="Paper (P)">✋</button>
    <button class="pick" data-c="scissors" title="Scissors (S)">✌️</button>
  </div>
  <div class="streak">Win streak: <b id="streak">0</b> · Best: <b id="best">0</b></div>
  <div class="banner" id="banner"></div>
</div>
<script src="/arcade.js"></script>
<script>
(function(){
  const CHOICES=["rock","paper","scissors"];
  const EMOJI={rock:"✊",paper:"✋",scissors:"✌️"};
  // a beats b?
  const BEATS={rock:"scissors",scissors:"paper",paper:"rock"};
  function beats(a,b){ return BEATS[a]===b; }
  function round(you,cpu){ if(you===cpu) return "tie"; return beats(you,cpu)?"win":"lose"; }
  window.__rps={ CHOICES, EMOJI, beats, round, WIN_TARGET:5 };

  if(typeof document==="undefined") return;
  const $=(id)=>document.getElementById(id);
  let you=0,cpu=0,streak=0,best=0,over=false;
  try{ best=parseInt(localStorage.getItem("rps_best")||"0")||0; }catch(e){}

  function reset(){ you=0;cpu=0;streak=0;over=false; $("meHand").textContent="✊";$("cpuHand").textContent="✊";
    $("result").className="result";$("result").textContent="First to 5 wins. Make your move!";$("banner").textContent=""; render(); }
  function render(){ $("youScore").textContent=you;$("cpuScore").textContent=cpu;$("streak").textContent=streak;$("best").textContent=best; }
  function play(pick){
    if(over) return;
    const c=CHOICES[Math.floor(Math.random()*3)];
    $("meHand").textContent=EMOJI[pick]; $("cpuHand").textContent=EMOJI[c];
    const r=round(pick,c);
    const res=$("result"); res.className="result "+r;
    if(r==="win"){ you++; streak++; if(typeof Arcade!=="undefined")Arcade.stats.record("rps",streak); if(streak>best){ best=streak; try{localStorage.setItem("rps_best",String(best));}catch(e){} } res.textContent="You win the round!"; }
    else if(r==="lose"){ cpu++; streak=0; res.textContent="CPU takes the round."; }
    else res.textContent="Tie — go again.";
    render();
    if(you>=5||cpu>=5){ over=true; $("banner").textContent=you>=5?"🏆 You won the match!":"💀 CPU won the match. Try again!"; }
  }
  document.querySelectorAll(".pick").forEach(b=>b.addEventListener("click",()=>play(b.getAttribute("data-c"))));
  addEventListener("keydown",(e)=>{ const k=e.key.toLowerCase(); const m={r:"rock",p:"paper",s:"scissors","1":"rock","2":"paper","3":"scissors"}[k]; if(m) play(m); });
  $("new").addEventListener("click",reset);
  render();
})();
</script>
<script src="/comments.js" defer></script>
</body>
</html>
