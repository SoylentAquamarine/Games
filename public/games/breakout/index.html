<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Breakout — Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>🧱</text></svg>" />
  <style>
    :root{--bg:#0f1020;--panel:#1e2140;--text:#e6e6f0;--muted:#9a9ab5;--accent:#7c5cff;--accent-2:#22d3ee;}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
      background:radial-gradient(1000px 500px at 70% -10%,rgba(124,92,255,.22),transparent 60%),radial-gradient(800px 400px at 10% 110%,rgba(34,211,238,.16),transparent 60%),var(--bg);-webkit-tap-highlight-color:transparent;}
    .wrap{max-width:480px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;align-items:center;gap:12px}
    .topbar{width:100%;display:flex;align-items:center;justify-content:space-between}
    .home{color:var(--muted);text-decoration:none;font-size:.9rem;padding:6px 12px;border:1px solid rgba(255,255,255,.12);border-radius:999px}
    .home:hover{color:var(--text);border-color:rgba(124,92,255,.6)}
    h1{margin:0;font-size:1.6rem;background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
    .scores{display:flex;gap:12px;width:100%}
    .stat{flex:1;background:var(--panel);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:8px;text-align:center}
    .stat .label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
    .stat .value{font-size:1.3rem;font-weight:700}
    .board-wrap{position:relative;width:100%}
    canvas{width:100%;height:auto;display:block;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);border-radius:14px;touch-action:none}
    .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(15,16,32,.82);border-radius:14px;text-align:center}
    .overlay.hidden{display:none}
    .overlay h2{margin:0;font-size:1.6rem}
    .overlay p{margin:0;color:var(--muted)}
    .btn{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0b0c1a;border:none;font-weight:700;padding:12px 28px;border-radius:999px;cursor:pointer}
    .btn:hover{transform:translateY(-2px)}
    .hint{color:var(--muted);font-size:.85rem}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar"><a class="home" href="/">← Home</a><h1>🧱 Breakout</h1><span style="width:64px"></span></div>
    <div class="scores">
      <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">Lives</div><div class="value" id="lives">3</div></div>
      <div class="stat"><div class="label">Level</div><div class="value" id="level">1</div></div>
    </div>
    <div class="board-wrap">
      <canvas id="c" width="440" height="520"></canvas>
      <div class="overlay" id="ov"><h2 id="ot">Breakout</h2><p id="om">Clear every brick.</p><button class="btn" id="start">Play</button></div>
    </div>
    <p class="hint">Move: mouse / touch / arrow keys</p>
  </div>
  <script>
  (function(){
    const cv=document.getElementById("c"),ctx=cv.getContext("2d"),W=cv.width,H=cv.height;
    const scoreEl=document.getElementById("score"),livesEl=document.getElementById("lives"),levelEl=document.getElementById("level");
    const ov=document.getElementById("ov"),ot=document.getElementById("ot"),om=document.getElementById("om"),startBtn=document.getElementById("start");
    const COLS=8,ROWS=5,BW=W/COLS,BH=22,TOP=50;
    const DEATH_FRAMES=120;   // 2s @ 60fps — the site-wide "room to breathe" pause after a death
    let paddle,ball,bricks,score,lives,level,running,raf,dying=0;
    function reset(full){
      if(full){score=0;lives=3;level=1;}
      paddle={w:84,h:12,x:W/2-42,y:H-28};
      ball={x:W/2,y:H-42,r:7,vx:4*(Math.random()<.5?1:-1),vy:-4.5};
      bricks=[];
      dying=0;
      for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)bricks.push({x:c*BW,y:TOP+r*BH,alive:true,hue:200+r*28});
      scoreEl.textContent=score;livesEl.textContent=lives;levelEl.textContent=level;
    }
    function start(){reset(true);ov.classList.add("hidden");running=true;loop();}
    function loop(){if(!running)return;update();render();raf=requestAnimationFrame(loop);}
    function update(){
      // Player feedback: the ball used to relaunch the instant it was missed,
      // giving no time to reposition before it was already barreling back
      // down. Now it freezes for DEATH_FRAMES (matching the site-wide 2s
      // death pause every other game uses) before respawning.
      if(dying>0){ if(--dying<=0){ ball={x:W/2,y:H-42,r:7,vx:4*(Math.random()<.5?1:-1),vy:-4.5}; paddle.x=W/2-paddle.w/2; } return; }
      ball.x+=ball.vx;ball.y+=ball.vy;
      if(ball.x<ball.r){ball.x=ball.r;ball.vx*=-1;}
      if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx*=-1;}
      if(ball.y<ball.r){ball.y=ball.r;ball.vy*=-1;}
      // paddle
      if(ball.y+ball.r>=paddle.y&&ball.y+ball.r<=paddle.y+paddle.h+8&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w&&ball.vy>0){
        const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);
        const sp=Math.hypot(ball.vx,ball.vy);const ang=hit*Math.PI/3;
        ball.vx=sp*Math.sin(ang);ball.vy=-Math.abs(sp*Math.cos(ang));
      }
      // bricks
      for(const b of bricks){if(!b.alive)continue;
        if(ball.x>b.x&&ball.x<b.x+BW-2&&ball.y-ball.r<b.y+BH-2&&ball.y+ball.r>b.y){
          b.alive=false;score+=10;scoreEl.textContent=score;
          // reflect based on approach
          const px=Math.min(Math.abs(ball.x-b.x),Math.abs(ball.x-(b.x+BW)));
          const py=Math.min(Math.abs(ball.y-b.y),Math.abs(ball.y-(b.y+BH)));
          if(px<py)ball.vx*=-1;else ball.vy*=-1;
          break;
        }
      }
      if(bricks.every(b=>!b.alive)){level++;levelEl.textContent=level;reset(false);ball.vx*=1.06;ball.vy*=1.06;}
      // lose life
      if(ball.y-ball.r>H){lives--;livesEl.textContent=lives;
        if(lives<=0){return gameOver();}
        ball.vx=0;ball.vy=0;dying=DEATH_FRAMES;
      }
    }
    function render(){
      ctx.clearRect(0,0,W,H);
      for(const b of bricks){if(!b.alive)continue;ctx.fillStyle=`hsl(${b.hue} 70% 55%)`;roundRect(b.x+2,b.y+2,BW-4,BH-4,5);ctx.fill();}
      ctx.fillStyle="#7c5cff";roundRect(paddle.x,paddle.y,paddle.w,paddle.h,6);ctx.fill();
      if(dying<=0){ ctx.fillStyle="#22d3ee";ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fill(); }
      if(dying>0){
        ctx.fillStyle="rgba(0,0,0,.5)";ctx.fillRect(0,0,W,H);
        ctx.fillStyle="#f43f5e";ctx.font="bold 22px system-ui";ctx.textAlign="center";
        ctx.fillText("BALL LOST",W/2,H/2-6);
        ctx.fillStyle="#e6e6f0";ctx.font="13px system-ui";
        ctx.fillText(lives+" "+(lives===1?"life":"lives")+" left",W/2,H/2+16);
      }
    }
    function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
    function gameOver(){running=false;cancelAnimationFrame(raf);ot.textContent="Game Over";om.textContent=`Score ${score} · reached level ${level}`;startBtn.textContent="Play again";ov.classList.remove("hidden");}
    function movePaddle(x){const rect=cv.getBoundingClientRect();const rel=(x-rect.left)/rect.width*W;paddle.x=Math.max(0,Math.min(W-paddle.w,rel-paddle.w/2));}
    cv.addEventListener("mousemove",e=>{if(running)movePaddle(e.clientX);});
    cv.addEventListener("touchmove",e=>{if(running){movePaddle(e.touches[0].clientX);e.preventDefault();}},{passive:false});
    let dir=0;
    document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")dir=-1;if(e.key==="ArrowRight")dir=1;});
    document.addEventListener("keyup",e=>{if((e.key==="ArrowLeft"&&dir<0)||(e.key==="ArrowRight"&&dir>0))dir=0;});
    setInterval(()=>{if(running&&dir)paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x+dir*7));},16);
    startBtn.addEventListener("click",start);
    reset(true);render();
    // expose for headless testing
    window.__breakout={ update, reset, DEATH_FRAMES,
      getBall:()=>ball, getLives:()=>lives, getDying:()=>dying,
      setBallY:(y)=>{ball.y=y;} };
  })();
  </script>
  <script src="/startgate.js" defer></script>
  <script src="/comments.js" defer></script>
</body>
</html>
