<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Games — Live Development</title>
  <meta name="description" content="An online games platform, currently in live development." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="hero">
    <div class="badge">
      <span class="dot"></span> Live Development
    </div>
    <h1>Games</h1>
    <p class="tagline">An online games platform is being built here.</p>
    <p class="sub">Check back soon — new games are on the way.</p>

    <section class="lineup" aria-label="Games in progress">
      <h2>Coming soon</h2>
      <div class="cards">
        <article class="card placeholder">
          <div class="thumb">🎲</div>
          <span>Game slot 1</span>
        </article>
        <article class="card placeholder">
          <div class="thumb">🧩</div>
          <span>Game slot 2</span>
        </article>
        <article class="card placeholder">
          <div class="thumb">🕹️</div>
          <span>Game slot 3</span>
        </article>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> Games. Built on Cloudflare.</p>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
